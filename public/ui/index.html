<style>
.forminput[name] { color: rgba(255,255,255,0.0)!important; }
.forminput[value] { color: rgba(255,255,255,0.0)!important; }
.forminput::placeholder { color: rgba(255,255,255,0.0)!important; }

.social-icons-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-right: 8px;
    z-index: 10;
}
.social-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.7);
    padding: 4px;
    border-radius: 6px;
    transition: color 0.2s, background 0.2s, transform 0.2s;
    text-decoration: none;
}
.social-icon:hover {
    color: #0088cc;
    background: rgba(255,255,255,0.1);
    transform: scale(1.1);
}
.social-icon svg { display: block; }

.split-container {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
    background: #454545;
}
.split-pane {
    width: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
}
.split-pane iframe {
    border: none;
    width: 100%;
    height: 100%;
    display: block;
}
.split-pane img {
    max-width: 100%;
    height: 100%;
    object-fit: contain;
}
.split-divider {
    height: 2px;
    width: 100%;
    background: linear-gradient(90deg, #ff8a00, #e52e71);
    flex-shrink: 0;
}

.split-container.mode-0 { flex-direction: column; }
.split-container.mode-0 .split-pane { height: 50%; }

.split-container.mode-1 { flex-direction: column; }
.split-container.mode-1 .split-pane { height: 100%; }
.split-container.mode-1 .split-divider { display: none; }
.split-container.mode-1 .split-pane:first-child { display: none; }
.split-container.mode-1 .split-pane:last-child { display: block; width: 100%; height: 100%; }

.split-container.mode-2 { flex-direction: column; }
.split-container.mode-2 .split-pane:first-child { display: block; width: 100%; height: 100%; }
.split-container.mode-2 .split-divider { display: none; }
.split-container.mode-2 .split-pane:last-child { display: none; }

.split-container.mode-3 { flex-direction: column; }
.split-container.mode-3 .split-pane:first-child { display: none; }
.split-container.mode-3 .split-divider { display: none; }
.split-container.mode-3 .split-pane:last-child { display: block; width: 100%; height: 100%; }

#splitToggle {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 9999;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: rgba(10, 10, 26, 0.9);
    border: 1.5px solid rgba(255, 138, 0, 0.4);
    color: #fff;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s ease, border-color 0.2s;
    padding: 0;
}
#splitToggle:hover {
    border-color: rgba(255, 138, 0, 0.8);
    transform: scale(1.05);
}
#splitToggle:active {
    transform: scale(0.95);
}
#splitToggle .arrow-row {
    display: flex;
    align-items: center;
    gap: 4px;
}
#splitToggle .arrow {
    width: 8px;
    height: 8px;
    border-top: 2px solid rgba(255, 255, 255, 0.8);
    border-right: 2px solid rgba(255, 255, 255, 0.8);
    display: inline-block;
}
#splitToggle .arrow.up { transform: rotate(-45deg); }
#splitToggle .arrow.down { transform: rotate(135deg); }
#splitToggle .mode-label {
    position: absolute;
    bottom: -22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    color: rgba(255, 255, 255, 0.5);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
}
#splitToggle:hover .mode-label,
#splitToggle:active .mode-label {
    opacity: 1;
}
</style>

<script>
    var currentMode = 0; // Default: split (top+bottom on Home)
    var MODE_LABELS = ['Split', 'Split', 'Split', 'Bottom Only'];

    function setViewMode(mode) {
        var container = document.getElementById('splitContainer');
        container.classList.remove('mode-0', 'mode-1', 'mode-2', 'mode-3');
        container.classList.add('mode-' + mode);
        currentMode = mode;
        document.getElementById('modeLabel').textContent = MODE_LABELS[mode];
    }

    var guacToken = null;
    fetch('https://ai.financecheque.uk/guacamole/api/tokens', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'username=user25148535&password=quantum25148535!!'
    }).then(function(r){ return r.json(); }).then(function(d){
        guacToken = d.authToken;
        document.getElementById('frameBottom').src = 'https://ai.financecheque.uk/guacamole/#/?token=' + guacToken;
    }).catch(function(){});

    function setIframeSrc(iframeId, url) {
        if (url.indexOf('guacamole') !== -1 && guacToken) {
            url = 'https://ai.financecheque.uk/guacamole/#/?token=' + guacToken;
        }
        document.getElementById(iframeId).src = url;
    }

    // Initialize on Home with split view
    setViewMode(0);
    
    // Toggle button - always visible, cycles through split modes
    document.getElementById('splitToggle').addEventListener('click', function(e) {
        e.preventDefault();
        // Cycle: split (0) -> full bottom (3) -> split (0)
        if (currentMode === 0) {
            setViewMode(3); // Full bottom
        } else {
            setViewMode(0); // Return to split
        }
    });
</script>
