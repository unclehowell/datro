<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flywheel Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0d1117;color:#c9d1d9;padding:20px}
h1{font-size:1.5rem;margin-bottom:8px;color:#58a6ff}
h2{font-size:1.1rem;margin:24px 0 12px;color:#8b949e}
.subtitle{color:#8b949e;font-size:.85rem;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:20px}
.stat-card{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:14px}
.stat-card .num{font-size:1.5rem;font-weight:700;color:#58a6ff}
.stat-card .label{font-size:.75rem;color:#8b949e;text-transform:uppercase}
table{width:100%;border-collapse:collapse;background:#161b22;border:1px solid #30363d;border-radius:6px;overflow:hidden;font-size:.8rem}
th{background:#21262d;padding:8px 10px;text-align:left;color:#8b949e;border-bottom:2px solid #30363d}
td{padding:8px 10px;border-bottom:1px solid #21262d}
tr:hover{background:#1c2128}
.badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:.7rem;font-weight:600}
.badge-ok{background:#1b4721;color:#3fb950}
.badge-fail{background:#49241e;color:#f85149}
.badge-skill{background:#1e3a5f;color:#58a6ff}
.tooltip{position:relative;cursor:help;border-bottom:1px dotted #8b949e}
.footer{margin-top:30px;font-size:.7rem;color:#484f58;text-align:center}
.timeline{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:12px;max-height:300px;overflow-y:auto;font-size:.8rem;font-family:monospace}
.timeline-item{padding:4px 0;border-bottom:1px solid #21262d}
.timeline-item:last-child{border-bottom:none}
.timeline-time{color:#484f58;margin-right:8px}
.timeline-ok{color:#3fb950}
.timeline-fail{color:#f85149}
.timeline-branch{color:#58a6ff}
.skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.skill-card{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:10px;font-size:.78rem}
.skill-card .name{color:#58a6ff;font-weight:600}
.skill-card .desc{color:#8b949e;margin-top:2px}
.skill-card .meta{color:#484f58;font-size:.7rem;margin-top:4px}
</style>
</head>
<body>
<h1>Flywheel Dashboard</h1>
<p class="subtitle" id="subtitle">Loading profiles...</p>

<div class="stats" id="stats"></div>
<div id="error" style="display:none;color:#f85149;background:#49241e;border:1px solid #f85149;border-radius:6px;padding:12px;margin-bottom:16px"></div>

<h2>Branch Overview</h2>
<table id="branch-table">
<thead><tr>
<th>Branch</th><th>Category</th><th>Cycles</th><th>Fixes</th><th>Skills</th><th>Tools Used</th><th>Last Fix</th>
</tr></thead>
<tbody id="branch-body"></tbody>
</table>

<h2>Recent Fixes (last 50)</h2>
<div class="timeline" id="timeline"></div>

<h2>Skill Library</h2>
<div class="skills-grid" id="skills"></div>

<p class="footer">Flywheel Dashboard — auto-generated from profiles.json</p>

<script>
async function load() {
  try {
    const resp = await fetch('./agent/profiles.json');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    render(data);
  } catch (e) {
    // Try alternate paths
    try {
      const resp = await fetch('../agent/profiles.json');
      const data = await resp.json();
      return render(data);
    } catch(e2) {}
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = 'Failed to load profiles.json: ' + e.message;
  }
}

function render(profiles) {
  const branches = Object.values(profiles);
  document.getElementById('subtitle').textContent =
    `${branches.length} branches · ${branches.reduce((s,b) => s + (b.total_learning_cycles||0), 0)} total cycles · ${branches.reduce((s,b) => s + (b.successful_fixes||[]).length, 0)} fixes · ${branches.reduce((s,b) => s + (b.skill_library||[]).length, 0)} skills`;

  // Stats cards
  const statsHtml = [
    {num: branches.length, label: 'Branches'},
    {num: branches.reduce((s,b) => s + (b.total_learning_cycles||0), 0), label: 'Learning Cycles'},
    {num: branches.reduce((s,b) => s + (b.successful_fixes||[]).length, 0), label: 'Successful Fixes'},
    {num: branches.reduce((s,b) => s + (b.failed_fixes||[]).length, 0), label: 'Failed Fixes'},
    {num: branches.reduce((s,b) => s + (b.skill_library||[]).length, 0), label: 'Skills Learned'},
    {num: branches.reduce((s,b) => s + (b.reflections||[]).length, 0), label: 'Reflections'},
  ].map(c => `<div class="stat-card"><div class="num">${c.num}</div><div class="label">${c.label}</div></div>`).join('');
  document.getElementById('stats').innerHTML = statsHtml;

  // Branch table
  const bodyHtml = branches.map(b => {
    const fixes = b.successful_fixes||[];
    const lastFix = fixes.length > 0 ? (fixes[fixes.length-1].timestamp||'').slice(0,10) : '-';
    const tools = [...new Set((fixes).map(f => f.tool||'sed'))].join(', ');
    return `<tr>
      <td><strong>${b.branch||'?'}</strong></td>
      <td>${b.category||'?'}</td>
      <td>${b.total_learning_cycles||0}</td>
      <td><span class="badge badge-ok">${(b.successful_fixes||[]).length}</span> / <span class="badge badge-fail">${(b.failed_fixes||[]).length}</span></td>
      <td><span class="badge badge-skill">${(b.skill_library||[]).length}</span></td>
      <td style="font-size:.7rem">${tools || 'sed'}</td>
      <td style="font-size:.7rem;color:#484f58">${lastFix}</td>
    </tr>`;
  }).join('');
  document.getElementById('branch-body').innerHTML = bodyHtml;

  // Timeline (all fixes across all branches, sorted by time)
  const allFixes = [];
  branches.forEach(b => {
    (b.successful_fixes||[]).forEach(f => allFixes.push({...f, outcome:'success', branch:b.branch}));
    (b.failed_fixes||[]).forEach(f => allFixes.push({...f, outcome:'failure', branch:b.branch}));
  });
  allFixes.sort((a, b) => (b.timestamp||'').localeCompare(a.timestamp||''));

  const timelineHtml = allFixes.slice(0, 50).map(f => {
    const time = (f.timestamp||'').slice(0,19).replace('T',' ');
    const cls = f.outcome === 'success' ? 'timeline-ok' : 'timeline-fail';
    return `<div class="timeline-item">
      <span class="timeline-time">${time}</span>
      <span class="${cls}">${f.outcome === 'success' ? '✓' : '✗'}</span>
      <span class="timeline-branch">${f.branch||'?'}</span>
      <span>${f.tool||'sed'}</span>
      <span>${f.bug_description||''}</span>
    </div>`;
  }).join('');
  document.getElementById('timeline').innerHTML = timelineHtml || '<div style="color:#484f58">No fixes recorded yet</div>';

  // Skills
  const allSkills = [];
  branches.forEach(b => {
    (b.skill_library||[]).forEach(s => allSkills.push({...s, branch:b.branch}));
  });
  const skillsHtml = allSkills.slice(0, 50).map(s =>
    `<div class="skill-card">
      <div class="name">${s.name||'?'}</div>
      <div class="desc">${s.description||''}</div>
      <div class="meta">${s.branch||'?'} · ${s.tool||'sed'} · ${s.file_type||''} · discovered ${(s.discovered||'').slice(0,10)}</div>
    </div>`
  ).join('');
  document.getElementById('skills').innerHTML = skillsHtml || '<div style="color:#484f58;padding:12px">No skills learned yet</div>';
}

load();
</script>
</body>
</html>
