<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archives - financecheque.uk</title>
  <style>
    body { font-family: system-ui; max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
    h1 { color: #333; }
    .file-list { list-style: none; padding: 0; }
    .file-list li { padding: 0.5rem; border-bottom: 1px solid #eee; }
    .file-list a { text-decoration: none; color: #0066cc; }
    .file-list a:hover { text-decoration: underline; }
    .meta { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Archives</h1>
  <p class="meta">Versioned document archive for financecheque.uk</p>
  <ul class="file-list" id="files"></ul>
  <script>
    fetch('/_archives_manifest.json')
      .then(r => r.json())
      .then(data => {
        const list = document.getElementById('files');
        data.deployed_files.sort().forEach(f => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = `/static/archives/${f}`;
          a.textContent = f;
          li.appendChild(a);
          list.appendChild(li);
        });
      });
  </script>
</body>
</html>
