<!-- Brain Chat Widget — SmolLM2 via Transformers.js + brain.financecheque.uk API -->
<style>
#brain-chat-btn{position:fixed;bottom:20px;left:20px;width:52px;height:52px;border-radius:50%;background:#29808A;color:#fff;border:none;font-size:22px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:9999;display:flex;align-items:center;justify-content:center;}
#brain-chat-box{position:fixed;bottom:82px;left:20px;width:340px;max-height:480px;background:#1a1a2e;border:1px solid #333666;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:9999;display:none;flex-direction:column;font-family:system-ui,sans-serif;overflow:hidden;}
#brain-chat-box.open{display:flex;}
#brain-chat-header{background:#33365D;padding:10px 14px;color:#e8e8f0;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center;}
#brain-chat-header span{font-size:10px;color:#55a5d9;margin-left:8px;}
#brain-chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:200px;}
.brain-msg{padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.4;max-width:90%;}
.brain-msg.user{background:#29808A;color:#fff;align-self:flex-end;}
.brain-msg.bot{background:#333666;color:#e8e8f0;align-self:flex-start;}
.brain-msg.status{background:transparent;color:#55a5d9;font-size:11px;align-self:center;font-style:italic;}
#brain-chat-input-row{display:flex;padding:8px;gap:6px;border-top:1px solid #333666;}
#brain-chat-input{flex:1;background:#333666;border:none;border-radius:6px;padding:8px 10px;color:#e8e8f0;font-size:13px;outline:none;}
#brain-chat-send{background:#29808A;color:#fff;border:none;border-radius:6px;padding:8px 12px;cursor:pointer;font-size:13px;}
</style>

<button id="brain-chat-btn" title="Ask unclehowell's brain">🧠</button>
<div id="brain-chat-box">
  <div id="brain-chat-header">
    unclehowell's brain
    <span id="brain-model-status">loading model...</span>
  </div>
  <div id="brain-chat-msgs"></div>
  <div id="brain-chat-input-row">
    <input id="brain-chat-input" placeholder="Ask anything..." disabled />
    <button id="brain-chat-send" disabled>→</button>
  </div>
</div>

<script type="module">
const BRAIN_API = 'https://brain.financecheque.uk/api';
const API_KEY = 'llmwiki-agent-key-unclehowell-2026';
const msgs = document.getElementById('brain-chat-msgs');
const input = document.getElementById('brain-chat-input');
const send = document.getElementById('brain-chat-send');
const status = document.getElementById('brain-model-status');

document.getElementById('brain-chat-btn').onclick = () =>
  document.getElementById('brain-chat-box').classList.toggle('open');

function addMsg(text, role) {
  const d = document.createElement('div');
  d.className = `brain-msg ${role}`;
  d.textContent = text;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
  return d;
}

// Fetch brain context
async function getBrainContext(query) {
  try {
    const r = await fetch(`${BRAIN_API}/list?api_key=${API_KEY}`);
    const d = await r.json();
    return `Available knowledge categories: ${(d.categories||[]).join(', ')}. Built at: ${d.built_at||'unknown'}.`;
  } catch { return ''; }
}

// Load SmolLM2 via Transformers.js
let generator = null;
async function loadModel() {
  try {
    const { pipeline, env } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3/dist/transformers.min.js');
    env.allowLocalModels = false;
    status.textContent = 'loading SmolLM2...';
    generator = await pipeline('text-generation', 'HuggingFaceTB/SmolLM2-135M-Instruct', {
      device: 'webgpu',
      dtype: 'q4'
    });
    status.textContent = 'SmolLM2 ready ✓';
    input.disabled = false;
    send.disabled = false;
    addMsg('Hi! I\'m powered by SmolLM2 + brain.financecheque.uk. Ask me anything about the DATRO knowledge base.', 'bot');
  } catch(e) {
    status.textContent = 'model unavailable';
    input.disabled = false;
    send.disabled = false;
    addMsg('SmolLM2 unavailable (WebGPU not supported). I\'ll use the brain API directly.', 'status');
  }
}

async function handleSend() {
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  addMsg(q, 'user');
  const thinking = addMsg('thinking...', 'status');

  const context = await getBrainContext(q);
  let reply = '';

  if (generator) {
    try {
      const prompt = `<|im_start|>system\nYou are unclehowell's AI assistant. Context: ${context}\n<|im_end|>\n<|im_start|>user\n${q}<|im_end|>\n<|im_start|>assistant\n`;
      const out = await generator(prompt, { max_new_tokens: 150, temperature: 0.7 });
      reply = out[0].generated_text.split('<|im_start|>assistant\n').pop().split('<|im_end|>')[0].trim();
    } catch(e) { reply = `Error: ${e.message}`; }
  } else {
    reply = `Brain context: ${context || 'No context available.'} (SmolLM2 not loaded — WebGPU required)`;
  }

  thinking.remove();
  addMsg(reply || 'No response.', 'bot');

  // Save conversation to brain memory (async, non-blocking)
  fetch(`${BRAIN_API}/memory?api_key=${API_KEY}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
    body: JSON.stringify({ user_message: q, bot_reply: reply, session_id: 'fcuk-web-' + Date.now() })
  }).catch(() => {});
}

send.onclick = handleSend;
input.onkeydown = e => e.key === 'Enter' && handleSend();

loadModel();
</script>
