#:schema node_modules/wrangler/config-schema.json
name = "dcc"
type = "javascript"

[env.production]
routes = [
  { pattern = "dcc.datro.xyz/*", zone_name = "dcc.datro.xyz" }
]

[build]
command = "npm run build"
cwd = "."
watch_paths = ["src/**/*.js", "src/**/*.jsx"]

[build.upload]
format = "service-worker"
main = "./dist/index.js"

[pages_build_output]
dir = "./dist" # This is the crucial line for Pages deployment
