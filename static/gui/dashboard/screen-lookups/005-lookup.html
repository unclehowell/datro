<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; background:#111; font-family:-apple-system,BlinkMacSystemFont,sans-serif; }
.settings-container {
  max-width:600px; margin:40px auto; padding:20px; color:#e0e0e0;
}
h1 { text-align:center; margin-bottom:30px; font-size:1.4rem; color:#fff; }
.setting-item {
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:10px; padding:16px 20px; margin-bottom:12px;
  display:flex; align-items:center; justify-content:space-between;
}
.setting-item span { font-size:0.95rem; }
.setting-item a {
  color:#ff8a00; text-decoration:none; font-size:0.85rem;
}
</style>
</head>
<body>
<iframe src="/links-app/" style="width:100%;height:100%;border:none;"></iframe>
</body>
</html>
