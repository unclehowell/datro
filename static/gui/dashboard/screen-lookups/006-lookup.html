<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Oakesy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .split-container {
    display: flex;
    width: 100%;
    height: 100%;
    position: relative;
  }
  .split-container iframe {
    border: none;
    width: 100%;
    height: 100%;
    display: block;
    background: #0a0a1a;
  }

  /* Mode 0: vertical split (side by side) */
  .split-container.mode-0 { flex-direction: row; }
  .split-container.mode-0 .split-pane { width: 50%; height: 100%; min-width: 0; }

  /* Mode 1: horizontal split (stacked) */
  .split-container.mode-1 { flex-direction: column; }
  .split-container.mode-1 .split-pane { width: 100%; height: 50%; min-height: 0; }

  /* Mode 2: left only */
  .split-container.mode-2 .split-pane:first-child { width: 100%; height: 100%; }
  .split-container.mode-2 .split-pane:last-child { display: none; }

  /* Mode 3: right only */
  .split-container.mode-3 .split-pane:first-child { display: none; }
  .split-container.mode-3 .split-pane:last-child { width: 100%; height: 100%; }

  /* Thin visual divider (non-interactive, no drag conflicts) */
  .split-divider {
    flex-shrink: 0;
    z-index: 1;
    background: linear-gradient(180deg, #ff8a00, #e52e71);
  }
  .mode-0 .split-divider { width: 2px; }
  .mode-1 .split-divider { height: 2px; width: 100%; }
  .mode-2 .split-divider,
  .mode-3 .split-divider { display: none; }

  /* Floating mode toggle button - bottom-right corner */
  #splitToggle {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 9999;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: rgba(10, 10, 26, 0.9);
    border: 1.5px solid rgba(255, 138, 0, 0.4);
    color: #fff;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s ease, border-color 0.2s;
    padding: 0;
  }
  #splitToggle:hover {
    border-color: rgba(255, 138, 0, 0.8);
    transform: scale(1.05);
  }
  #splitToggle:active {
    transform: scale(0.95);
  }
  #splitToggle .arrow-row {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  #splitToggle .arrow {
    width: 8px;
    height: 8px;
    border-top: 2px solid rgba(255, 255, 255, 0.8);
    border-right: 2px solid rgba(255, 255, 255, 0.8);
    display: inline-block;
  }
  #splitToggle .arrow.right {
    transform: rotate(45deg);
    margin-left: -2px;
  }
  #splitToggle .arrow.left {
    transform: rotate(-135deg);
    margin-right: -2px;
  }
  #splitToggle .mode-label {
    position: absolute;
    bottom: -22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    color: rgba(255, 255, 255, 0.5);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  #splitToggle:hover .mode-label,
  #splitToggle:active .mode-label {
    opacity: 1;
  }

  @media (max-width: 768px) {
    #splitToggle {
      bottom: 12px;
      right: 12px;
      width: 42px;
      height: 42px;
      border-radius: 10px;
    }
    #splitToggle .arrow { width: 7px; height: 7px; }
    #splitToggle .mode-label { display: none; }
  }
</style>
</head>
<body>

<div class="split-container mode-0" id="splitContainer">
  <div class="split-pane" id="paneLeft">
    <iframe src="https://call.datro.xyz" allow="camera; microphone" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox" allowfullscreen></iframe>
  </div>
  <div class="split-divider"></div>
  <div class="split-pane" id="paneRight">
    <iframe src="/ai-app/" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox" allowfullscreen></iframe>
  </div>
</div>

<!-- Floating toggle button -- cycles: vertical split, horizontal split, left only, right only -->
<button id="splitToggle" title="Cycle layout">
  <div class="arrow-row">
    <span class="arrow left"></span>
    <span class="arrow right"></span>
  </div>
  <span class="mode-label" id="modeLabel">Vertical Split</span>
</button>

<script>
(function() {
  var container = document.getElementById('splitContainer');
  var btn = document.getElementById('splitToggle');
  var label = document.getElementById('modeLabel');
  var isMobile = window.innerWidth <= 768;

  var DESKTOP_ORDER = [0, 1, 2, 3]; // vertical, horizontal, left-only, right-only
  var MOBILE_ORDER  = [1, 0, 3, 2]; // horizontal, vertical, right-only, left-only
  var order = isMobile ? MOBILE_ORDER : DESKTOP_ORDER;
  var MODE_LABELS = ['Vertical Split', 'Horizontal Split', 'Left Only', 'Right Only'];

  var defaultMode = isMobile ? 1 : 0;
  var idx = 0;

  // Restore saved mode
  try {
    var saved = parseInt(localStorage.getItem('splitMode'));
    if (saved >= 0 && saved <= 3) {
      defaultMode = saved;
      idx = order.indexOf(saved);
      if (idx === -1) idx = 0;
    }
  } catch(e) {}

  function apply(mode) {
    container.classList.remove('mode-0', 'mode-1', 'mode-2', 'mode-3');
    container.classList.add('mode-' + mode);
    label.textContent = MODE_LABELS[mode];
    try { localStorage.setItem('splitMode', mode); } catch(e) {}
  }

  apply(defaultMode);
  idx = order.indexOf(defaultMode);
  if (idx === -1) idx = 0;

  btn.addEventListener('click', function(e) {
    e.preventDefault();
    idx = (idx + 1) % order.length;
    apply(order[idx]);
  });

  // Handle resize / orientation
  window.addEventListener('resize', function() {
    var wasMobile = isMobile;
    isMobile = window.innerWidth <= 768;
    if (wasMobile !== isMobile) {
      order = isMobile ? MOBILE_ORDER : DESKTOP_ORDER;
      var currentMode = parseInt(container.className.match(/mode-(\d)/)?.[1] || 0);
      var newIdx = order.indexOf(currentMode);
      if (newIdx === -1) {
        apply(isMobile ? 1 : 0);
        idx = order.indexOf(isMobile ? 1 : 0);
      } else {
        idx = newIdx;
      }
    }
  });
})();
</script>
</body>
</html>
