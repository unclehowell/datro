    <script>
      $(document).ready(function(){
        // Set trigger and container variables
        var trigger = $('#nav ul li a'),
            container = $('#content');

        // Fire on click
        trigger.on('click', function(){
          // Set $this for re-use. Set target from data attribute
          var $this = $(this),
            target = $this.data('target');

          // Load target page into container
          container.load(target + '.html');

          // Stop normal link behavior
          return false;
        });
      });
    </script>

<body style="overflow: inherit!important;height: inherit!important;display:visible;">
<div id="apps-container" class="apps-container">
</div>

<script src="media/js/breadcrumb.js"></script>

<script src="media/js/main.js"></script>

<script>
const ADD_APP_ID = '999-999';

function shouldDisplayAddApp() {
    if (document.body.dataset.lockAddApp === 'true') {
        return true;
    }

    const addAppState = localStorage.getItem(ADD_APP_ID);
    return addAppState !== 'removed';
}

function updateHomeScreen() {
    const appsContainer = document.getElementById('apps-container');
    appsContainer.innerHTML = ''; // Clear existing apps

    let allAppIds = ['005-001', '005-002']; // All potential app IDs for this page
    let appsToDisplay = [];

    // Add installed apps
    allAppIds.forEach(appId => {
        if (localStorage.getItem(appId) === 'added') {
            appsToDisplay.push(appId);
        }
    });

    // Add the 'Add+' icon last
    if (shouldDisplayAddApp()) {
        appsToDisplay.push(ADD_APP_ID);
    }

    appsToDisplay.forEach(appId => {
        const appElement = document.createElement('a');
        appElement.href = getAppLink(appId); // Set the hyperlink
        appElement.style.cursor = 'pointer';

        let logoFile;
        // Assuming all logos are .png unless specified otherwise
        logoFile = `../app-store/apps/${appId}/logo.png`;

        appElement.innerHTML = `
            <div class="square-${appId}">
                <div class="content-${appId}">
                    <div class="table-${appId}">
                        <div class="table-cell-${appId}">
                            <img class="rs-${appId}" src="${logoFile}">
                            <br>
                            <img src="../app-store/apps/${appId}/title.svg" style="width:75%; height:5vw; margin-top:-0.25pc;">
                            <br>
                        </div>
                    </div>
                </div>
            </div>
        `;
        appsContainer.appendChild(appElement);
    });
}

function getAppLink(appId) {
    switch (appId) {
        case '005-001':
            return '#'; // Placeholder link
        case '005-002':
            return '#'; // Placeholder link
        case ADD_APP_ID:
            return '../app-store/005.html'; // Link to its own app-store page
        default:
            return '#'; // Fallback for any unhandled appIds
    }
}

document.addEventListener("DOMContentLoaded", updateHomeScreen);
window.addEventListener('storage', updateHomeScreen);
</script>
