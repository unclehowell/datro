<script>
  document.addEventListener('DOMContentLoaded', function() {
    const squares = document.querySelectorAll('.square');
    squares.forEach(square => {
      let appId = null;
      let imgElement = square.querySelector('img.rs');

      if (imgElement) {
        const src = imgElement.getAttribute('src');
        const match = src.match(/icons\/([^.]+)\.svg$/);
        if (match && match[1]) {
          appId = match[1];
        }
      } else {
        // Check for the '+ Add App' icon which doesn't have an img.rs with appId
        const appCard = square.querySelector('.app-card');
        if (appCard && appCard.dataset.appId === '999-999') {
          appId = '999-999';
        }
      }

      if (appId) {
        // Special case for '000' which might be 'Search' and not a toggleable app
        if (appId === '000') {
          // If not explicitly set to 'removed', show it. Otherwise, hide it.
          if (localStorage.getItem(appId) !== 'removed') {
            square.style.display = ''; // Ensure it's visible by default
          } else {
            square.style.display = 'none';
          }
          return;
        }

        // For other app IDs, check localStorage
        if (localStorage.getItem(appId) === 'added') {
          square.style.display = ''; // Show the square
        } else {
          square.style.display = 'none'; // Hide the square
        }
      }
    });
  });
</script>
