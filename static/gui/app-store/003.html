<!DOCTYPE html>
<html lang="en">
<html>
        <meta charset="UTF-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <title>App Store</title>
        <link href="../dashboard/media/css/breadcrumb.css" rel="stylesheet">
        <link href="../dashboard/media/css/appstore.css" rel="stylesheet">
        <link href="css/font-awesome.css" rel="stylesheet">
        <style>
            body {
                background: rgb(44,12,33)!important;
            }
            .square {
                border:solid rgba(255,255,255,0.3) 1.5px;
            }
        </style>
</head>
<body onload="document.body.classList.add('loaded');">
        <div class="container">
                <div class="box">
                        <div class="box-row">
                                <div class="box-cell box1">
                                        <ul class="breadcrumb"></ul>
                                        <script src="js/dynamic-breadcrumb.js"></script>
                                </div>
                        </div>
                </div>
        </div>

        <main class="app-store-grid">
                <!-- 003-004 (Paperclip) -->
                <a class="app-card-link" href="#">
                        <article class="app-card" data-app-id="003-004">
                                <div class="app-card__icon-wrapper">
                                        <img class="app-card__icon" src="apps/003-004/logo.png" alt="App Icon 003-004">
                                </div>
                                <div class="app-card__toggle">
                                        <input class="app-checkbox" id="003-004" type="checkbox">
                                        <label class="app-label install" for="003-004"><span class="thumb"></span></label>
                                </div>
                        </article>
                </a>

                <!-- 005-004 (Links) -->
                <a class="app-card-link" href="#">
                        <article class="app-card" data-app-id="005-004">
                                <div class="app-card__icon-wrapper">
                                        <img class="app-card__icon" src="apps/005-004/logo.png" alt="App Icon 005-004">
                                </div>
                                <div class="app-card__toggle">
                                        <input class="app-checkbox" id="005-004" type="checkbox">
                                        <label class="app-label install" for="005-004"><span class="thumb"></span></label>
                                </div>
                        </article>
                </a>

                <!-- Add New App -->
                <a class="app-card-link app-card-link--inactive" href="#" aria-disabled="true">
                        <article class="app-card app-card--disabled" data-app-id="999-999">
                                <div class="app-card__icon-wrapper">
                                        <img class="app-card__icon" src="apps/999-999/logo.png" alt="Add new app" style="opacity: 0.4; filter: drop-shadow(2px 4px 1px black) invert(0.5);">
                                </div>
                                <div class="app-card__toggle">
                                        <input class="app-checkbox" id="999-999" type="checkbox" checked>
                                        <label class="app-label install" for="999-999"><span class="thumb"></span></label>
                                </div>
                        </article>
                </a>
        </main>

<script src="js/app-toggle.js"></script>
<script src="js/breadcrumb.js"></script>
<script src="js/jquery-2.1.4.min.js"></script>
<script src="js/main.js"></script>
<script src="js/jquery.modallink-1.0.0.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    ['003-004', '005-004', '999-999'].forEach(appId => {
      const checkbox = document.getElementById(appId);
      if (checkbox) {
        const stored = localStorage.getItem(appId);
        checkbox.checked = stored === 'added' || (appId === '999-999' && stored !== 'removed');
        
        checkbox.addEventListener('change', function() {
          if (this.checked) {
            localStorage.setItem(appId, 'added');
          } else {
            localStorage.setItem(appId, 'removed');
          }
          window.location.reload();
        });
      }
    });
  });
</script>
  </body>
</html>
