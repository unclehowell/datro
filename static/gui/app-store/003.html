<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <title>App Store</title>
        <link href="css/002e.css" rel="stylesheet">
        <link href="css/breadcrumb.css" rel="stylesheet">
        <link href="css/appstore.css" rel="stylesheet">
        <link href="css/appstore-common.css" rel="stylesheet">
        <link href="css/font-awesome.css" rel="stylesheet">
        <link href="apps/000-000/style.css" rel="stylesheet">
        <link href="apps/003-001/style.css" rel="stylesheet">
        <link href="apps/999-999/style.css" rel="stylesheet">
        <style>
@tailwind base;
@tailwind components;
@tailwind utilities;

  :root {
    --sz: 10vmin;
    --on: #99dc39;
    --of: #F44336;
    --lg: var(--of);
    --sp: 5s;
  }

  body {
    background-color:#303030;
  }

  .app-checkbox {
    display: none;
  }

.app-checkbox:checked + .app-label::before {
    right: 50%;
    background: var(--on);
}
        @font-face {
             font-family: 'FontAwesome';
             src: url('../fonts/fontawesome-webfont.eot');
           }

        html {overflow-x: hidden!important;height: -webkit-fill-available;}
        body::-webkit-scrollbar {
           width: 30px;
           height: 30px;
        }
        html::-webkit-scrollbar-thumb {
           background: -webkit-gradient(linear,left top,left bottom,from(#ff8a00),to(#e52e71));
           background: linear-gradient(180deg,#ff8a00,#e52e71);
           border-radius: 30px;
           box-shadow: inset 2px 2px 2px hsla(0,0%,100%,.25), inset -2px -2px 2px rgba(0,0,0,.25);
        }

        html::-webkit-scrollbar-track {
           background: linear-gradient(90deg,#201c29,#201c29 1px,#100e17 0,#100e17);
        }

        .content .rs {
           max-height: 35%;
           width: auto;
           margin-top: 10px;
           overflow: hidden!important;
           height: 6%;
        }
        a:link, a, a:hover {color: rgba(255,255,255,0.8); font-size: 1.6rem;}

        .container .box {
           width: 82vw;
           margin-left: 0.5vw;
           display: table;
           border-radius: 20px;
           min-height:98px;
        }

        .container .box .box-row {
           display:table-row;
           color:rgba(255,255,255,0.6);
        }

        .container .box .box-cell {
           display:table-cell;
           width:28vw;
           padding:20px 45px 13px 20px;
        }

        .container .box .box-cell.box1 {
           background:transparent;
           text-align:left;
           position:fixed;
           min-height:10vh;
        }

        .container .box .box-cell.box2 {
           background: transparent;
           font-size: 2rem;
           text-align: center;
           padding-left: 100px;
           font-weight: bold;
        }

        .container .box .box-cell.box3 {
           background:transparent;
           text-align:right;
           position: relative;
        }

        img {
         image-rendering: auto;
         image-rendering: crisp-edges;
         image-rendering: pixelated;
        }
        .breadcrumb {opacity:0.4;}
        .noHover{
           pointer-events: none;
        }

        .noHover a:hover{
           pointer-events: none;
        }

        body:not(.loaded) #slider img {
         display:none;
        }

        .forminput {
         border: 1px solid transparent!important;
         margin-top: -1.5rem;
         background: transparent;
         opacity: 0.6;
         max-width: 17rem;
         text-align: center;
         padding: 5px;
         position: fixed;
         margin-left: -7.5rem;
         color: dimgrey;
         font-weight: 800!important;
         letter-spacing: 0.2em;
         font-size: 1.7rem;
        }

        .logo {
         background:transparent!important;
         opacity:1;
         margin-top: 0.8rem;
         max-width: calc(100vw - 80px)!important;
         width: 23rem!important;
         margin-right: calc(-9.5rem + 41.5vw)!important;
         float: right!important;
        }

body {
    background-color: #454545;
}
  .app {
    width: 100px;
    max-height: 19px;
    text-align: center;
    line-height: 19px;
    cursor: pointer;
    border: none;
    border-radius: 5px;
    position: relative;
    background-color: rgb(1, 1, 1, 0.1);
    color: white ! Important;
  }
        </style>
</head>
<body style="overflow: inherit !important; height: inherit !important; display: visible;" onload="document.body.classList.add('loaded');">
        <div class="container">
                <div class="box">
                        <div class="box-row">
                                <div class="box-cell box1">
                                        <ul class="breadcrumb" id="btn noHover">
                                                <li class='btn noHover'>
                                                        <a href="#" style="width:auto!Important;"><span class="icon icon-gamepad"></span> <span class="text2">Controllers</span></a>
                                                </li>
                                                <li>
                                                        <a href='000.html' style='--breadcrumb-bg: rgba(0,0,0,0.55); --breadcrumb-border-color: rgba(255,255,255,0.4); --breadcrumb-text-color: rgba(255,255,255,0.8); --breadcrumb-padding-left: 48px; width:auto!Important; filter: brightness(1); background: var(--breadcrumb-bg); border: 1px solid var(--breadcrumb-border-color); position: initial; margin-top: 0px;'><span class="text2" style="margin-left:1vw;">Categories</span></a>
                                                </li>
                                                <li class="btn noHover">
                                                        <a class="backtodash" href="000.html"><span class="text2">App Store</span></a>
                                                </li>
                                                <li class="btn">
                                                        <a href="../dashboard/001-a.html"><span class="icon icon-search"></span> <span class="text"></span></a>
                                                </li>
                                        </ul>
                                </div>
                        </div>
                </div>
        </div>
        <div class="apps-container" id="apps-container">
                <a class="app-link" href="apps/003-001/fetch.html" style="cursor:pointer;">
                        <div class="square-003-001">
                                <div class="content-003-001">
                                        <div class="table-003-001">
                                                <div class="table-cell-003-001">
                                                        <img class="rs-003-001" src="apps/003-001/logo.png" alt="003-001 app icon"><br>
                                                        <span class="app-title">
                                                                <object data="apps/003-001/title.svg" type="image/svg+xml" aria-label="003-001 app title"></object>
                                                        </span><br>
                                                        <div class="toggle">
                                                                <input class="app-checkbox" id="003-001" type="checkbox">
                                                                <label class="app-label install" for="003-001"><span class="thumb"></span></label>
                                                        </div>
                                                </div>
                                        </div>
                                </div>
                        </div>
                </a>
                <a class="app-link" href="#" style="cursor:pointer;">
                        <div class="square-999-999">
                                <div class="content-999-999">
                                        <div class="table-999-999">
                                                <div class="table-cell-999-999">
                                                        <img class="rs-999-999" src="apps/999-999/logo.png" alt="Add application icon"><br>
                                                        <span class="app-title">
                                                                <object data="apps/999-999/title.svg" type="image/svg+xml" aria-label="Add application title"></object>
                                                        </span><br>
                                                        <div class="toggle">
                                                                <input class="app-checkbox" id="999-999" type="checkbox" checked>
                                                                <label class="app-label install" for="999-999"><span class="thumb"></span></label>
                                                        </div>
                                                </div>
                                        </div>
                                </div>
                        </div>
                </a>
        </div>
        <script src="js/appstore-page.js"></script>
        <script>
        document.addEventListener('DOMContentLoaded', function () {
            initAppStore(['003-001', '999-999'], ['999-999']);
        });
        </script>
</body>
</html>
