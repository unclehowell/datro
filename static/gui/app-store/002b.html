<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <title>App Store</title>
        <link href="css/002e.css" rel="stylesheet">
        <link href="css/breadcrumb.css" rel="stylesheet">
        <link href="css/appstore.css" rel="stylesheet">
        <link href="apps/000-000/style.css" rel="stylesheet">
        <link href="apps/002-001/style.css" rel="stylesheet">
        <link href="apps/002-002/style.css" rel="stylesheet">
        <link href="apps/002-003/style.css" rel="stylesheet">
        <link href="apps/999-999/style.css" rel="stylesheet">
        <link href="css/appstore-common.css" rel="stylesheet">
</head>
<body class="app-store-page" style="overflow: inherit !important; height: inherit !important; display: visible;" onload="document.body.classList.add('loaded');">
        <div class="container">
                <div class="box">
                        <div class="box-row">
                                <div class="box-cell box1">
                                        <ul class="breadcrumb" id="btn noHover">
                                                <li class='btn noHover'>
                                                        <a href="#" style="width:auto!Important;"><span class="icon icon-home"></span> <span class="text2">Entertainment</span></a>
                                                </li>
                                                <li>
                                                        <a href='000.html' style='width:auto!Important;filter: brightness(1);background:rgba(0,0,0,0.55);border: 1px solid rgba(255,255,255,0.4);position: initial; padding-left: 48px!Important; margin-top: 0px;'><span class="text2" style="margin-left:1vw;">Categories</span></a>
                                                </li>
                                                <li class="btn noHover">
                                                        <a class='backtodash' href='000.html'><span class="text2">App Store</span></a>
                                                </li>
                                                <li class="btn">
                                                        <a href='../dashboard/001-a.html'><span class="icon icon-search"></span> <span class="text"></span></a>
                                                </li>
                                        </ul>
                                </div>
                        </div>
                </div>
        </div>

        <div id="apps-container" class="apps-container app-store-grid"></div>

        <script>
function isAddIconProtected() {
    return /app-store\/006/i.test(window.location.pathname);
}

function toggleAppInstallation(appId, shouldBeInstalled) {
    const isAddIcon = appId === '999-999';
    const addIconProtected = isAddIcon && isAddIconProtected();
    if (addIconProtected) {
        const checkbox = document.getElementById(appId);
        if (checkbox) {
            checkbox.checked = true;
        }
        return;
    }

    if (shouldBeInstalled) {
        localStorage.setItem(appId, 'added');
    } else if (isAddIcon) {
        localStorage.setItem(appId, 'removed');
    } else {
        localStorage.removeItem(appId);
    }
}

function getAppLink(appId) {
    switch (appId) {
        case '002-001':
            return '../app-store/apps/002-001/fetch.html';
        case '002-002':
            return 'http://hbnb.local:81';
        case '999-999':
            return '../app-store/002b.html';
        default:
            return '#';
    }
}

function handleDragStart(event) {
    const source = event.currentTarget;
    const appId = source.dataset.appId || source.id || '';
    if (appId) {
        event.dataTransfer.setData('text/plain', appId);
    }
}

function updateHomeScreen() {
    const appsContainer = document.getElementById('apps-container');
    appsContainer.innerHTML = ''; // Clear existing apps

    const appIds = ['002-001', '002-002', '999-999']; // Using class-based IDs
    appIds.forEach(appId => {
        const appInstalled = localStorage.getItem(appId) === 'added';
        const storedValue = localStorage.getItem(appId);
        const appElement = document.createElement('a');
        const isPlaceholder = appId === '999-999';
        const addIconProtected = isPlaceholder && isAddIconProtected();
        const shouldBeChecked = isPlaceholder
            ? (addIconProtected || storedValue !== 'removed')
            : appInstalled;
        const shouldRender = appInstalled || isPlaceholder;
        if (!shouldRender) {
            return;
        }
        appElement.href = getAppLink(appId); // Set the hyperlink
        const linkClasses = ['app-card-link'];
        if (isPlaceholder && addIconProtected) {
            linkClasses.push('app-card-link--inactive');
        }
        appElement.className = linkClasses.join(' ');
        appElement.dataset.appId = appId;
        appElement.draggable = true;
        appElement.style.cursor = isPlaceholder && addIconProtected ? 'default' : 'pointer';
        if (addIconProtected) {
            appElement.setAttribute('aria-disabled', 'true');
        } else {
            appElement.removeAttribute('aria-disabled');
        }

        const toggleAttributes = [];
        if (shouldBeChecked) {
            toggleAttributes.push('checked');
        }
        if (addIconProtected) {
            toggleAttributes.push('disabled');
        }
        const cardClasses = `app-card${isPlaceholder && addIconProtected ? ' app-card--disabled' : ''}`;
        const altText = isPlaceholder ? 'Add new app' : `Hβnβ entertainment app icon ${appId}`;

        appElement.innerHTML = `
            <article class="${cardClasses}" data-app-id="${appId}">
                <div class="app-card__icon-wrapper">
                    <img class="app-card__icon" src="apps/${appId}/logo.png" alt="${altText}">
                </div>
                <div class="app-card__toggle">
                    <input class="app-checkbox" id="${appId}" type="checkbox" ${toggleAttributes.join(' ')}>
                    <label class="app-label install" for="${appId}"><span class="thumb"></span></label>
                </div>
            </article>
        `;
        appElement.addEventListener('dragstart', handleDragStart);
        appsContainer.appendChild(appElement);
    });

    // Re-attach click listeners to newly created checkboxes
    const checkboxes = document.querySelectorAll('.app-checkbox');
    checkboxes.forEach(checkbox => {
        checkbox.addEventListener('change', function() {
            toggleAppInstallation(this.id, this.checked);
        });
    });
}

document.addEventListener("DOMContentLoaded", updateHomeScreen);
window.addEventListener('storage', updateHomeScreen); // Listen for changes in localStorage
        </script>
</body>
</html>
