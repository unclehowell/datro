<!DOCTYPE html>
<html class="no-js" lang="en">
<head>
    <meta charset="utf-8">
    <title>Redirect Page</title>
    <script src="../../../dashboard/js/jquery-3.3.1.min.js"></script>
    <script src="../../../dashboard/js/appLauncher.js"></script>
<script>
        window.onload = function() {
            const appId = '003-001'; // Corrected appId
            const localBaseUrl = 'http://' + window.location.hostname + '/dash';
            const onlineDemoUrl = 'https://demo.jellyfin.org/stable/web/index.html'; // Placeholder, needs to be specific to the app

            // Ensure handleAppLaunch is available (it should be loaded from appLauncher.js)
            if (typeof handleAppLaunch === 'function') {
                handleAppLaunch(appId, localBaseUrl, onlineDemoUrl);
            } else {
                // Fallback if appLauncher.js is not loaded or function is not available
                console.error('appLauncher.js or handleAppLaunch function not found.');
                // Optionally, you could try the old redirect logic here as a fallback
                var hostname = window.location.hostname;
                if (hostname.indexOf("datro") !== -1) {
                    window.location.replace(onlineDemoUrl);
                } else {
                    window.location.replace(localBaseUrl);
                }
            }
        };
    </script>
</head>

</html>
