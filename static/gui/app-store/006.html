<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <title>App Store</title>
        <link href="../dashboard/media/css/breadcrumb.css" rel="stylesheet">
        <link href="../dashboard/media/css/appstore.css" rel="stylesheet">
        <link href="css/font-awesome.css" rel="stylesheet">
        <style>
            /* Additional styles specific to app-store pages if needed */
            body {
                background: rgb(44,12,33)!important;
            }
            .square {
                border:solid rgba(255,255,255,0.3) 1.5px;
            }
        </style>
</head>
<body onload="document.body.classList.add('loaded');">
        <div class="container">
                <div class="box">
                        <div class="box-row">
                                <div class="box-cell box1">
                                        <ul class="breadcrumb" id="btn noHover">
                                                <li class="btn">
                                                        <a href="#"></a>
                                                </li>
                                                <li class='btn noHover'>
                                                        <a class='backtodash' href='000.html'><span class="text2">App Store</span></a>
                                                </li>
                                                <li class="btn">
                                                        <a href='000.html'><span class="text2">Categories</span></a>
                                                </li>
                                                <li class="btn">
                                                        <a href='../dashboard/001-a.html'><span class="icon icon-search"></span> <span class="text">Search</span></a>
                                                </li>
                                        </ul>
                                </div>
                        </div>
                </div>
        </div>
        <main class="app-store-grid">
                <a class="app-card-link" href="app-description-006-001.html">
                        <article class="app-card" data-app-id="006-001">
                                <div class="app-card__icon-wrapper">
                                        <img class="app-card__icon" src="apps/006-001/logo.png" alt="Other app icon 006-001">
                                </div>
                                <div class="app-card__toggle">
                                        <input class="app-checkbox" id="006-001" type="checkbox">
                                        <label class="app-label install" for="006-001"><span class="thumb"></span></label>
                                </div>
                        </article>
                </a>

                <a class="app-card-link" href="app-description-006-002.html">
                        <article class="app-card" data-app-id="006-002">
                                <div class="app-card__icon-wrapper">
                                        <img class="app-card__icon" src="apps/006-002/logo.png" alt="Other app icon 006-002">
                                </div>
                                <div class="app-card__toggle">
                                        <input class="app-checkbox" id="006-002" type="checkbox">
                                        <label class="app-label install" for="006-002"><span class="thumb"></span></label>
                                </div>
                        </article>
                </a>

                <a class="app-card-link app-card-link--inactive" href="#" aria-disabled="true">
                        <article class="app-card app-card--disabled" data-app-id="999-999">
                                <div class="app-card__icon-wrapper">
                                        <img class="app-card__icon" src="apps/999-999/logo.png" alt="Add new app" style="opacity: 0.4; filter: drop-shadow(2px 4px 1px black) invert(0.5);">
                                </div>
                                <div class="app-card__toggle">
                                        <input class="app-checkbox" id="999-999" type="checkbox" checked>
                                        <label class="app-label install" for="999-999"><span class="thumb"></span></label>
                                </div>
                        </article>
                </a>
        </main>

        <script src="js/app-toggle.js"></script>
        <script>
          document.addEventListener('DOMContentLoaded', function() {
            const squares = document.querySelectorAll('.square');
            squares.forEach(square => {
              const link = square.querySelector('a');
              if (link) {
                const href = link.getAttribute('href');
                let appId = null;
                let match = href.match(/app-description-(\d+-\d+)\.html/);
                if (match && match[1]) {
                  appId = match[1];
                } else {
                  match = href.match(/apps\/(\d+-\d+)\/fetch\.html/);
                  if (match && match[1]) {
                    appId = match[1];
                  }
                }

                if (appId) {
                  if (appId === '999-999') {
                    return;
                  }
                  if (appId === '000') {
                    if (localStorage.getItem(appId) !== 'added') {
                      square.style.display = 'none';
                    } else {
                      square.style.display = '';
                    }
                    return;
                  }

                  if (localStorage.getItem(appId) === 'added') {
                    square.style.display = '';
                  } else {
                    square.style.display = 'none';
                  }
                }
              }
            });
          });
        </script>
</body>
</html>
