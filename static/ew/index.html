<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Secure Site</title>
<style>
body { font-family: sans-serif; padding:40px; }
input { padding:10px; width:280px;}
button { padding:10px; }
</style>
</head>
<body>
<h2>Enter Passphrase to Unlock Site</h2>
<input type="password" id="pw">
<button onclick="unlock()">Unlock</button>
<script>
async function unlock() {
    const pw = document.getElementById('pw').value;
    const encrypted = await fetch("encrypted.bin");
    const data = new Uint8Array(await encrypted.arrayBuffer());

    const keyMaterial = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(pw), {name:"PBKDF2"}, false, ["deriveKey"]
    );
    const key = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:new Uint8Array([1,2,3,4]), iterations:500000, hash:"SHA-256"},
      keyMaterial,
      {name:"AES-CBC", length:256},
      false,
      ["decrypt"]
    );

    try {
        const iv = data.slice(0,16);
        const ciphertext = data.slice(16);
        const decrypted = await crypto.subtle.decrypt({name:"AES-CBC", iv}, key, ciphertext);

        const blob = new Blob([decrypted]);
        const url = URL.createObjectURL(blob);

        // Extract TAR archive in memory
        const tarJS = await (await fetch("https://cdn.jsdelivr.net/npm/tar-js@0.3.5/dist/tar.min.js")).text();
        eval(tarJS);
        const tar = new Tar();
        const files = tar.extract(new Uint8Array(await blob.arrayBuffer()));

        // Load index.html from tar
        for (const f of files) {
            if (f.name.endsWith("index.html")) {
                document.write(new TextDecoder().decode(f.buffer));
                return;
            }
        }
        alert("No index.html found.");

    } catch (e) {
        alert("Incorrect passphrase or corrupt file.");
    }
}
</script>
</body>
</html>
