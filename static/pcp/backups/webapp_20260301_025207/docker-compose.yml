version: '3.8'

services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80/tcp"
      - "443:443/tcp"
    environment:
      TZ: 'UTC'
      WEBPASSWORD: 'admin123'
      SERVERIP: '127.0.0.1'
      DNS1: '172.20.0.5'
      DNS2: '172.20.0.5'
      DNS_BOGUS_PRIV: 'true'
      DNS_FQDN_REQUIRED: 'true'
      DNSSEC: 'true'
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    networks:
      dns_network:
        ipv4_address: 172.20.0.2
    depends_on:
      - bind9

  bind9:
    image: internetsystemsconsortium/bind9:9.18
    container_name: bind9
    ports:
      - "5353:53/tcp"
      - "5353:53/udp"
    volumes:
      - ./bind9/zones:/etc/bind/zones
      - ./bind9/bind9.conf:/etc/bind/named.conf
      - ./bind9/bind9.local.conf:/etc/bind/named.conf.local
      - ./bind9/bind9.options:/etc/bind/named.conf.options
    environment:
      BIND9_USER: bind
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    networks:
      dns_network:
        ipv4_address: 172.20.0.5

  squid:
    build:
      context: ./squid
      dockerfile: Dockerfile
    container_name: squid
    ports:
      - "3128:3128/tcp"
    volumes:
      - ./squid/cache:/var/spool/squid
      - ./squid/logs:/var/log/squid
      - ./squid/squid.conf:/etc/squid/squid.conf
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    networks:
      dns_network:
        ipv4_address: 172.20.0.3
    depends_on:
      - pihole

networks:
  dns_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16