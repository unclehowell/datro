<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <meta name="color-scheme" content="light dark" />
  <title>Finance Cheques | Control Panel Login</title>

  <link rel="stylesheet" href="css/adminlte.css" />

  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px 84px;
      box-sizing: border-box;
      background-color: #0a0a0f; /* Ensure background color for consistency */
    }
    .login-box {
      margin: auto; /* Center the login box */
      width: min(92vw, 440px);
      z-index: 10;
    }
    .login-box .card {
      background: rgba(16, 21, 29, 0.94);
      border: 1px solid #2a3341;
      border-radius: 14px;
      color: #e7edf5;
      backdrop-filter: blur(6px);
    }
    .login-box .card-header {
      border-bottom: 1px solid #2a3341;
    }
    .login-box .form-control,
    .login-box .form-select {
      background: #0f141b;
      border: 1px solid #2a3341;
      color: #e7edf5;
    }
    .login-box .form-control:focus,
    .login-box .form-select:focus {
      border-color: #45ff8f;
      box-shadow: 0 0 0 0.15rem rgba(69, 255, 143, 0.2);
    }
    footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 8px;
      z-index: 10;
      display: flex;
      justify-content: center;
      pointer-events: auto;
    }
    .root-footer {
      text-align: center;
      margin-top: 0;
      padding: 10px 16px;
      color: #8893a3;
      font-size: 0.8em;
    }
    /* ── AdminLTE dark mode overrides ── */
    body[data-bs-theme="dark"] .app-header,
    body[data-bs-theme="dark"] .app-main,
    body[data-bs-theme="dark"] .app-content-header,
    body[data-bs-theme="dark"] .app-footer { background-color: #0a0a0f !important; color: #d7d7d7; }
    body[data-bs-theme="dark"] .bg-body,
    body[data-bs-theme="dark"] .bg-body-tertiary,
    body[data-bs-theme="dark"] .bg-body-secondary { background-color: #0a0a0f !important; }

    /* ── BannerForge scoped variables ── */
    .bf-wrap {
      --bg:      #0b0f0b;
      --surface: #121a14;
      --surface2: #18231a;
      --border:  #2b3b2f;
      --accent:  #ffd400;
      --accent2: #45ff8f;
      --text:    #e7fbe7;
      --muted:   #6e8b6e;
      font-size: 12px;
    }

    /* Noise texture only inside bf-wrap */
    .bf-wrap::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1;
      opacity: 0.4;
    }

    /* ── Two-panel layout ── */
    .bf-wrap {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 56px - 56px);
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
    }

    /* ── LEFT: Preview ── */
    .bf-main {
      padding: 1.25rem 2rem;
      overflow: visible;
      background: var(--bg);
      position: relative;
    }
    .bf-stats-bar {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
      flex-wrap: wrap;
      overflow: visible;
    }
    .bf-summary { width: auto; margin: 0; }
    .bf-stats-spacer { flex: 1 1 auto; }
    .bf-stats-actions { display:flex; align-items:center; gap:0.4rem; flex-wrap:wrap; width:100%; }
    .bf-summary {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      flex-wrap: nowrap;
    }
    .bf-summary-col {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.25rem 0.35rem;
      min-width: 90px;
      height: auto;
      display:flex;
      align-items:flex-start;
      justify-content:flex-start;
      flex-direction: column;
      background: rgba(0,0,0,0.2);
    }
    .bf-summary-col.grey { background: rgba(120,120,120,0.12); }
    .bf-summary-col.red { background: rgba(214,40,40,0.08); }
    .bf-summary-col.amber { background: rgba(244,162,97,0.10); }
    .bf-summary-col.green { background: rgba(46,204,113,0.10); }
    .bf-summary-blocks { display: flex; flex-direction: row; gap: 2px; align-items: center; height: auto; min-height: 14px; }
    .bf-summary-block {
      width: 10px;
      height: 8px;
      border-radius: 2px;
      background: #666;
      opacity: 0.95;
      flex: 0 0 auto;
    }
    .bf-summary-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #666;
      opacity: 0.95;
      flex: 0 0 auto;
    }
    .bf-summary-block.grey, .bf-summary-dot.grey { background: #7a7a7a; }
    .bf-summary-block.red, .bf-summary-dot.red { background: #d62828; }
    .bf-summary-block.amber, .bf-summary-dot.amber { background: #f4a261; }
    .bf-summary-block.green, .bf-summary-dot.green { background: #2ecc71; }
    .bf-stat { display: flex; flex-direction: column; }
    .bf-stat-num { font-family: 'Bebas Neue', cursive; font-size: 2rem; color: var(--accent); line-height: 1; }
    .bf-stat-label { font-size: 0.85rem; color: var(--muted); font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; }
    .bf-export-all { margin-left: auto; background: var(--accent); border: none; color: #000; padding: 0.35rem 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.9rem; transition: all 0.15s; font-weight:700; display:inline-flex; align-items:center; justify-content:center; }
    .bf-export-all:hover { box-shadow: 0 0 12px rgba(255,212,0,0.4); }
    .bf-export-all:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
    .bf-export-all img { width: 20px; height: 20px; display: block; }
    .bf-filter-menu { margin-left: auto; position: relative; z-index: 50; }
    .bf-filter-btn { background:none; border:1px solid var(--border); color:var(--muted); padding:0.4rem 0.7rem; border-radius:999px; font-size:0.85rem; cursor:pointer; min-width: 200px; text-align: left; }
    #filterCounts { display:inline-block; min-width: 9ch; font-variant-numeric: tabular-nums; }
    .bf-activity { display:flex; align-items:center; gap:0.35rem; font-size:0.9rem; color:var(--muted); border:1px solid var(--border); padding:0.3rem 0.6rem; border-radius:999px; }
    .bf-activity-dot { width:8px; height:8px; border-radius:50%; background:#555; }
    .bf-activity.active .bf-activity-dot { background:#2ecc71; box-shadow:0 0 8px rgba(46,204,113,0.7); animation:pulse 1s infinite; }
    .bf-htop { display:flex; flex-direction:column; gap:4px; min-width: 140px; border:1px solid var(--border); padding:0.25rem 0.4rem; border-radius:6px; font-size:0.85rem; color:var(--muted); }
    .bf-htop-row { display:flex; align-items:center; gap:6px; }
    .bf-htop-bar { flex:1; height:6px; background:#111218; border:1px solid var(--border); border-radius:999px; overflow:hidden; }
    .bf-htop-fill { height:100%; width:0%; background:var(--accent2); transition:width 0.2s ease; }
    @keyframes pulse { 0%{transform:scale(1);}50%{transform:scale(1.4);}100%{transform:scale(1);} }
    .bf-filter-btn:hover { border-color: var(--accent2); color: var(--accent2); }
    .bf-filter-btn.glow { box-shadow: 0 0 0 2px rgba(214,40,40,0.35), 0 0 12px rgba(214,40,40,0.45); color:#ffb3b3; border-color:#d62828; }
    .bf-filter-dropdown { position:fixed; right:auto; top:auto; background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:0.45rem; min-width:160px; display:none; z-index:9999; }
    .bf-filter-dropdown.show { display:block; }
    .bf-filter-item { display:flex; align-items:center; gap:0.4rem; font-size:0.85rem; color:var(--text); padding:0.25rem 0.25rem; }
    .bf-progress { height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 1.5rem; overflow: hidden; display: none; }
    .bf-progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px; transition: width 0.2s; }
    .bf-ads-grid {
      --ad-card-h: 320px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-auto-flow: row;
      gap: 0.7rem;
      margin-top: 0.4rem;
      align-content: start;
    }
    .bf-ad-card {
      width: 100%;
      height: var(--ad-card-h);
      overflow: hidden;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .bf-ad-card.bf-hidden { display: none; }
    .bf-ad-card.bf-enter { opacity: 0; transform: translateY(10px); }
    .bf-loading {
      grid-column: 1 / -1;
      padding: 1.2rem;
      border: 1px dashed var(--border);
      border-radius: 6px;
      color: var(--muted);
      text-align: center;
      font-size: 0.95rem;
    }
    .bf-cache-overlay {
      position: absolute;
      top: 6px;
      left: 0;
      right: 0;
      height: 56px;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(6,6,8,0.55);
      backdrop-filter: blur(2px);
      z-index: 20;
      pointer-events: none;
    }
    .bf-control-bar { display:flex; flex-direction:column; gap:0.35rem; padding-bottom:0.4rem; border-bottom:1px solid var(--border); margin-bottom:0.4rem; }
    .bf-control-bar.fixed-bottom {
      position: fixed;
      left: calc(var(--sidebar-width, 260px) + 12px);
      right: 12px;
      bottom: 12px;
      transform: none;
      width: max-content;
      max-width: calc(100vw - var(--sidebar-width, 260px) - 24px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.5rem 0.8rem;
      z-index: 50;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
      margin: 0 auto;
    }
    .bf-main { padding-bottom: 220px; }
    .bf-control-top { display:flex; flex-wrap:wrap; align-items:center; gap:0.5rem; }
    .cp-row {
      display: grid;
      grid-template-columns: auto auto minmax(50vw, 1fr) auto auto auto;
      gap: 0.5rem;
      align-items: center;
      width: max-content;
    }
    .cp-col { min-height: 42px; display: flex; align-items: center; justify-content: center; position: relative; }
    .cp-btn {
      width: 44px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      border-radius: 8px;
      padding: 0;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      overflow: hidden;
    }
    .cp-btn:hover { border-color: var(--accent2); }
    .cp-hype {
      width: 100%;
      min-width: 50vw;
      max-width: calc(100vw - var(--sidebar-width, 260px) - 220px);
      justify-content: flex-start;
      border: 1px dashed var(--border);
      border-radius: 8px;
      color: var(--muted);
      padding: 0.45rem 0.6rem;
      text-transform: lowercase;
      letter-spacing: 0.06em;
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
    }
    .cp-menu {
      position: fixed;
      top: 10vh;
      left: 0;
      right: 0;
      width: 100vw;
      height: calc(100vh - 10vh);
      overflow: auto;
      display: none;
      flex-direction: column;
      gap: 0.6rem;
      background: var(--surface2);
      border: none;
      border-radius: 0;
      padding: 6vh 6vw;
      box-shadow: none;
      z-index: 9999;
      align-items: flex-end;
    }
    .cp-menu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      margin-bottom: 0.2rem;
    }
    .cp-menu-close {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    .cp-menu.show { display: flex; }
    .cp-menu .bf-gen-row,
    .cp-menu .bf-mini-stats,
    .cp-menu .bf-tabs,
    .cp-menu .bf-stats-bar { width: 100%; margin: 0; }
    .cp-menu .bf-tabs {
      flex-direction: column;
      align-items: flex-end;
      gap: 0.4rem;
    }
    .cp-menu .bf-tab-btn {
      width: 100%;
      text-align: right;
    }
    .cp-menu > * {
      max-width: 320px;
      width: 100%;
      margin-left: auto;
      margin-right: 0;
    }
    .cp-menu .bf-stats-bar { border: none; padding: 0; }
    @media (max-width: 980px) {
      .cp-row { grid-template-columns: 1fr 1fr 1fr; }
    }
    .bf-cache-card {
      width: min(33vw, 420px);
      min-width: 260px;
      border: 1px solid var(--border);
      background: var(--surface2);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
      box-shadow: 0 12px 24px rgba(0,0,0,0.35);
    }
    .bf-cache-label { font-size: 0.95rem; color: var(--muted); margin-bottom: 0.5rem; }
    .bf-cache-bar { height: 6px; background: #111218; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
    .bf-cache-fill { height: 100%; width: 0%; background: var(--accent2); transition: width 0.15s ease; }
    .bf-loading {
      grid-column: 1 / -1;
      padding: 1.2rem;
      border: 1px dashed var(--border);
      border-radius: 6px;
      color: var(--muted);
      text-align: center;
      font-size: 0.85rem;
    }
    .bf-ad-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; position: relative; }
    .bf-ad-card:hover { border-color: var(--accent2); }
    .bf-canvas-wrap { display: flex; align-items: center; justify-content: center; padding: 0; background: repeating-conic-gradient(#1a1a24 0% 25%,#111118 0% 50%) 0 0/16px 16px; min-height: 0; height: 100%; }
    .bf-canvas-wrap canvas { width: 100%; height: 100%; display: block; object-fit: cover; box-shadow: none; }
    /* OpenClaw drawer */
    .oc-tab {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 12000;
      padding: 0.25rem 0.7rem;
      background: #111418;
      border: 1px solid #1e2428;
      border-top: none;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
      color: #7a9aaa;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      cursor: pointer;
    }
    .oc-tab.hidden { display: none; }
    .oc-drawer {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 80vh;
      background: #0a0a0a;
      color: #7a9aaa;
      border-bottom: 1px solid #1e2428;
      transform: translateY(-100%);
      transition: transform 0.9s ease;
      z-index: 11000;
      display: flex;
      flex-direction: column;
      font-family: 'Share Tech Mono', monospace;
    }
    .oc-drawer.open { transform: translateY(0); }
    .oc-handle {
      height: 34px;
      background: #111418;
      border-bottom: 1px solid #1e2428;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #7a9aaa;
    }
    .oc-toggle {
      border: 1px solid #1e2428;
      background: #0d1014;
      color: #7a9aaa;
      width: 28px;
      height: 22px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      line-height: 1;
    }
    .oc-root {
      display: flex;
      flex-direction: column;
      height: calc(100% - 34px);
      background: #0a0a0a;
    }
    .oc-header {
      height: 52px;
      background: #111418;
      border-bottom: 1px solid #1e2428;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      flex-shrink: 0;
    }
    .oc-header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #00ff88;
      text-transform: uppercase;
    }
    .oc-header .sep { flex: 1; }
    #timer-display {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      color: #334;
      transition: color 0.3s;
    }
    #timer-display.active   { color: #00ff88; }
    #timer-display.warning  { color: #ffaa00; }
    #timer-display.critical { color: #ff3333; }
    #led-strip { display: flex; align-items: center; gap: 9px; }
    .led {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #1a1a1a;
      border: 1px solid #222;
      transition: background 0.4s, box-shadow 0.4s, border-color 0.4s;
    }
    .led.on-green { background: #00ff88; box-shadow: 0 0 6px #00ff88, 0 0 14px rgba(0,255,136,0.35); border-color: #00ff88; }
    .led.on-amber { background: #ffaa00; box-shadow: 0 0 6px #ffaa00, 0 0 14px rgba(255,170,0,0.35); border-color: #ffaa00; }
    .led.on-red { background: #ff3333; box-shadow: 0 0 6px #ff3333, 0 0 14px rgba(255,51,51,0.35); border-color: #ff3333; }
    .led.flash { animation: ledFlash 0.5s ease-in-out infinite; }
    @keyframes ledFlash {
      0%,100% { background: #ff3333; box-shadow: 0 0 8px #ff3333, 0 0 16px rgba(255,51,51,0.5); border-color: #ff3333; }
      50% { background: #1a1a1a; box-shadow: none; border-color: #222; }
    }
    .oc-screen {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #050608;
    }
    .oc-screen::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px);
      pointer-events: none;
      z-index: 10;
    }
    #guac-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      opacity: 0;
      transition: opacity 0.7s ease;
      display: none;
    }
    #guac-frame.visible { display: block; opacity: 1; }
    #standby-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 0.5s ease;
    }
    #standby-screen.hidden { opacity: 0; pointer-events: none; }
    #standby-screen .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      letter-spacing: 8px;
      color: #151d22;
      text-transform: uppercase;
    }
    #standby-screen .hint {
      font-size: 12px;
      letter-spacing: 2px;
      color: #151d22;
      animation: blink 2.5s ease-in-out infinite;
    }
    @keyframes blink { 0%,100% { opacity: 0.3; } 50% { opacity: 0.9; } }
    #offline-screen {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    #offline-screen.visible { display: flex; }
    #offline-screen img { max-width: 100%; max-height: 100%; object-fit: contain; filter: grayscale(30%) brightness(0.8); }
    #offline-screen .offline-label {
      position: absolute;
      bottom: 24px;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      letter-spacing: 5px;
      color: #ff3333;
      opacity: 0.6;
    }
    .oc-bottom {
      height: 68px;
      background: #111418;
      border-top: 1px solid #1e2428;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 10px;
      flex-shrink: 0;
    }
    #power-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #0d1014;
      border: 2px solid #1e2428;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
      outline: none;
      flex-shrink: 0;
    }
    #power-btn:hover { border-color: #00ff88; box-shadow: 0 0 10px rgba(0,255,136,0.2); }
    #power-btn.on { border-color: #00ff88; box-shadow: 0 0 10px rgba(0,255,136,0.4), inset 0 0 8px rgba(0,255,136,0.08); }
    #power-btn svg { width: 18px; height: 18px; stroke: #334; transition: stroke 0.25s; }
    #power-btn.on svg { stroke: #00ff88; }
    #power-btn:hover svg { stroke: #00ff88; }
    #user-query {
      flex: 1;
      padding: 12px 16px;
      border-radius: 3px;
      border: 1px solid #1e2428;
      background: #0d1014;
      color: #8ab;
      font-family: 'Share Tech Mono', monospace;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    #user-query::placeholder { color: #1e2d35; }
    #user-query:focus { border-color: #233a48; }
    #user-query:disabled { opacity: 0.3; }
    #send-btn, #mic-btn {
      padding: 12px 22px;

<script>

// Redirect if already authenticated
if (localStorage.getItem("authenticated") === "true" || localStorage.getItem("session_active") === "true") {
  window.location.href = "/pages/index.html";
}

async function hashPassword(str) {
  const utf8 = new TextEncoder().encode(str);
  const hashBuffer = await crypto.subtle.digest("SHA-256", utf8);
  return Array.from(new Uint8Array(hashBuffer))
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");
}

const VALID_HASHES = {
  "1": "d015e3bb592d887241d26d27e15cdbff24e57f13e7336c636aa8ceb12b38ad99",
  "2": "89c139ff45b6e9aa55e98302bbc8c070758e54f3d5e960a0101a4d3c5916bb98",
  "3": "ff9d65f48991f6463211580e9e6df2faf9427ac2a7e0137ffca99005733a976c",
  "4": "8c86f7bb66e5c389966fe80d28f74b0b062ddc4f9ca3a85de146eed72dd23311"
};

document.getElementById("loginForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const userNum = document.getElementById("user-select").value;
  const input = document.getElementById("password-input").value;
  const error = document.getElementById("error");
  const inputHash = await hashPassword(input);

  if (inputHash === VALID_HASHES[userNum]) {
    localStorage.setItem("session_active", "true");
    localStorage.setItem("authenticated", "true");
    localStorage.setItem("user_num", userNum);
    localStorage.setItem("user_pwd", input);
    window.location.href = "/pages/index.html";
  } else {
    error.innerText = "Invalid Access Key";
    error.style.display = "block";
  }
});
</script>

            if (el) {
                let url = el.getAttribute(item.attr);
                if (url) {
                    url = url.split('?')[0];
                    el.setAttribute(item.attr, `${url}?v=${timestamp}`);
