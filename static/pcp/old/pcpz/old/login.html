<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="css/adminlte.min.css">
</head>
<body class="hold-transition login-page">

<div class="login-box">
  <div class="card card-outline card-primary">
    <div class="card-header text-center">
      <b>Control Panel Login</b>
    </div>
    <div class="card-body">

      <div class="form-group">
        <input id="domain" class="form-control" placeholder="Domain Name">
      </div>

      <div class="form-group">
        <input id="passphrase" type="password" class="form-control" placeholder="Passphrase">
      </div>

      <button onclick="login()" class="btn btn-primary btn-block">
        Login
      </button>

      <p id="error" class="text-danger mt-2"></p>

    </div>
  </div>
</div>

<script>
function login() {
  const domain = document.getElementById('domain').value;
  const pass = document.getElementById('passphrase').value;

  // 🔒 CHANGE THESE
  const correctDomain = "example.com";
  const correctPass = "supersecret";

  if (domain === correctDomain && pass === correctPass) {
    localStorage.setItem("authenticated", "true");
    window.location.href = "/";
  } else {
    document.getElementById("error").innerText = "Invalid credentials";
  }
}
</script>

</body>
</html>
