<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control Panel Login</title>
  <link rel="stylesheet" href="css/adminlte.min.css">
</head>

<body class="hold-transition login-page dark-mode">

<div class="login-box">
  <div class="card card-outline card-primary shadow">
    <div class="card-header text-center">
      <h3 class="card-title mb-0">Control Panel</h3>
      <small class="text-muted">carfinancecheque.uk</small>
    </div>

    <div class="card-body">
      <form id="loginForm">

        <div class="form-group mb-3">
          <label>Domain</label>
          <input type="text" class="form-control" value="carfinancecheque.uk" readonly>
        </div>

        <div class="form-group mb-3">
          <label>Passphrase</label>
          <input 
            id="passphrase"
            type="password"
            class="form-control"
            placeholder="Enter passphrase"
            required
            autofocus
          >
        </div>

        <div id="error" class="text-danger mb-3" style="display:none;"></div>

        <button type="submit" class="btn btn-primary btn-block w-100">
          Login
        </button>

      </form>
    </div>
  </div>
</div>

<script>

const STORED_HASH = "9d82225c1e68e80baf5f248a40b5fe8d1462f9cf259c64016740aa595ef557f8";

// Redirect if already authenticated
if (localStorage.getItem("authenticated") === "true") {
  window.location.href = "/static/pcp/index.html";
}

async function sha256(str) {
  const buffer = await crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(str)
  );

  return Array.from(new Uint8Array(buffer))
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");
}

document.getElementById("loginForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const input = document.getElementById("passphrase").value;
  const error = document.getElementById("error");

  const hashed = await sha256(input);

  if (hashed === STORED_HASH) {
    localStorage.setItem("authenticated", "true");
    window.location.href = "/static/pcp/index.html";
  } else {
    error.innerText = "Invalid passphrase";
    error.style.display = "block";
  }
});
</script>

</body>
</html>
