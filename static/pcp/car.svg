<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050505;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="wheelGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3a3a3a;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1536" height="1024" fill="url(#bgGrad)"/>
  
  <!-- Ground shadow -->
  <ellipse cx="768" cy="880" rx="700" ry="40" fill="#000000" opacity="0.4" filter="url(#glow)"/>
  
  <!-- Car Body Main Shape -->
  <path d="
    M 180,720 
    Q 160,680 180,640 
    L 220,580 
    Q 260,520 340,480 
    L 480,420 
    Q 560,380 680,360 
    L 920,340 
    Q 1040,330 1160,360 
    L 1280,400 
    Q 1380,440 1440,500 
    L 1480,580 
    Q 1500,640 1480,720 
    L 1460,780 
    Q 1440,820 1380,840 
    L 1280,860 
    Q 1200,880 1120,860 
    L 1080,840 
    Q 1040,820 1000,840 
    L 920,860 
    Q 840,880 760,860 
    L 680,840 
    Q 640,820 600,840 
    L 520,860 
    Q 440,880 360,860 
    L 280,840 
    Q 220,820 200,780 
    Z" 
    fill="url(#carBody)" stroke="#0a0a0a" stroke-width="2"/>
  
  <!-- Cabin/Roof -->
  <path d="
    M 420,480 
    L 520,380 
    Q 600,320 720,300 
    L 1000,280 
    Q 1120,270 1220,320 
    L 1320,380 
    L 1280,420 
    L 1160,400 
    Q 1080,390 1000,400 
    L 720,420 
    Q 640,430 560,450 
    Z" 
    fill="#0f0f0f"/>
  
  <!-- Side Windows -->
  <path d="
    M 540,400 
    L 620,340 
    Q 680,310 760,300 
    L 980,290 
    Q 1060,285 1140,310 
    L 1240,360 
    L 1220,390 
    L 1120,370 
    Q 1040,360 960,370 
    L 760,390 
    Q 680,400 600,420 
    Z" 
    fill="url(#windowGrad)" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- Front Window (Windshield) -->
  <path d="
    M 520,380 
    L 620,340 
    L 540,400 
    Z" 
    fill="#0a0a0a"/>
  
  <!-- Rear Window -->
  <path d="
    M 1220,320 
    L 1320,380 
    L 1240,360 
    Z" 
    fill="#0a0a0a"/>
  
  <!-- Front Wheel Arch -->
  <path d="
    M 280,780 
    Q 280,680 380,680 
    Q 480,680 480,780 
    Q 480,880 380,880 
    Q 280,880 280,780" 
    fill="#0a0a0a"/>
  
  <!-- Rear Wheel Arch -->
  <path d="
    M 1080,780 
    Q 1080,680 1180,680 
    Q 1280,680 1280,780 
    Q 1280,880 1180,880 
    Q 1080,880 1080,780" 
    fill="#0a0a0a"/>
  
  <!-- Front Wheel -->
  <circle cx="380" cy="780" r="85" fill="url(#wheelGrad)" stroke="#2a2a2a" stroke-width="3"/>
  <circle cx="380" cy="780" r="55" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/>
  <circle cx="380" cy="780" r="25" fill="#0a0a0a"/>
  
  <!-- Rear Wheel -->
  <circle cx="1180" cy="780" r="85" fill="url(#wheelGrad)" stroke="#2a2a2a" stroke-width="3"/>
  <circle cx="1180" cy="780" r="55" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/>
  <circle cx="1180" cy="780" r="25" fill="#0a0a0a"/>
  
  <!-- Wheel Spokes (Front) -->
  <g stroke="#3a3a3a" stroke-width="3" opacity="0.6">
    <line x1="380" y1="725" x2="380" y2="835"/>
    <line x1="325" y1="780" x2="435" y2="780"/>
    <line x1="341" y1="741" x2="419" y2="819"/>
    <line x1="419" y1="741" x2="341" y2="819"/>
  </g>
  
  <!-- Wheel Spokes (Rear) -->
  <g stroke="#3a3a3a" stroke-width="3" opacity="0.6">
    <line x1="1180" y1="725" x2="1180" y2="835"/>
    <line x1="1125" y1="780" x2="1235" y2="780"/>
    <line x1="1141" y1="741" x2="1219" y2="819"/>
    <line x1="1219" y1="741" x2="1141" y2="819"/>
  </g>
  
  <!-- Headlight -->
  <path d="
    M 185,620 
    Q 200,600 240,610 
    Q 260,620 250,650 
    Q 220,660 190,650 
    Z" 
    fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1"/>
  <ellipse cx="220" cy="630" rx="20" ry="15" fill="#1a1a1a" opacity="0.8"/>
  
  <!-- Taillight -->
  <path d="
    M 1460,580 
    Q 1480,600 1475,640 
    Q 1450,650 1430,640 
    Q 1420,610 1440,590 
    Z" 
    fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1"/>
  <ellipse cx="1450" cy="615" rx="12" ry="20" fill="#1a1a1a" opacity="0.8"/>
  
  <!-- Door Lines -->
  <path d="
    M 600,450 
    L 600,780" 
    stroke="#0a0a0a" stroke-width="2" opacity="0.5" fill="none"/>
  <path d="
    M 980,430 
    L 980,760" 
    stroke="#0a0a0a" stroke-width="2" opacity="0.5" fill="none"/>
  
  <!-- Door Handles -->
  <rect x="620" y="520" width="40" height="8" rx="2" fill="#1a1a1a" opacity="0.6"/>
  <rect x="940" y="500" width="40" height="8" rx="2" fill="#1a1a1a" opacity="0.6"/>
  
  <!-- Side Skirt/Body Line -->
  <path d="
    M 280,720 
    Q 500,740 768,750 
    Q 1036,740 1256,720" 
    stroke="#1a1a1a" stroke-width="3" fill="none" opacity="0.4"/>
  
  <!-- Front Bumper Detail -->
  <path d="
    M 180,720 
    Q 200,760 240,780 
    L 280,790" 
    stroke="#2a2a2a" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- Rear Bumper Detail -->
  <path d="
    M 1356,720 
    Q 1380,760 1420,780 
    L 1460,790" 
    stroke="#2a2a2a" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- Grille hint -->
  <rect x="190" y="650" width="30" height="40" rx="3" fill="#0a0a0a" opacity="0.6"/>
  
  <!-- Mirror -->
  <path d="
    M 620,420 
    Q 640,400 660,410 
    Q 670,430 650,440 
    Q 630,450 620,430 
    Z" 
    fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
  
  <!-- Subtle highlight on body -->
  <path d="
    M 300,600 
    Q 500,550 768,540 
    Q 1036,550 1300,600" 
    stroke="#3a3a3a" stroke-width="20" fill="none" opacity="0.1" filter="url(#glow)"/>
    
</svg>
