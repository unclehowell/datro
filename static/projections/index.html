<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial Model</title>
  <link rel="stylesheet" href="projections.css" />
</head>
<body class="page-body">
  <div
    id="loading-bar-container"
    class="loading-bar"
    role="status"
    aria-live="polite"
  >
    <div id="loading-bar" class="loading-bar__progress"></div>
  </div>
  <main class="dashboard">
    <div class="slider-column">
      <span id="slider-end" class="slider-label"></span>
      <input
        id="year-slider"
        class="year-slider"
        type="range"
        min="0"
        step="1"
        value="0"
        aria-orientation="vertical"
        aria-label="Financial Year Slider"
      />
      <span id="slider-start" class="slider-label"></span>
    </div>

    <div class="content-column">
      <div class="year-header">
        <h3 id="year-label" class="year-title"></h3>
      </div>

      <div class="row-group" data-row-group="top" data-expanded="false">
        <div class="panel-grid">
          <section class="panel" data-quadrant="income">
            <div aria-hidden="true" class="panel-overlay"></div>
            <div class="panel-inner">
              <header class="panel-header">
                <h4 class="panel-title">Lenders / Financing Summary</h4>
                <p class="panel-total" data-total></p>
              </header>
              <div class="panel-entries" data-entries aria-live="polite"></div>
            </div>
          </section>

          <section class="panel" data-quadrant="assets">
            <div aria-hidden="true" class="panel-overlay"></div>
            <div class="panel-inner">
              <header class="panel-header">
                <h4 class="panel-title">Assets (Owned Value)</h4>
                <p class="panel-total" data-total></p>
              </header>
              <div class="panel-entries" data-entries aria-live="polite"></div>
            </div>
          </section>
        </div>
        <button
          type="button"
          class="row-toggle"
          data-row-toggle
          aria-expanded="false"
          title="Expand row"
        >
          <span aria-hidden="true" class="row-toggle-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="20" height="20">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25 12 15.75 4.5 8.25M19.5 12.75 12 20.25 4.5 12.75" />
            </svg>
          </span>
          <span class="sr-only" data-toggle-label>Expand row</span>
        </button>
      </div>

      <div class="row-group" data-row-group="bottom" data-expanded="false">
        <div class="panel-grid">
          <section class="panel" data-quadrant="liabilities">
            <div aria-hidden="true" class="panel-overlay"></div>
            <div class="panel-inner">
              <header class="panel-header">
                <h4 class="panel-title">Liabilities (Owed Value)</h4>
                <p class="panel-total" data-total></p>
              </header>
              <div class="panel-entries" data-entries aria-live="polite"></div>
            </div>
          </section>

          <section class="panel" data-quadrant="expenses">
            <div aria-hidden="true" class="panel-overlay"></div>
            <div class="panel-inner">
              <header class="panel-header">
                <h4 class="panel-title">Expenses (Operational &amp; Financing)</h4>
                <p class="panel-total" data-total></p>
              </header>
              <div class="panel-entries" data-entries aria-live="polite"></div>
            </div>
          </section>
        </div>
        <button
          type="button"
          class="row-toggle"
          data-row-toggle
          aria-expanded="false"
          title="Expand row"
        >
          <span aria-hidden="true" class="row-toggle-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="20" height="20">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25 12 15.75 4.5 8.25M19.5 12.75 12 20.25 4.5 12.75" />
            </svg>
          </span>
          <span class="sr-only" data-toggle-label>Expand row</span>
        </button>
      </div>
    </div>
  </main>

  <script>
    const formatCurrency = (value) => {
      if (value === 0) return '$0';
      const absValue = Math.abs(value);
      const sign = value < 0 ? '-' : '';
      if (absValue >= 1_000_000) return `${sign}$${(absValue / 1_000_000).toFixed(1)}M`;
      if (absValue >= 1_000) return `${sign}$${(absValue / 1_000).toFixed(0)}K`;
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        minimumFractionDigits: 0,
        maximumFractionDigits: 0,
      }).format(value);
    };

    const formatCurrencyExact = (value) => {
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        minimumFractionDigits: 0,
        maximumFractionDigits: 0,
      }).format(value);
    };

    const loadingBarContainer = document.getElementById('loading-bar-container');
    const loadingBar = document.getElementById('loading-bar');
    let loadingIntervalId = null;
    let loadingProgress = 0;

    const startLoadingBar = () => {
      if (!loadingBarContainer || !loadingBar) return;
      loadingBarContainer.style.display = 'block';
      loadingBarContainer.removeAttribute('data-hidden');
      loadingProgress = 0;
      loadingBar.style.width = '0%';
      if (loadingIntervalId) clearInterval(loadingIntervalId);
      loadingIntervalId = setInterval(() => {
        loadingProgress = Math.min(loadingProgress + Math.random() * 20 + 5, 90);
        loadingBar.style.width = `${loadingProgress}%`;
      }, 200);
    };

    const finishLoadingBar = () => {
      if (!loadingBarContainer || !loadingBar) return;
      if (loadingIntervalId) {
        clearInterval(loadingIntervalId);
        loadingIntervalId = null;
      }
      loadingBar.style.width = '100%';
      setTimeout(() => {
        loadingBarContainer.setAttribute('data-hidden', 'true');
        setTimeout(() => {
          loadingBarContainer.style.display = 'none';
        }, 300);
      }, 300);
    };

    const createInfoIcon = () => {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      svg.setAttribute('fill', 'none');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('stroke-width', '2');
      svg.setAttribute('stroke', 'currentColor');
      svg.setAttribute('class', 'info-icon');

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
      path.setAttribute(
        'd',
        'm11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z'
      );

      svg.appendChild(path);
      return svg;
    };

    const TEN_K_PIN_VALUE = 10_000;
    const HUNDRED_K_PIN_VALUE = 100_000;

    const evaluatePinBreakdown = (value) => {
      const absValue = Math.abs(value);
      const hundredPinCount = Math.floor(absValue / HUNDRED_K_PIN_VALUE);
      const remainingAfterHundreds = absValue - hundredPinCount * HUNDRED_K_PIN_VALUE;
      const tenPinCount = Math.floor(remainingAfterHundreds / TEN_K_PIN_VALUE);
      const totalPinCount = hundredPinCount + tenPinCount;

      return {
        hundredPinCount,
        tenPinCount,
        totalPinCount,
      };
    };

    const determineShipVariant = (pinCapacity) => {
      if (pinCapacity <= 4) return 'patrol';
      if (pinCapacity <= 8) return 'submarine';
      if (pinCapacity <= 14) return 'destroyer';
      if (pinCapacity <= 20) return 'battleship';
      return 'carrier';
    };

    const determineGridColumns = (pinCapacity) => {
      if (pinCapacity <= 4) return 2;
      if (pinCapacity <= 6) return 3;
      if (pinCapacity <= 12) return 4;
      if (pinCapacity <= 18) return 5;
      return 6;
    };

    const createPinGrid = (value, pinCapacity) => {
      const { hundredPinCount, tenPinCount, totalPinCount } = evaluatePinBreakdown(value);

      if (totalPinCount === 0) return null;

      const pinGrid = document.createElement('div');
      pinGrid.className = 'pin-grid';

      const gridCapacity = Math.max(pinCapacity, totalPinCount);
      const gridColumns = determineGridColumns(gridCapacity);
      const gridRows = Math.max(1, Math.ceil(gridCapacity / gridColumns));
      pinGrid.style.setProperty('--pin-grid-columns', gridColumns);
      pinGrid.style.setProperty('--pin-grid-rows', gridRows);
      pinGrid.setAttribute('data-pin-capacity', String(pinCapacity));

      const maxVisiblePins = 240;
      let renderedPins = 0;

      const makePin = (title, classes) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'pin-cell';
        wrapper.title = title;

        const dot = document.createElement('div');
        dot.className = ['pin-dot', ...classes].join(' ');
        wrapper.appendChild(dot);

        return wrapper;
      };

      const isPositive = value >= 0;
      const tenPinClasses = ['pin-ten', isPositive ? 'positive' : 'negative'];
      const hundredPinClasses = ['pin-hundred', isPositive ? 'positive' : 'negative'];

      const appendPins = (count, title, classes) => {
        for (let i = 0; i < count && renderedPins < maxVisiblePins; i += 1) {
          pinGrid.appendChild(makePin(title, classes));
          renderedPins += 1;
        }
      };

      appendPins(hundredPinCount, '$100,000', hundredPinClasses);
      appendPins(tenPinCount, '$10,000', tenPinClasses);

      if (renderedPins < totalPinCount) {
        const more = document.createElement('div');
        more.className = 'pin-more';
        more.textContent = `+${totalPinCount - renderedPins} more`;
        pinGrid.appendChild(more);
      }

      return pinGrid;
    };

    let hullIdCounter = 0;
    const nextHullGradientId = (variant) => {
      hullIdCounter += 1;
      return `hull-gradient-${variant}-${hullIdCounter}`;
    };

    const hullShapes = {
      patrol: 'M8,60 L26,42 L94,38 L126,46 L150,62 L8,62 Z',
      submarine: 'M6,64 L30,42 L140,36 L182,44 L210,62 L6,64 Z',
      destroyer: 'M6,66 L28,44 L168,36 L210,46 L242,60 L256,68 L6,66 Z',
      battleship: 'M6,66 L32,42 L198,34 L238,46 L278,60 L298,70 L6,66 Z',
      carrier: 'M6,68 L34,40 L230,32 L280,44 L320,60 L332,72 L6,68 Z',
    };

    const createHullSVG = (variant) => {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'battleship-hull');
      svg.setAttribute('viewBox', '0 0 340 100');
      svg.setAttribute('role', 'presentation');
      svg.setAttribute('aria-hidden', 'true');

      const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      const gradient = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
      const gradientId = nextHullGradientId(variant);
      gradient.setAttribute('id', gradientId);
      gradient.setAttribute('x1', '0%');
      gradient.setAttribute('x2', '100%');
      gradient.setAttribute('y1', '0%');
      gradient.setAttribute('y2', '100%');

      const stopOne = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
      stopOne.setAttribute('offset', '0%');
      stopOne.setAttribute('stop-color', 'rgba(71, 85, 105, 0.95)');
      gradient.appendChild(stopOne);

      const stopTwo = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
      stopTwo.setAttribute('offset', '70%');
      stopTwo.setAttribute('stop-color', 'rgba(51, 65, 85, 0.9)');
      gradient.appendChild(stopTwo);

      defs.appendChild(gradient);
      svg.appendChild(defs);

      const hullPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      hullPath.setAttribute('d', hullShapes[variant] || hullShapes.destroyer);
      hullPath.setAttribute('fill', `url(#${gradientId})`);
      hullPath.setAttribute('stroke', 'rgba(15, 23, 42, 0.85)');
      hullPath.setAttribute('stroke-width', '3');
      hullPath.setAttribute('stroke-linejoin', 'round');
      hullPath.setAttribute('stroke-linecap', 'round');
      svg.appendChild(hullPath);

      const deck = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      deck.setAttribute('x', '60');
      deck.setAttribute('y', '44');
      deck.setAttribute('width', '180');
      deck.setAttribute('height', '16');
      deck.setAttribute('rx', '6');
      deck.setAttribute('fill', 'rgba(148, 163, 184, 0.35)');
      svg.appendChild(deck);

      const bridge = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      bridge.setAttribute('x', '110');
      bridge.setAttribute('y', '36');
      bridge.setAttribute('width', '46');
      bridge.setAttribute('height', '18');
      bridge.setAttribute('rx', '6');
      bridge.setAttribute('fill', 'rgba(226, 232, 240, 0.45)');
      svg.appendChild(bridge);

      const portholeGroup = document.createDocumentFragment();
      [0, 1, 2, 3].forEach((index) => {
        const porthole = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        porthole.setAttribute('cx', String(80 + index * 36));
        porthole.setAttribute('cy', '52');
        porthole.setAttribute('r', '5');
        porthole.setAttribute('fill', 'rgba(226, 232, 240, 0.6)');
        porthole.setAttribute('stroke', 'rgba(15, 23, 42, 0.6)');
        porthole.setAttribute('stroke-width', '1.5');
        portholeGroup.appendChild(porthole);
      });
      svg.appendChild(portholeGroup);

      return svg;
    };

    const buildShip = (nominal) => {
      const pinCapacity = nominal.pinCapacity || 0;
      const variant = determineShipVariant(pinCapacity);
      const ship = document.createElement('div');
      ship.className = `battleship-container animate-fade-in ship-${variant}`;

      const info = document.createElement('div');
      info.className = 'battleship-info';

      const labelGroup = document.createElement('div');
      labelGroup.className = 'battleship-label-group';

      const codeBadge = document.createElement('span');
      codeBadge.className = 'battleship-code';
      codeBadge.textContent = nominal.code;
      labelGroup.appendChild(codeBadge);

      const title = document.createElement('span');
      title.className = 'entry-title';
      title.textContent = nominal.description;
      labelGroup.appendChild(title);

      const infoIcon = createInfoIcon();
      infoIcon.setAttribute('aria-hidden', 'true');
      infoIcon.setAttribute('focusable', 'false');
      labelGroup.appendChild(infoIcon);

      info.appendChild(labelGroup);

      const valueBadge = document.createElement('span');
      valueBadge.className = 'entry-value-badge';
      valueBadge.textContent = formatCurrency(nominal.value);
      info.appendChild(valueBadge);

      ship.appendChild(info);

      const card = document.createElement('div');
      card.className = 'entry-card';
      card.setAttribute('data-ship-variant', variant);

      const hullSvg = createHullSVG(variant);
      card.appendChild(hullSvg);

      const tooltip = document.createElement('div');
      tooltip.className = 'entry-tooltip';

      const tooltipTitle = document.createElement('p');
      tooltipTitle.className = 'entry-tooltip-title';
      tooltipTitle.textContent = `${nominal.code} - ${nominal.description}`;
      tooltip.appendChild(tooltipTitle);

      const tooltipValue = document.createElement('p');
      tooltipValue.className = 'entry-tooltip-value';
      tooltipValue.textContent = 'Value: ';
      const tooltipValueSpan = document.createElement('span');
      tooltipValueSpan.textContent = formatCurrencyExact(nominal.value);
      tooltipValue.appendChild(tooltipValueSpan);
      tooltip.appendChild(tooltipValue);

      card.appendChild(tooltip);

      const pinWrapper = document.createElement('div');
      pinWrapper.className = 'entry-pin-wrapper';
      pinWrapper.setAttribute('data-pin-capacity', String(pinCapacity));
      const pinGrid = createPinGrid(nominal.value, pinCapacity);
      if (pinGrid) {
        pinWrapper.appendChild(pinGrid);
      }
      card.appendChild(pinWrapper);

      ship.appendChild(card);

      return ship;
    };

    const parseFinancialData = (csv) => {
      const USD_MULTIPLIER = 1000;
      const START_YEAR = 2024;
      const lines = csv
        .split('\n')
        .map((line) => line.trim())
        .filter((line) => line !== '' && !line.toLowerCase().startsWith('code'));
      const years = [0, 1, 2, 3, 4, 5];
      const labels = years.map((year, index) => {
        const currentYear = START_YEAR + year;
        return index === 0 ? `${currentYear} (Startup)` : `${currentYear}`;
      });

      const rawData = {
        income: [],
        assets: [],
        liabilities: [],
        expenses: [],
      };

      let currentQuadrantKey = null;

      lines.forEach((line) => {
        if (line.startsWith('#############')) {
          const header = line.toLowerCase();
          if (header.includes('lenders')) currentQuadrantKey = 'income';
          else if (header.includes('contra-assets')) currentQuadrantKey = 'assets';
          else if (header.includes('assets')) currentQuadrantKey = 'assets';
          else if (header.includes('liabilities') || header.includes('equity')) currentQuadrantKey = 'liabilities';
          else if (header.includes('expenses')) currentQuadrantKey = 'expenses';
          return;
        }

        if (!currentQuadrantKey) return;

        const parts = line.split(',').map((part) => part.trim());
        const code = parts[0];
        const description = parts[1];
        const values = parts.slice(2).map((v) => (parseFloat(v) || 0) * USD_MULTIPLIER);
        rawData[currentQuadrantKey].push({ code, description, values });
      });

      const liabilities = rawData.liabilities;
      const depreciationIndex = liabilities.findIndex((item) => item.description.toLowerCase().includes('accumulated depreciation'));
      if (depreciationIndex > -1) {
        const [depreciationItem] = liabilities.splice(depreciationIndex, 1);
        rawData.assets.push(depreciationItem);
      }

      Object.values(rawData).forEach((items) => {
        items.forEach((item) => {
          const maxPins = item.values.reduce((max, value) => {
            const { totalPinCount } = evaluatePinBreakdown(value);
            return Math.max(max, totalPinCount);
          }, 0);
          item.pinCapacity = maxPins;
        });
      });

      const yearlyData = years.map((_, index) => {
        const yearEntry = {
          year: START_YEAR + index,
          label: labels[index],
          income: { total: 0, nominals: [] },
          assets: { total: 0, nominals: [] },
          liabilities: { total: 0, nominals: [] },
          expenses: { total: 0, nominals: [] },
        };

        Object.keys(rawData).forEach((key) => {
          const quadrantData = rawData[key];
          const nominalsForYear = quadrantData.map((item) => ({
            code: item.code,
            description: item.description,
            value: item.values[index] || 0,
            pinCapacity: item.pinCapacity || 0,
          }));

          const totalForYear = nominalsForYear.reduce((sum, nominal) => sum + nominal.value, 0);
          yearEntry[key].nominals = nominalsForYear;
          yearEntry[key].total = totalForYear;
        });

        return yearEntry;
      });

      return yearlyData;
    };

    let battleshipData = [];

    const slider = document.getElementById('year-slider');
    const sliderStart = document.getElementById('slider-start');
    const sliderEnd = document.getElementById('slider-end');
    const yearLabel = document.getElementById('year-label');

    let sliderMaxIndex = 0;

    slider.disabled = true;
    slider.setAttribute('aria-valuemin', '0');
    slider.setAttribute('aria-valuemax', '0');
    slider.setAttribute('aria-valuenow', '0');
    slider.setAttribute('aria-valuetext', '');
    yearLabel.textContent = 'Loading projections…';

    const quadrants = {
      income: {
        entries: document.querySelector('[data-quadrant="income"] [data-entries]'),
        total: document.querySelector('[data-quadrant="income"] [data-total]'),
      },
      assets: {
        entries: document.querySelector('[data-quadrant="assets"] [data-entries]'),
        total: document.querySelector('[data-quadrant="assets"] [data-total]'),
      },
      liabilities: {
        entries: document.querySelector('[data-quadrant="liabilities"] [data-entries]'),
        total: document.querySelector('[data-quadrant="liabilities"] [data-total]'),
      },
      expenses: {
        entries: document.querySelector('[data-quadrant="expenses"] [data-entries]'),
        total: document.querySelector('[data-quadrant="expenses"] [data-total]'),
      },
    };

    const toggleGroups = () => {
      const rowGroups = document.querySelectorAll('[data-row-group]');
      rowGroups.forEach((group) => {
        const toggleButton = group.querySelector('[data-row-toggle]');
        if (!toggleButton) return;
        const toggleLabel = toggleButton.querySelector('[data-toggle-label]');

        const updateToggleState = () => {
          const expanded = group.getAttribute('data-expanded') === 'true';
          toggleButton.setAttribute('aria-expanded', String(expanded));
          if (toggleLabel) {
            toggleLabel.textContent = expanded ? 'Collapse row' : 'Expand row';
          }
          toggleButton.title = expanded ? 'Collapse row' : 'Expand row';
        };

        toggleButton.addEventListener('click', () => {
          const expanded = group.getAttribute('data-expanded') === 'true';
          group.setAttribute('data-expanded', expanded ? 'false' : 'true');
          updateToggleState();
        });

        updateToggleState();
      });
    };

    const showStatusMessage = (message) => {
      Object.values(quadrants).forEach((quadrant) => {
        quadrant.total.textContent = formatCurrency(0);
        quadrant.entries.innerHTML = '';
        const placeholder = document.createElement('div');
        placeholder.className = 'panel-placeholder';
        placeholder.textContent = message;
        quadrant.entries.appendChild(placeholder);
      });
    };

    const renderQuadrant = (key, data) => {
      const quadrant = quadrants[key];
      if (!quadrant) return;
      quadrant.total.textContent = formatCurrency(data.total);
      quadrant.entries.innerHTML = '';
      quadrant.entries.scrollTop = 0;

      const activeNominals = data.nominals.filter((nominal) => nominal.value !== 0);
      if (activeNominals.length === 0) {
        const placeholder = document.createElement('div');
        placeholder.className = 'panel-placeholder';
        placeholder.textContent = 'No Activity';
        quadrant.entries.appendChild(placeholder);
        return;
      }

      activeNominals.forEach((nominal) => {
        const ship = buildShip(nominal);
        quadrant.entries.appendChild(ship);
      });
    };

    const updateSliderForIndex = (index) => {
      const frame = battleshipData[index];
      if (!frame) return;
      slider.value = String(index);
      slider.setAttribute('aria-valuenow', String(frame.year));
      slider.setAttribute('aria-valuetext', frame.label);
    };

    const renderFrame = (index) => {
      const frame = battleshipData[index];
      if (!frame) return;
      updateSliderForIndex(index);
      yearLabel.textContent = frame.label;
      renderQuadrant('income', frame.income);
      renderQuadrant('assets', frame.assets);
      renderQuadrant('liabilities', frame.liabilities);
      renderQuadrant('expenses', frame.expenses);
    };

    slider.addEventListener('input', (event) => {
      if (!battleshipData.length) return;
      const sliderValue = Number(event.target.value);
      const newIndex = Math.max(0, Math.min(sliderMaxIndex, sliderValue));
      renderFrame(newIndex);
    });

    const initialize = async () => {
      startLoadingBar();
      try {
        const response = await fetch('projections.csv');
        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}`);
        }

        const csvText = await response.text();
        battleshipData = parseFinancialData(csvText);

        if (battleshipData.length === 0) {
          console.warn('No financial data available to display.');
          slider.disabled = true;
          sliderMaxIndex = 0;
          slider.value = '0';
          slider.setAttribute('aria-valuemax', '0');
          slider.setAttribute('aria-valuenow', '0');
          slider.setAttribute('aria-valuetext', '');
          sliderStart.textContent = '';
          sliderEnd.textContent = '';
          yearLabel.textContent = 'No data available';
          showStatusMessage('No data available');
          return;
        }

        slider.disabled = false;
        sliderMaxIndex = Math.max(0, battleshipData.length - 1);
        slider.max = String(sliderMaxIndex);
        slider.value = '0';
        slider.setAttribute('aria-valuemin', '0');
        slider.setAttribute('aria-valuemax', String(sliderMaxIndex));
        sliderStart.textContent = battleshipData[battleshipData.length - 1].year;
        sliderEnd.textContent = battleshipData[0].year;
        renderFrame(0);
      } catch (error) {
        console.error('Error loading financial data:', error);
        slider.disabled = true;
        sliderMaxIndex = 0;
        slider.max = '0';
        slider.value = '0';
        slider.setAttribute('aria-valuemin', '0');
        slider.setAttribute('aria-valuemax', '0');
        slider.setAttribute('aria-valuenow', '0');
        slider.setAttribute('aria-valuetext', '');
        sliderStart.textContent = '';
        sliderEnd.textContent = '';
        yearLabel.textContent = 'Unable to load data';
        showStatusMessage('Unable to load data');
      } finally {
        finishLoadingBar();
      }
    };

    toggleGroups();
    initialize();
  </script>
</body>
</html>
