<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Jellyfin</title>
<style>
  body{background:#111;color:#fff;font-family:system-ui;text-align:center;padding:40px;overflow-y:auto}
  .header{display:flex;align-items:center;justify-content:center;gap:40px;margin:40px auto}
  .logo{position:relative;width:180px;height:180px;background:url('https://jellyfin.org/images/logo.svg') center/contain no-repeat}
  .ring{transform:rotate(-90deg);width:180px;height:180px;position:absolute;top:0;left:0}
  .ring circle{fill:none;stroke-width:14}
  .bg{stroke:#333}
  .fg{stroke:#c33;stroke-linecap:round;stroke-dasharray:502.4;stroke-dashoffset:0}
  .percent{font-size:3.5em;font-weight:bold}
  .buttons{margin:30px 0;display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
  button{padding:20px 80px;font-size:2.2em;border:0;border-radius:24px;cursor:pointer;min-width:360px}
  #open{background:#0099ff;color:#fff;box-shadow:0 12px 40px rgba(0,153,255,.5)}
  #uninstall{background:#c33;color:#fff;box-shadow:0 12px 40px rgba(200,50,50,.5)}
  #install{background:#00a85a;color:#fff;min-width:760px;box-shadow:0 12px 40px rgba(0,168,90,.5)}
  #cancel{background:#c33;color:#fff;display:none}
  .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:100}
  .modal.active{display:flex}
  .modal-box{background:#222;padding:40px;border-radius:24px;text-align:center;max-width:500px}
  .modal-box h2{font-size:2.5em;margin-bottom:20px}
  .modal-buttons{margin-top:30px;display:flex;gap:20px;justify-content:center}
  .modal-buttons button{font-size:1.8em;padding:14px 40px}
  .yes{background:#c33;color:#fff}
  .no{background:#666;color:#fff}
  .log{background:#222;padding:20px;margin:30px auto;width:90%;max-width:900px;border-radius:16px;position:relative;overflow:hidden}
  pre{margin:0;min-height:500px;max-height:500px;overflow-y:auto;scrollbar-width:none;line-height:1.5;white-space:pre-wrap;transition:max-height .6s}
  pre::-webkit-scrollbar{display:none}
  pre.collapsed{min-height:120px;max-height:120px}
  .toggle{position:absolute;top:10px;right:10px;background:#444;color:#0f8;border:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:0.9em}
</style></head>
<body>

<div class="header">
  <div class="logo">
    <svg class="ring"><circle class="bg" cx="90" cy="90" r="80"/><circle class="fg" cx="90" cy="90" r="80"/></svg>
  </div>
  <div class="percent" id="percent">100%</div>
</div>

<div class="buttons" id="installed-view">
  <button id="open">Open</button>
  <button id="uninstall">Uninstall</button>
  <button id="cancel">Cancel</button>
</div>

<div class="buttons" id="not-installed-view" style="display:none">
  <button id="install">Install</button>
</div>

<div class="modal" id="confirm-modal">
  <div class="modal-box">
    <h2>Uninstall Jellyfin?</h2>
    <p>This will completely remove Jellyfin and all data.</p>
    <div class="modal-buttons">
      <button class="yes">Uninstall</button>
      <button class="no">Cancel</button>
    </div>
  </div>
</div>

<div class="log">
  <pre id="log">Ready</pre>
  <button class="toggle" id="toggle">Collapse</button>
</div>

<script>
const installedView = document.getElementById('installed-view');
const notInstalledView = document.getElementById('not-installed-view');
const openBtn = document.getElementById('open');
const uninstallBtn = document.getElementById('uninstall');
const installBtn = document.getElementById('install');
const cancelBtn = document.getElementById('cancel');
const modal = document.getElementById('confirm-modal');
const log = document.getElementById('log');
const toggle = document.getElementById('toggle');
const fg = document.querySelector('.fg');
const percent = document.getElementById('percent');
let es = null;

openBtn.onclick = () => window.open('http://localhost:8096','_blank');

toggle.onclick = () => {
  log.classList.toggle('collapsed');
  toggle.textContent = log.classList.contains('collapsed') ? 'Show more' : 'Collapse';
};

function setProgress(p) {
  fg.style.strokeDashoffset = 502.4 - (502.4 * p / 100);
  percent.textContent = Math.round(p) + '%';
}

uninstallBtn.onclick = () => modal.classList.add('active');

document.querySelector('.modal .no').onclick = () => modal.classList.remove('active');

document.querySelector('.modal .yes').onclick = () => {
  modal.classList.remove('active');
  installedView.style.display = 'none';
  notInstalledView.style.display = 'flex';
  uninstallBtn.style.display = 'none';
  cancelBtn.style.display = 'block';
  log.textContent = '';
  setProgress(100);

  es = new EventSource('http://127.0.0.1:27272/run/uninstall');
  es.onmessage = e => e.data && (log.textContent += e.data + '\n');
  es.onerror = () => {
    es.close();
    setProgress(0);
  };
};

cancelBtn.onclick = () => {
  if (es) es.close();
  installedView.style.display = 'flex';
  notInstalledView.style.display = 'none';
  uninstallBtn.style.display = 'block';
  cancelBtn.style.display = 'none';
  setProgress(100);
  log.textContent += '\nCancelled\n';
};

installBtn.onclick = () => {
  log.textContent = 'Installing Jellyfin...\n';
  setProgress(0);

  es = new EventSource('http://127.0.0.1:27272/run/install');
  es.onmessage = e => e.data && (log.textContent += e.data + '\n');
  es.onerror = () => {
    es.close();
    setProgress(100);
    installedView.style.display = 'flex';
    notInstalledView.style.display = 'none';
  };
};
</script>
</body></html>
