<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Provider Token Usage Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #121212 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(90deg, #1a1a1a 0%, #2a2a2a 100%);
            padding: 1.5rem 2rem;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4CAF50, #66BB6A);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .connection-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .connected .connection-dot {
            background: #4CAF50;
        }

        .disconnected .connection-dot {
            background: #f44336;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main Layout */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* Users Sidebar */
        .users-sidebar {
            width: 200px;
            background: linear-gradient(180deg, #1a1a1a 0%, #1a1a1a 100%);
            border-right: 1px solid #333;
            padding: 1.5rem 1rem;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .users-sidebar h3 {
            font-size: 1rem;
            margin-bottom: 1rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .user-item {
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            position: relative;
            z-index: 1;
        }

        .user-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .user-item.active {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border-color: #66BB6A;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
        }

        .user-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.5rem;
            background: #4CAF50;
        }

        /* Canvas for connection lines */
        #connection-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            overflow: auto;
            position: relative;
            z-index: 1;
        }

        /* Legend */
        .legend {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            min-width: 200px;
            z-index: 10;
            max-height: 60vh;
            overflow-y: auto;
        }

        .legend h3 {
            margin-bottom: 1rem;
            font-size: 1.1rem;
            color: #ccc;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Companies Container */
        .companies-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            align-items: start;
        }

        /* Company Bubble */
        .company-bubble {
            background: linear-gradient(145deg, #1a1a1a, #2a2a2a);
            border: 1px solid #333;
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .company-bubble:hover {
            border-color: #555;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
        }

        /* Company Header */
        .company-header {
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #333;
        }

        .company-name {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .company-total {
            font-size: 0.9rem;
            color: #999;
        }

        /* Model Tabs */
        .model-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #333;
        }

        .model-tab {
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: all 0.3s ease;
            color: #aaa;
        }

        .model-tab:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .model-tab.active {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border-color: #66BB6A;
            color: #fff;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
        }

        .model-tab.in-use {
            border-color: #FF9800;
            background: rgba(255, 152, 0, 0.1);
        }

        /* Model Details */
        .model-details {
            display: none;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
        }

        .model-details.show {
            display: block;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .detail-label {
            color: #999;
        }

        .detail-value {
            color: #fff;
            font-weight: 600;
        }

        /* Usage Bar */
        .usage-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .usage-bar {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #66BB6A);
            transition: width 0.3s ease;
            border-radius: 2px;
        }

        .usage-bar.medium {
            background: linear-gradient(90deg, #FF9800, #F57C00);
        }

        .usage-bar.high {
            background: linear-gradient(90deg, #F44336, #D32F2F);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .companies-container {
                grid-template-columns: 1fr;
            }
            .users-sidebar {
                width: 150px;
            }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 1rem;
            }
            .container {
                flex-direction: column;
            }
            .users-sidebar {
                width: 100%;
                height: 120px;
                border-right: none;
                border-bottom: 1px solid #333;
                overflow-x: auto;
                display: flex;
                gap: 1rem;
                padding: 1rem;
            }
            .users-sidebar h3 {
                display: none;
            }
            .main-content {
                padding: 1rem;
            }
            .legend {
                position: static;
                margin-top: 1rem;
            }
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            color: #999;
            height: 300px;
        }

        .loading::after {
            content: '';
            width: 24px;
            height: 24px;
            border: 2px solid #333;
            border-top: 2px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 0.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 LLM Provider Token Usage Dashboard</h1>
        <div class="connection-status" id="connection-status">
            <div class="connection-dot"></div>
            <span>Connecting...</span>
        </div>
    </div>

    <div class="container">
        <canvas id="connection-canvas"></canvas>

        <div class="users-sidebar" id="users-sidebar">
            <h3>👥 Users</h3>
            <div id="users-list"></div>
        </div>

        <div class="main-content">
            <div class="legend">
                <h3>Usage Levels</h3>
                <div class="legend-item">
                    <div class="legend-color" style="background: linear-gradient(180deg, #2196F3, #1976D2);"></div>
                    <span>0-20% (Very Low)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: linear-gradient(180deg, #4CAF50, #388E3C);"></div>
                    <span>21-50% (Low)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: linear-gradient(180deg, #FF9800, #F57C00);"></div>
                    <span>51-75% (Medium)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: linear-gradient(180deg, #F44336, #D32F2F);"></div>
                    <span>76-100% (High)</span>
                </div>
            </div>

            <div class="companies-container" id="companies-container">
                <div class="loading">Loading Providers...</div>
            </div>
        </div>
    </div>

    <script>
        class EnhancedTokenDashboard {
            constructor() {
                this.connectionStatus = document.getElementById('connection-status');
                this.companiesContainer = document.getElementById('companies-container');
                this.usersList = document.getElementById('users-list');
                this.canvas = document.getElementById('connection-canvas');
                this.ctx = this.canvas.getContext('2d');

                this.apiEndpoint = '/api/llm-usage';
                this.updateInterval = 3000;
                this.users = [];
                this.companies = [];
                this.selectedModel = {};
                this.userModelUsage = {};

                this.init();
            }

            init() {
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
                this.loadData();
                setInterval(() => this.loadData(), this.updateInterval);
            }

            resizeCanvas() {
                const container = document.querySelector('.container');
                this.canvas.width = container.offsetWidth;
                this.canvas.height = container.offsetHeight;
            }

            async loadData() {
                try {
                    const response = await fetch(this.apiEndpoint);
                    const data = await response.json();

                    this.companies = data.providers || [];
                    this.users = data.users || this.generateMockUsers();

                    this.renderUsers();
                    this.renderCompanies();
                    this.drawConnections();
                    this.updateConnection(true);
                } catch (error) {
                    console.error('Failed to load data:', error);
                    this.updateConnection(false);

                    // Use mock data if API fails
                    this.companies = this.generateMockCompanies();
                    this.users = this.generateMockUsers();
                    this.renderUsers();
                    this.renderCompanies();
                    this.drawConnections();
                }
            }

            generateMockUsers() {
                return [
                    { id: 'openclaw', name: 'OpenClaw', device: 'GPU Node', status: 'online' },
                    { id: 'picoclaw', name: 'PicoClaw', device: 'CPU Server', status: 'online' },
                    { id: 'researcher', name: 'Researcher', device: 'Laptop', status: 'idle' },
                    { id: 'dev', name: 'Developer', device: 'Desktop', status: 'online' }
                ];
            }

            generateMockCompanies() {
                const companies = ['OpenAI', 'Anthropic', 'Google', 'Groq', 'Mistral', 'Ollama'];
                return companies.map(name => ({
                    name: name,
                    model: `${name}-latest`,
                    used: Math.floor(Math.random() * 100),
                    remaining: Math.floor(Math.random() * 100),
                    limit: 100,
                    status: 'OK'
                }));
            }

            renderUsers() {
                this.usersList.innerHTML = this.users.map((user, index) => `
                    <div class="user-item ${user.status === 'online' ? 'active' : ''}" data-user-id="${user.id}">
                        <span class="user-status"></span>
                        <strong>${user.name}</strong>
                        <div style="font-size: 0.75rem; color: #999;">${user.device}</div>
                    </div>
                `).join('');

                // Simulate user-model associations
                this.users.forEach((user, idx) => {
                    const companyIdx = idx % this.companies.length;
                    this.userModelUsage[user.id] = this.companies[companyIdx].name;
                });
            }

            renderCompanies() {
                this.companiesContainer.innerHTML = this.companies.map((company, idx) => {
                    const models = this.generateModelsForCompany(company);
                    const activeModel = this.selectedModel[company.name] || models[0].name;
                    const inUseBy = Object.entries(this.userModelUsage)
                        .filter(([_, model]) => model === company.name)
                        .map(([userId]) => userId);

                    return this.createCompanyBubble(company, models, activeModel, inUseBy, idx);
                }).join('');

                // Add event listeners
                document.querySelectorAll('.model-tab').forEach(tab => {
                    tab.addEventListener('click', (e) => {
                        const company = e.target.dataset.company;
                        const model = e.target.dataset.model;
                        this.selectModel(company, model);
                    });
                });
            }

            generateModelsForCompany(company) {
                const modelNames = {
                    'OpenAI': ['GPT-4', 'GPT-4 Turbo', 'GPT-3.5'],
                    'Anthropic': ['Claude 3 Opus', 'Claude 3 Sonnet', 'Claude 3 Haiku'],
                    'Google': ['Gemini 2.0', 'Gemini Pro', 'PaLM 2'],
                    'Groq': ['Llama 3.3 70B', 'Mixtral 8x7B'],
                    'Mistral': ['Mistral Large', 'Mistral Medium', 'Mistral Small'],
                    'Ollama': ['Qwen 2.5', 'Llama 2', 'Mistral 7B']
                };

                const names = modelNames[company.name] || ['Model 1', 'Model 2', 'Model 3'];
                return names.map(name => ({
                    name: name,
                    usage: Math.floor(Math.random() * 100),
                    tokens: Math.floor(Math.random() * 100000)
                }));
            }

            createCompanyBubble(company, models, activeModel, inUseBy, idx) {
                const usageClass = company.used <= 50 ? '' : company.used <= 75 ? 'medium' : 'high';

                return `
                    <div class="company-bubble" data-company="${company.name}">
                        <div class="company-header">
                            <div class="company-name">${company.name}</div>
                            <div class="company-total">${company.used}% Used</div>
                        </div>

                        <div class="model-tabs">
                            ${models.map(model => `
                                <div class="model-tab ${model.name === activeModel ? 'active' : ''} ${inUseBy.length > 0 ? 'in-use' : ''}"
                                     data-company="${company.name}"
                                     data-model="${model.name}">
                                    ${model.name}
                                    ${inUseBy.length > 0 ? ' 👤' : ''}
                                </div>
                            `).join('')}
                        </div>

                        <div class="model-details show">
                            ${models.find(m => m.name === activeModel) ? `
                                <div class="detail-row">
                                    <span class="detail-label">Usage:</span>
                                    <span class="detail-value">${models.find(m => m.name === activeModel).usage}%</span>
                                </div>
                                <div class="usage-bar-container">
                                    <div class="usage-bar ${usageClass}" style="width: ${company.used}%"></div>
                                </div>
                                <div class="detail-row" style="margin-top: 0.5rem;">
                                    <span class="detail-label">Tokens:</span>
                                    <span class="detail-value">${(models.find(m => m.name === activeModel).tokens / 1000).toFixed(1)}K</span>
                                </div>
                                ${inUseBy.length > 0 ? `
                                    <div class="detail-row">
                                        <span class="detail-label">In Use By:</span>
                                        <span class="detail-value">${inUseBy.join(', ')}</span>
                                    </div>
                                ` : ''}
                            ` : ''}
                        </div>
                    </div>
                `;
            }

            selectModel(company, model) {
                this.selectedModel[company] = model;
                this.renderCompanies();
                this.drawConnections();
            }

            drawConnections() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw dotted lines from users to their active models
                Object.entries(this.userModelUsage).forEach(([userId, companyName]) => {
                    const userEl = document.querySelector(`[data-user-id="${userId}"]`);
                    const companyEl = document.querySelector(`[data-company="${companyName}"]`);

                    if (userEl && companyEl) {
                        const userRect = userEl.getBoundingClientRect();
                        const companyRect = companyEl.getBoundingClientRect();
                        const containerRect = this.canvas.parentElement.getBoundingClientRect();

                        const x1 = userRect.left - containerRect.left + userRect.width / 2;
                        const y1 = userRect.top - containerRect.top + userRect.height / 2;
                        const x2 = companyRect.left - containerRect.left + companyRect.width / 2;
                        const y2 = companyRect.top - containerRect.top + companyRect.height / 2;

                        this.drawDottedLine(x1, y1, x2, y2);
                    }
                });
            }

            drawDottedLine(x1, y1, x2, y2) {
                const dashLen = 5;
                const gap = 5;
                const angle = Math.atan2(y2 - y1, x2 - x1);
                const distance = Math.hypot(x2 - x1, y2 - y1);
                let pos = 0;

                this.ctx.strokeStyle = 'rgba(76, 175, 80, 0.4)';
                this.ctx.lineWidth = 2;

                while (pos < distance) {
                    const nextPos = Math.min(pos + dashLen, distance);
                    const nextX = x1 + Math.cos(angle) * nextPos;
                    const nextY = y1 + Math.sin(angle) * nextPos;

                    if (pos === 0) {
                        this.ctx.beginPath();
                        this.ctx.moveTo(x1 + Math.cos(angle) * pos, y1 + Math.sin(angle) * pos);
                    } else {
                        this.ctx.moveTo(x1 + Math.cos(angle) * pos, y1 + Math.sin(angle) * pos);
                    }

                    this.ctx.lineTo(nextX, nextY);
                    this.ctx.stroke();

                    pos = nextPos + gap;
                }
            }

            updateConnection(connected) {
                this.connectionStatus.className = `connection-status ${connected ? 'connected' : 'disconnected'}`;
                this.connectionStatus.querySelector('span').textContent = connected ? 'Connected' : 'Disconnected';
            }
        }

        // Initialize on page load
        const dashboard = new EnhancedTokenDashboard();
    </script>
</body>
</html>
