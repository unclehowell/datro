<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced LLM Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #121212 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(90deg, #1a1a1a 0%, #2a2a2a 100%);
            padding: 1.5rem 2rem;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4CAF50, #66BB6A);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .connection-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .connected .connection-dot { background: #4CAF50; }
        .disconnected .connection-dot { background: #f44336; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main Container */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 1rem;
        }

        /* Users Column */
        .users-column {
            width: 180px;
            background: linear-gradient(180deg, #1a1a1a, #0f0f0f);
            border-right: 1px solid #333;
            padding: 1rem;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .users-column h3 {
            font-size: 0.85rem;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 1rem;
            letter-spacing: 0.05em;
        }

        .user-item {
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
            position: relative;
            z-index: 10;
        }

        .user-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .user-item.active {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border-color: #66BB6A;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.4);
        }

        .user-status {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.5rem;
            background: #4CAF50;
        }

        .user-item.idle .user-status { background: #FF9800; }
        .user-item.offline .user-status { background: #f44336; }

        /* Canvas */
        #connection-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            overflow: auto;
            position: relative;
            z-index: 2;
        }

        .companies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
            align-items: start;
            height: fit-content;
        }

        /* Company Card */
        .company-card {
            background: linear-gradient(145deg, #1a1a1a, #2a2a2a);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 0;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }

        .company-card:hover {
            border-color: #555;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
            transform: translateY(-2px);
        }

        .company-card.locked {
            opacity: 0.8;
        }

        /* Card Header with Tabs */
        .card-header {
            padding: 1rem 1rem 0.5rem;
            border-bottom: 1px solid #333;
        }

        .model-tabs {
            display: flex;
            gap: 0.3rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .model-tab {
            padding: 0.4rem 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            white-space: nowrap;
            transition: all 0.2s;
            color: #999;
        }

        .model-tab:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .model-tab.active {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border-color: #66BB6A;
            color: #fff;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.3);
        }

        /* Company Main Area */
        .company-main {
            padding: 1rem;
            position: relative;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .company-name {
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            font-size: 0.85rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Quota Tank Visualization */
        .quota-tank-container {
            position: relative;
            width: 150px;
            height: 180px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            overflow: hidden;
            margin: 0 auto;
        }

        .quota-tank-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, #4CAF50, #388E3C);
            transition: height 0.3s ease;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 0.5rem;
        }

        .quota-tank-fill.medium {
            background: linear-gradient(180deg, #FF9800, #F57C00);
        }

        .quota-tank-fill.low {
            background: linear-gradient(180deg, #F44336, #D32F2F);
        }

        .quota-tank-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            font-size: 1.2rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        /* Lock Overlay */
        .lock-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            border-radius: 12px;
        }

        .lock-overlay.active {
            display: flex;
        }

        .lock-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .reset-time {
            text-align: center;
            font-size: 0.85rem;
            color: #FF9800;
            font-weight: 600;
        }

        .reset-time small {
            display: block;
            color: #999;
            font-size: 0.75rem;
        }

        /* Card Footer */
        .card-footer {
            padding: 1rem;
            border-top: 1px solid #333;
            background: rgba(255, 255, 255, 0.02);
        }

        .usage-stat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }

        .stat-label {
            color: #999;
        }

        .stat-value {
            color: #fff;
            font-weight: 600;
        }

        .users-using {
            font-size: 0.8rem;
            color: #66BB6A;
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px solid #333;
        }

        /* Responsive */
        @media (max-width: 1600px) {
            .companies-grid {
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            }
        }

        @media (max-width: 1024px) {
            .companies-grid {
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            }
            .users-column {
                width: 150px;
            }
        }

        .loading {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4rem;
            color: #999;
        }

        .loading::after {
            content: '';
            width: 20px;
            height: 20px;
            border: 2px solid #333;
            border-top: 2px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 Advanced LLM Provider Dashboard</h1>
        <div class="connection-status" id="connection-status">
            <div class="connection-dot"></div>
            <span>Connecting...</span>
        </div>
    </div>

    <div class="container">
        <canvas id="connection-canvas"></canvas>

        <div class="users-column">
            <h3>👥 Users</h3>
            <div id="users-list"></div>
        </div>

        <div class="main-content">
            <div class="companies-grid" id="companies-grid">
                <div class="loading">Loading Providers...</div>
            </div>
        </div>
    </div>

    <script>
        class AdvancedLLMDashboard {
            constructor() {
                this.connectionStatus = document.getElementById('connection-status');
                this.usersList = document.getElementById('users-list');
                this.companiesGrid = document.getElementById('companies-grid');
                this.canvas = document.getElementById('connection-canvas');
                this.ctx = this.canvas.getContext('2d');

                this.apiEndpoint = '/api/llm-usage';
                this.quotaEndpoint = '/api/quota-status';
                this.updateInterval = 3000;
                this.users = [];
                this.providers = [];
                this.quotaData = {};
                this.selectedModels = {};
                this.userProviderUsage = {};

                this.init();
            }

            init() {
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
                this.loadData();
                setInterval(() => this.loadData(), this.updateInterval);
            }

            resizeCanvas() {
                const container = document.querySelector('.container');
                this.canvas.width = container.offsetWidth;
                this.canvas.height = container.offsetHeight;
            }

            async loadData() {
                try {
                    const [usageRes, quotaRes] = await Promise.all([
                        fetch(this.apiEndpoint),
                        fetch(this.quotaEndpoint)
                    ]);

                    const usageData = await usageRes.json();
                    const quotaData = await quotaRes.json();

                    this.providers = usageData.providers || [];
                    this.users = usageData.users || this.generateMockUsers();
                    this.quotaData = quotaData.statuses || [];

                    this.assignUserProviders();
                    this.renderUsers();
                    this.renderCompanies();
                    this.drawConnections();
                    this.updateConnection(true);
                } catch (error) {
                    console.error('Load error:', error);
                    this.loadMockData();
                }
            }

            loadMockData() {
                this.users = this.generateMockUsers();
                this.providers = this.generateMockProviders();
                this.quotaData = this.generateMockQuota();
                this.assignUserProviders();
                this.renderUsers();
                this.renderCompanies();
                this.drawConnections();
                this.updateConnection(true);
            }

            generateMockUsers() {
                return [
                    { id: 'openclaw', name: 'OpenClaw', device: 'Main', status: 'online' },
                    { id: 'picoclaw', name: 'PicoClaw', device: 'GPU', status: 'online' },
                    { id: 'researcher', name: 'Researcher', device: 'Laptop', status: 'idle' },
                    { id: 'dev', name: 'Developer', device: 'Desktop', status: 'online' }
                ];
            }

            generateMockProviders() {
                return [
                    { name: 'OpenAI', used: 75, remaining: 25, status: 'OK' },
                    { name: 'Anthropic', used: 45, remaining: 55, status: 'OK' },
                    { name: 'Google', used: 88, remaining: 12, status: 'OK' },
                    { name: 'Groq', used: 30, remaining: 70, status: 'OK' },
                    { name: 'Mistral', used: 60, remaining: 40, status: 'OK' },
                    { name: 'Ollama', used: 15, remaining: 85, status: 'OK' }
                ];
            }

            generateMockQuota() {
                const providers = ['OpenAI', 'Anthropic', 'Google', 'Groq', 'Mistral', 'Ollama'];
                return providers.map(p => ({
                    apiId: `provider/${p}`,
                    status: Math.random() > 0.8 ? 'quota_exceeded' : 'active',
                    quotaRemaining: Math.floor(Math.random() * 100),
                    nextAccessAt: new Date(Date.now() + 86400000)
                }));
            }

            assignUserProviders() {
                this.users.forEach((user, idx) => {
                    const providerIdx = idx % this.providers.length;
                    this.userProviderUsage[user.id] = this.providers[providerIdx].name;
                });
            }

            renderUsers() {
                this.usersList.innerHTML = this.users.map(user => `
                    <div class="user-item ${user.status === 'online' ? 'active' : user.status}" data-user-id="${user.id}">
                        <span class="user-status"></span>
                        <strong style="font-size: 0.8rem; display: block;">${user.name}</strong>
                        <small style="color: #666;">${user.device}</small>
                    </div>
                `).join('');
            }

            renderCompanies() {
                this.companiesGrid.innerHTML = this.providers.map((provider, idx) => {
                    const usersUsing = Object.entries(this.userProviderUsage)
                        .filter(([_, prov]) => prov === provider.name)
                        .map(([userId]) => userId);

                    const quota = this.quotaData.find(q => q.apiId && q.apiId.includes(provider.name)) || {};
                    const isLocked = quota.status === 'quota_exceeded';

                    let lineIntensity = provider.used <= 40 ? 0.3 : provider.used <= 70 ? 0.6 : 0.9;
                    let lineStyle = provider.used <= 40 ? 'dotted' : provider.used <= 70 ? 'dotted' : 'solid';

                    return `
                        <div class="company-card ${isLocked ? 'locked' : ''}" data-provider="${provider.name}">
                            <div class="card-header">
                                <div class="company-name">${provider.name}</div>
                                <div class="model-tabs">
                                    <div class="model-tab active" data-model="primary">Primary</div>
                                    <div class="model-tab" data-model="secondary">Secondary</div>
                                    <div class="model-tab" data-model="tertiary">Tertiary</div>
                                </div>
                            </div>

                            <div class="company-main">
                                <div class="quota-tank-container">
                                    <div class="quota-tank-fill ${provider.used > 75 ? 'low' : provider.used > 50 ? 'medium' : ''}"
                                         style="height: ${provider.remaining}%; opacity: ${lineIntensity};">
                                    </div>
                                    <div class="quota-tank-label">${provider.remaining}%</div>
                                </div>

                                <div class="lock-overlay ${isLocked ? 'active' : ''}">
                                    <div class="lock-icon">🔒</div>
                                    <div class="reset-time">
                                        Quota Exceeded
                                        <small>${quota.nextAccessAt ? new Date(quota.nextAccessAt).toLocaleDateString() : 'N/A'}</small>
                                    </div>
                                </div>
                            </div>

                            <div class="card-footer">
                                <div class="usage-stat">
                                    <span class="stat-label">Usage:</span>
                                    <span class="stat-value">${provider.used}%</span>
                                </div>
                                <div class="usage-stat">
                                    <span class="stat-label">Remaining:</span>
                                    <span class="stat-value">${provider.remaining}%</span>
                                </div>
                                ${usersUsing.length > 0 ? `
                                    <div class="users-using">👤 ${usersUsing.join(', ')}</div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            drawConnections() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                Object.entries(this.userProviderUsage).forEach(([userId, providerName]) => {
                    const userEl = document.querySelector(`[data-user-id="${userId}"]`);
                    const providerEl = document.querySelector(`[data-provider="${providerName}"]`);

                    if (userEl && providerEl) {
                        const user = this.users.find(u => u.id === userId);
                        const provider = this.providers.find(p => p.name === providerName);

                        if (user && provider) {
                            const userRect = userEl.getBoundingClientRect();
                            const providerRect = providerEl.getBoundingClientRect();
                            const containerRect = this.canvas.parentElement.getBoundingClientRect();

                            const x1 = userRect.left - containerRect.left + userRect.width / 2;
                            const y1 = userRect.top - containerRect.top + userRect.height / 2;
                            const x2 = providerRect.left - containerRect.left + providerRect.width / 2;
                            const y2 = providerRect.top - containerRect.top + providerRect.height / 2;

                            // Determine line style based on usage
                            let lineStyle = 'dotted';
                            let intensity = 0.3;
                            if (provider.used > 70) {
                                lineStyle = 'solid';
                                intensity = 0.9;
                            } else if (provider.used > 40) {
                                lineStyle = 'dotted';
                                intensity = 0.6;
                            }

                            this.drawLine(x1, y1, x2, y2, lineStyle, intensity);
                        }
                    }
                });
            }

            drawLine(x1, y1, x2, y2, style, opacity) {
                this.ctx.strokeStyle = `rgba(76, 175, 80, ${opacity})`;
                this.ctx.lineWidth = 2;

                if (style === 'solid') {
                    this.ctx.setLineDash([]);
                } else {
                    this.ctx.setLineDash([5, 5]);
                }

                this.ctx.beginPath();
                this.ctx.moveTo(x1, y1);
                this.ctx.lineTo(x2, y2);
                this.ctx.stroke();
                this.ctx.setLineDash([]);
            }

            updateConnection(connected) {
                this.connectionStatus.className = `connection-status ${connected ? 'connected' : 'disconnected'}`;
                this.connectionStatus.querySelector('span').textContent = connected ? 'Connected' : 'Disconnected';
            }
        }

        new AdvancedLLMDashboard();
    </script>
</body>
</html>
