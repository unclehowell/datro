<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Dashboard - Supply & Demand</title>
    <style>
        :root {
            --bg-color: #000;
            --tile-bg: #0a0a0a;
            --border-color: #1a1a1a;
            --text-main: #fff;
            --text-dim: #444;
            --accent: #00ff80;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 2vw;
        }

        /* Top 2/3: Supply (Providers) */
        .supply-container {
            height: 65vh;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 1.5vw;
            margin-bottom: 2vh;
        }

        .provider-tile {
            background: var(--tile-bg);
            border: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.5s ease;
        }

        .provider-name {
            font-size: 3vw;
            font-weight: 900;
            letter-spacing: -0.1vw;
            z-index: 2;
            text-align: center;
            line-height: 1;
        }

        .model-name {
            font-size: 1.2vw;
            color: var(--text-dim);
            font-weight: 400;
            margin-top: 1vh;
            letter-spacing: 0.5vw;
        }

        .provider-tile.exceeded {
            transform: translateY(2vh) scale(0.95);
            opacity: 0.5;
            filter: grayscale(100%);
            border-color: #333;
        }

        .usage-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--accent);
            opacity: 0.15;
            transition: height 1s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
        }

        /* Bottom 1/3: Demand (Devices/Users) */
        .demand-container {
            height: 30vh;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2vw;
        }

        .device-col {
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--border-color);
            padding-top: 1vh;
        }

        .device-header {
            font-size: 1.5vw;
            font-weight: 800;
            color: var(--text-dim);
            margin-bottom: 2vh;
            text-transform: uppercase;
            letter-spacing: 0.2vw;
        }

        .user-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8vw;
        }

        .user-tag {
            font-size: 1.2vw;
            font-weight: 700;
            padding: 0.5vh 1vw;
            background: #111;
            border: 1px solid #222;
            color: #666;
            transition: all 0.3s ease;
        }

        .user-tag.active {
            color: var(--text-main);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 255, 128, 0.2);
        }

        /* Overlay Canvas for lines */
        #line-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>
    <canvas id="line-canvas"></canvas>

    <div id="supply-grid" class="supply-container">
        <!-- 6 Provider Tiles -->
    </div>

    <div id="demand-grid" class="demand-container">
        <!-- 3 Device Columns -->
    </div>

    <script>
        const canvas = document.getElementById('line-canvas');
        const ctx = canvas.getContext('2d');
        let dashboardData = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.onresize = resizeCanvas;
        resizeCanvas();

        async function fetchData() {
            try {
                const response = await fetch('/api/llm-usage');
                dashboardData = await response.json();
                renderSupply(dashboardData.providers);
                renderDemand(dashboardData.devices, dashboardData.users);
            } catch (err) { console.error(err); }
        }

        function renderSupply(providers) {
            const container = document.getElementById('supply-grid');
            container.innerHTML = '';
            providers.forEach(p => {
                const tile = document.createElement('div');
                tile.className = 'provider-tile';
                tile.id = `tile-${p.name.toLowerCase()}`;
                
                // Descend away if usage is 100% or error
                if (p.usage >= 100 || (p.status && p.status !== 'ACTIVE')) {
                    tile.classList.add('exceeded');
                }

                const name = document.createElement('div');
                name.className = 'provider-name';
                name.textContent = p.name;
                name.style.color = p.color;
                
                const model = document.createElement('div');
                model.className = 'model-name';
                model.textContent = p.model;
                if (p.status && p.status !== 'ACTIVE') {
                     model.textContent += ` (${p.status})`;
                     model.style.color = '#ff4444';
                }
                
                const fill = document.createElement('div');
                fill.className = 'usage-fill';
                fill.style.height = `${p.usage}%`; // Height represents usage
                fill.style.backgroundColor = p.color;
                
                // If usage is high, make fill more opaque
                if (p.usage > 80) fill.style.opacity = 0.4;
                if (p.usage >= 100) fill.style.opacity = 0.8;

                tile.appendChild(name);
                tile.appendChild(model);
                tile.appendChild(fill);
                container.appendChild(tile);
            });
        }

        function renderDemand(devices, users) {
            const container = document.getElementById('demand-grid');
            container.innerHTML = '';
            
            devices.forEach(device => {
                const col = document.createElement('div');
                col.className = 'device-col';
                
                const header = document.createElement('div');
                header.className = 'device-header';
                header.textContent = device.name;
                
                const list = document.createElement('div');
                list.className = 'user-list';
                
                const deviceUsers = users.filter(u => u.device === device.id);
                deviceUsers.forEach(u => {
                    const tag = document.createElement('div');
                    tag.className = 'user-tag';
                    tag.id = `user-${u.id}`;
                    tag.textContent = u.name;
                    list.appendChild(tag);
                });

                col.appendChild(header);
                col.appendChild(list);
                container.appendChild(col);
            });
        }

        // Draw connections
        function drawConnections() {
            if (!dashboardData) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const users = dashboardData.users;
            const providers = dashboardData.providers;
            
            // Only draw lines if we have data and provider is ACTIVE
            providers.forEach(provider => {
                if (provider.status === 'ACTIVE' && provider.usage < 100) {
                    // Simulate a few users connected to active providers
                    const activeUsers = users.filter(u => u.device === 'laptop').slice(0, 2); 
                    
                    activeUsers.forEach(user => {
                        const userEl = document.getElementById(`user-${user.id}`);
                        const providerEl = document.getElementById(`tile-${provider.name.toLowerCase()}`);
                        
                        if (userEl && providerEl) {
                            userEl.classList.add('active');
                            setTimeout(() => userEl.classList.remove('active'), 1500);
                            
                            const uRect = userEl.getBoundingClientRect();
                            const pRect = providerEl.getBoundingClientRect();
                            
                            const startX = uRect.left + uRect.width / 2;
                            const startY = uRect.top;
                            const endX = pRect.left + pRect.width / 2;
                            const endY = pRect.top + pRect.height;
                            
                            ctx.beginPath();
                            ctx.setLineDash([5, 5]);
                            ctx.strokeStyle = provider.color;
                            ctx.globalAlpha = 0.4;
                            ctx.lineWidth = 2;
                            ctx.moveTo(startX, startY);
                            ctx.bezierCurveTo(startX, startY - 100, endX, endY + 100, endX, endY);
                            ctx.stroke();
                        }
                    });
                }
            });
        }

        fetchData();
        setInterval(fetchData, 3000);
        setInterval(drawConnections, 1000);
    </script>
</body>
</html>
