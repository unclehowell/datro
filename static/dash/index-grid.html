<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Dashboard</title>
    <style>
        :root {
            --bg:    #050505;
            --tile:  #0c0c0c;
            --border:#1e1e1e;
            --text:  #f0f0f0;
            --dim:   #505050;
            --green: #00ff88;
            --red:   #ff3333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; overflow: hidden; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.2vw 1.6vw;
        }

        /* ── TITLEBAR ── */
        .titlebar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 1vh;
            margin-bottom: 1.2vh;
            border-bottom: 1px solid var(--border);
        }
        .titlebar h1 {
            font-size: 1.5vw;
            font-weight: 900;
            letter-spacing: 0.3vw;
            text-transform: uppercase;
            color: var(--dim);
        }
        .clock {
            font-size: 1.5vw;
            font-weight: 700;
            color: var(--dim);
            letter-spacing: 0.12vw;
            font-variant-numeric: tabular-nums;
        }

        /* ── SUPPLY GRID ── */
        .supply {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 1vw;
            margin-bottom: 1.4vh;
        }

        .tile {
            background: var(--tile);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.4vh 1.6vw 1vh;
            display: flex;
            flex-direction: column;
            transition: border-color 0.4s;
        }
        .tile.over  { border-color: var(--red); }
        .tile.err   { border-color: var(--red); opacity: 0.75; }

        /* provider name + percentage in brackets – same line, same size */
        .tile-name {
            font-size: 2vw;
            font-weight: 900;
            letter-spacing: -0.02em;
            line-height: 1;
            margin-bottom: 0.5vh;
        }

        .tile-model {
            font-size: 1vw;
            font-weight: 600;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 0.1vw;
            margin-bottom: 1vh;
        }

        /* bar: remaining quota (inverted – full = lots left, empty = exhausted) */
        .tile-bar-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
            background: #111;
            border: 1px solid #1e1e1e;
            border-radius: 4px;
            overflow: hidden;
            min-height: 0;
        }
        .tile-bar-fill {
            width: 100%;
            transition: height 1s cubic-bezier(0.4,0,0.2,1);
            border-radius: 3px;
            min-height: 2px;
        }
        .tile-status-badge {
            position: absolute;
            top: 0.5vh;
            right: 0.6vw;
            font-size: 0.75vw;
            font-weight: 800;
            letter-spacing: 0.12vw;
            text-transform: uppercase;
            color: var(--green);
        }
        .tile.over  .tile-status-badge { color: var(--red); }
        .tile.err   .tile-status-badge { color: var(--red); }

        /* ── DEMAND SECTION ── */
        .demand {
            height: 18vh;
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--border);
            padding-top: 1vh;
        }
        .demand-header {
            font-size: 1.3vw;
            font-weight: 900;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 0.2vw;
            margin-bottom: 1.4vh;
        }
        .user-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8vw;
            align-content: flex-start;
        }
        .user-tag {
            font-size: 1.2vw;
            font-weight: 800;
            padding: 0.5vh 1.2vw;
            background: #0f0f0f;
            border: 1px solid #222;
            border-radius: 4px;
            color: #3a3a3a;
            letter-spacing: 0.06vw;
            transition: all 0.25s ease;
        }
        .user-tag.live {
            color: var(--text);
            border-color: var(--green);
            background: #071a0d;
            box-shadow: 0 0 14px rgba(0,255,136,0.25);
        }
        .device-locked { opacity: 0.2; }
        .locked-icon   { font-size: 2.5vw; color: #1a1a1a; margin-top: 0.8vh; }
        .locked-text   { font-size: 0.9vw; color: #2a2a2a; text-transform: uppercase; letter-spacing: 0.1vw; margin-top: 0.4vh; }

        /* ── CONNECTIONS CANVAS ── */
        #lines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="titlebar">
        <h1>LLM Supply &amp; Demand</h1>
        <span class="clock" id="clock"></span>
    </div>

    <div id="supply-grid" class="supply"></div>
    <div id="demand-grid" class="demand"></div>
    <canvas id="lines"></canvas>

    <script>
        // ── Clock ──
        const clockEl = document.getElementById('clock');
        function tick() {
            const n = new Date();
            clockEl.textContent = n.toLocaleTimeString('en-US', { hour12: false });
        }
        tick();
        setInterval(tick, 1000);

        // ── Canvas ──
        const canvas = document.getElementById('lines');
        const ctx    = canvas.getContext('2d');
        function resizeCanvas() {
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ── State ──
        let data = null;

        async function load() {
            try {
                const r  = await fetch('/api/llm-usage');
                data = await r.json();
                render(data.providers, data.devices, data.users);
            } catch(e) { console.error(e); }
        }

        // ── Render providers ──
        function render(providers, devices, users) {
            renderSupply(providers);
            renderDemand(devices, users);
        }

        function renderSupply(providers) {
            const grid = document.getElementById('supply-grid');
            grid.innerHTML = '';

            providers.forEach(p => {
                // remaining = 0% → bar is empty (exhausted)
                // remaining = 100% → bar is full
                const remaining = Math.max(0, Math.min(100, p.remaining));
                const isOver  = p.used >= 100 || p.status === 'OVER';
                const isErr   = p.status === 'ERR';

                const tile = document.createElement('div');
                tile.className = 'tile' + (isOver ? ' over' : isErr ? ' err' : '');
                tile.id = `tile-${p.name.toLowerCase().replace(/\s+/g, '-')}`;

                // Name (coloured) + [XX%] in brackets – same colour, same size
                const nameEl = document.createElement('div');
                nameEl.className = 'tile-name';
                nameEl.style.color = p.color;
                nameEl.innerHTML   = `${p.name}&nbsp;<span style="color:var(--dim);font-weight:700">${Math.round(remaining)}%</span>`;

                const modelEl = document.createElement('div');
                modelEl.className   = 'tile-model';
                modelEl.textContent = p.model;

                const barWrap = document.createElement('div');
                barWrap.className = 'tile-bar-wrap';

                const barFill = document.createElement('div');
                barFill.className = 'tile-bar-fill';
                barFill.style.height    = `${remaining}%`;
                barFill.style.background = (isOver || isErr) ? 'var(--red)' : p.color;

                const badge = document.createElement('div');
                badge.className   = 'tile-status-badge';
                badge.textContent = isErr ? 'ERR' : isOver ? 'OVER' : 'OK';

                barWrap.appendChild(barFill);
                barWrap.appendChild(badge);

                tile.appendChild(nameEl);
                tile.appendChild(modelEl);
                tile.appendChild(barWrap);
                grid.appendChild(tile);
            });
        }

        // ── Render devices / users ──
        function renderDemand(devices, users) {
            const grid = document.getElementById('demand-grid');
            grid.innerHTML = '';

            // Flat single-row: header + all users from all visible devices
            const hdr = document.createElement('div');
            hdr.className   = 'demand-header';
            hdr.textContent = 'Active Programs & Users';

            const list = document.createElement('div');
            list.className = 'user-list';

            users.forEach(u => {
                if (!u.visible) return;
                const tag = document.createElement('div');
                tag.className   = 'user-tag';
                tag.id          = `user-${u.id}`;
                tag.textContent = u.name;
                list.appendChild(tag);
            });

            grid.appendChild(hdr);
            grid.appendChild(list);
        }

        // ── Draw connection lines ──
        function drawLines() {
            if (!data) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const traffic = data.traffic || {};
            const providers = data.providers || [];
            const users     = data.users     || [];

            providers.forEach(p => {
                const tileEl = document.getElementById(`tile-${p.name.toLowerCase().replace(/\s+/g, '-')}`);
                if (!tileEl) return;

                // Thickness: proportional to traffic weight (1–10px)
                const weight = traffic[p.name] || 0;
                const thick  = Math.max(1, Math.min(10, weight * 10));

                const pRect = tileEl.getBoundingClientRect();

                // Light up up to N users proportional to traffic
                const count = Math.max(1, Math.round(weight * users.length));
                users.slice(0, count).forEach(u => {
                    const userEl = document.getElementById(`user-${u.id}`);
                    if (!userEl) return;

                    userEl.classList.add('live');
                    setTimeout(() => userEl.classList.remove('live'), 1800);

                    const uRect = userEl.getBoundingClientRect();

                    const sx = uRect.left + uRect.width  / 2;
                    const sy = uRect.top;
                    const ex = pRect.left + pRect.width / 2;
                    const ey = pRect.top  + pRect.height;

                    ctx.beginPath();
                    ctx.setLineDash([8, 6]);
                    ctx.lineDashOffset = 0;
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth   = thick;
                    ctx.globalAlpha = 0.5;
                    ctx.moveTo(sx, sy);
                    ctx.bezierCurveTo(sx, sy - 120, ex, ey + 120, ex, ey);
                    ctx.stroke();
                });
            });

            ctx.globalAlpha = 1;
        }

        // ── Init ──
        load();
        setInterval(load,      8000);
        setInterval(drawLines, 2500);
    </script>
</body>
</html>
