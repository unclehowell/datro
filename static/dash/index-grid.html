<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supply & Demand Dashboard</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #111;
            --border-color: #222;
            --text-main: #eee;
            --text-dim: #666;
            --accent: #00ff80;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 3rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 0.8rem;
            font-weight: 400;
            margin-bottom: 3rem;
            color: var(--text-dim);
            letter-spacing: 0.3rem;
            text-transform: uppercase;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 4rem;
        }

        /* Supply Side (Companies & Models) */
        .section-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-bottom: 2rem;
            letter-spacing: 0.1rem;
            text-transform: uppercase;
        }

        .supply-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
        }

        .company-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            aspect-ratio: 1.2;
            display: flex;
            flex-direction: column;
        }

        .company-name {
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05rem;
        }

        .models-container {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            align-content: start;
        }

        .model-square {
            aspect-ratio: 1;
            background: var(--accent);
            opacity: 0.3;
            transition: all 0.5s ease;
            position: relative;
        }

        .model-square:hover {
            opacity: 1;
        }

        .model-tooltip {
            position: absolute;
            bottom: -1.5rem;
            left: 0;
            font-size: 0.6rem;
            color: var(--text-dim);
            white-space: nowrap;
            opacity: 0;
        }

        .model-square:hover .model-tooltip {
            opacity: 1;
        }

        /* Demand Side (Devices & Users) */
        .demand-section {
            border-left: 1px solid var(--border-color);
            padding-left: 3rem;
        }

        .device-item {
            margin-bottom: 3rem;
        }

        .device-name {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .user-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .user-pill {
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
        }

        @media (max-width: 900px) {
            .dashboard-container { grid-template-columns: 1fr; }
            .demand-section { border-left: none; padding-left: 0; }
        }
    </style>
</head>
<body>
    <h1>Supply & Demand</h1>

    <div class="dashboard-container">
        <!-- SUPPLY -->
        <div class="supply-section">
            <div class="section-label">Supply: LLM Providers</div>
            <div id="supply-grid" class="supply-grid">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- DEMAND -->
        <div class="demand-section">
            <div class="section-label">Demand: Active Devices</div>
            <div id="demand-list">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <script>
        async function fetchData() {
            try {
                const response = await fetch('/api/llm-usage');
                const data = await response.json();
                renderSupply(data.providers);
                renderDemand(data.devices, data.users);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function renderSupply(providers) {
            const container = document.getElementById('supply-grid');
            container.innerHTML = '';

            providers.forEach(provider => {
                const box = document.createElement('div');
                box.className = 'company-box';
                
                const name = document.createElement('div');
                name.className = 'company-name';
                name.textContent = provider.name;
                
                const modelsContainer = document.createElement('div');
                modelsContainer.className = 'models-container';
                
                provider.models.forEach(model => {
                    const modelSq = document.createElement('div');
                    modelSq.className = 'model-square';
                    
                    // Usage determines opacity and scale
                    const usage = model.usage || 0;
                    modelSq.style.opacity = (usage / 100) * 0.8 + 0.2;
                    modelSq.style.transform = `scale(${0.7 + (usage / 100) * 0.3})`;
                    
                    if (usage > 80) modelSq.style.background = '#ff4444';
                    else if (usage > 50) modelSq.style.background = '#ffbb33';
                    
                    const tooltip = document.createElement('div');
                    tooltip.className = 'model-tooltip';
                    tooltip.textContent = `${model.name} (${usage}%)`;
                    
                    modelSq.appendChild(tooltip);
                    modelsContainer.appendChild(modelSq);
                });

                box.appendChild(name);
                box.appendChild(modelsContainer);
                container.appendChild(box);
            });
        }

        function renderDemand(devices, users) {
            const container = document.getElementById('demand-list');
            container.innerHTML = '';

            devices.forEach(device => {
                const item = document.createElement('div');
                item.className = 'device-item';
                
                const name = document.createElement('div');
                name.className = 'device-name';
                name.textContent = device.name;
                
                const userList = document.createElement('div');
                userList.className = 'user-list';
                
                const deviceUsers = users.filter(u => u.device === device.id);
                
                if (deviceUsers.length === 0) {
                    userList.innerHTML = '<div style="color: #333; font-size: 0.7rem;">IDLE</div>';
                } else {
                    deviceUsers.forEach(user => {
                        const pill = document.createElement('div');
                        pill.className = 'user-pill';
                        pill.innerHTML = `<span class="status-dot" style="background: ${user.color || 'var(--accent)'}"></span> ${user.name}`;
                        userList.appendChild(pill);
                    });
                }

                item.appendChild(name);
                item.appendChild(userList);
                container.appendChild(item);
            });
        }

        fetchData();
        setInterval(fetchData, 2000);
    </script>
</body>
</html>
