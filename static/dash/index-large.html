<!DOCTYPE html>
<html lang="en" class="dark accessibility-mode">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Bubble Monitor - Large Text Accessibility</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary-bg: #000000;
            --secondary-bg: #111111;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --accent-glow: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-size: 24px; /* Large base font for accessibility */
            line-height: 1.3;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .accessibility-mode {
            font-size: 24px !important;
        }

        .bubble-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding: 40px;
            height: 100vh;
            align-items: start;
            grid-auto-rows: auto;
            overflow: hidden;
            align-content: start;
        }

        .bubble {
            background: linear-gradient(135deg, var(--secondary-bg), #222);
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 25px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .bubble:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
        }

        .usage-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: currentColor;
            filter: blur(0px);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 40px currentColor;
        }

        .usage-dot.critical {
            animation: pulseCritical 2s infinite;
        }

        @keyframes pulseCritical {
            0%, 100% { 
                box-shadow: 0 0 40px currentColor;
                opacity: 1;
            }
            50% { 
                box-shadow: 0 0 80px currentColor, 0 0 120px currentColor;
                opacity: 0.8;
            }
        }

        .provider-name {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 5px;
        }

        .model-name {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .company-name {
            font-size: 20px;
            color: #999;
            font-weight: 500;
        }

        .user-name {
            font-size: 24px;
            font-weight: 700;
            margin-top: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 16px;
            display: inline-block;
        }

        .usage-info {
            font-size: 22px;
            margin-top: 10px;
            font-weight: 600;
        }

        .time-info {
            position: fixed;
            top: 20px;
            right: 30px;
            font-size: 36px;
            font-weight: 700;
            color: var(--text-secondary);
            background: var(--secondary-bg);
            padding: 12px 24px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .title {
            position: fixed;
            top: 20px;
            left: 30px;
            font-size: 56px;
            font-weight: 900;
            color: var(--text-primary);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            letter-spacing: -0.02em;
        }

        .subtitle {
            position: fixed;
            top: 85px;
            left: 30px;
            font-size: 28px;
            color: #ccc;
            font-weight: 500;
        }

        .radio-player {
            position: fixed;
            bottom: 20px;
            right: 30px;
            width: 0;
            height: 0;
            opacity: 0;
            pointer-events: none;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-size: 40px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .error-message {
            color: #ff6b6b;
            font-size: 24px;
            text-align: center;
            margin-top: 20px;
        }

        @media (max-width: 1920px) {
            .bubble-container {
                gap: 20px;
            }
            
            .bubble {
                padding: 20px;
                min-height: 160px;
            }
        }

        @media (max-width: 1366px) {
            .bubble-container {
                grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
                padding: 30px 20px;
            }
            
            .provider-name { font-size: 28px; }
            .model-name { font-size: 24px; }
            .user-name { font-size: 20px; }
            .title { font-size: 48px; }
            .subtitle { font-size: 24px; }
        }

        .connection-indicator {
            position: fixed;
            bottom: 20px;
            left: 30px;
            font-size: 18px;
            color: #999;
            background: var(--secondary-bg);
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .connection-indicator.connected {
            color: #00ff80;
            border-color: #00ff80;
        }

        .connection-indicator.disconnected {
            color: #ff6b6b;
            border-color: #ff6b6b;
        }
    </style>
</head>
<body>
    <h1 class="title">LLM USAGE MONITOR</h1>
    <p class="subtitle">Large Text • Real-Time Bubbles • User Tracking</p>
    
    <div class="time-info" id="clock">--:--:--</div>
    <div class="connection-indicator" id="connection">CONNECTING...</div>
    
    <audio autoplay loop class="radio-player" id="radioPlayer" preload="auto">
        <!-- Radio Monte Carlo stream will be loaded here -->
        <source src="https://streaming.shoutcast.com/RadioMonteCarlo?lang=en" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div class="bubble-container" id="bubble-container">
        <div class="loading">Loading LLM Status...</div>
    </div>

    <script>
        class LLMBubbleMonitor {
            constructor() {
                this.container = document.getElementById('bubble-container');
                this.clock = document.getElementById('clock');
                this.connection = document.getElementById('connection');
                this.radioPlayer = document.getElementById('radioPlayer');
                this.models = [];
                this.lastUpdate = null;
                this.updateInterval = 2000; // 2 seconds for real-time updates
                
                this.init();
            }

            init() {
                this.updateClock();
                this.startRadioPlayer();
                this.fetchData();
                this.startAutoUpdate();
            }

            startRadioPlayer() {
                // Try multiple Radio Monte Carlo stream URLs
                const radioUrls = [
                    'https://streaming.shoutcast.com/RadioMonteCarlo?lang=en',
                    'https://relay.radioparadise.com/rp_192.ogg',
                    'https://stream.azuracast.com/radio/8000/radio.mp3'
                ];

                let currentUrlIndex = 0;
                
                const tryNextStream = () => {
                    if (currentUrlIndex >= radioUrls.length) return;
                    
                    const url = radioUrls[currentUrlIndex];
                    this.radioPlayer.src = url;
                    
                    this.radioPlayer.addEventListener('error', () => {
                        console.log(`Radio stream ${url} failed, trying next...`);
                        currentUrlIndex++;
                        tryNextStream();
                    });
                };

                tryNextStream();
                this.radioPlayer.volume = 0.3; // Start at low volume
            }

            updateClock() {
                const now = new Date();
                this.clock.textContent = now.toLocaleTimeString('en-GB', {
                    hour12: false,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            }

            async fetchData() {
                try {
                    const response = await fetch('/api/llm-usage');
                    const data = await response.json();
                    
                    this.models = data.models.sort((a, b) => {
                        const usageA = a.used / a.limit;
                        const usageB = b.used / b.limit;
                        return usageB - usageA;
                    });
                    
                    this.lastUpdate = new Date();
                    this.renderBubbles();
                    this.updateConnectionStatus(true);
                } catch (error) {
                    console.error('Failed to fetch data:', error);
                    this.updateConnectionStatus(false);
                }
            }

            updateConnectionStatus(connected) {
                this.connection.textContent = connected ? 'CONNECTED' : 'DISCONNECTED';
                this.connection.className = `connection-indicator ${connected ? 'connected' : 'disconnected'}`;
            }

            renderBubbles() {
                const html = this.models.map(model => {
                    const usage = (model.used / model.limit) * 100;
                    const dotSize = Math.max(40, (usage / 100) * 180); // Expands up to 180px
                    const isCritical = usage > 85;
                    const isWarning = usage > 50;
                    
                    return `
                        <div class="bubble">
                            <div class="usage-dot ${isCritical ? 'critical' : ''}" 
                                 style="width: ${dotSize}px; height: ${dotSize}px; color: ${model.color}; opacity: ${Math.max(0.3, usage / 100)}">
                            </div>
                            <div style="position: relative; z-index: 2;">
                                <div class="provider-name">${model.provider}</div>
                                <div class="model-name">${model.model}</div>
                                <div class="company-name">${model.company}</div>
                                <div class="user-name" style="background: ${model.color}20; color: ${model.color};">
                                    👤 ${model.userFullName}
                                </div>
                                <div class="usage-info">
                                    ${model.used.toLocaleString()} / ${model.limit.toLocaleString()} ${model.unit}
                                </div>
                                <div style="font-size: 20px; margin-top: 5px; font-weight: bold; color: ${usage > 85 ? '#ff6b6b' : usage > 50 ? '#ff9f40' : '#00ff80'};">
                                    ${Math.round(usage)}% USED
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                this.container.innerHTML = html;
            }

            startAutoUpdate() {
                setInterval(() => {
                    this.updateClock();
                    this.fetchData();
                }, this.updateInterval);
            }
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            new LLMBubbleMonitor();
        });

        // Handle visibility changes to pause/resume audio
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // Optionally pause audio when page is hidden
                // this.radioPlayer.pause();
            } else {
                // Optionally resume audio when page is visible
                // this.radioPlayer.play();
            }
        });

        // Error handling
        window.addEventListener('error', (e) => {
            console.error('Page error:', e.error);
            // Continue operation despite errors
        });

        window.addEventListener('unhandledrejection', (e) => {
            console.error('Unhandled promise rejection:', e.reason);
            // Continue operation despite errors
        });
    </script>
</body>
</html>
