<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Provider Token Usage Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #121212 100%);
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: linear-gradient(90deg, #1a1a1a 0%, #2a2a2a 100%);
            padding: 1.5rem 2rem;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4CAF50, #66BB6A);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .connection-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .connected .connection-dot {
            background: #4CAF50;
        }

        .disconnected .connection-dot {
            background: #f44336;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            position: relative;
        }

        /* Legend/Key */
        .legend {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            min-width: 200px;
            z-index: 10;
        }

        .legend h3 {
            margin-bottom: 1rem;
            font-size: 1.1rem;
            color: #ccc;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .legend-rating {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.8rem;
            color: #999;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #333;
        }

        /* Company Container */
        .companies-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            flex: 1;
            overflow: hidden;
            padding-right: 220px; /* Space for legend */
            align-items: start;
        }

        /* Company Bubble */
        .company-bubble {
            background: linear-gradient(145deg, #1a1a1a, #2a2a2a);
            border: 1px solid #333;
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .company-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-shrink: 0;
        }

        .company-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: #fff;
        }

        .company-total {
            font-size: 0.9rem;
            color: #999;
        }

        .company-models {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 0.5rem;
            flex: 1;
            min-height: 0;
        }

        /* Individual Model Bubbles */
        .model-square {
            aspect-ratio: 1;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            position: relative;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform-origin: center;
        }

        .model-square:hover {
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.1);
            z-index: 2;
        }

        /* Usage fill effect */
        .model-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 0%;
            transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            border-radius: 6px;
        }

        .model-info {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 2;
            pointer-events: none;
        }

        .model-name {
            font-size: 0.65rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
            max-width: 90%;
            margin: 0 auto 0.2rem;
        }

        .usage-percentage {
            font-size: 0.75rem;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .model-square:hover .usage-percentage {
            opacity: 1;
        }

        /* Star rating */
        .star-rating {
            display: flex;
            gap: 1px;
            justify-content: center;
            margin-top: 0.3rem;
            font-size: 0.55rem;
        }

        .star {
            color: #ffd700;
            text-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
        }

        .star.empty {
            color: #555;
        }

        /* Color coding for usage levels */
        .usage-very-low .model-fill { background: linear-gradient(180deg, #2196F3, #1976D2); }
        .usage-low .model-fill { background: linear-gradient(180deg, #4CAF50, #388E3C); }
        .usage-medium .model-fill { background: linear-gradient(180deg, #FF9800, #F57C00); }
        .usage-high .model-fill { background: linear-gradient(180deg, #F44336, #D32F2F); }
        .usage-extreme .model-fill { background: linear-gradient(180deg, #9C27B0, #7B1FA2); }

        .usage-very-low .usage-percentage { color: #2196F3; }
        .usage-low .usage-percentage { color: #4CAF50; }
        .usage-medium .usage-percentage { color: #FF9800; }
        .usage-high .usage-percentage { color: #F44336; }
        .usage-extreme .usage-percentage { color: #9C27B0; }

        /* Expand animation when usage is high */
        .expanding {
            transform: scale(calc(0.3 + var(--usage-percentage) * 0.7));
            z-index: 1;
        }

        /* Tooltip */
        .tooltip {
            position: fixed;
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            pointer-events: none;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
            max-width: 200px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .tooltip.show {
            opacity: 1;
        }

        /* Responsive adjustments */
        @media (max-width: 1200px) {
            .companies-container {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                padding-right: 0;
            }
            .legend {
                position: static;
                margin-bottom: 2rem;
            }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }
            .header h1 {
                font-size: 1.5rem;
            }
            .main-content {
                padding: 1rem;
            }
            .companies-container {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .company-bubble {
                min-height: 250px;
            }
        }

        /* Loading state */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            color: #999;
        }

        .loading::after {
            content: '';
            width: 24px;
            height: 24px;
            border: 2px solid #333;
            border-top: 2px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 0.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 LLM Provider Token Usage Dashboard</h1>
        <div class="connection-status" id="connection-status">
            <div class="connection-dot"></div>
            <span>Connecting...</span>
        </div>
    </div>

    <div class="main-content">
        <div class="legend">
            <h3>Usage Levels</h3>
            <div class="legend-item">
                <div class="legend-color usage-very-low" style="background: linear-gradient(180deg, #2196F3, #1976D2);"></div>
                <span>0-20% (🚲 Very Low)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color usage-low" style="background: linear-gradient(180deg, #4CAF50, #388E3C);"></div>
                <span>21-50% (🚗 Low)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color usage-medium" style="background: linear-gradient(180deg, #FF9800, #F57C00);"></div>
                <span>51-75% (🚙 Medium)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color usage-high" style="background: linear-gradient(180deg, #F44336, #D32F2F);"></div>
                <span>76-90% (✈️ High)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color usage-extreme" style="background: linear-gradient(180deg, #9C27B0, #7B1FA2);"></div>
                <span>91-100% (🚀 Extreme)</span>
            </div>
            <div class="legend-rating">
                <span>⭐ Star ratings show model quality (1-5 stars)</span>
            </div>
        </div>

        <div class="companies-container" id="companies-container">
            <div class="loading">
                <span>Loading Providers...</span>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script>
        class TokenBubbleDashboard {
            constructor() {
                this.connectionStatus = document.getElementById('connection-status');
                this.tooltip = document.getElementById('tooltip');
                this.companiesContainer = document.getElementById('companies-container');
                
                // Mock data - replace with your actual API endpoint
                this.apiEndpoint = '/api/llm-usage';
                this.updateInterval = 2000; // 2 seconds
                this.lastUpdate = null;
                this.isConnected = false;

                // Company colors for consistent theming
                this.companyColors = {
                    'OpenAI': '#00A86B',
                    'Anthropic': '#FF6B35',
                    'Google': '#4285F4',
                    'Microsoft': '#00BCF2',
                    'Meta': '#1877F2',
                    'Cohere': '#FF5A5F',
                    'AI21': '#FF6B6B',
                    'Stability': '#FF1493',
                    'Mistral': '#4A90E2',
                    'Grok': '#1DA1F2'
                };

                this.init();
            }

            init() {
                this.updateConnection(false);
                this.bindEvents();
                this.startRealTimeUpdates();
                this.loadData();
            }

            bindEvents() {
                // Handle window resize to adjust layouts
                window.addEventListener('resize', () => {
                    this.handleResize();
                });

                // Handle visibility change to pause/resume updates
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        this.pauseUpdates();
                    } else {
                        this.resumeUpdates();
                    }
                });
            }

            async loadData() {
                try {
                    // For demo purposes, use mock data first
                    // Replace this with actual API call:
                    // const response = await fetch(this.apiEndpoint);
                    // const data = await response.json();
                    
                    const mockData = this.generateMockData();
                    this.renderCompanies(mockData);
                    this.updateConnection(true);
                    this.lastUpdate = new Date();
                    
                } catch (error) {
                    console.error('Failed to load data:', error);
                    this.updateConnection(false);
                    this.showError('Failed to load token usage data');
                }
            }

            generateMockData() {
                const companies = [
                    'OpenAI', 'Anthropic', 'Google', 'Microsoft', 'Meta', 'Cohere', 'AI21', 'Stability', 'Mistral', 'Grok'
                ];
                
                return companies.slice(0, 6).map((company, companyIndex) => {
                    const modelsPerCompany = 3 + Math.floor(Math.random() * 4);
                    const models = [];
                    
                    for (let i = 0; i < modelsPerCompany; i++) {
                        const usage = Math.floor(Math.random() * 100);
                        const modelQualities = ['GPT-4', 'Claude', 'Gemini', 'Copilot', 'Llama'];
                        const quality = modelQualities[i % modelQualities.length];
                        
                        models.push({
                            name: `${quality}-${i + 1}`,
                            usage: usage,
                            limit: Math.floor(Math.random() * 50000) + 10000,
                            used: Math.floor(Math.random() * 40000) + 5000,
                            stars: Math.floor(Math.random() * 5) + 1,
                            description: `${quality} model with ${Math.floor(Math.random() * 32) + 8}B parameters`
                        });
                    }
                    
                    return {
                        name: company,
                        models: models,
                        totalUsage: Math.floor(models.reduce((sum, model) => sum + model.usage, 0) / models.length),
                        color: this.companyColors[company] || '#4CAF50',
                        status: models.some(m => m.usage > 80) ? 'warning' : 'ok'
                    };
                }).sort((a, b) => b.totalUsage - a.totalUsage); // Sort by usage percentage, highest first
            }

            renderCompanies(companies) {
                this.companiesContainer.innerHTML = '';
                
                // Sort companies by total usage (already done in generateMockData)
                companies.forEach((company, index) => {
                    const companyBubble = this.createCompanyBubble(company, index);
                    this.companiesContainer.appendChild(companyBubble);
                });

                // Start expansion animations after initial render
                setTimeout(() => {
                    this.animateExpansions();
                }, 100);
            }

            createCompanyBubble(company, companyIndex) {
                const bubble = document.createElement('div');
                bubble.className = 'company-bubble';
                bubble.style.animationDelay = `${companyIndex * 0.1}s`;
                
                // Company header
                const header = document.createElement('div');
                header.className = 'company-header';
                header.innerHTML = `
                    <div class="company-name" style="color: ${company.color}">${company.name}</div>
                    <div class="company-total">${company.totalUsage}% Avg Usage</div>
                `;
                
                // Models grid
                const modelsContainer = document.createElement('div');
                modelsContainer.className = 'company-models';
                
                // Sort models by usage percentage within each company
                const sortedModels = company.models.sort((a, b) => b.usage - a.usage);
                
                sortedModels.forEach((model, modelIndex) => {
                    const modelSquare = this.createModelSquare(model, modelIndex, company);
                    modelsContainer.appendChild(modelSquare);
                });
                
                bubble.appendChild(header);
                bubble.appendChild(modelsContainer);
                
                return bubble;
            }

            createModelSquare(model, index, company) {
                const square = document.createElement('div');
                square.className = 'model-square';
                
                // Determine usage category for styling
                const usage = model.usage;
                let usageClass = '';
                if (usage <= 20) usageClass = 'usage-very-low';
                else if (usage <= 50) usageClass = 'usage-low';
                else if (usage <= 75) usageClass = 'usage-medium';
                else if (usage <= 90) usageClass = 'usage-high';
                else usageClass = 'usage-extreme';
                
                square.classList.add(usageClass);
                
                // Set CSS custom property for dynamic scaling
                square.style.setProperty('--usage-percentage', usage / 100);
                
                // Create star rating
                const stars = Array.from({length: 5}, (_, i) => 
                    `<span class="star ${i < model.stars ? '' : 'empty'}">★</span>`
                ).join('');
                
                square.innerHTML = `
                    <div class="model-fill"></div>
                    <div class="model-info">
                        <div class="model-name">${model.name}</div>
                        <div class="usage-percentage">${usage}%</div>
                        <div class="star-rating">${stars}</div>
                    </div>
                `;
                
                // Set initial fill height with animation
                setTimeout(() => {
                    const fill = square.querySelector('.model-fill');
                    if (fill) {
                        fill.style.height = `${usage}%`;
                    }
                }, index * 100);
                
                // Add expansion class based on usage
                if (usage > 50) {
                    setTimeout(() => {
                        square.classList.add('expanding');
                    }, 500 + (index * 50));
                }
                
                // Add event listeners for tooltip
                square.addEventListener('mouseenter', (e) => {
                    this.showTooltip(e, company, model);
                });
                
                square.addEventListener('mouseleave', (e) => {
                    this.hideTooltip();
                });
                
                square.addEventListener('mousemove', (e) => {
                    this.positionTooltip(e);
                });
                
                return square;
            }

            animateExpansions() {
                const modelSquares = document.querySelectorAll('.model-square');
                modelSquares.forEach((square, index) => {
                    // Check if this square should expand based on usage
                    const usagePercentage = parseInt(square.querySelector('.usage-percentage')?.textContent) || 0;
                    
                    if (usagePercentage > 50) {
                        // Dynamic scale based on usage
                        const scale = 0.3 + (usagePercentage / 100) * 0.7;
                        setTimeout(() => {
                            square.style.transform = `scale(${scale})`;
                            square.style.zIndex = '1';
                        }, index * 20);
                    }
                });
            }

            showTooltip(event, company, model) {
                const tooltip = this.tooltip;
                const usageLevel = model.usage <= 20 ? 'Very Low' :
                               model.usage <= 50 ? 'Low' :
                               model.usage <= 75 ? 'Medium' :
                               model.usage <= 90 ? 'High' : 'Extreme';
                
                const emoji = model.usage <= 20 ? '🚲' :
                             model.usage <= 50 ? '🚗' :
                             model.usage <= 75 ? '🚙' :
                             model.usage <= 90 ? '✈️' : '🚀';
                
                tooltip.innerHTML = `
                    <div style="font-weight: 600; margin-bottom: 0.5rem; color: ${company.color}">
                        ${company.name} - ${model.name}
                    </div>
                    <div style="margin-bottom: 0.3rem;">
                        <strong>Usage:</strong> ${model.used.toLocaleString()} / ${model.limit.toLocaleString()} tokens
                    </div>
                    <div style="margin-bottom: 0.3rem;">
                        <strong>Percentage:</strong> ${emoji} ${model.usage}% (${usageLevel})
                    </div>
                    <div style="margin-bottom: 0.3rem;">
                        <strong>Rating:</strong> ${'★'.repeat(model.stars)}${'☆'.repeat(5-model.stars)} ${model.stars}/5
                    </div>
                    <div style="font-size: 0.8rem; color: #ccc; margin-top: 0.5rem;">
                        ${model.description}
                    </div>
                `;
                
                this.positionTooltip(event);
                tooltip.classList.add('show');
            }

            hideTooltip() {
                this.tooltip.classList.remove('show');
            }

            positionTooltip(event) {
                const tooltip = this.tooltip;
                const rect = tooltip.getBoundingClientRect();
                let x = event.clientX + 15;
                let y = event.clientY - 10;
                
                // Prevent tooltip from going off-screen
                if (x + rect.width > window.innerWidth) {
                    x = event.clientX - rect.width - 15;
                }
                if (y + rect.height > window.innerHeight) {
                    y = event.clientY - rect.height - 10;
                }
                if (x < 0) x = 10;
                if (y < 0) y = 10;
                
                tooltip.style.left = `${x}px`;
                tooltip.style.top = `${y}px`;
            }

            updateConnection(connected) {
                this.isConnected = connected;
                this.connectionStatus.className = `connection-status ${connected ? 'connected' : 'disconnected'}`;
                this.connectionStatus.querySelector('span').textContent = connected ? 'Connected' : 'Disconnected';
            }

            startRealTimeUpdates() {
                // Simulate real-time updates
                setInterval(() => {
                    this.simulateRealTimeUpdate();
                }, this.updateInterval);
            }

            simulateRealTimeUpdate() {
                const modelSquares = document.querySelectorAll('.model-square');
                
                // Randomly update a few models
                const squaresToUpdate = Math.floor(Math.random() * 3) + 1;
                for (let i = 0; i < squaresToUpdate; i++) {
                    const randomSquare = modelSquares[Math.floor(Math.random() * modelSquares.length)];
                    if (randomSquare) {
                        const currentUsage = parseInt(randomSquare.querySelector('.usage-percentage')?.textContent) || 0;
                        const change = Math.floor(Math.random() * 5) - 2; // -2 to +2
                        const newUsage = Math.max(0, Math.min(100, currentUsage + change));
                        
                        this.updateModelSquare(randomSquare, newUsage);
                    }
                }
            }

            updateModelSquare(square, newUsage) {
                const usageText = square.querySelector('.usage-percentage');
                const fillElement = square.querySelector('.model-fill');
                
                if (usageText && fillElement) {
                    // Update usage text
                    usageText.textContent = `${newUsage}%`;
                    
                    // Update fill height
                    fillElement.style.height = `${newUsage}%`;
                    
                    // Update usage class
                    const usageClass = newUsage <= 20 ? 'usage-very-low' :
                                     newUsage <= 50 ? 'usage-low' :
                                     newUsage <= 75 ? 'usage-medium' :
                                     newUsage <= 90 ? 'usage-high' : 'usage-extreme';
                    
                    // Remove old usage classes
                    ['usage-very-low', 'usage-low', 'usage-medium', 'usage-high', 'usage-extreme'].forEach(cls => {
                        square.classList.remove(cls);
                    });
                    
                    // Add new usage class
                    square.classList.add(usageClass);
                    
                    // Update expansion
                    if (newUsage > 50) {
                        setTimeout(() => {
                            square.classList.add('expanding');
                            const scale = 0.3 + (newUsage / 100) * 0.7;
                            square.style.transform = `scale(${scale})`;
                            square.style.zIndex = '1';
                        }, 200);
                    } else {
                        square.classList.remove('expanding');
                        square.style.transform = 'scale(1)';
                        square.style.zIndex = 'auto';
                    }
                }
            }

            handleResize() {
                // Adjust layouts for different screen sizes
                const container = this.companiesContainer;
                const legend = document.querySelector('.legend');
                
                if (window.innerWidth <= 1200) {
                    container.style.paddingRight = '0';
                    legend.style.position = 'sticky';
                    legend.style.top = '1rem';
                    legend.style.marginBottom = '2rem';
                } else {
                    container.style.paddingRight = '220px';
                    legend.style.position = 'absolute';
                    legend.style.top = '2rem';
                    legend.style.right = '2rem';
                    legend.style.position = 'absolute';
                }
            }

            pauseUpdates() {
                // Pause real-time updates when page is not visible
                console.log('Pausing updates - page not visible');
            }

            resumeUpdates() {
                // Resume updates when page becomes visible again
                console.log('Resuming updates - page visible');
                this.refreshData();
            }

            showError(message) {
                const container = this.companiesContainer;
                container.innerHTML = `<div style="text-align: center; color: #F44336; font-size: 1.2rem; padding: 3rem;">
                    ⚠️ ${message}<br/>
                    <button onclick="location.reload()" style="margin-top: 1rem; padding: 0.5rem 1rem; background: #F44336; color: white; border: none; border-radius: 6px; cursor: pointer;">Retry</button>
                </div>`;
            }

            refreshData() {
                // Refresh data from API
                this.loadData();
            }
        }

        // Initialize the dashboard
        const dashboard = new TokenBubbleDashboard();

        // Handle cleanup on page unload
        window.addEventListener('beforeunload', () => {
            // Cleanup if needed
        });
    </script>
</body>
</html>
