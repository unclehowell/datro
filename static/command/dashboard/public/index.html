<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMMAND Cockpit</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app" style="display:none">
  <!-- Cockpit View -->
  <div id="cockpit">
    <!-- Windshield (main view - top 65%) -->
    <div id="windshield">
      <canvas id="track-canvas"></canvas>
      
      <!-- Milestone markers -->
      <div id="milestone-container">
        <div id="current-milestone" class="milestone">--</div>
        <div id="progress-milestone" class="milestone">0/0</div>
      </div>
      
      <!-- Joystick with compass overlay -->
      <div id="joystick-container">
        <div id="joystick-base">
          <canvas id="joystick-canvas"></canvas>
          <div id="joystick-label">JOYSTICK</div>
        </div>
        <!-- Compass rose with preset positions -->
        <div id="compass-rose">
          <div class="compass-point N" data-direction="N">N</div>
          <div class="compass-point NE" data-direction="NE">NE</div>
          <div class="compass-point E" data-direction="E">E</div>
          <div class="compass-point SE" data-direction="SE">SE</div>
          <div class="compass-point S" data-direction="S">S</div>
          <div class="compass-point SW" data-direction="SW">SW</div>
          <div class="compass-point W" data-direction="W">W</div>
          <div class="compass-point NW" data-direction="NW">NW</div>
        </div>
      </div>
    </div>
    
    <!-- Side panels (left/right - each 15% width) -->
    <div id="side-panels">
      <!-- Left panel - Branch list for navigation -->
      <div id="left-panel" class="side-panel">
        <div class="panel-header">
          <span class="panel-title">LEFT BRANCHES</span>
          <button id="btn-left" class="nav-btn active">◀</button>
        </div>
        <div id="left-list" class="branch-list"></div>
      </div>
      
      <!-- Right panel - Branch list for navigation -->
      <div id="right-panel" class="side-panel">
        <div class="panel-header">
          <span class="panel-title">RIGHT BRANCHES</span>
          <button id="btn-right" class="nav-btn active">▶</button>
        </div>
        <div id="right-list" class="branch-list"></div>
      </div>
    </div>
    
    <!-- Dashboard controls (bottom 35%) -->
    <div id="dashboard">
      <!-- Gear control (left) -->
      <div id="gear-control" class="dashboard-unit">
        <div class="unit-title">GEAR</div>
        <div class="gear-display">
          <input type="range" id="gear-slider" class="gear-slider" min="1" max="10" value="3">
          <div class="gear-readout">
            <span id="gear-value">3</span>
            <span id="gear-rate-label">1/hr</span>
          </div>
        </div>
        <div class="gear-presets">
          <span class="preset" data-gear="1">1</span>
          <span class="preset" data-gear="2">2</span>
          <span class="preset" data-gear="3">3</span>
          <span class="preset" data-gear="4">4</span>
          <span class="preset" data-gear="5">5</span>
          <span class="preset" data-gear="6">6</span>
          <span class="preset" data-gear="7">7</span>
          <span class="preset" data-gear="8">8</span>
          <span class="preset" data-gear="9">9</span>
          <span class="preset" data-gear="10">10</span>
        </div>
      </div>
      
      <!-- Radio/COMMS (center) -->
      <div id="radio-control" class="dashboard-unit">
        <div class="unit-title">RADIO — INTERCOM</div>
        <div class="radio-avatar-container">
          <div class="radio-avatar" id="radio-avatar">
            <svg viewBox="0 0 60 60" width="50" height="50">
              <circle cx="30" cy="30" r="26" fill="#1a1c2a" stroke="#00f2ff" stroke-width="1.5"/>
              <circle cx="30" cy="30" r="3" fill="#00f2ff" opacity="0.8"/>
              <path d="M30,5 Q45,15 45,30 Q45,45 30,55" stroke="#00f2ff" stroke-width="0.5" fill="none" opacity="0.3"/>
              <path d="M30,5 Q15,15 15,30 Q15,45 30,55" stroke="#00f2ff" stroke-width="0.5" fill="none" opacity="0.3"/>
              <circle cx="30" cy="30" r="8" fill="none" stroke="#ff4444" stroke-width="1.5" opacity="0.6" class="radio-pulse"/>
            </svg>
          </div>
          <div class="radio-status" id="radio-status">Standing by...</div>
        </div>
        <div class="radio-controls">
          <div class="radio-input-row">
            <input type="text" class="radio-input" id="radio-input" placeholder="Message agent..." autocomplete="off">
            <button class="radio-send-btn" id="radio-send-btn">⏎</button>
          </div>
          <div class="radio-btns">
            <button class="call-btn" id="btn-call">CALL</button>
            <button class="hangup-btn" id="btn-hangup" disabled>END</button>
          </div>
        </div>
      </div>
      
      <!-- Manual release & fuel (right) -->
      <div id="release-fuel-control" class="dashboard-unit">
        <div class="unit-title">MANUAL RELEASE</div>
        <div class="release-buttons">
          <button class="release-btn fc" id="rel-fc" title="Release financecheque">FC</button>
          <button class="release-btn cn" id="rel-cn" title="Release cnei">CN</button>
          <button class="release-btn cm" id="rel-cm" title="Release command">CM</button>
        </div>
        
        <div class="unit-title" style="margin-top:1rem">FUEL GAUGES</div>
        <div class="fuel-gauges">
          <div class="fuel-gauge"><span class="fuel-label">API</span><div class="fuel-bar"><div class="fuel-fill" id="fuel-api"></div></div></div>
          <div class="fuel-gauge"><span class="fuel-label">LLM</span><div class="fuel-bar"><div class="fuel-fill" id="fuel-llm"></div></div></div>
          <div class="fuel-gauge"><span class="fuel-label">CLI</span><div class="fuel-bar"><div class="fuel-fill" id="fuel-cli"></div></div></div>
          <div class="fuel-gauge"><span class="fuel-label">IDE</span><div class="fuel-bar"><div class="fuel-fill" id="fuel-ide"></div></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Wing File Editor Modal -->
<div id="editor-modal" class="modal" style="display:none">
  <div class="modal-backdrop"></div>
  <div class="modal-panel editor-panel">
    <div class="modal-header">
      <span id="editor-title">EDITOR</span>
      <div class="editor-tabs" id="editor-tabs"></div>
      <button class="modal-close" id="modal-editor-close">✕</button>
    </div>
    <div class="modal-body editor-body">
      <textarea id="editor-textarea" class="editor-textarea"></textarea>
    </div>
    <div class="modal-footer">
      <button class="modal-save-btn" id="editor-save">SAVE</button>
      <span class="settings-status" id="editor-status"></span>
    </div>
  </div>
</div>

<script src="/racetrack.js"></script>
<script src="/app.js"></script>
</body>
</html>
