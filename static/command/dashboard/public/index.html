<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMMAND Cockpit</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-overlay" id="login-overlay">
    <div class="login-panel">
        <div class="login-title">COMMAND TERMINAL</div>
        <div class="login-subtitle">AUTHORISED PERSONNEL ONLY</div>
        <input type="password" class="login-input" id="login-pass" placeholder="KEY" autocomplete="off">
        <div class="login-error" id="login-error"></div>
        <button class="login-btn" id="login-btn">VERIFY</button>
    </div>
</div>

<!-- MAIN COCKPIT -->
<div id="app" style="display:none">
<div class="cockpit">
    <canvas id="track-canvas"></canvas>

    <div id="milestone-overlay">
        <div id="current-milestone" class="ms-title">--</div>
        <div id="progress-milestone" class="ms-progress">0/24</div>
    </div>

    <div class="fuel-stack">
        <div class="fuel-gauge"><span class="fuel-label">API</span><div id="fuel-api" class="fuel-fill" style="height:80%"></div></div>
        <div class="fuel-gauge"><span class="fuel-label">LLM</span><div id="fuel-llm" class="fuel-fill" style="height:65%"></div></div>
        <div class="fuel-gauge"><span class="fuel-label">CLI</span><div id="fuel-cli" class="fuel-fill" style="height:90%"></div></div>
        <div class="fuel-gauge"><span class="fuel-label">IDE</span><div id="fuel-ide" class="fuel-fill" style="height:40%"></div></div>
    </div>

    <!-- STATUS BAR (version, auto-update toggle, update button) -->
    <div class="status-bar">
        <div class="status-bar-inner">
            <span>v<span class="version-label" id="version-label">--</span></span>
            <label class="auto-toggle">
                <input type="checkbox" id="auto-toggle-input">
                AUTO
            </label>
            <button class="update-btn" id="update-btn" style="display:none">UPDATE</button>
            <button id="logout-btn" style="background:none;border:1px solid #444;color:#666;font-family:monospace;font-size:9px;cursor:pointer;padding:2px 8px">LOCK</button>
        </div>
    </div>

    <div class="branch-overlay-backdrop" id="branch-backdrop"></div>

    <div class="branch-slide-menu left" id="left-branch-menu">
        <div class="branch-menu-header">▼ BRANCHES</div>
        <div id="left-branch-list"></div>
    </div>
    <div class="branch-slide-menu right" id="right-branch-menu">
        <div class="branch-menu-header">▼ BRANCHES</div>
        <div id="right-branch-list"></div>
    </div>

    <div class="dashboard-base">
        <div class="joystick-area">
            <button class="arrow-btn" id="btn-left-menu" title="Branches">◀</button>
            <div class="control-module">
                <canvas id="joystick-canvas"></canvas>
            </div>
            <button class="arrow-btn" id="btn-right-menu" title="Branches">▶</button>
        </div>

        <div class="center-console">
            <div id="avatar-screen">
                <canvas id="avatar-canvas"></canvas>
                <div id="call-status">READY</div>
            </div>
            <div class="call-buttons">
                <button id="btn-call" class="call-btn">CALL</button>
                <button id="btn-hangup" class="hangup-btn" disabled>HANG UP</button>
            </div>
            <div class="branch-dots" id="branch-dots"></div>
            <div class="current-branch-info">
                <span>ACTIVE_SYS: <span id="active-branch-name">---</span></span>
                <span>GEAR_MODE: <span id="gear-val-text">3</span></span>
            </div>
        </div>

        <div class="right-module">
            <div class="gear-display" id="gear-value">3</div>
            <div class="shifter-base">
                <input type="range" id="gear-slider" min="1" max="10" value="3">
                <div class="shifter-stick"></div>
            </div>
            <div style="font-size:10px;font-family:monospace;opacity:0.5">SEQUENTIAL GEAR</div>
        </div>
    </div>
</div>
</div>

<script src="/racetrack.js"></script>
<script src="/app.js"></script>
</body>
</html>
