<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMMAND</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="app" style="display:none">

  <!-- Racetrack Stage (top 2/3) -->
  <div id="track-stage">
    <canvas id="track-canvas"></canvas>

    <!-- Directional Buttons (toggle wing overlays) -->
    <button id="dir-up" class="dir-btn" title="Toggle High wing">▲</button>
    <button id="dir-down" class="dir-btn" title="Toggle Low wing">▼</button>
    <button id="dir-left" class="dir-btn" title="Toggle Left wing">◀</button>
    <button id="dir-right" class="dir-btn" title="Toggle Right wing">▶</button>

    <!-- Wing file overlays (dir-btn toggled, 0.73 opacity) -->
    <div id="wing-top" class="wing-overlay wing-overlay-top">
      <div class="wing-overlay-label">▲ HIGH</div>
      <div class="wing-overlay-files" id="wing-files-top"></div>
    </div>
    <div id="wing-left" class="wing-overlay wing-overlay-left">
      <div class="wing-overlay-label">◀ LEFT</div>
      <div class="wing-overlay-files" id="wing-files-left"></div>
    </div>
    <div id="wing-right" class="wing-overlay wing-overlay-right">
      <div class="wing-overlay-label">RIGHT ▶</div>
      <div class="wing-overlay-files" id="wing-files-right"></div>
    </div>
    <div id="wing-bottom" class="wing-overlay wing-overlay-bottom">
      <div class="wing-overlay-label">▼ LOW</div>
      <div class="wing-overlay-files" id="wing-files-bottom"></div>
    </div>

    <!-- Track controls overlay (always visible) -->
    <div id="track-controls">
      <div class="track-controls-left">
        <span class="ttl">COMMAND</span>
        <span class="badge" id="version-badge">—</span>
      </div>
      <div class="track-controls-center">
        <select id="branch-select" class="cyber-select" title="Active branch">
          <option value="">— branch —</option>
        </select>
      </div>
      <div class="track-controls-right">
        <span class="ctrl-status">✓GH</span>
        <span class="ctrl-status">✓CF</span>
      </div>
    </div>
  </div>

  <!-- Dashboard (bottom 1/3) -->
  <div id="dash-panel">

    <!-- Joystick (left) -->
    <div class="dash-cell dash-left">
      <div class="dash-title">JOYSTICK</div>
      <div class="joystick-wrap">
        <canvas id="joystick-canvas" width="137" height="137"></canvas>
      </div>
      <div class="joystick-labels">
        <span id="joystick-bias">BIAS:0</span>
        <span id="joystick-risk">RISK:0</span>
      </div>
    </div>

    <!-- Avatar / Radio (center) -->
    <div class="dash-cell dash-center">
      <div class="dash-title">RADIO — INTERCOM</div>
      <div class="radio-wrap">
        <div class="radio-avatar" id="radio-avatar">
          <svg viewBox="0 0 60 60" width="50" height="50">
            <circle cx="30" cy="30" r="26" fill="#1a1c2a" stroke="#00f2ff" stroke-width="1.5"/>
            <circle cx="30" cy="30" r="3" fill="#00f2ff" opacity="0.8"/>
            <path d="M30,5 Q45,15 45,30 Q45,45 30,55" stroke="#00f2ff" stroke-width="0.5" fill="none" opacity="0.3"/>
            <path d="M30,5 Q15,15 15,30 Q15,45 30,55" stroke="#00f2ff" stroke-width="0.5" fill="none" opacity="0.3"/>
            <circle cx="30" cy="30" r="8" fill="none" stroke="#ff4444" stroke-width="1.5" opacity="0.6" class="radio-pulse"/>
          </svg>
        </div>
        <div class="radio-chat">
          <div class="radio-msgs" id="radio-messages">
            <span class="radio-placeholder">Standing by...</span>
          </div>
          <div class="radio-input-row">
            <input type="text" class="radio-input" id="radio-input" placeholder="Message agent..." autocomplete="off">
            <button class="radio-send-btn" id="radio-send-btn">⏎</button>
          </div>
          <div class="radio-btns">
            <button class="call-btn" id="btn-call">CALL</button>
            <button class="hangup-btn" id="btn-hangup" disabled>END</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Gear + Manual Release + Fuel (right) -->
    <div class="dash-cell dash-right">
      <div class="dash-title">GEAR</div>
      <div class="gear-wrap">
        <input type="range" id="gear-slider" class="gear-slider" min="1" max="10" value="3" orient="vertical">
        <div class="gear-labels" id="gear-labels">
          <span class="gear-label active" data-g="3">3</span>
        </div>
        <div class="gear-rate" id="gear-rate">1/hr</div>
      </div>
      <div class="dash-title" style="margin-top:0.15rem">MANUAL RELEASE</div>
      <div class="release-wrap">
        <button class="release-btn fc" id="rel-fc" title="Release financecheque">FC</button>
        <button class="release-btn cn" id="rel-cn" title="Release cnei">CN</button>
        <button class="release-btn cm" id="rel-cm" title="Release command">CM</button>
      </div>
      <div class="fuel-gauges">
        <div class="fuel-gauge"><span class="fuel-label">API</span><div class="fuel-bar"><div class="fuel-fill" id="fuel-api"></div></div></div>
        <div class="fuel-gauge"><span class="fuel-label">LLM</span><div class="fuel-bar"><div class="fuel-fill" id="fuel-llm"></div></div></div>
        <div class="fuel-gauge"><span class="fuel-label">CLI</span><div class="fuel-bar"><div class="fuel-fill" id="fuel-cli"></div></div></div>
        <div class="fuel-gauge"><span class="fuel-label">IDE</span><div class="fuel-bar"><div class="fuel-fill" id="fuel-ide"></div></div></div>
      </div>
    </div>

  </div>

</div>

<!-- Wing File Editor Modal -->
<div id="editor-modal" class="modal" style="display:none">
  <div class="modal-backdrop"></div>
  <div class="modal-panel editor-panel">
    <div class="modal-header">
      <span id="editor-title">EDITOR</span>
      <div class="editor-tabs" id="editor-tabs"></div>
      <button class="modal-close" id="modal-editor-close">✕</button>
    </div>
    <div class="modal-body editor-body">
      <textarea id="editor-textarea" class="editor-textarea"></textarea>
    </div>
    <div class="modal-footer">
      <button class="modal-save-btn" id="editor-save">SAVE</button>
      <span class="settings-status" id="editor-status"></span>
    </div>
  </div>
</div>

<script src="/racetrack.js"></script>
<script src="/app.js"></script>
</body>
</html>
