site_name: LLMWiki — Agent Hive Mind
site_description: Persistent knowledge base for agent swarms across laptop and AWS infrastructure
site_url: https://brain.financecheque.uk
docs_dir: .
site_dir: _site

theme:
  name: material
  palette:
    primary: deep purple
    accent: teal
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest

nav:
