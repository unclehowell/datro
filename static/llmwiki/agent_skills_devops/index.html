<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Skills Devops — LLMWiki</title>
<link rel="stylesheet" href="../_theme-vitepress/nav.css">
<link rel="icon" href="../_theme-explorer/favicons/favicon-32x32.png">
</head>
<body>
<nav class="nav-sidebar">
  <a href="../index.html" class="nav-back">← LLMWiki</a>
  <div class="nav-title">Agent Skills Devops</div>
  <ul class="nav-list" id="nav-list"></ul>
</nav>
<main class="nav-content" id="nav-content"></main>
<script>
(async () => {
  const data = await fetch('./_treeview.json').then(r=>r.json());
  const list = document.getElementById('nav-list');
  const content = document.getElementById('nav-content');
  let html = '';
  for (const item of data) {
    const isDisabled = item.path === 'javascript:void(0)';
    const isHeader = item.name && item.name.includes('title-line');
    if (isHeader) {
      html += '<li><div class="nav-section-title">' + item.name.replace(/<[^>]+>/g,'').trim() + '</div></li>';
    } else if (isDisabled) {
      html += '<li><a class="disabled">' + item.name.replace(/<[^>]+>/g,'').trim() + '</a></li>';
    } else {
      const htmlLink = item._links && item._links.html !== 'javascript:void(0)' ? item._links.html : null;
      const pdfLink = item._links && item._links.pdf ? item._links.pdf : null;
      const label = item.name.replace(/<[^>]+>/g,'').trim();
      html += '<li><a href="' + item.path + '">' + label;
      if (htmlLink) html += '<span class="badge-html">HTML</span>';
      if (pdfLink) html += '<a href="' + pdfLink + '" class="badge-pdf" style="text-decoration:none">PDF</a>';
      html += '</a></li>';
    }
  }
  list.innerHTML = html;
})();
</script>
</body>
</html>
