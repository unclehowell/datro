<!DOCTYPE html>
<html>
  <head>
  <meta charset="UTF-8">
  <meta content="LLMWiki — Agent Hive Mind" name="description">
  <meta content="DATRO Consortium" name="author">
  <title>LLMWiki — Long-term Memory</title>
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, shrink-to-fit=no" name="viewport">
        <link href="../../_theme-explorer/favicons/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png">
        <link rel="stylesheet" href="../../_theme-explorer/style.css">
        <link rel="stylesheet" href="../../_theme-explorer/glyphicon.css">
<style>html{overflow-y:scroll;overflow-x:hidden;}::-webkit-scrollbar{width:0px;background:transparent;}</style>
  </head>
  <body>
    <script>
      (async () => {
        const response = await fetch('_treeview.json');
        const data = await response.json();
        let htmlString = '<ul>';
        htmlString += `<a href="../" class="up-active"><<</a>`;
        htmlString += `<p class="main-title"><span style="font-size:1.1em;font-weight:700;color:#55a5d9;">Finance Cheque UK</span><br><br>Long Term Honcho</p>`;
        for (let file of data) {
          htmlString += `<li class="li"><a href="${file.path}">${file.name}</a></li>`;
        }
        htmlString += '</ul>';
        document.getElementsByTagName('body')[0].innerHTML = htmlString;
      })()
    </script>
  </body>
<script src="../../_theme-explorer/jquery.min.js"></script>
</html>
