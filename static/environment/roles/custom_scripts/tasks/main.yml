---
# Custom scripts installation

- name: Create /usr/local/bin directory
  file:
    path: /usr/local/bin
    state: directory
    mode: '0755'

- name: Install health-monitor.sh
  copy:
    content: |
      #!/bin/bash
      # System Health Monitor
      # Monitors system resources and alerts on issues

      MEMORY_THRESHOLD=80
      DISK_THRESHOLD=85
      CPU_THRESHOLD=80
      LOG_FILE="/var/log/system-health.log"

      mkdir -p $(dirname "$LOG_FILE")

      get_memory_usage() {
          free | awk 'NR==2{printf "%.0f", $3*100/$2}'
      }

      get_disk_usage() {
          df / | tail -1 | awk '{print $5}' | sed 's/%//'
      }

      get_cpu_usage() {
          top -bn1 | grep "Cpu(s)" | awk '{print $2}' | cut -d'%' -f1 | cut -d',' -f1
      }

      get_load_average() {
          uptime | awk -F'load average:' '{print $2}' | awk '{print $1}' | sed 's/,//'
      }

      log_health_status() {
          local timestamp=$(date '+%Y-%m-%d %H:%M:%S')
          local memory=$(get_memory_usage)
          local disk=$(get_disk_usage)
          local cpu=$(get_cpu_usage)
          local load=$(get_load_average)
          
          echo "[$timestamp] Memory: ${memory}% Disk: ${disk}% CPU: ${cpu}% Load: $load" >> "$LOG_FILE"
          
          if [ "$memory" -gt "$MEMORY_THRESHOLD" ]; then
              echo "WARNING: High memory usage - ${memory}%" | tee -a "$LOG_FILE"
          fi
          
          if [ "$disk" -gt "$DISK_THRESHOLD" ]; then
              echo "WARNING: High disk usage - ${disk}%" | tee -a "$LOG_FILE"
          fi
          
          if [ "${cpu%.*}" -gt "$CPU_THRESHOLD" ]; then
              echo "WARNING: High CPU usage - ${cpu}%" | tee -a "$LOG_FILE"
          fi
      }

      main() {
          echo "System Health Check - $(date)"
          log_health_status
      }

      main
    dest: /usr/local/bin/health-monitor.sh
    mode: '0755'
    owner: root
    group: root

- name: Install system-optimizer.sh
  copy:
    content: |
      #!/bin/bash
      # System Optimizer
      # Daily system maintenance

      LOG_FILE="/var/log/system-optimizer.log"

      echo "Starting system optimization - $(date)" | tee -a "$LOG_FILE"

      # Clean apt cache
      apt-get clean 2>&1 | tee -a "$LOG_FILE"
      apt-get autoremove -y 2>&1 | tee -a "$LOG_FILE"

      # Clean thumbnail cache
      find ~/.cache/thumbnails -type f -atime +7 -delete 2>/dev/null || true

      # Clean log files older than 7 days
      find /var/log -type f -name "*.log" -mtime +7 -exec truncate -s 0 {} \; 2>/dev/null || true

      # Clear tmp files
      find /tmp -type f -atime +3 -delete 2>/dev/null || true

      # Drop memory caches
      sync
      echo 3 > /proc/sys/vm/drop_caches 2>&1 | tee -a "$LOG_FILE"

      # Rotate journal logs
      journalctl --vacuum-time=7d 2>&1 | tee -a "$LOG_FILE"

      echo "System optimization complete - $(date)" | tee -a "$LOG_FILE"
    dest: /usr/local/bin/system-optimizer.sh
    mode: '0755'
    owner: root
    group: root

- name: Install system-status.sh
  copy:
    content: |
      #!/bin/bash
      # Quick system status

      echo "=== System Status ==="
      echo "Hostname: $(hostname)"
      echo "Uptime: $(uptime -p)"
      echo ""
      echo "=== Memory ==="
      free -h
      echo ""
      echo "=== Disk ==="
      df -h | grep -E '^/dev'
      echo ""
      echo "=== Top CPU Processes ==="
      ps aux --sort=-%cpu | head -6
      echo ""
      echo "=== Top Memory Processes ==="
      ps aux --sort=-%mem | head -6
    dest: /usr/local/bin/system-status.sh
    mode: '0755'
    owner: root
    group: root

- name: Install scrcpy (Android screen mirroring)
  block:
    - name: Add scrcpy repository
      apt_repository:
        repo: ppa:moritzmolch/scrcpy
        state: present
      failed_when: false

    - name: Install scrcpy
      apt:
        name: scrcpy
        state: present
      failed_when: false

- name: Install Ollama binary directly
  get_url:
    url: https://ollama.ai/install.sh
    dest: /tmp/ollama-install.sh
    mode: '0755'
  register: ollama_installer
  failed_when: false

- name: Run Ollama install
  command: sh /tmp/ollama-install.sh
  args:
    creates: /usr/local/bin/ollama
  when: ollama_installer is changed
  failed_when: false

- name: Install openshell (custom binary - restore from backup)
  copy:
    content: |
      # Placeholder for openshell binary
      # Restore from backup: cp /path/to/backup/openshell /usr/local/bin/openshell
      # then: chmod +x /usr/local/bin/openshell
      echo "openshell binary needs to be restored from backup"
    dest: /usr/local/bin/openshell
    mode: '0755'
    owner: root
    group: root
