---
# Go tools installation

- name: Ensure Go workspace is set up
  block:
    - name: Create Go workspace directories
      file:
        path: "{{ ansible_user_dir }}/go"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Configure Go environment in bashrc
      lineinfile:
        path: "{{ ansible_user_dir }}/.bashrc"
        line: "{{ item }}"
        create: yes
      loop:
        - 'export GOPATH="$HOME/go"'
        - 'export PATH="$PATH:$GOPATH/bin"'
        - 'export GO111MODULE=on'

- name: Install zeroclaw using go install
  become: no
  command: go install github.com/zeroclaw/zeroclaw@latest
  environment:
    GOPATH: "{{ ansible_user_dir }}/go"
  args:
    creates: "{{ ansible_user_dir }}/go/bin/zeroclaw"
  failed_when: false

- name: Create go bin symlink if needed
  file:
    src: "{{ ansible_user_dir }}/go/bin"
    dest: "{{ ansible_user_dir }}/.cargo/bin"
    state: link
    force: yes
  when: ansible_user_dir is defined

- name: Install Ollama
  block:
    - name: Download Ollama install script
      get_url:
        url: https://ollama.ai/install.sh
        dest: /tmp/ollama-install.sh
        mode: '0755'
      register: ollama_download
      failed_when: false

    - name: Run Ollama install script
      command: sh /tmp/ollama-install.sh
      args:
        creates: /usr/local/bin/ollama
      when: ollama_download is changed
      failed_when: false

    - name: Remove install script
      file:
        path: /tmp/ollama-install.sh
        state: absent
      when: ollama_download is changed
