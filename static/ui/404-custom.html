<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Error Report</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background: #0a0a1a;
    color: #e0e0e0;
    padding: 20px;
    min-height: 100vh;
  }
  .error-container {
    max-width: 800px;
    margin: 40px auto;
    background: #12122a;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 32px;
  }
  h1 { color: #ff4444; margin-bottom: 8px; font-size: 1.4rem; }
  .url { color: #ff8a00; font-size: 0.85rem; margin-bottom: 24px; word-break: break-all;
        background: rgba(255,138,0,0.1); padding: 8px 12px; border-radius: 6px; }
  .section { margin-bottom: 20px; }
  .section h2 {
    font-size: 0.9rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding-bottom: 6px;
  }
  .log-entry {
    background: rgba(0,0,0,0.3);
    padding: 8px 12px;
    margin-bottom: 4px;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    white-space: pre-wrap;
    word-break: break-all;
    border-left: 3px solid #555;
  }
  .log-entry.error { border-left-color: #ff4444; }
  .log-entry.warn { border-left-color: #ffaa00; }
  .log-entry.info { border-left-color: #4a9eff; }
  .report-id {
    font-size: 0.75rem;
    color: #666;
    margin-top: 20px;
  }
  .report-code {
    background: rgba(0,0,0,0.5);
    padding: 8px;
    border-radius: 4px;
    margin-top: 12px;
    font-family: monospace;
    font-size: 0.75rem;
    color: #aaa;
    white-space: pre-wrap;
  }
  button {
    background: linear-gradient(135deg, #ff8a00, #e52e71);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    margin-right: 8px;
  }
  button:hover { opacity: 0.9; }
  .actions { margin-top: 16px; }
</style>
</head>
<body>
<div class="error-container">
  <h1>404 &mdash; Page Not Found</h1>
  <p style="color:#888;margin-bottom:12px;">The requested resource could not be found on this server.</p>
  <div class="url" id="requestedUrl"></div>

  <div class="section">
    <h2>Console Errors</h2>
    <div id="errorLogs"><p style="color:#666;font-size:0.85rem;">Capturing from page...</p></div>
  </div>

  <div class="section">
    <h2>Captured Page Data</h2>
    <div id="pageData">
      <div class="log-entry info">Collecting browser data...</div>
    </div>
  </div>

  <div class="actions">
    <button onclick="copyReport()">Copy Report</button>
    <button onclick="goBack()">Go Back</button>
    <button onclick="goHome()">Home</button>
  </div>

  <div class="report-id">
    Report ID: <span id="reportId"></span>
    Captured: <span id="timestamp"></span>
  </div>
</div>

<script>
(function() {
  var reportId = 'RPT-' + Date.now().toString(36).toUpperCase() +
                 '-' + Math.random().toString(36).substring(2,6).toUpperCase();
  var timestamp = new Date().toISOString();

  document.getElementById('reportId').textContent = reportId;
  document.getElementById('timestamp').textContent = timestamp;

  // Show the requested URL (from referrer or a hash fragment)
  var requestedUrl = decodeURIComponent(location.hash.substring(1)) ||
                     document.referrer || 'Unknown';
  document.getElementById('requestedUrl').textContent = requestedUrl;

  // ---- Collect console errors from cached page context ----
  // Try to get previously stored error logs
  var storedErrors = [];
  try {
    for (var i = localStorage.length - 1; i >= 0; i--) {
      var key = localStorage.key(i);
      if (key.indexOf('console_err_') === 0 || key.indexOf('console_log_') === 0) {
        try {
          storedErrors.push(JSON.parse(localStorage.getItem(key)));
        } catch(e) {}
      }
    }
  } catch(e) {}

  // Render stored errors
  var errorDiv = document.getElementById('errorLogs');
  if (storedErrors.length > 0) {
    errorDiv.innerHTML = '';
    storedErrors.slice(-20).reverse().forEach(function(err) {
      var type = err.type || 'unknown';
      var cls = type === 'error' ? 'error' : type === 'warn' ? 'warn' : 'info';
      var entry = document.createElement('div');
      entry.className = 'log-entry ' + cls;
      entry.textContent = '[' + (err.time || '?') + '] ' + type.toUpperCase() + ': ' +
                          (err.message || JSON.stringify(err).substring(0, 500));
      errorDiv.appendChild(entry);
    });
  } else {
    errorDiv.innerHTML = '<div class="log-entry info">No cached errors found. Console logs are ' +
                         'stored in browser localStorage during page visits and retrieved here.</div>';
  }

  // Collect current page diagnostics
  var pageData = document.getElementById('pageData');
  var diagnostics = [
    'URL: ' + location.href,
    'User-Agent: ' + navigator.userAgent.substring(0, 120),
    'Screen: ' + screen.width + 'x' + screen.height,
    'Viewport: ' + window.innerWidth + 'x' + window.innerHeight,
    'LocalStorage: ' + localStorage.length + ' entries (' +
      (new Blob([JSON.stringify(localStorage)]).size / 1024).toFixed(1) + ' KB)',
    'Cookies: ' + (document.cookie ? 'Present (' + document.cookie.length + ' bytes)' : 'None'),
    'Connection: ' + (navigator.onLine ? 'Online' : 'Offline'),
    'Service Worker: ' + ('serviceWorker' in navigator ? 'Supported' : 'Not supported'),
    'Protocol: ' + location.protocol,
    'localStorage entries: ' + Object.keys(localStorage).join(', ').substring(0, 300),
  ];
  pageData.innerHTML = diagnostics.map(function(d) {
    return '<div class="log-entry info">' + d + '</div>';
  }).join('');

  // Store report in localStorage
  try {
    localStorage.setItem('last_error_report', JSON.stringify({
      id: reportId,
      time: timestamp,
      url: requestedUrl,
      errors: storedErrors.slice(-10),
      diagnostics: diagnostics
    }));
  } catch(e) {}

  // Expose functions globally
  window.copyReport = function() {
    var text = 'ERROR REPORT ' + reportId + '\n' +
               'Time: ' + timestamp + '\n' +
               'URL: ' + requestedUrl + '\n' +
               'Diagnostics:\n' + diagnostics.join('\n') + '\n\n' +
               'Console Errors (' + storedErrors.length + '):\n' +
               storedErrors.map(function(e) {
                 return '[' + (e.time||'') + '] ' + (e.type||'') + ': ' + (e.message||'').substring(0,500);
               }).join('\n');

    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function() {
        alert('Report copied to clipboard!');
      });
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      alert('Report copied!');
    }
  };

  window.goBack = function() { history.back(); };
  window.goHome = function() { location.href = '/'; };
})();
</script>
</body>
</html>
