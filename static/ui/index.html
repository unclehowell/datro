<script>
    function getCookie(name) {
      var nameEQ = name + "=";
      var ca = document.cookie.split(';');
      for(var i=0;i < ca.length;i++) {
        var c = ca[i];
        while (c.charAt(0)==' ') c = c.substring(1,c.length);
        if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length,c.length);
      }
      return null;
    }

    function setIframeSrc(iframeId, url) {
      var isLoggedIn = getCookie('datro_login');
      var targetUrl = url;

      if (!isLoggedIn) {
        // Map URLs to illustration views
        var view = 'ai-chat'; // default
        if (url.includes('paperclip') || url.includes('003')) view = 'brain';
        else if (url.includes('netdata') || url.includes('004')) view = 'stats';
        else if (url.includes('jellyfin') || url.includes('002')) view = 'media';
        else if (url.includes('005')) view = 'settings';
        else if (url.includes('006')) view = 'oakesy';
        
        targetUrl = 'dashboard/locked-state.html?view=' + view;
      }

      document.getElementById(iframeId).src = targetUrl;
    }
    function resizeframez(obj) {
      obj.style.height = obj.contentWindow.document.body.scrollHeight + 'px';
    }
</script>
