<style>
/* Hide the Hotspot title text but keep the form structure intact */
.forminput[name] { color: rgba(255,255,255,0.0)!important; }
.forminput[value] { color: rgba(255,255,255,0.0)!important; }
.forminput::placeholder { color: rgba(255,255,255,0.0)!important; }

/* Social icons - right aligned in header */
.social-icons-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-right: 8px;
    z-index: 10;
}
.social-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.7);
    padding: 4px;
    border-radius: 6px;
    transition: color 0.2s, background 0.2s, transform 0.2s;
    text-decoration: none;
}
.social-icon:hover {
    color: #0088cc;
    background: rgba(255,255,255,0.1);
    transform: scale(1.1);
}
.social-icon svg { display: block; }

/* Split Iframe Container */
.split-container {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
    background: #454545;
}
.split-pane {
    width: 100%;
    position: relative;
}
.split-pane iframe {
    border: none;
    width: 100%;
    height: 100%;
    display: block;
    background: transparent;
}
.split-divider {
    height: 2px;
    width: 100%;
    background: linear-gradient(90deg, #ff8a00, #e52e71);
    flex-shrink: 0;
}

/* Mode 0: horizontal split (stacked - landing page) */
.split-container.mode-0 { flex-direction: column; }
.split-container.mode-0 .split-pane { height: 50%; }

/* Mode 1: single iframe (full) */
.split-container.mode-1 { flex-direction: column; }
.split-container.mode-1 .split-pane { height: 100%; }
.split-container.mode-1 .split-divider { display: none; }
.split-container.mode-1 .split-pane:first-child { display: block; width: 100%; height: 100%; }
.split-container.mode-1 .split-pane:last-child { display: none; }
</style>

<script>
    function setViewMode(mode) {
        var container = document.getElementById('splitContainer');
        container.classList.remove('mode-0', 'mode-1');
        container.classList.add('mode-' + mode);
        
        var topPane = document.getElementById('paneTop');
        var bottomPane = document.getElementById('paneBottom');
        var divider = document.getElementById('splitDivider');
        
        if (mode === 0) {
            topPane.style.display = 'block';
            bottomPane.style.display = 'block';
            divider.style.display = 'block';
        } else {
            topPane.style.display = 'none';
            bottomPane.style.display = 'block';
            divider.style.display = 'none';
        }
    }

    function setIframeSrc(iframeId, url) {
        document.getElementById(iframeId).src = url;
    }
    
    function resizeframez(obj) {
        obj.style.height = obj.contentWindow.document.body.scrollHeight + 'px';
    }
</script>
