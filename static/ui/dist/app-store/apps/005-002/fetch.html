<!DOCTYPE html>
<html class="no-js" lang="en">
<head>
    <meta charset="utf-8">
    <title>Netdata Redirect</title>
<script>
    window.onload = function() {
        var hostname = window.location.hostname;
        if (hostname.indexOf("datro") !== -1) {
            window.location.replace('https://netdata.cloud');
        } else {
            window.location.replace('http://' + hostname + ':19999');
        }
    };
</script>
</head>
<body></body>
</html>
