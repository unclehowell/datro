.demo-iframe-container {
    display: flex;
    width: 100%;
    height: calc(100vh - 60px);
    background: #454545;

.demo-iframe-container.mode-0 { flex-direction: row; }
.demo-iframe-container.mode-0 .demo-iframe { width: 50%; height: 100%; }
.demo-iframe-container.mode-1 { flex-direction: column; }

.demo-iframe-container.mode-2 .demo-iframe:first-child { width: 100%; height: 100%; }

.split-divider {

}
.mode-0 .split-divider { width: 2px; }
.mode-1 .split-divider { height: 2px; width: 100%; }
.mode-2 .split-divider,

#splitToggle {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 9999;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: rgba(10, 10, 26, 0.9);
    border: 1.5px solid rgba(255, 138, 0, 0.4);
    color: #fff;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s ease, border-color 0.2s;
    padding: 0;
}
#splitToggle:hover {
    border-color: rgba(255, 138, 0, 0.8);
    transform: scale(1.05);
}
#splitToggle:active {
    transform: scale(0.95);
}
#splitToggle .arrow-row {
    display: flex;
    align-items: center;
    gap: 4px;
}
#splitToggle .arrow {
    width: 8px;
    height: 8px;
    border-top: 2px solid rgba(255, 255, 255, 0.8);
    border-right: 2px solid rgba(255, 255, 255, 0.8);
    display: inline-block;
}
#splitToggle .arrow.up { transform: rotate(-45deg); }
#splitToggle .arrow.down { transform: rotate(135deg); }
#splitToggle .mode-label {
    position: absolute;
    bottom: -22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    color: rgba(255, 255, 255, 0.5);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
}
#splitToggle:hover .mode-label,
#splitToggle:active .mode-label {
    opacity: 1;
}

<script>
    function setIframeSrc(iframeId, url) {
      document.getElementById(iframeId).src = url;
    }
    function resizeframez(obj) {
      obj.style.height = obj.contentWindow.document.body.scrollHeight + 'px';
    }

    var currentMode = 0;
    var MODE_LABELS = ['Split Vertical', 'Split Horizontal', 'Left Only', 'Right Only'];

    function setViewMode(mode) {
        var container = document.getElementById('splitContainer');
        container.classList.remove('mode-0', 'mode-1', 'mode-2', 'mode-3');
        container.classList.add('mode-' + mode);
        currentMode = mode;
        document.getElementById('modeLabel').textContent = MODE_LABELS[mode];
    }

    (function() {
        var btn = document.getElementById('splitToggle');
        var isMobile = window.innerWidth <= 768;
        var DESKTOP_ORDER = [0, 1, 2, 3];
        var MOBILE_ORDER = [1, 0, 3, 2];
        var order = isMobile ? MOBILE_ORDER : DESKTOP_ORDER;

        var idx = 0;
        try {
            var saved = parseInt(localStorage.getItem('splitMode'));
            if (saved >= 0 && saved <= 3) {
                currentMode = saved;
                idx = order.indexOf(saved);
                if (idx === -1) idx = 0;
            }
        } catch(e) {}

        setViewMode(currentMode);
        idx = order.indexOf(currentMode);
        if (idx === -1) idx = 0;

        btn.addEventListener('click', function(e) {
            e.preventDefault();
            idx = (idx + 1) % order.length;
            setViewMode(order[idx]);
            try { localStorage.setItem('splitMode', currentMode); } catch(e) {}
        });

        window.addEventListener('resize', function() {
            var wasMobile = isMobile;
            isMobile = window.innerWidth <= 768;
            if (wasMobile !== isMobile) {
                order = isMobile ? MOBILE_ORDER : DESKTOP_ORDER;
            }
        });
    })();
</script>
