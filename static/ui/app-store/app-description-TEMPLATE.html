<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <title>[APP_NAME] - App Store</title>
        <link href="../dashboard/media/css/breadcrumb.css" rel="stylesheet">
        <link href="../dashboard/media/css/appstore.css" rel="stylesheet">
        <link href="css/font-awesome.css" rel="stylesheet">
        <style>
            body {
                background: rgb(44,12,33)!important;
            }
            .square {
                border:solid rgba(255,255,255,0.3) 1.5px;
            }
            .app-description-container {
                max-width: 800px;
                margin: 50px auto;
                padding: 30px;
                padding-top: 100px; /* Added to ensure content starts below breadcrumb */
                background: rgba(255,255,255,0.05);
                border-radius: 10px;
                border: 1px solid rgba(255,255,255,0.1);
            }
            .app-description-header {
                display: flex;
                align-items: center;
                margin-bottom: 30px;
            }
            .app-description-icon {
                width: 80px;
                height: 80px;
                margin-right: 20px;
                border-radius: 15px;
                object-fit: contain;
            }
            .app-description-title {
                font-size: 2.5rem;
                font-weight: bold;
                color: rgba(255,255,255,0.9);
            }
            .app-description-category {
                font-size: 1.2rem;
                color: rgba(255,255,255,0.6);
                margin-top: 5px;
            }
            .app-description-content {
                font-size: 1.1rem;
                color: rgba(255,255,255,0.7);
                line-height: 1.6;
            }
            .app-description-content p {
                margin-bottom: 15px;
            }
            .app-toggle-container {
                margin-top: 30px;
                text-align: center;
            }
        </style>
</head>
<body onload="document.body.classList.add('loaded');">
        <div class="container">
                <div class="box">
                        <div class="box-row">
                                <div class="box-cell box1">
                                        <!-- Dynamic Breadcrumb Placeholder -->
                                        <ul class="breadcrumb"></ul>
                                        <!-- End Dynamic Breadcrumb Placeholder -->

                                        <!-- Include the dynamic breadcrumb script -->
                                        <script src="js/dynamic-breadcrumb.js"></script>
                                </div>
                        </div>
                </div>
        </div>

        <div class="app-description-container">
            <div class="app-description-header">
                <img class="app-description-icon" src="[APP_ICON_URL]" alt="[APP_NAME] icon">
                <div>
                    <h1 class="app-description-title">[APP_REAL_NAME]</h1>
                    <p class="app-description-category">Category: [CATEGORY_NAME]</p>
                </div>
            </div>
            <div class="app-description-content">
                <p>[APP_DESCRIPTION]</p>
                <!-- Add more description paragraphs or details here -->
            </div>
            <div class="app-toggle-container">
                <input class="app-checkbox" id="[APP_ID]" type="checkbox">
                <label class="app-label install" for="[APP_ID]"><span class="thumb"></span></label>
                <button id="reinstall-[APP_ID]" class="reinstall-button" style="display: none;">Reinstall</button>
            </div>
        </div>

        <script src="js/app-toggle.js"></script>
        <script>
          document.addEventListener('DOMContentLoaded', function() {
            const appId = '[APP_ID]';
            const checkbox = document.getElementById(appId);
            const appCard = document.querySelector(`.app-card[data-app-id="${appId}"]`);
            const reinstallButton = document.getElementById(`reinstall-${appId}`);

            function updateAppCardState(isAdded) {
              if (appCard) {
                if (isAdded) {
                  appCard.classList.remove('app-card--disabled');
                  appCard.classList.remove('app-card-link--inactive');
                  appCard.removeAttribute('aria-disabled');
                } else {
                  appCard.classList.add('app-card--disabled');
                  appCard.classList.add('app-card-link--inactive');
                  appCard.setAttribute('aria-disabled', 'true');
                }
              }
            }

            function handleReinstallClick() {
              // Logic for reinstallation goes here.
              // For now, we'll just reset the state and log a message.
              console.log(`Reinstalling app: ${appId}`);
              localStorage.setItem(appId, 'added'); // Mark as added
              checkbox.checked = true;
              updateAppCardState(true);
              // In a real scenario, this would trigger a more complex process.
            }

            if (checkbox) {
              const storedValue = localStorage.getItem(appId);
              checkbox.checked = storedValue === 'added';
              updateAppCardState(checkbox.checked); // Set initial state

              // Show reinstall button if app was previously installed
              if (storedValue === 'added') {
                if (reinstallButton) reinstallButton.style.display = 'inline-block';
              }

              checkbox.addEventListener('change', function() {
                if (this.checked) {
                  localStorage.setItem(appId, 'added');
                } else {
                  localStorage.removeItem(appId);
                  if (reinstallButton) reinstallButton.style.display = 'none'; // Hide reinstall if uninstalled
                }
                updateAppCardState(this.checked);
              });
            }

            if (reinstallButton) {
              reinstallButton.addEventListener('click', handleReinstallClick);
            }
          });
        </script>
</body>
</html>
