<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard</title>

  <link rel="stylesheet" href="../node_modules/admin-lte/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="../node_modules/@fortawesome/fontawesome-free/css/all.min.css">

<script src="db-data.js"></script>
</head>

<body class="hold-transition sidebar-mini dark-mode">
<div class="wrapper">

  <!-- Navbar -->
  <nav class="main-header navbar navbar-expand navbar-dark">
    <ul class="navbar-nav">
      <li class="nav-item">
        <span class="nav-link">Admin Dashboard</span>
      </li>
    </ul>
  </nav>

  <!-- Sidebar -->
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="#" class="brand-link text-center">
      <span class="brand-text font-weight-light">My CMS</span>
    </a>
  </aside>

  <!-- Content -->
  <div class="content-wrapper p-4">
    <section class="content">
      <div id="puck-root"></div>
    </section>
  </div>

</div>

<script src="../node_modules/admin-lte/dist/js/adminlte.min.js"></script>
<script src="./puck.js"></script>

<style>
#puck-root {
  background: #1f2d3d;
  padding: 20px;
  border-radius: 8px;
}
</style>


<!-- DB Footer Release -->
<footer id="db-footer" style="font-size:12px;color:#666;text-align:center;padding:10px;margin-top:20px;border-top:1px solid #eee;">
  Datro Release • <span id="db-version">loading…</span>
</footer>
<script>
  (function(){
    try {
      var el=document.getElementById("db-version");
      if(el && typeof DB_STATUS !== "undefined") {
        el.textContent = "v"+DB_STATUS.version+" • "+DB_STATUS.release_date+" • Gateway: "+DB_STATUS.gateway_state+" • Sessions: "+DB_STATUS.active_sessions;
      }
    } catch(e) {}
  })();
</script>

</body>
</html>
