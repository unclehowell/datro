<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Great House Farm Timeline</title>
  <link rel="stylesheet" href="tailwind.css">
  <style>
    :root {
      color-scheme: light;
      --page-background: #f3f4f6;
      --surface: rgba(255, 255, 255, 0.94);
      --surface-muted: rgba(255, 255, 255, 0.82);
      --surface-border: rgba(59, 130, 246, 0.16);
      --heading-color: #0f172a;
      --text-primary: #1f2937;
      --text-muted: rgba(17, 24, 39, 0.75);
      --text-soft: rgba(17, 24, 39, 0.6);
      --accent-primary: #2563eb;
      --accent-primary-strong: #1e3a8a;
      --accent-muted: rgba(59, 130, 246, 0.18);
      --buckler-surface: linear-gradient(135deg, #d1fae5, #ecfdf5);
      --buckler-border: #10b981;
      --bp-surface: linear-gradient(135deg, #fee2e2, #fff1f2);
      --bp-border: #ef4444;
      --shared-surface: linear-gradient(135deg, #e0e7ff, #eef2ff);
      --shared-border: #4338ca;
      --shadow-soft: 0 22px 36px -24px rgba(15, 23, 42, 0.55);
      --shadow-strong: 0 30px 52px -32px rgba(15, 23, 42, 0.65);
      --modal-backdrop: rgba(15, 23, 42, 0.55);
      --axis-column-width: 150px;
      --entry-gap: 32px;
      --bubble-size: 60px;
      --year-scale: 7px;
      --timeline-row-height: 184px;
    }

    body[data-theme='dark'] {
      color-scheme: dark;
      --page-background: #060b16;
      --surface: rgba(15, 23, 42, 0.9);
      --surface-muted: rgba(30, 41, 59, 0.82);
      --surface-border: rgba(96, 165, 250, 0.28);
      --heading-color: #e2e8f0;
      --text-primary: #e2e8f0;
      --text-muted: rgba(203, 213, 225, 0.85);
      --text-soft: rgba(148, 163, 184, 0.8);
      --accent-primary: #60a5fa;
      --accent-primary-strong: #bfdbfe;
      --accent-muted: rgba(96, 165, 250, 0.32);
      --buckler-surface: linear-gradient(135deg, rgba(34, 197, 94, 0.25), rgba(16, 185, 129, 0.1));
      --buckler-border: rgba(34, 197, 94, 0.75);
      --bp-surface: linear-gradient(135deg, rgba(248, 113, 113, 0.25), rgba(248, 113, 113, 0.1));
      --bp-border: rgba(248, 113, 113, 0.75);
      --shared-surface: linear-gradient(135deg, rgba(96, 165, 250, 0.25), rgba(129, 140, 248, 0.1));
      --shared-border: rgba(129, 140, 248, 0.85);
      --shadow-soft: 0 24px 44px -26px rgba(8, 47, 73, 0.7);
      --shadow-strong: 0 34px 56px -30px rgba(8, 47, 73, 0.85);
      --modal-backdrop: rgba(6, 12, 24, 0.75);
    }

    body {
      background: var(--page-background);
      color: var(--text-primary);
      transition: background 0.3s ease, color 0.3s ease;
    }

    a {
      color: var(--accent-primary);
    }

    .page-title {
      color: var(--heading-color);
    }

    .page-subtitle {
      color: var(--text-muted);
    }

    .round-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 9999px;
      background: linear-gradient(135deg, var(--accent-primary), rgba(37, 99, 235, 0.85));
      color: #ffffff;
      font-size: 1.35rem;
      border: none;
      box-shadow: 0 16px 36px -20px rgba(37, 99, 235, 0.55);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    body[data-theme='dark'] .round-button {
      color: var(--heading-color);
      background: linear-gradient(135deg, rgba(96, 165, 250, 0.95), rgba(59, 130, 246, 0.75));
      box-shadow: 0 18px 40px -22px rgba(30, 64, 175, 0.65);
    }

    .round-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 36px -18px rgba(37, 99, 235, 0.55);
    }

    .round-button:focus-visible {
      outline: 3px solid rgba(59, 130, 246, 0.45);
      outline-offset: 3px;
    }

    .controls-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: stretch;
      gap: 12px;
      width: 100%;
      max-width: 520px;
    }

    .controls-group__buttons {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .century-select {
      position: relative;
      display: inline-block;
      flex: 1 1 220px;
      min-width: 220px;
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      padding: 0.8rem 3.25rem 0.8rem 1.1rem;
      border-radius: 14px;
      border: 1px solid rgba(37, 99, 235, 0.35);
      background: linear-gradient(135deg, rgba(219, 234, 254, 0.96), rgba(191, 219, 254, 0.92));
      color: #1e293b;
      font-weight: 600;
      letter-spacing: 0.02em;
      box-shadow: 0 18px 34px -24px rgba(37, 99, 235, 0.55);
      transition: border 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      cursor: pointer;
      background-image: url("data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M6 9l6 6 6-6' stroke='%233256eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 1.1rem center;
      background-size: 18px;
    }

    .century-select option {
      background-color: rgba(219, 234, 254, 0.96);
      color: #1e293b;
    }

    .century-select:disabled {
      cursor: progress;
      opacity: 0.7;
    }

    .century-select:focus,
    .century-select:focus-visible {
      border-color: rgba(37, 99, 235, 0.75);
      box-shadow: 0 18px 34px -20px rgba(37, 99, 235, 0.6), 0 0 0 4px rgba(59, 130, 246, 0.25);
      outline: none;
      transform: translateY(-1px);
    }

    body[data-theme='dark'] .century-select {
      border-color: rgba(96, 165, 250, 0.45);
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(30, 41, 59, 0.86));
      color: #e2e8f0;
      box-shadow: 0 18px 34px -24px rgba(15, 23, 42, 0.85);
      background-image: url("data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M6 9l6 6 6-6' stroke='%2396a5fa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    }

    body[data-theme='dark'] .century-select option {
      background-color: rgba(15, 23, 42, 0.92);
      color: #e2e8f0;
    }

    body[data-theme='dark'] .century-select:focus,
    body[data-theme='dark'] .century-select:focus-visible {
      border-color: rgba(147, 197, 253, 0.8);
      box-shadow: 0 18px 34px -22px rgba(8, 47, 73, 0.85), 0 0 0 4px rgba(96, 165, 250, 0.35);
    }

    .intro-panel {
      background: var(--surface);
      border-radius: 18px;
      border: 1px solid var(--surface-border);
      box-shadow: 0 28px 48px -28px rgba(15, 23, 42, 0.55);
      padding: 28px 32px;
      margin: 28px auto 0;
      max-width: 720px;
      text-align: left;
    }

    .intro-panel__header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .intro-panel__close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      background: var(--surface-muted);
      border: 1px solid var(--surface-border);
      color: var(--text-primary);
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .intro-panel__close:hover,
    .intro-panel__close:focus-visible {
      transform: translateY(-1px);
      outline: none;
      box-shadow: 0 20px 32px -24px rgba(37, 99, 235, 0.35);
    }

    body[data-theme='dark'] .intro-panel__close {
      background: rgba(15, 23, 42, 0.92);
      color: var(--heading-color);
    }

    .intro-heading {
      color: var(--accent-primary-strong);
    }

    .intro-body p {
      color: var(--text-muted);
    }

    .intro-grid {
      display: grid;
      gap: 16px;
      margin-top: 24px;
    }

    @media (min-width: 768px) {
      .intro-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .intro-card {
      background: var(--surface-muted);
      border-radius: 16px;
      border: 1px solid var(--surface-border);
      padding: 20px 22px;
      box-shadow: var(--shadow-soft);
    }

    .intro-card h3 {
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    .intro-card ul {
      color: var(--text-muted);
      margin: 0;
      padding-left: 1.1rem;
      list-style: disc;
      display: grid;
      gap: 0.5rem;
    }

    .timeline-section {
      max-width: 1080px;
      margin: 0 auto;
    }

    .timeline-xmb {
      display: grid;
      gap: 28px;
      padding: 28px;
      background: var(--surface);
      border-radius: 24px;
      border: 1px solid var(--surface-border);
      box-shadow: var(--shadow-soft);
      transition: background 0.3s ease, border 0.3s ease, box-shadow 0.3s ease;
    }

    body[data-theme='dark'] .timeline-xmb {
      background: rgba(15, 23, 42, 0.92);
      border-color: rgba(96, 165, 250, 0.28);
      box-shadow: 0 30px 56px -28px rgba(6, 12, 24, 0.85);
    }

    .timeline-xmb__years {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(180px, 1fr);
      gap: 18px;
      overflow-x: auto;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--surface-border);
      scrollbar-width: thin;
    }

    .timeline-xmb__years::-webkit-scrollbar {
      height: 8px;
    }

    .timeline-xmb__years::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.4);
      border-radius: 9999px;
    }

    body[data-theme='dark'] .timeline-xmb__years::-webkit-scrollbar-thumb {
      background: rgba(96, 165, 250, 0.35);
    }

    .timeline-xmb__year-button {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 18px 16px;
      border-radius: 20px;
      border: 1px solid transparent;
      background: var(--surface-muted);
      color: var(--heading-color);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      min-height: 124px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border 0.2s ease, background 0.2s ease;
      box-shadow: 0 18px 36px -26px rgba(15, 23, 42, 0.55);
    }

    .timeline-xmb__year-button:hover,
    .timeline-xmb__year-button:focus-visible {
      transform: translateY(-3px);
      border-color: rgba(59, 130, 246, 0.45);
      box-shadow: 0 24px 42px -24px rgba(37, 99, 235, 0.45);
      outline: none;
    }

    body[data-theme='dark'] .timeline-xmb__year-button {
      background: rgba(30, 41, 59, 0.85);
      color: var(--heading-color);
      box-shadow: 0 22px 40px -26px rgba(6, 12, 24, 0.8);
    }

    .timeline-xmb__year-button--active {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.12), rgba(37, 99, 235, 0.38));
      border-color: rgba(37, 99, 235, 0.5);
      box-shadow: 0 24px 48px -26px rgba(37, 99, 235, 0.55);
      color: var(--accent-primary-strong);
    }

    body[data-theme='dark'] .timeline-xmb__year-button--active {
      background: linear-gradient(135deg, rgba(96, 165, 250, 0.16), rgba(59, 130, 246, 0.38));
      border-color: rgba(96, 165, 250, 0.55);
      color: var(--accent-primary-strong);
      box-shadow: 0 26px 52px -28px rgba(8, 47, 73, 0.75);
    }

    .timeline-xmb__year-label {
      font-size: 1rem;
      letter-spacing: 0.06em;
    }

    .timeline-xmb__year-count {
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      color: var(--text-soft);
    }

    .timeline-xmb__panel {
      display: grid;
      gap: 20px;
    }

    .timeline-xmb__panel-header {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .timeline-xmb__panel-title {
      margin: 0;
      font-size: 2rem;
      font-weight: 700;
      color: var(--heading-color);
      letter-spacing: -0.01em;
    }

    .timeline-xmb__panel-meta {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.95rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .timeline-xmb__entries {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 14px;
    }

    .timeline-xmb__entry {
      display: block;
    }

    .timeline-xmb__entry-button {
      width: 100%;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 18px;
      padding: 18px 22px;
      border-radius: 20px;
      border: 1px solid rgba(59, 130, 246, 0.18);
      background: var(--surface-muted);
      color: inherit;
      text-align: left;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border 0.2s ease;
      box-shadow: 0 20px 40px -28px rgba(15, 23, 42, 0.55);
    }

    .timeline-xmb__entry-button:hover,
    .timeline-xmb__entry-button:focus-visible {
      transform: translateX(6px);
      border-color: rgba(37, 99, 235, 0.45);
      box-shadow: 0 28px 48px -24px rgba(37, 99, 235, 0.55);
      outline: none;
    }

    body[data-theme='dark'] .timeline-xmb__entry-button {
      background: rgba(15, 23, 42, 0.82);
      border-color: rgba(96, 165, 250, 0.25);
      box-shadow: 0 26px 46px -26px rgba(6, 12, 24, 0.82);
    }

    .timeline-xmb__entry-button--buckler {
      border-color: rgba(16, 185, 129, 0.45);
    }

    .timeline-xmb__entry-button--bp {
      border-color: rgba(248, 113, 113, 0.45);
    }

    .timeline-xmb__entry-button--both {
      border-color: rgba(99, 102, 241, 0.4);
    }

    .timeline-xmb__entry-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      background: var(--surface);
      color: var(--heading-color);
      box-shadow: 0 16px 26px -18px rgba(15, 23, 42, 0.55);
    }

    .timeline-xmb__entry-button--buckler .timeline-xmb__entry-icon {
      background: var(--buckler-surface);
      border: 1px solid var(--buckler-border);
    }

    .timeline-xmb__entry-button--bp .timeline-xmb__entry-icon {
      background: var(--bp-surface);
      border: 1px solid var(--bp-border);
    }

    .timeline-xmb__entry-button--both .timeline-xmb__entry-icon {
      background: var(--shared-surface);
      border: 1px solid var(--shared-border);
    }

    .timeline-xmb__entry-text {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .timeline-xmb__entry-title {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--heading-color);
    }

    .timeline-xmb__entry-summary {
      color: var(--text-muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .timeline-xmb__entry-chevron {
      font-size: 1.8rem;
      font-weight: 500;
      color: var(--accent-primary-strong);
    }

    .timeline-xmb__empty {
      padding: 18px 20px;
      border-radius: 18px;
      background: var(--surface-muted);
      border: 1px solid var(--surface-border);
      color: var(--text-soft);
      text-align: center;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .loading-text {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--modal-backdrop);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--surface);
      padding: 28px 30px;
      border-radius: 18px;
      max-width: 720px;
      width: 100%;
      position: relative;
      box-shadow: var(--shadow-strong);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-content h3 {
      color: var(--heading-color);
    }

    .close-btn {
      position: absolute;
      top: 14px;
      right: 16px;
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
    }

    .close-btn:hover,
    .close-btn:focus-visible {
      color: var(--accent-primary);
    }

    .modal-description {
      color: var(--text-muted);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal-summary-text {
      display: block;
    }

    .modal-learn-more {
      align-self: flex-start;
      padding: 0.55rem 1.2rem;
      border-radius: 9999px;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.18), rgba(37, 99, 235, 0.35));
      border: 1px solid rgba(37, 99, 235, 0.35);
      color: var(--accent-primary-strong);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.75rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .modal-learn-more:hover,
    .modal-learn-more:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 20px 34px -24px rgba(37, 99, 235, 0.45);
      outline: none;
    }

    body[data-theme='dark'] .modal-learn-more {
      background: linear-gradient(135deg, rgba(96, 165, 250, 0.18), rgba(96, 165, 250, 0.35));
      border-color: rgba(96, 165, 250, 0.45);
      color: var(--accent-primary-strong);
    }

    .modal-body {
      margin-top: 20px;
      display: grid;
      gap: 18px;
      color: var(--text-muted);
    }

    .modal-section-heading {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-soft);
      margin-bottom: 8px;
    }

    .modal-context {
      list-style: disc;
      padding-left: 1.2rem;
      margin: 0;
      display: grid;
      gap: 0.35rem;
    }

    .modal-evidence {
      display: grid;
      gap: 14px;
    }

    .modal-evidence-item {
      background: var(--surface-muted);
      border-radius: 14px;
      border: 1px solid var(--surface-border);
      padding: 16px 18px;
    }

    .modal-evidence-item h5 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--heading-color);
      margin-bottom: 6px;
    }

    .modal-evidence-item p {
      margin: 6px 0 0;
      color: var(--text-muted);
    }

    .modal-evidence-meta {
      font-size: 0.85rem;
      color: var(--text-soft);
      margin-top: 8px;
    }

    .modal-evidence-item iframe,
    .modal-evidence-item object {
      width: 100%;
      min-height: 300px;
      border: none;
      border-radius: 12px;
      margin-top: 12px;
    }

    @media (max-width: 960px) {
      .timeline-xmb {
        padding: 22px;
      }

      .timeline-xmb__years {
        grid-auto-columns: minmax(150px, 1fr);
      }

      .timeline-xmb__panel-title {
        font-size: 1.8rem;
      }
    }

    @media (max-width: 760px) {
      .timeline-xmb {
        padding: 18px;
        gap: 22px;
      }

      .timeline-xmb__year-button {
        min-height: 112px;
        padding: 16px 14px;
      }

      .timeline-xmb__entry-button {
        padding: 16px 18px;
        gap: 16px;
      }

      .timeline-xmb__entry-icon {
        width: 46px;
        height: 46px;
        font-size: 1.5rem;
      }
    }

    @media (max-width: 540px) {
      .round-button {
        width: 40px;
        height: 40px;
        font-size: 1.2rem;
      }

      .timeline-xmb {
        padding: 16px;
      }

      .timeline-xmb__years {
        grid-auto-columns: minmax(130px, 1fr);
        gap: 14px;
      }

      .timeline-xmb__year-label {
        font-size: 0.92rem;
      }

      .timeline-xmb__panel-title {
        font-size: 1.5rem;
      }

      .timeline-xmb__entry-button {
        grid-template-columns: auto 1fr;
        padding: 14px 16px;
        gap: 14px;
      }

      .timeline-xmb__entry-chevron {
        display: none;
      }

      .timeline-xmb__entry-summary {
        font-size: 0.88rem;
      }

      .modal-content {
        padding: 24px 22px;
      }
    }
  </style>
</head>
<body class="font-sans" data-theme="light">
  <div class="container mx-auto px-4 py-10">
    <header class="text-center">
      <div class="flex flex-col items-center gap-4">
        <h1 id="case-title" class="text-4xl md:text-5xl font-extrabold tracking-tight page-title">Great House Farm</h1>
        <p id="case-subtitle" class="text-lg md:text-xl max-w-3xl mx-auto page-subtitle">Occupied for centuries by the Williams/ Buckler family.</p>
      </div>
      <div id="timeline-controls" class="mt-8 flex flex-col items-center gap-3">
        <div class="controls-group">
          <div class="controls-group__buttons">
            <button id="theme-toggle" class="round-button" type="button" aria-pressed="false" title="Switch to dark theme">
              <span class="sr-only">Toggle colour theme</span>
              <span aria-hidden="true" data-theme-icon>☀️</span>
            </button>
            <button id="intro-toggle" class="round-button" type="button" aria-expanded="false" aria-controls="intro-panel" title="About this timeline">
              <span aria-hidden="true">ℹ️</span>
              <span class="sr-only">Toggle introduction</span>
            </button>
          </div>
        </div>
      </div>
      <div id="intro-panel" class="intro-panel hidden" aria-hidden="true" tabindex="-1">
        <div class="intro-panel__header">
          <h2 class="text-2xl font-semibold intro-heading">About this timeline</h2>
          <button id="intro-close" class="intro-panel__close" type="button" aria-label="Close introduction">&times;</button>
        </div>
        <div id="case-intro" class="intro-body space-y-4"></div>
        <div id="key-themes" class="intro-grid"></div>
      </div>
    </header>

    <section class="mt-14 timeline-section">
      <div id="timeline-loading" class="text-center loading-text">Loading timeline data…</div>
      <div class="timeline-xmb hidden" id="timeline" aria-live="polite">
        <div class="timeline-xmb__years" id="timeline-year-bar" role="tablist" aria-label="Timeline years"></div>
        <div class="timeline-xmb__panel">
          <div class="timeline-xmb__panel-header">
            <h2 id="timeline-year-title" class="timeline-xmb__panel-title">Select a year</h2>
            <p id="timeline-year-meta" class="timeline-xmb__panel-meta hidden"></p>
          </div>
          <ul id="timeline-year-entries" class="timeline-xmb__entries" role="list"></ul>
        </div>
      </div>
    </section>
  </div>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-content">
      <button class="close-btn" type="button" aria-label="Close event details">&times;</button>
      <h3 id="modal-title" class="text-2xl font-semibold"></h3>
      <p id="modal-source" class="text-sm mt-2 text-slate-500 dark:text-slate-300"></p>
      <p id="modal-description" class="text-base modal-description mt-4"></p>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

    <script src="timeline.js"></script>

</body>
</html>
