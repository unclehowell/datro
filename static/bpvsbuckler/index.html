<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Great House Farm Timeline</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%232563eb%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2242%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%22%20font-size%3D%2232%22%20fill%3D%22%23ffffff%22%3EGH%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="tailwind.css">
  <style>
    :root {
      color-scheme: light;
      --page-background: #f3f4f6;
      --surface: rgba(255, 255, 255, 0.94);
      --surface-muted: rgba(255, 255, 255, 0.82);
      --surface-border: rgba(59, 130, 246, 0.16);
      --heading-color: #0f172a;
      --text-primary: #1f2937;
      --text-muted: rgba(17, 24, 39, 0.75);
      --text-soft: rgba(17, 24, 39, 0.6);
      --accent-primary: #2563eb;
      --accent-primary-strong: #1e3a8a;
      --accent-muted: rgba(59, 130, 246, 0.18);
      --buckler-surface: linear-gradient(135deg, #d1fae5, #ecfdf5);
      --buckler-border: #10b981;
      --bp-surface: linear-gradient(135deg, #fee2e2, #fff1f2);
      --bp-border: #ef4444;
      --shared-surface: linear-gradient(135deg, #e0e7ff, #eef2ff);
      --shared-border: #4338ca;
      --shadow-soft: 0 22px 36px -24px rgba(15, 23, 42, 0.55);
      --shadow-strong: 0 30px 52px -32px rgba(15, 23, 42, 0.65);
      --modal-backdrop: rgba(15, 23, 42, 0.55);
      --axis-column-width: 150px;
      --entry-gap: 32px;
      --bubble-size: 60px;
      --year-scale: 7px;
      --timeline-row-height: 184px;
    }

    body[data-theme='dark'] {
      color-scheme: dark;
      --page-background: #000000;
      --text-primary: #f8fafc;
      --text-muted: rgba(226, 232, 240, 0.6);
      --accent: #38bdf8;
      --row-history-height: clamp(92px, 15vh, 132px);
      --row-spacer-height: clamp(18px, 4vh, 28px);
      --entry-row-height: clamp(92px, 16vh, 138px);
      --entry-gap: clamp(12px, 3vh, 20px);
      --horizontal-band-height: var(--row-history-height);
      --horizontal-padding: clamp(48px, 7vw, 96px);
      --horizontal-padding-right: clamp(48px, 8vw, 120px);
      --horizontal-gap: clamp(18px, 2.6vw, 28px);
      --horizontal-icon: clamp(18px, 4.6vw, 30px);
      --vertical-gap: clamp(12px, 4vh, 20px);
      --fade-width: 20%;
      --icon-size-small: clamp(16px, 3.8vw, 26px);
      --visible-columns: 8;
      --focus-column-index: 2;
      --horizontal-top: calc(var(--row-history-height) * 2);
      --year-slot-width: calc(
        (
          100vw - var(--horizontal-padding) - var(--horizontal-padding-right) -
          var(--horizontal-gap) * (var(--visible-columns) - 1)
        ) / var(--visible-columns)
      );
      --focus-offset-width: calc(
        (var(--year-slot-width) + var(--horizontal-gap)) * var(--focus-column-index)
      );
      --horizontal-trailing-space: calc((var(--year-slot-width) + var(--horizontal-gap)) * 3);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--page-background);
      color: var(--text-primary);
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .is-hidden {
      display: none !important;
    }

    .xmb-shell {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--page-background);
      isolation: isolate;
    }

    .xmb-stage {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }

    .xmb-vertical {
      position: absolute;
      left: calc(var(--horizontal-padding) + var(--focus-offset-width));
      right: clamp(40px, 22vw, 420px);
      top: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      z-index: 2;
    }

    .xmb-vertical__viewport {
      width: min(420px, 36vw);
      max-width: 420px;
      height: 100%;
      overflow: visible;
      position: relative;
    }

    .xmb-vertical__list {
      position: relative;
      width: 100%;
      min-height: calc(
        var(--row-history-height) * 2 + var(--horizontal-band-height) +
        var(--row-spacer-height) + var(--entry-row-height) * 2 + var(--entry-gap)
      );
      padding-left: clamp(2px, 1vw, 12px);
      padding-right: clamp(12px, 2vw, 24px);
      padding-bottom: clamp(36px, 8vh, 64px);
    }

    .xmb-entry {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      gap: clamp(10px, 2vw, 18px);
      min-width: clamp(200px, 32vw, 260px);
      max-width: clamp(260px, 44vw, 340px);
      padding: clamp(10px, 2vh, 14px) clamp(10px, 2vw, 18px);
      color: var(--text-primary);
      text-align: left;
      height: var(--entry-row-height);
      transform: translateY(var(--entry-offset, 0px));
      transition: transform 0.45s cubic-bezier(0.33, 1, 0.68, 1),
        opacity 0.35s ease;
      pointer-events: auto;
    }

    .xmb-entry__icon {
      width: var(--icon-size-small);
      height: var(--icon-size-small);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: calc(var(--icon-size-small) * 0.62);
      line-height: 1;
      background: radial-gradient(circle at 30% 30%, rgba(56, 189, 248, 0.55), rgba(56, 189, 248, 0.08) 65%, rgba(15, 23, 42, 0));
      box-shadow: 0 16px 36px rgba(2, 6, 23, 0.55);
      flex-shrink: 0;
    }

    .xmb-entry__copy {
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 1vh, 8px);
      text-transform: uppercase;
      font-size: clamp(0.75rem, 1.6vw, 0.9rem);
      letter-spacing: 0.08em;
      align-items: flex-start;
      text-align: left;
    }

    .xmb-entry__title {
      font-weight: 700;
      color: var(--text-primary);
      font-size: clamp(0.85rem, 2vw, 1rem);
    }

    .xmb-entry__subtitle {
      color: var(--text-muted);
      font-size: clamp(0.62rem, 1.4vw, 0.82rem);
      letter-spacing: 0.06em;
    }

    .xmb-entry.is-active {
      opacity: 1;
    }

    .xmb-entry.is-active .xmb-entry__title {
      animation: xmbTitlePulse 1.4s ease-in-out infinite alternate;
    }

    .xmb-entry.is-active .xmb-entry__icon {
      opacity: 1;
    }

    .xmb-entry.is-before {
      opacity: 0.88;
    }

    .xmb-entry.is-history-slot-1,
    .xmb-entry.is-history-slot-2 {
      pointer-events: auto;
    }

    .xmb-entry.is-history-slot-1 {
      opacity: 0.88;
    }

    .xmb-entry.is-history-slot-2 {
      opacity: 0.8;
    }

    .xmb-entry.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .xmb-entry:not(.is-active):not(.is-history-slot-1):not(.is-history-slot-2) .xmb-entry__icon {
      opacity: 0.6;
    }

    .xmb-entry:not(.is-active) .xmb-entry__title,
    .xmb-entry:not(.is-active) .xmb-entry__subtitle {
      opacity: 0.75;
    }

    .xmb-entry:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    .xmb-horizontal {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--horizontal-top);
      bottom: auto;
      height: var(--horizontal-band-height);
      display: flex;
      align-items: flex-end;
      padding-bottom: clamp(20px, 5vh, 32px);
      background: transparent;
      z-index: 4;
    }

    .xmb-horizontal__viewport {
      flex: 1;
      overflow: hidden;
      padding-left: var(--horizontal-padding);
      padding-right: var(--horizontal-padding-right);
      position: relative;
    }

    .xmb-entry:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    .xmb-horizontal {
      position: absolute;
      left: 0;
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--axis-column-width) minmax(0, 1fr);
      column-gap: var(--entry-gap);
      align-items: center;
      height: var(--timeline-row-height);
      top: calc(var(--entry-row-index, 0) * var(--timeline-row-height));
      z-index: 2;
      --connector-length: calc(var(--entry-gap) + var(--axis-column-width) / 2);
    }

    .timeline-entry__column {
      display: flex;
      align-items: flex-end;
      gap: var(--horizontal-gap);
      transform: translateX(0);
      transition: transform 0.45s cubic-bezier(0.33, 1, 0.68, 1);
      will-change: transform;
      padding-right: var(--horizontal-trailing-space);
    }

    .xmb-year {
      position: relative;
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      gap: clamp(12px, 1.8vw, 18px);
      min-width: var(--year-slot-width);
      flex: 0 0 var(--year-slot-width);
      padding: clamp(6px, 1.4vh, 10px) 0;
      background: transparent;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      transform: translateY(0) scale(1);
      transition: transform 0.4s cubic-bezier(0.33, 1, 0.68, 1),
        color 0.35s ease;
      opacity: 0.9;
    }

    .xmb-year__icon {
      width: var(--horizontal-icon);
      height: var(--horizontal-icon);
      border-radius: 50%;
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      font-size: calc(var(--horizontal-icon) * 0.68);
      background: radial-gradient(circle at 35% 35%, rgba(56, 189, 248, 0.65), rgba(56, 189, 248, 0.08) 70%, rgba(15, 23, 42, 0));
      box-shadow: 0 20px 42px rgba(2, 6, 23, 0.6);
    }

    .xmb-year:not(.is-active) .xmb-year__icon {
      opacity: 0.9;
    }

    .xmb-year.is-active .xmb-year__icon {
      opacity: 1;
    }

    .xmb-year__label {
      font-weight: 700;
      font-size: clamp(0.85rem, 1.6vw, 1.05rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .xmb-year.is-active {
      transform: translateY(-12px) scale(1.12);
      color: #ffffff;
      opacity: 1;
    }

    .xmb-year:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 5px;
    }

    .xmb-horizontal__fade {
      position: absolute;
      top: clamp(12px, 3vh, 24px);
      bottom: clamp(12px, 3vh, 24px);
      right: 0;
      width: var(--fade-width);
      background: linear-gradient(90deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.9) 90%);
      pointer-events: none;
      z-index: 4;
    }

    .xmb-year-placeholder {
      flex: 0 0 var(--year-slot-width);
      min-width: var(--year-slot-width);
      height: var(--horizontal-icon);
      pointer-events: none;
      opacity: 0;
    }

    .xmb-loading {
      position: fixed;
      top: 18px;
      right: 18px;
      padding: 0.65rem 1.2rem;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--text-muted);
      font-size: 0.95rem;
      box-shadow: 0 18px 48px rgba(2, 6, 23, 0.6);
      z-index: 5;
    }

    .xmb-loading.is-hidden {
      display: none;
    }

    @media (max-width: 960px) {
      :root {
        --axis-column-width: 120px;
        --entry-gap: 24px;
        --timeline-row-height: 176px;
      }
      100% {
        text-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
      }
    }

    @media (max-width: 900px) {
      :root {
        --axis-column-width: 100px;
        --entry-gap: 18px;
        --bubble-size: 54px;
        --timeline-row-height: 168px;
      }

      .timeline {
        padding-left: 12px;
        padding-right: 12px;
      }

      .timeline-entry {
        column-gap: 14px;
      }

      .xmb-vertical {
        left: clamp(24px, 10vw, 40px);
        right: clamp(20px, 18vw, 60px);
      }
    }

      .xmb-vertical__viewport {
        width: 100%;
        height: 100%;
      }

      .xmb-year__label {
        font-size: clamp(0.95rem, 4vw, 1.2rem);
      }
    }

    /* Layout overrides to support the static deployment */
    html,
    body {
      overflow: auto;
    }

    .xmb-stage {
      overflow: visible;
      display: flex;
      justify-content: center;
      padding: clamp(48px, 8vw, 96px) clamp(24px, 6vw, 72px)
        clamp(72px, 10vw, 120px);
    }

    .xmb-vertical {
      position: relative;
      left: auto;
      right: auto;
      top: auto;
      bottom: auto;
      width: 100%;
      max-width: 1120px;
    }

    .xmb-vertical__viewport {
      width: 100%;
      max-width: none;
      height: auto;
      overflow: visible;
    }

    .xmb-vertical__list {
      position: relative;
      min-height: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: clamp(1.5rem, 3vw, 2.5rem);
    }

    .xmb-entry {
      position: relative;
      min-width: 100%;
      max-width: none;
      height: auto;
      transform: none !important;
      background: var(--surface);
      border-radius: 24px;
      border: 1px solid var(--surface-border);
      box-shadow: var(--shadow-soft);
      padding: clamp(1rem, 2.4vw, 1.6rem);
      display: grid;
      grid-template-columns: auto 1fr;
      gap: clamp(0.9rem, 2vw, 1.4rem);
      transition: box-shadow 0.3s ease, background 0.3s ease;
    }

    .xmb-entry[data-side='buckler'] {
      background: var(--buckler-surface);
      border-left: 6px solid var(--buckler-border);
    }

    .xmb-entry[data-side='bp'] {
      background: var(--bp-surface);
      border-left: 6px solid var(--bp-border);
    }

    .xmb-entry[data-side='shared'],
    .xmb-entry[data-side='both'],
    .xmb-entry[data-side='either'] {
      background: var(--shared-surface);
      border-left: 6px solid var(--shared-border);
    }

    .xmb-entry.is-active {
      box-shadow: var(--shadow-strong);
    }

    .xmb-entry__icon {
      width: clamp(3rem, 6vw, 3.75rem);
      height: clamp(3rem, 6vw, 3.75rem);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.4rem, 3vw, 2rem);
      background: rgba(15, 23, 42, 0.12);
      box-shadow: none;
    }

    .xmb-entry__copy {
      text-transform: none;
      letter-spacing: 0;
      gap: clamp(0.35rem, 1.2vw, 0.75rem);
    }

    .xmb-entry__title {
      font-size: clamp(1.05rem, 2.4vw, 1.4rem);
      letter-spacing: 0;
    }

    .xmb-entry__subtitle {
      font-size: clamp(0.85rem, 1.8vw, 1rem);
      color: var(--text-muted);
      letter-spacing: 0;
    }

    .xmb-entry__body {
      display: flex;
      flex-direction: column;
      gap: clamp(0.65rem, 1.5vw, 0.9rem);
      color: var(--text-soft);
      font-size: clamp(0.85rem, 1.8vw, 1rem);
      line-height: 1.6;
    }

    .xmb-entry__body ul {
      margin: 0;
      padding-left: 1.1em;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .xmb-entry__body li strong {
      display: block;
      font-weight: 600;
      color: var(--text-primary);
    }

    .xmb-entry details {
      background: rgba(15, 23, 42, 0.04);
      border-radius: 16px;
      padding: clamp(0.65rem, 1.4vw, 0.9rem)
        clamp(0.75rem, 1.8vw, 1.1rem);
    }

    .xmb-entry summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--heading-color);
      list-style: none;
    }

    .xmb-entry summary::-webkit-details-marker {
      display: none;
    }

    .xmb-entry summary::before {
      content: '▸';
      display: inline-block;
      margin-right: 0.5rem;
      transition: transform 0.2s ease;
    }

    .xmb-entry details[open] summary::before {
      transform: rotate(90deg);
    }

    .xmb-horizontal {
      position: sticky;
      top: 0;
      padding: clamp(1.1rem, 3vw, 1.8rem) clamp(1.5rem, 5vw, 5rem);
      margin: 0 auto;
      backdrop-filter: blur(12px);
      box-shadow: inset 0 -1px 0 rgba(15, 23, 42, 0.08);
      z-index: 10;
    }

    .xmb-horizontal__viewport {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0;
      scrollbar-width: thin;
    }

    .xmb-horizontal__track {
      display: inline-flex;
      gap: clamp(0.75rem, 1.5vw, 1.1rem);
      padding-bottom: 0.25rem;
    }

    .xmb-year {
      min-width: auto;
      flex: none;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      border: 1px solid rgba(59, 130, 246, 0.25);
      gap: 0.6rem;
      transform: none;
      font-weight: 600;
      letter-spacing: 0.08em;
      transition: background 0.3s ease, color 0.3s ease,
        border-color 0.3s ease;
    }

    .xmb-year__icon {
      width: 2.2rem;
      height: 2.2rem;
      font-size: 1.1rem;
      background: rgba(59, 130, 246, 0.18);
      box-shadow: none;
    }

    .xmb-year__label {
      white-space: nowrap;
      font-size: 0.95rem;
    }

    .xmb-year__subtitle {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.75;
    }

    .xmb-year.is-active {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: #ffffff;
    }

    .xmb-year:focus-visible {
      outline-offset: 3px;
    }

    .xmb-horizontal__fade {
      display: none;
    }

    .xmb-loading {
      top: 1rem;
      right: 1rem;
    }

    .xmb-century-header {
      background: var(--surface-muted);
      border-left: 6px solid var(--accent-primary);
      border-radius: 20px;
      padding: clamp(1rem, 2vw, 1.4rem) clamp(1.2rem, 3vw, 1.8rem);
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .xmb-century-header__title {
      margin: 0;
      font-size: clamp(1.25rem, 3vw, 1.6rem);
      font-weight: 700;
      color: var(--heading-color);
    }

    .xmb-century-header__range {
      margin: 0;
      font-size: clamp(0.95rem, 2vw, 1.15rem);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    @media (max-width: 768px) {
      .xmb-stage {
        padding: clamp(36px, 10vw, 56px) clamp(18px, 5vw, 32px)
          clamp(80px, 12vw, 120px);
      }

      .xmb-horizontal {
        padding-left: clamp(1rem, 6vw, 2rem);
        padding-right: clamp(1rem, 6vw, 2rem);
      }

      .xmb-entry {
        grid-template-columns: minmax(0, 1fr);
      }

      .xmb-entry__icon {
        justify-self: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="xmb-shell">
    <main class="xmb-stage">
      <section class="xmb-vertical" aria-label="Timeline entries">
        <div class="xmb-vertical__viewport" id="timeline-entry-viewport">
          <div class="xmb-vertical__list" id="timeline-year-entries"></div>
        </div>
      </section>
    </main>

    <nav class="xmb-horizontal" aria-label="Timeline years">
      <div class="xmb-horizontal__viewport" id="year-bar-viewport">
        <div class="xmb-horizontal__track" id="timeline-year-track" role="listbox" aria-label="Timeline years"></div>
        <div class="xmb-horizontal__fade" aria-hidden="true"></div>
      </div>
    </nav>

    <div id="timeline-loading" class="xmb-loading">Loading timeline…</div>
  </div>

  <script src="timeline.js"></script>
</body>
</html>
