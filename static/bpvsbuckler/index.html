<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <!-- Preloader -->
  <div id="preloader">
    <div class="spinner"></div>
    <div class="preload-text">Loading Great House Farm&hellip;</div>
  </div>

  <!-- Splash Overlay -->
  <div id="splash-overlay">
    <div class="splash-panel" style="display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;box-sizing:border-box;">
    </div>
  </div>

  <!-- Character Bubble -->
  <div id="character-bubble"></div>

  <!-- App Root -->
  <div id="app-root">
    <!-- Header -->
    <header id="header">
      <div style="display:flex;justify-content:space-between;align-items:center;width:100%;padding-bottom:0.75rem;">
        <div></div>
        <div id="header-center" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);">
          <div class="header-brand" data-switch="timeline">Great House Farm</div>
        </div>
        <div style="display:flex;align-items:center;gap:1rem;">
          <button id="mobile-menu-btn" aria-label="Menu">
            <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/></svg>
          </button>
        </div>
      </div>

      <nav id="nav-desktop">
        <button class="view-nav-btn active-home" data-view="timeline">Home</button>
        <button class="view-nav-btn" data-view="script">Script</button>
      </nav>
    </header>

    <!-- Mobile Menu -->
    <div id="mobile-menu-overlay"></div>
    <nav id="mobile-menu">
      <button class="close-btn">✕</button>
      <button class="mobile-nav-btn" data-mobile-view="timeline">Home</button>
      <button class="mobile-nav-btn" data-mobile-view="script">Script</button>
    </nav>

    <!-- Main Content -->
    <div id="main">
      <!-- Timeline View -->
      <div id="timeline-view">
        <div id="scene-display" class="no-scrollbar">
          <div id="narration-area">
            <div id="narration-label">NARRATION</div>
            <div id="narration-text"></div>
          </div>
        </div>

        <div id="slide-counter">1 / 100</div>

        <div id="gallery-btn">
          <div class="gallery-trigger">
            <div class="gallery-icons">
              <span class="gallery-icon">📄</span>
              <span class="gallery-icon">🖼️</span>
              <span class="gallery-icon">📰</span>
              <span class="gallery-icon">📧</span>
              <span class="gallery-icon">📝</span>
            </div>
          </div>
        </div>

        <!-- Nav Arrows -->
        <button class="nav-arrow left" id="prev-scene-btn">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="nav-arrow right" id="next-scene-btn">
          <svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
        </button>

        <!-- Timeline Controls -->
        <div id="timeline-controls">
          <div id="scrubber-area">
            <div id="scrubber-bar">
              <div id="scrubber-progress"></div>
              <div id="scrubber-handle"></div>
            </div>
            <div class="scrubber-tooltip" style="left:0%">Slide 1: 1100</div>
          </div>
          <div id="controls-bar">
            <button class="ctrl-btn" id="prev-scene-btn-inner" title="Previous">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <button class="play-btn" id="play-btn" title="Play/Pause">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="ctrl-btn" id="next-scene-btn-inner" title="Next">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
            </button>
            <button class="ctrl-btn" id="voice-toggle-btn" title="Toggle Voice">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
            </button>
            <div class="voice-slider-container">
              <span class="voice-slider-label desktop-label">Voice</span>
              <span class="voice-slider-label mobile-label">V</span>
              <input type="range" id="voice-slider" min="0" max="1" step="0.01" value="0.5">
            </div>
            <button class="ctrl-btn" id="minimize-btn" title="Minimize/Restore">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Script View -->
      <div id="script-view" class="view-page">
        <div class="view-toolbar">
          <div class="view-toolbar-left">
            <span class="view-brand">Great House Farm</span>
          </div>
          <div class="view-toolbar-right">
            <button class="view-toolbar-btn" data-switch="timeline">Home</button>
            <a class="view-toolbar-btn primary" href="#" id="download-script-btn">Download Script</a>
          </div>
        </div>
        <div class="puck-content" id="script-content"></div>
      </div>
    </div>

    <!-- Footer -->
    <footer id="footer">

        <span id="version-display" style="font-size:0.95rem;">Version: <span id="deployed-version">0.8</span></span>
        <span id="update-notice">Update available: <span id="latest-version">&mdash;</span></span>

  <!-- Archive Modal -->

          <div class="archive-title" id="archive-modal-title"></div>
        </div>
        <button id="archive-modal-close" style="background:none;border:none;color:#94a3b8;font-size:1.25rem;cursor:pointer;">✕</button>
      </div>

    </div>
  </div>

  <!-- Source Modal -->
  <div id="source-modal">
    <div class="source-panel">
      <button id="source-modal-close" style="position:absolute;top:1rem;right:1rem;background:none;border:none;color:#94a3b8;font-size:1.25rem;cursor:pointer;">✕</button>

      <button id="btc-close-btn" style="background:transparent;color:#94a3b8;border:1px solid #475569;border-radius:0.5rem;padding:0.5rem 1.5rem;cursor:pointer;margin-left:0.5rem;">Close</button>

  <script src="js/main.js"></script>
