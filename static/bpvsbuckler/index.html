<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Great House Farm Timeline</title>
  <link rel="stylesheet" href="tailwind.css">
  <style>
    :root {
      color-scheme: dark;
      --page-background: #04070c;
      --surface: rgba(12, 18, 32, 0.82);
      --surface-strong: rgba(20, 30, 48, 0.94);
      --surface-border: rgba(148, 163, 184, 0.18);
      --text-primary: #e2e8f0;
      --text-muted: rgba(148, 163, 184, 0.75);
      --accent: #38bdf8;
      --horizontal-band-height: clamp(220px, 34vh, 320px);
      --horizontal-padding: clamp(40px, 8vw, 128px);
      --horizontal-gap: clamp(36px, 8vw, 72px);
      --horizontal-icon: clamp(48px, 10vw, 96px);
      --vertical-gap: clamp(18px, 4vh, 32px);
      --vertical-icon: clamp(40px, 7vw, 68px);
      --fade-width: 20%;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--page-background);
      color: var(--text-primary);
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .is-hidden {
      display: none !important;
    }

    .xmb-shell {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--page-background);
      isolation: isolate;
    }

    .xmb-stage {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }

    .xmb-vertical {
      position: absolute;
      left: var(--horizontal-padding);
      right: calc(var(--horizontal-padding) + var(--horizontal-gap));
      bottom: calc(var(--horizontal-band-height) + clamp(18px, 4vh, 36px));
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      z-index: 1;
    }

    .xmb-vertical__viewport {
      width: min(480px, 46vw);
      max-width: 520px;
      height: clamp(200px, 32vh, 300px);
      overflow: hidden;
    }

    .xmb-vertical__list {
      display: flex;
      flex-direction: column;
      gap: var(--vertical-gap);
      transform: translateY(0);
      transition: transform 0.45s cubic-bezier(0.33, 1, 0.68, 1);
    }

    .xmb-entry {
      display: flex;
      align-items: center;
      gap: clamp(14px, 3vw, 28px);
      padding: clamp(16px, 3vw, 28px) clamp(20px, 4vw, 32px);
      background: var(--surface);
      border-radius: clamp(22px, 6vw, 32px);
      border: 1px solid transparent;
      color: var(--text-primary);
      filter: drop-shadow(0 24px 45px rgba(2, 6, 23, 0.55));
      opacity: 0.65;
      transform: scale(0.96);
      transition: transform 0.35s cubic-bezier(0.33, 1, 0.68, 1),
        opacity 0.35s ease,
        border-color 0.35s ease,
        background 0.35s ease;
      pointer-events: auto;
    }

    .xmb-entry__icon {
      font-size: var(--vertical-icon);
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1em;
    }

    .xmb-entry__copy {
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 1vh, 8px);
      text-transform: none;
      font-size: clamp(0.85rem, 2vw, 1rem);
    }

    .xmb-entry__title {
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-primary);
      font-size: clamp(0.9rem, 2.2vw, 1.05rem);
    }

    .xmb-entry__subtitle {
      color: var(--text-muted);
      font-size: clamp(0.75rem, 1.8vw, 0.9rem);
      letter-spacing: 0.04em;
    }

    .xmb-entry.is-active {
      opacity: 1;
      background: var(--surface-strong);
      border-color: rgba(56, 189, 248, 0.35);
      transform: scale(1.02);
    }

    .xmb-entry:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    .xmb-horizontal {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--horizontal-band-height);
      display: flex;
      align-items: flex-end;
      padding-bottom: clamp(32px, 6vh, 52px);
      background: transparent;
      z-index: 2;
    }

    .xmb-horizontal__viewport {
      flex: 1;
      overflow: hidden;
      padding-left: var(--horizontal-padding);
      padding-right: clamp(32px, 6vw, 64px);
      position: relative;
    }

    .xmb-horizontal__track {
      display: flex;
      align-items: center;
      gap: var(--horizontal-gap);
      transform: translateX(0);
      transition: transform 0.45s cubic-bezier(0.33, 1, 0.68, 1);
      will-change: transform;
    }

    .xmb-year {
      display: flex;
      align-items: center;
      gap: clamp(16px, 3vw, 32px);
      padding: clamp(18px, 4vw, 32px) clamp(24px, 6vw, 40px);
      border-radius: clamp(26px, 7vw, 40px);
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text-primary);
      cursor: pointer;
      filter: drop-shadow(0 26px 48px rgba(2, 6, 23, 0.52));
      transform: translateY(0) scale(1);
      transition: transform 0.4s cubic-bezier(0.33, 1, 0.68, 1),
        border-color 0.35s ease,
        background 0.35s ease,
        color 0.35s ease;
      min-width: clamp(200px, 28vw, 280px);
    }

    .xmb-year__icon {
      font-size: var(--horizontal-icon);
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1em;
    }

    .xmb-year__copy {
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 1vh, 10px);
      text-align: left;
    }

    .xmb-year__title {
      font-weight: 700;
      font-size: clamp(1rem, 2.6vw, 1.35rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-primary);
    }

    .xmb-year__subtitle {
      font-size: clamp(0.8rem, 2vw, 0.95rem);
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .xmb-year.is-active {
      transform: translateY(-12px) scale(1.12);
      background: var(--surface-strong);
      border-color: rgba(56, 189, 248, 0.4);
      color: #f8fafc;
    }

    .xmb-year:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 5px;
    }

    .xmb-horizontal__fade {
      position: absolute;
      top: clamp(12px, 3vh, 24px);
      bottom: clamp(12px, 3vh, 24px);
      right: 0;
      width: var(--fade-width);
      background: linear-gradient(90deg, rgba(4, 7, 12, 0) 0%, rgba(4, 7, 12, 0.95) 90%);
      pointer-events: none;
      z-index: 3;
    }

    .xmb-loading {
      position: fixed;
      top: 18px;
      right: 18px;
      padding: 0.65rem 1.2rem;
      background: var(--surface-strong);
      border-radius: 999px;
      border: 1px solid var(--surface-border);
      color: var(--text-muted);
      font-size: 0.95rem;
      box-shadow: 0 18px 48px rgba(2, 6, 23, 0.45);
      z-index: 4;
    }

    .xmb-loading.is-hidden {
      display: none;
    }

    @media (max-width: 900px) {
      :root {
        --horizontal-band-height: clamp(220px, 42vh, 320px);
        --horizontal-padding: clamp(28px, 8vw, 72px);
        --horizontal-gap: clamp(28px, 10vw, 48px);
        --horizontal-icon: clamp(48px, 14vw, 72px);
        --vertical-gap: clamp(14px, 4vh, 24px);
        --vertical-icon: clamp(36px, 10vw, 58px);
      }

      .xmb-vertical__viewport {
        width: min(420px, 80vw);
      }

      .xmb-year {
        min-width: clamp(160px, 44vw, 220px);
      }
    }

    @media (max-width: 640px) {
      html, body {
        overflow: hidden;
      }

      .xmb-horizontal {
        padding-bottom: clamp(24px, 8vh, 40px);
      }

      .xmb-vertical {
        left: clamp(20px, 8vw, 32px);
        right: clamp(20px, 12vw, 40px);
      }

      .xmb-vertical__viewport {
        width: 100%;
        height: clamp(220px, 44vh, 320px);
      }

      .xmb-year__title {
        font-size: clamp(0.95rem, 4vw, 1.2rem);
      }
    }
  </style>
</head>
<body>
  <div class="xmb-shell">
    <main class="xmb-stage">
      <section class="xmb-vertical" aria-label="Timeline entries">
        <div class="xmb-vertical__viewport" id="timeline-entry-viewport">
          <div class="xmb-vertical__list" id="timeline-year-entries"></div>
        </div>
      </section>
    </main>

    <nav class="xmb-horizontal" aria-label="Timeline years">
      <div class="xmb-horizontal__viewport" id="year-bar-viewport">
        <div class="xmb-horizontal__track" id="timeline-year-track" role="listbox" aria-label="Timeline years"></div>
        <div class="xmb-horizontal__fade" aria-hidden="true"></div>
      </div>
    </nav>

    <div id="timeline-loading" class="xmb-loading">Loading timeline…</div>
  </div>

  <script src="timeline.js"></script>
</body>
</html>
