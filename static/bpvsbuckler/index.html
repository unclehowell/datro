<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Great House Farm Timeline</title>
  <link rel="stylesheet" href="tailwind.css">
  <style>
    :root {
      color-scheme: light;
      --page-background: #f3f4f6;
      --surface: rgba(255, 255, 255, 0.94);
      --surface-muted: rgba(255, 255, 255, 0.82);
      --surface-border: rgba(59, 130, 246, 0.16);
      --heading-color: #0f172a;
      --text-primary: #1f2937;
      --text-muted: rgba(17, 24, 39, 0.72);
      --text-soft: rgba(17, 24, 39, 0.58);
      --accent-primary: #2563eb;
      --accent-primary-strong: #1e3a8a;
      --accent-muted: rgba(59, 130, 246, 0.18);
      --buckler-surface: linear-gradient(135deg, #d1fae5, #ecfdf5);
      --buckler-border: rgba(16, 185, 129, 0.45);
      --bp-surface: linear-gradient(135deg, #fee2e2, #fff1f2);
      --bp-border: rgba(239, 68, 68, 0.45);
      --shared-surface: linear-gradient(135deg, #e0e7ff, #eef2ff);
      --shared-border: rgba(67, 56, 202, 0.45);
      --shadow-soft: 0 22px 36px -24px rgba(15, 23, 42, 0.45);
      --shadow-strong: 0 32px 52px -24px rgba(15, 23, 42, 0.55);
      --axis-width: 4px;
      --axis-highlight: rgba(37, 99, 235, 0.85);
      --axis-fade: rgba(14, 165, 233, 0.18);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--page-background);
      color: var(--text-primary);
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .is-hidden {
      display: none !important;
    }

    .xmb-shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: var(--page-background);
      padding: clamp(32px, 6vh, 72px) clamp(32px, 6vw, 80px);
      gap: clamp(24px, 4vh, 36px);
    }

    .timeline-layout {
      flex: 1;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      justify-content: center;
      gap: clamp(24px, 5vw, 64px);
      position: relative;
      min-height: 0;
    }

    .timeline-nav {
      width: clamp(200px, 22vw, 280px);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      position: relative;
      z-index: 3;
    }

    .timeline-nav__viewport {
      flex: 1;
      max-height: calc(100vh - clamp(160px, 20vh, 240px));
      overflow-y: auto;
      padding-right: clamp(4px, 1vw, 12px);
      margin-right: clamp(2px, 0.6vw, 8px);
      scroll-behavior: smooth;
    }

    .timeline-nav__track {
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 2vh, 20px);
    }

    .xmb-year {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: clamp(10px, 1.8vw, 18px);
      border: 1px solid transparent;
      border-radius: 18px;
      padding: clamp(12px, 1.8vh, 18px) clamp(14px, 2vw, 22px);
      background: var(--surface);
      color: var(--text-primary);
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease, color 0.3s ease;
      text-align: left;
    }

    .xmb-year__icon {
      font-size: clamp(1.2rem, 2.2vw, 1.5rem);
      filter: drop-shadow(0 10px 18px rgba(15, 23, 42, 0.25));
    }

    .xmb-year__label {
      font-weight: 700;
      font-size: clamp(0.95rem, 1.8vw, 1.15rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .xmb-year.is-active {
      background: var(--accent-primary);
      color: #ffffff;
      transform: translateX(12px);
      box-shadow: var(--shadow-strong);
    }

    .xmb-year:focus-visible {
      outline: 3px solid var(--accent-primary-strong);
      outline-offset: 4px;
    }

    .timeline-stage {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(24px, 6vh, 56px) 0;
      overflow: hidden;
    }

    .timeline-stage::before {
      content: "";
      position: absolute;
      top: clamp(12px, 6vh, 48px);
      bottom: clamp(12px, 6vh, 48px);
      left: 50%;
      width: var(--axis-width);
      transform: translateX(-50%);
      background: linear-gradient(180deg, var(--axis-highlight) 0%, var(--axis-fade) 100%);
      border-radius: 999px;
      z-index: 1;
      opacity: 0.9;
    }

    .timeline-stage__viewport {
      position: relative;
      z-index: 2;
      width: 100%;
      overflow-x: auto;
      overflow-y: visible;
      scroll-snap-type: x proximity;
      padding: clamp(16px, 4vh, 32px) 0;
      display: flex;
      justify-content: center;
    }

    .timeline-stage__viewport::-webkit-scrollbar {
      height: 10px;
    }

    .timeline-stage__viewport::-webkit-scrollbar-thumb {
      background: rgba(15, 23, 42, 0.25);
      border-radius: 999px;
    }

    .timeline-stage__list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(24px, 5vh, 40px);
      min-width: min(100%, 960px);
    }

    .timeline-year-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 2vh, 16px);
      align-items: center;
    }

    .timeline-year-header__icon {
      width: clamp(60px, 8vw, 90px);
      height: clamp(60px, 8vw, 90px);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(37, 99, 235, 0.08);
      box-shadow: 0 18px 34px rgba(15, 23, 42, 0.12);
      font-size: clamp(1.8rem, 3.5vw, 2.4rem);
    }

    .timeline-year-header__year {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--heading-color);
    }

    .timeline-year-header__subtitle {
      color: var(--text-muted);
      font-size: clamp(0.85rem, 1.4vw, 1rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .timeline-empty {
      font-size: 1rem;
      color: var(--text-muted);
      text-align: center;
      max-width: 520px;
      margin: clamp(16px, 4vh, 28px) auto 0;
    }

    .timeline-card-row {
      display: flex;
      flex-direction: row;
      gap: clamp(18px, 4vw, 36px);
      justify-content: center;
      align-items: stretch;
      flex-wrap: nowrap;
      min-width: 100%;
    }

    .timeline-card {
      flex: 0 0 clamp(240px, 24vw, 320px);
      border-radius: 24px;
      padding: clamp(18px, 3vh, 26px);
      border: 1px solid var(--surface-border);
      box-shadow: var(--shadow-soft);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 2vh, 18px);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      scroll-snap-align: center;
    }

    .timeline-card:focus-visible {
      outline: 3px solid var(--accent-primary);
      outline-offset: 4px;
    }

    .timeline-card.is-active {
      transform: translateY(-10px);
      box-shadow: var(--shadow-strong);
    }

    .timeline-card__side {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--text-soft);
    }

    .timeline-card__title {
      font-size: clamp(1.05rem, 2.2vw, 1.35rem);
      font-weight: 700;
      color: var(--heading-color);
      line-height: 1.3;
    }

    .timeline-card__summary {
      font-size: clamp(0.95rem, 1.6vw, 1.05rem);
      color: var(--text-muted);
      line-height: 1.6;
    }

    .timeline-card__link {
      margin-top: auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.85rem;
      color: var(--accent-primary-strong);
    }

    .timeline-card__link::after {
      content: '→';
      font-size: 0.95rem;
      transition: transform 0.3s ease;
    }

    .timeline-card__link:hover::after {
      transform: translateX(4px);
    }

    .timeline-card--buckler {
      background: var(--buckler-surface);
      border-color: var(--buckler-border);
    }

    .timeline-card--bp {
      background: var(--bp-surface);
      border-color: var(--bp-border);
    }

    .timeline-card--both {
      background: var(--shared-surface);
      border-color: var(--shared-border);
    }

    .timeline-loading {
      align-self: flex-end;
      padding: 0.65rem 1.4rem;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #e2e8f0;
      font-size: 0.95rem;
      box-shadow: 0 18px 48px rgba(2, 6, 23, 0.6);
    }

    .timeline-loading.is-hidden {
      display: none;
    }

    @media (max-width: 1100px) {
      .timeline-layout {
        flex-direction: column;
        align-items: center;
        gap: clamp(32px, 6vh, 48px);
      }

      .timeline-nav {
        width: min(100%, 560px);
      }

      .timeline-nav__viewport {
        max-height: none;
      }

      .xmb-year.is-active {
        transform: translateY(-6px);
      }

      .timeline-stage {
        width: 100%;
      }
    }

    @media (max-width: 720px) {
      .timeline-card-row {
        flex-wrap: wrap;
        justify-content: center;
      }

      .timeline-card {
        flex: 1 1 calc(50% - 16px);
        min-width: 240px;
      }

      .timeline-stage__list {
        min-width: 100%;
      }
    }

    @media (max-width: 540px) {
      .xmb-shell {
        padding: clamp(24px, 6vh, 40px) clamp(16px, 6vw, 32px);
      }

      .xmb-year {
        flex-direction: column;
        align-items: flex-start;
      }

      .timeline-card {
        flex: 1 1 100%;
        min-width: 100%;
      }

      .timeline-stage__viewport {
        padding: clamp(12px, 4vh, 24px) 0;
      }
    }
  </style>
</head>
<body>
  <div class="xmb-shell">
    <div class="timeline-layout">
      <nav class="timeline-nav" aria-label="Timeline years">
        <div class="timeline-nav__viewport" id="year-bar-viewport">
          <div class="timeline-nav__track" id="timeline-year-track" role="listbox" aria-label="Timeline years"></div>
        </div>
      </nav>
      <main class="timeline-stage" aria-label="Timeline entries">
        <div class="timeline-stage__viewport" id="timeline-entry-viewport">
          <div class="timeline-stage__list" id="timeline-year-entries"></div>
        </div>
      </main>
    </div>
    <div id="timeline-loading" class="timeline-loading">Loading timeline…</div>
  </div>

  <script src="timeline.js"></script>
</body>
</html>
