<script defer>
(function(){
  function hideEdit(){
    try{
      var nodes=document.querySelectorAll('button, [role="button"], a');
      for(var i=0;i<nodes.length;i++){
        var el=nodes[i];
        if(/Edit Content/i.test((el.textContent||el.innerText||el.getAttribute('aria-label')||'')).trim()){ el.style.display='none'; }
      }
    }catch(e){}
  }
  function patchVersion(){
    try{
      fetch('version.txt').then(function(r){return r.text();}).then(function(v){
        var deployed=(v||'').trim();
        var root=document.getElementById('root'); if(!root) return;
        var candidates=root.querySelectorAll('*');
        var found=null;
        for(var i=0;i<candidates.length;i++){
          var el=candidates[i];
          var txt=(el.textContent||'').trim();
          if(/^v\d+\.\d+/.test(txt)){ found=el; break; }
        }
        if(found){ found.textContent=deployed; }
        hideEdit();
        fetch('https://api.github.com/repos/unclehowell/datro/releases').then(function(r){return r.json();}).then(function(list){
          var bp=list.filter(function(x){return x.tag_name && x.tag_name.startsWith('bpvsbuckler-');});
          bp.sort(function(a,b){return new Date(b.published_at)-new Date(a.published_at);});
          var latest=bp[0]; if(!latest) return;
          var ver=latest.tag_name.replace(/^bpvsbuckler-/,'');
          if(ver!==deployed && found){ found.textContent=deployed+' (update: '+ver+')'; }
        }).catch(function(){});
      }).catch(function(){});
    }catch(e){}
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',patchVersion);}else{patchVersion();}
})();
