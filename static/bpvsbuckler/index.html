(function() {
  var done = false;
  var obs = new MutationObserver(function() {
    if (done) return;
    var nav = document.querySelector("nav");
    if (!nav) return;
    var links = nav.querySelectorAll("a");
    var foundBeur = false;
    for (var i = 0; i < links.length; i++) {
      if (links[i].textContent.trim() === "Beurcracy") { foundBeur = true; break; }
    }
    if (!foundBeur) {
      var repLink = Array.from(links).find(function(a) { return a.textContent.trim() === "Reparations"; });
      if (repLink) {
        var a = document.createElement("a");
        a.href = "/beurcracy/";
        a.textContent = "Beurcracy";
        a.className = repLink.className;
        repLink.parentNode.insertBefore(a, repLink.nextSibling);
      }
    }
    done = true;
  });
  obs.observe(document.body, { childList: true, subtree: true });
})();
</script>
