<body>
  <div class="background-media" aria-hidden="true">
    <video
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      id="background-video"
      crossorigin="anonymous"
    >
      <source src="vid.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <div class="background-overlay"></div>
  </div>

  <script>
    window.addEventListener("load", () => {
      const video = document.getElementById("background-video");
      if (!video) {
        return;
      }

      const revealVideo = () => {
        video.classList.add("is-visible");
      };

      const tryPlay = () => {
        const playPromise = video.play();
        if (playPromise && typeof playPromise.then === "function") {
          playPromise
            .then(() => {
              revealVideo();
            })
             .catch(() => {
              video.controls = true;
            });
        } else {
          revealVideo();
        }
      };

      if (video.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA) {
        revealVideo();
      } else {
        const onFirstFrame = () => {
          revealVideo();
        };
        video.addEventListener("loadeddata", onFirstFrame, { once: true });
        video.addEventListener("canplaythrough", onFirstFrame, { once: true });
        video.addEventListener(
          "error",
          () => {
            video.classList.add("is-visible");
          },
          { once: true },
        );
      }

      tryPlay();
    });
  </script>
  <div class="xmb-shell">
    <main class="xmb-stage">
      <section class="xmb-vertical" aria-label="Timeline years">
        <div class="xmb-vertical__viewport" id="year-list-viewport">
          <div class="xmb-vertical__list" id="timeline-year-list" role="listbox" aria-label="Timeline years"></div>
        </div>
      </section>
    </main>

    <nav class="xmb-horizontal" aria-label="Timeline entries">
      <div class="xmb-horizontal__viewport" id="entry-bar-viewport">
        <div class="xmb-horizontal__track" id="timeline-entry-track" role="listbox" aria-label="Timeline entries"></div>
      </div>
    </nav>

    <div id="timeline-loading" class="xmb-loading">Loading timeline…</div>
  </div>

  <script src="timeline.js"></script>
</body>
