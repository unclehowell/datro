<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DATRO Wayback Archive</title>
  <style>
    * { box-sizing: border-box; }

    body {
      background: #336; color: #ddd; font-family: -apple-system,BlinkMacSystemFont,sans-serif;
      margin: 0; padding: 0.5rem; min-height: 100vh;
    }
    .main-title {
      text-align: center; color: lightslategrey;
      font-size: clamp(17px,4.5vw,28px); font-weight: bolder; margin: 0.3rem 0;
    }
    .logo { display: block; margin: 0 auto 0.2rem; max-width: 55px; }

    /* -- TABS (scrollable row on mobile) -- */
    .tabs {
      display: flex; gap: 0.3rem; margin-bottom: 0.5rem;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none; padding: 0.25rem 0;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; padding: 0.5rem 0.7rem;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px; cursor: pointer; color: #aac; font-weight: bold;
      font-size: clamp(0.75rem,2.5vw,0.9rem); min-height: 44px;
      display: flex; align-items: center; touch-action: manipulation;
    }
    .tab.active { background: rgba(255,255,255,0.25); color: #fff; border-color: rgba(255,255,255,0.5); }
    .tab:active { background: rgba(255,255,255,0.3); }
    .count-badge {
      display: inline-block; background: rgba(255,255,255,0.15);
      border-radius: 10px; padding: 0.05rem 0.4rem; font-size: 0.65rem; margin-left: 0.25rem;
    }

    /* -- GALLERY -- */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.5rem;
    }
    .item {
      background: rgba(255,255,255,0.08); border-radius: 8px; padding: 0.4rem;
      text-align: center; position: relative;
    }
    .item a {
      color: #aac; text-decoration: none; font-size: 0.75rem;
      display: block; word-break: break-all;
    }
    .item a:active { color: #fff; }
    .item img, .item video {
      max-width: 100%; max-height: 200px; border-radius: 4px;
      object-fit: contain; cursor: pointer; display: block; margin: 0 auto;
    }
    .item .name { font-size: 0.8rem; color: #ccd; margin-top: 0.2rem; word-break: break-word; line-height: 1.2; font-weight: 500; }
    .item.pdf a, .item.text a, .item.video a { padding: 1.2rem 0; display: block; font-size: 0.8rem; }

    .hash-badge {
      display: inline-block; padding: 0.1rem 0.35rem; border-radius: 6px;
      font-size: 0.55rem; font-weight: bold; letter-spacing: 0.2px; margin-top: 0.15rem;
    }
    .hash-badge.bpvsbuckler { background: rgba(200,100,50,0.3); color: #fca; }
    .hash-badge.datro { background: rgba(50,150,200,0.3); color: #8cf; }

    /* -- PAGINATION (bigger touch targets) -- */
    .pagination {
      display: flex; justify-content: center; align-items: center;
      gap: 0.25rem; margin-top: 0.75rem; flex-wrap: wrap;
    }
    .pagination button {
      padding: 0.4rem 0.55rem; min-width: 36px; min-height: 36px;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px; color: #aac; cursor: pointer; font-weight: bold;
      font-size: 0.8rem; touch-action: manipulation;
    }
    .pagination button:active:not(:disabled) { background: rgba(255,255,255,0.3); color: #fff; }
    .pagination button:disabled { opacity: 0.3; }
    .pagination button.active-page { background: rgba(255,255,255,0.3); color: #fff; border-color: rgba(255,255,255,0.5); }
    .pagination .info { color: #889; font-size: 0.75rem; }

    .subtitle { text-align: center; color: #667; font-size: 0.75rem; margin-bottom: 0.5rem; }

    /* -- HASHTAG FILTER (single row under categories, click to show/filter; mobile friendly horizontal) -- */
    #hashtag-cloud {
      max-width: 100%; margin: 0.2rem 0 0.4rem;
      background: rgba(40,40,70,0.6); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px; padding: 0.2rem 0.35rem;
      display: flex; flex-wrap: wrap; gap: 0.2rem; align-items: center;
    }
    #hashtag-cloud .tag-label { color: #889; font-size: 0.6rem; margin-right: 0.35rem; white-space: nowrap; }
    #hashtag-cloud .tag {
      display: inline-flex; align-items: center; padding: 0.15rem 0.4rem;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px; color: #8ac; cursor: pointer; font-size: 0.65rem;
      min-height: 24px; line-height: 1; touch-action: manipulation; white-space: nowrap;
    }
    #hashtag-cloud .tag:active { background: rgba(255,255,255,0.25); color: #fff; }
    #hashtag-cloud .tag.active { background: rgba(255,200,100,0.25); color: #fff; border-color: rgba(255,200,100,0.4); }
    #hashtag-cloud .clear-btn { background: none; border: none; color: #667; cursor: pointer; font-size: 0.6rem; padding: 0.1rem 0.3rem; }

    #all-search {
      width: 100%; padding: 0.6rem 0.7rem; margin-bottom: 0.5rem;
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1); color: #ddd;
      font-size: 1rem; box-sizing: border-box; min-height: 44px;
    }

    footer { text-align: center; padding: 0.75rem; font-size: 0.7rem; color: #667; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 1.5rem; }

    /* -- TABLET+ -- */
    @media (min-width: 768px) {
      body { padding: 1rem; }
      .gallery { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.75rem; }
      .item img, .item video { max-height: 250px; }
      .item .name { font-size: 0.75rem; }
      .tab { font-size: 0.85rem; padding: 0.4rem 0.75rem; }
      #hashtag-cloud { flex-wrap: nowrap; overflow-x: auto; }
    }
    @media (min-width: 1024px) {
      .gallery { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
      .item img, .item video { max-height: 300px; }
    }
  </style>
</head>
<body>
  <p class="main-title" id="main-title">DATRO Wayback Archive 0.0.0.18</p>

  <div class="tabs" id="tabs"></div>
  <div id="all-search-wrapper" style="display:none"><input type="text" id="all-search" placeholder="Search all files..."></div>

  <div id="hashtag-cloud"></div>
  <div id="category-info" class="subtitle"></div>
  <div class="gallery" id="gallery"></div>
  <div class="pagination" id="pagination"></div>

  <footer style="text-align:center;padding:1rem;font-size:0.75rem;color:#666;border-top:1px solid rgba(255,255,255,0.1);margin-top:2rem">
    &copy; 2026 DATRO Consortium.
  </footer>

  <script data-cfasync="true">
    (async () => {
      const CATEGORIES = [
        { name: 'all', label: 'All', icon: '📦' },
        { name: 'images', label: 'Images', icon: '🖼' },
        { name: 'pdf', label: 'PDF', icon: '📄' },
        { name: 'text', label: 'Text', icon: '📝' },
        { name: 'video', label: 'Video', icon: '🎬' }
      ];
      const PER_PAGE = 10;
      let allData = {};
      let currentCat = 'images';
      let currentPage = 1;
      let filtered = [];

      const tabsEl = document.getElementById('tabs');
      const galleryEl = document.getElementById('gallery');
      const paginationEl = document.getElementById('pagination');
      const infoEl = document.getElementById('category-info');
      const hashCloudEl = document.getElementById('hashtag-cloud');
      const allSearchEl = document.getElementById('all-search');
      const allSearchWrapper = document.getElementById('all-search-wrapper');

      // render tabs immediately so UI is never just the title
      renderTabs();

      // set version immediately (dynamic, no hardcode)
      (async function updateWaybackVersion() {
        try {
          const ver = (await xhrGet('version.txt')).trim();
          const titleEl = document.getElementById('main-title');
          if (titleEl) titleEl.textContent = `DATRO Wayback Archive ${ver}`;
          document.title = `DATRO Wayback Archive ${ver}`;
        } catch(e) {}
      })();

      function extractTags(item) {
        const tags = (item.name || '').match(/#\w+/g) || [];
        if (Array.isArray(item.tags)) tags.push(...item.tags.map(t => t.startsWith('#') ? t : '#' + t));
        return tags.map(t => t.toLowerCase());
      }

      function xhrGet(url) {
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('GET', url, true);
          xhr.responseType = 'text';
          xhr.onload = function() {
            if (xhr.status >= 200 && xhr.status < 300) resolve(xhr.responseText);
            else reject(new Error('HTTP ' + xhr.status));
          };
          xhr.onerror = function() { reject(new Error('Network error')); };
          xhr.send();
        });
      }

      async function loadCategory(cat) {
        if (cat === 'all') return [];
        const url = `${cat}/_treeview.json`;
        try {
          const text = await xhrGet(url);
          const data = JSON.parse(text);
          return data.map(item => ({
            ...item,
            _category: cat,
            _hashtags: extractTags(item),
            _tags: (item.name || '').toLowerCase()
          }));
        } catch(e) {
          return [];
        }
      }

      function getSafePath(p) {
        if (!p) return '';
        // encode each segment so # and special chars in filenames don't break URLs ( # starts fragment)
        return p.split('/').map(encodeURIComponent).join('/');
      }

      function renderHashtagCloud() {
        // restore previous single-row under categories style: click tags to filter/show matching
        const allTags = ['#bpvsbuckler', '#datro', '#ccan', '#morgan', '#ceo', '#gui', '#library', '#family'];
        const tags = allTags.filter(t => !t.includes('slide')); // keep bpvs etc visible for click-to-show
        const active = window.activeTagFilters || (window.activeTagFilters = new Set());
        hashCloudEl.innerHTML = `<span class="tag-label">Filter:</span>` +
          tags.map(t =>
            `<span class="tag${active.has(t) ? ' active' : ''}" data-tag="${t}">${t}</span>`
          ).join('') +
          `<button class="clear-btn" id="hash-clear">clear</button>`;
        hashCloudEl.querySelectorAll('.tag').forEach(el => {
          el.addEventListener('click', () => {
            const tag = el.dataset.tag;
            if (active.has(tag)) active.delete(tag);
            else active.add(tag);
            currentPage = 1;
            applyFilter();
          });
        });
        const clearBtn = document.getElementById('hash-clear');
        if (clearBtn) clearBtn.addEventListener('click', () => { active.clear(); currentPage = 1; applyFilter(); });
      }

      async function init() {
        try {
          for (const cat of CATEGORIES) {
            if (cat.name === 'all') {
              const allItems = [];
              for (const sub of CATEGORIES) {
                if (sub.name === 'all') continue;
                allData[sub.name] = await loadCategory(sub.name);
                allItems.push(...(allData[sub.name] || []));
              }
              allData.all = allItems;
            } else {
              allData[cat.name] = await loadCategory(cat.name);
            }
          }
        } catch (e) {
          console.warn('load error, continuing with partial data', e);
        }
        renderTabs();
        switchCategory('images');

        // Support URL param from bpvsbuckler for filtered view, e.g. ?slide=65 or ?year=1988
        // Filter items with matching #slide-N or year in name, without affecting main UI
        const params = new URLSearchParams(window.location.search);
        const slideParam = params.get('slide') || params.get('s');
        const yearParam = params.get('year') || params.get('y');
        if (slideParam || yearParam) {
          setTimeout(() => {
            let items = allData[currentCat] || [];
            if (slideParam) {
              const tag = '#slide-' + slideParam;
              items = items.filter(item => (item._hashtags || []).includes(tag.toLowerCase()) || (item.name || '').includes(slideParam));
            } else if (yearParam) {
              items = items.filter(item => (item.name || '').includes(yearParam));
            }
            filtered = items;
            infoEl.textContent = `${filtered.length} result${filtered.length !== 1 ? 's' : ''} (filtered for bpvsbuckler)`;
            renderPage();
          }, 200);
        }

        // support ?hashtag=bpvsbuckler for bpvs integration
        const hashParam = params.get('hashtag');
        if (hashParam) {
          setTimeout(() => {
            let items = allData[currentCat] || [];
            const tag = '#' + hashParam.toLowerCase();
            items = items.filter(item => (item._hashtags || []).includes(tag) || (item.name || '').toLowerCase().includes(tag));
            filtered = items;
            infoEl.textContent = `${filtered.length} result${filtered.length !== 1 ? 's' : ''} (bpvsbuckler filter)`;
            renderPage();
          }, 300);
        }
      }

      function renderTabs() {
        tabsEl.innerHTML = CATEGORIES.map(c =>
          `<div class="tab${c.name === currentCat ? ' active' : ''}" data-cat="${c.name}">${c.icon} ${c.label}<span class="count-badge">${(allData[c.name] || []).length}</span></div>`
        ).join('');
        tabsEl.querySelectorAll('.tab').forEach(el => {
          el.addEventListener('click', () => {
            switchCategory(el.dataset.cat);
          });
        });
      }

      function switchCategory(cat) {
        currentCat = cat;
        currentPage = 1;
        tabsEl.querySelectorAll('.tab').forEach(el => {
          el.classList.toggle('active', el.dataset.cat === cat);
        });
        if (cat === 'all') {
          allSearchWrapper.style.display = 'block';
          allSearchEl.value = '';
        } else {
          allSearchWrapper.style.display = 'none';
        }
        applyFilter();
      }

      function applyFilter() {
        let items = allData[currentCat] || [];

        const query = currentCat === 'all' ? allSearchEl.value.toLowerCase().trim() : '';
        if (query) {
          items = items.filter(item => item._tags.includes(query));
        }
        const active = window.activeTagFilters || new Set();
        if (active.size > 0) {
          items = items.filter(item =>
            item._hashtags.some(t => active.has(t))
          );
        }
        filtered = items;
        infoEl.textContent = `${filtered.length} result${filtered.length !== 1 ? 's' : ''} in ${currentCat}`;
        renderHashtagCloud();
        renderPage();
      }

      function renderPage() {
        const total = filtered.length;
        const totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * PER_PAGE;
        const pageItems = filtered.slice(start, start + PER_PAGE);

        if (total === 0) {
          galleryEl.innerHTML = '<p style="text-align:center;color:#667;padding:2rem">No results found.</p>';
          paginationEl.innerHTML = '';
          return;
        }

        galleryEl.innerHTML = pageItems.map(item => {
          const ext = (item.path || '').split('.').pop().toLowerCase();
          const imgExts = ['jpg','jpeg','png','gif','webp','bmp','svg'];
          const vidExts = ['mp4', 'webm', 'mov', 'avi'];
          const isImg = imgExts.includes(ext);
          const isVid = vidExts.includes(ext);
          const hash = item._hashtags && item._hashtags.length > 0 ? item._hashtags[0].replace('#', '') : '';
          let media = '';
          const safe = `https://wayback.datro.xyz/${getSafePath(item.path)}`;
          if (isImg) {
            media = `<a href="${safe}" target="_blank"><img src="${safe}" loading="lazy" alt="${item.name}"></a>`;
          } else if (isVid) {
            media = `<a href="${safe}" target="_blank"><video src="${safe}" controls preload="metadata"></video></a>`;
          } else {
            media = `<a href="${safe}" target="_blank">${item.name}</a>`;
          }
          const nameClean = (item.name || '').replace(/\s*#\w+/g, '').trim();
          return `<div class="item ${item._category}">${media}<div class="name">${nameClean}</div>${hash ? `<span class="hash-badge ${hash}">#${hash}</span>` : ''}</div>`;
        }).join('');

        renderPagination(totalPages, total);
      }

      function renderPagination(totalPages, total) {
        if (totalPages <= 1) {
          paginationEl.innerHTML = `<span class="info">${total} item${total !== 1 ? 's' : ''}</span>`;
          return;
        }
        let html = `<button class="prev" data-page="${currentPage - 1}" ${currentPage <= 1 ? 'disabled' : ''}>Back</button>`;
        const maxVisible = 9;
        let startPage = Math.max(1, currentPage - 4);
        let endPage = Math.min(totalPages, startPage + maxVisible - 1);
        if (endPage - startPage < maxVisible - 1) {
          startPage = Math.max(1, endPage - maxVisible + 1);
        }
        if (startPage > 1) {
          html += `<button data-page="1">1</button>`;
          if (startPage > 2) html += `<span class="info">...</span>`;
        }
        for (let i = startPage; i <= endPage; i++) {
          html += `<button data-page="${i}" class="${i === currentPage ? 'active-page' : ''}">${i}</button>`;
        }
        if (endPage < totalPages) {
          if (endPage < totalPages - 1) html += `<span class="info">...</span>`;
          html += `<button data-page="${totalPages}">${totalPages}</button>`;
        }
        html += `<button class="next" data-page="${currentPage + 1}" ${currentPage >= totalPages ? 'disabled' : ''}>Next</button>`;
        html += `<span class="info">Page ${currentPage} of ${totalPages}</span>`;
        paginationEl.innerHTML = html;
        paginationEl.querySelectorAll('button:not(:disabled)').forEach(btn => {
          btn.addEventListener('click', () => {
            const page = parseInt(btn.dataset.page);
            if (!isNaN(page)) { currentPage = page; renderPage(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
          });
        });
      }

      if (allSearchEl) {
        allSearchEl.addEventListener('input', () => { currentPage = 1; applyFilter(); });
      }

      await init();

      // Support URL param for cross-site filter from bpvsbuckler, e.g. ?slide=85 or ?year=1988
      (function applyUrlFilter() {
        const params = new URLSearchParams(window.location.search);
        const slide = params.get('slide') || params.get('s');
        const yr = params.get('year') || params.get('y');
        const q = params.get('q') || params.get('query');
        if (slide || yr || q) {
          setTimeout(() => {
            if (slide) {
              // filter items with #slide-N or the number in name
              const tag = '#slide-' + slide;
              filtered = (allData[currentCat] || []).filter(item => 
                (item.name || '').toLowerCase().includes(tag) || (item.name || '').includes(slide)
              );
              infoEl.textContent = `${filtered.length} result${filtered.length !== 1 ? 's' : ''} for slide ${slide}`;
            } else if (yr) {
              filtered = (allData[currentCat] || []).filter(item => (item.name || '').includes(yr));
              infoEl.textContent = `${filtered.length} result${filtered.length !== 1 ? 's' : ''} for year ${yr}`;
            } else if (q) {
              filtered = (allData[currentCat] || []).filter(item => (item._tags || '').includes(q.toLowerCase()));
            }
            currentPage = 1;
            renderPage();
          }, 300);
        }
      })();
    })();
  </script>
</body>
</html>
