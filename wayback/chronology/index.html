efarmwiki.wordpress.com/"}, {"id": "CH-0005", "d": "1855", "s": "1855-00-00", "c": "heritage", "e": "John Williams succeeds his father in the occupancy of the farm, per a 1904 press report: “He succeeded his father in the occupancy of the farm in 1855” (Cardiff Times, 16 Jul 1904, which calls him “of Llandough Farm”; that he is the Great House John Williams is an inference) (Cardiff Times 1904; EV-0224)", "src": "Legal Wiki, Master Timeline · EV-0224", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0224-1881-census-llandough-rg11-5288/#corroboration", "ev": "Press report, 1904 — inference"}, {"id": "CH-0006", "d": "23 Dec 1864", "s": "1864-12-23", "c": "history", "e": "Amy Williams, “relict of the late Mr. John Williams, Great House farm”, dies at Llandough, aged 65 (EV-0246)", "src": "Legal Wiki, Master Timeline · EV-0246", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0246-cardiff-times-1864-death-of-amy-williams-great-house-farm/", "ev": "Contemporary press"}, {"id": "CH-0007", "d": "30 Dec 1864", "s": "1864-12-30", "c": "press", "e": "Cardiff Times and Cardiff and Merthyr Guardian, 30 Dec 1864: death of Amy, “relict of the late Mr. John Williams, Great House farm”", "src": "Media register MR-0001", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0246-cardiff-times-1864-death-of-amy-williams-great-house-farm/", "w": "https://web.archive.org/web/20261023164935/https://greathousefarmwiki.wordpress.com/evidence/ev-0246-cardiff-times-1864-death-of-amy-williams-great-house-farm/"}, {"id": "CH-0008", "d": "9 Apr 1872", "s": "1872-04-09", "c": "history", "e": "Llandough poor rate: John Williams rated for glebe land, owner Rev. H.H. Rickards (rate book, reference pending) (EV-0212)", "src": "Legal Wiki, Master Timeline · EV-0212", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0212-llandough-poor-rate-books-1870s/", "ev": "Provisional reading"}, {"id": "CH-0009", "d": "1875", "s": "1875-00-00", "c": "history", "e": "Worrall’s Directory lists “Williams John, Great house” in Llandough parish; Slater’s 1868 and 1880, Owen’s 1887 and 1891 and the 1901 Cardiff Directory list him at Great House as well (EV-0225)", "src": "Legal Wiki, Master Timeline · EV-0225", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0225-trade-directories-1868-1901-john-williams-great-house/", "ev": "Published directory"}, {"id": "CH-0010", "d": "1876–1912", "s": "1876-00-00", "c": "title", "e": "NLW Bute deeds D153/4–8, catalogue entry: “land (33 a.), formerly part of Great House Farm, for the Llandough Limeworks (33 a.), 1876-1912 (D153/4-8). Plan engrossed on D153/3 (1875) and 4 (1876).” The deeds, their parties and the parcel are unread (EV-0291; SC-21; Llandough Limeworks)", "src": "Legal Wiki, Master Timeline · EV-0291", "u": "https://greathousefarmwiki.wordpress.com/llandough-limeworks/", "ev": "Catalogue entry — deeds unread"}, {"id": "CH-0011", "d": "1876–1912", "s": "1876-00-00", "c": "title", "e": "Bute deeds: “land (33 a.), formerly part of Great House Farm, for the Llandough Limeworks (33 a.), 1876-1912”; plan engrossed on D153/3 (1875) and 4 (1876)", "src": "National Library of Wales D153/4–8", "u": "https://csscpsg.bucklerfamily.estate/"}, {"id": "CH-0012", "d": "Oct 1876", "s": "1876-10-00", "c": "history", "e": "Llandough poor rate: John Williams rated for a farm, owner Lord Bute, c. 76a, gross £41 0s (same sequence in the rate of 20 Aug 187?, year unread); Lord Bute rated for woods in hand, 32a 3r 39p; Daniel Thomas & Son rated for a lime kiln and quarry (EV-0212)", "src": "Legal Wiki, Master Timeline · EV-0212", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0212-llandough-poor-rate-books-1870s/", "ev": "Provisional — read across the fold"}, {"id": "CH-0013", "d": "1877", "s": "1877-00-00", "c": "history", "e": "Bute serves notice to quit (Mary’s statement) (notice to quit)", "src": "Legal Wiki, Master Timeline", "u": "https://greathousefarmwiki.wordpress.com/1877-agreement/#notice-1877"}, {"id": "CH-0014", "d": "1877", "s": "1877-00-00", "c": "title", "e": "Mary (Nancy) Williams’s statement reports a sale of the farmhouse/buildings and about 10 acres to Daniel Thomas, with about 9 acres retained by Bute; original deed/plan missing (1877 sale, plan) whole farm Nomenclaturewhole farm", "src": "Legal Wiki, Master Timeline", "u": "https://greathousefarmwiki.wordpress.com/the-two-parcels/whole-farm-nomenclature/", "ev": "← / →"}, {"id": "CH-0015", "d": "6 Nov 1877", "s": "1877-11-06", "c": "heritage", "e": "Date reported for a lease to John Williams in Mary (Nancy) Williams’s account; no matching Llandough instrument has been identified. The checked DBDT/79/1 item is a 2 May 1877 lease for Pembroke Terrace, Cardiff; other similarly named Cardiff lease references remain catalogue leads, not verified Llandough evidence (SC-20; 1877 Agreement). A Bute Trustees counterpart lease of this date to John Williams, builder, of System Street, Roath, for a plot in Clyde Street, Roath, is photographed; it is not the farm (EV-0213; Excluded).", "src": "Legal Wiki, Master Timeline · EV-0213", "u": "https://greathousefarmwiki.wordpress.com/evidence/excluded-not-our-farm/", "ev": "Original unlocated — parcel unassigned"}, {"id": "CH-0016", "d": "c.1880", "s": "1880-00-00", "c": "heritage", "e": "‘Armour’ reported found under the floor of the rear wing of Great House; thought to be the medieval ironwork from Llandough now at the National Museum.", "src": "Heneb HER 02038s (Suggett, RCAHMW, Dec 1988)", "u": "https://archwilio.org.uk/her/chi3/report/page.php?watprn=GGAT02038s"}, {"id": "CH-0017", "d": "3 Apr 1881", "s": "1881-04-03", "c": "heritage", "e": "The 1881 census records John Williams, 53, “Farmer of 170[? or 120] ac.”, with his wife Mary and children at “Llandough Home Farm”, Llandough (RG11/5288 p.2). On our case’s reading, the census mixed up the Llandough farm with Great House Farm, so this is Great House Farm under another name (EV-0224)", "src": "Legal Wiki, Master Timeline · EV-0224", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0224-1881-census-llandough-rg11-5288/", "ev": "Farm name disputed"}, {"id": "CH-0018", "d": "15 Dec 1887", "s": "1887-12-15", "c": "history", "e": "Obituary of Daniel Thomas of Penylan (Tarian y Gweithiwr): a contractor under Lord Bute and owner of “valuable lime kilns at Llandough”; on 24 Apr 1888 a man is described as “a labourer at Llandough Quarry” (EV-0280)", "src": "Legal Wiki, Master Timeline · EV-0280", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0280-llandough-lime-works-and-quarry-1876-1947-daniel-thomas-s-kilns-quarry-workers-kel/", "ev": "Contemporary press"}, {"id": "CH-0019", "d": "11 Aug 1889", "s": "1889-08-11", "c": "press", "e": "Apples taken from “the orchard of Great House Farm … the property of John Williams”, reached “over the hedge from the railway”; John Williams junior gives evidence (Barry Dock News, 16 Aug 1889) (EV-0279)", "src": "Legal Wiki, Master Timeline · EV-0279", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0279-barry-dock-news-16-aug-1889-p-2-apples-taken-from-the-orchard-of-great-house-farm/", "ev": "Contemporary press"}, {"id": "CH-0020", "d": "16 Aug 1889", "s": "1889-08-16", "c": "press", "e": "Barry Dock News, 16 Aug 1889, p.2: apples taken from “the orchard of Great House Farm … the property of John Williams”; orchard reached “over the hedge from the railway”", "src": "Media register MR-0002", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0279-barry-dock-news-16-aug-1889-p-2-apples-taken-from-the-orchard-of-great-house-farm/", "w": "https://web.archive.org/web/20261023165003/https://greathousefarmwiki.wordpress.com/evidence/ev-0279-barry-dock-news-16-aug-1889-p-2-apples-taken-from-the-orchard-of-great-house-farm/"}, {"id": "CH-0021", "d": "11 Nov 1891", "s": "1891-11-11", "c": "legal", "e": "Three geese taken from “Mr. John Williams, Great House Farm, Llandough”; the court report is contemporary evidence of his occupancy (press 1891) whole farm Nomenclaturewhole farm", "src": "Legal Wiki, Master Timeline", "u": "https://greathousefarmwiki.wordpress.com/the-two-parcels/whole-farm-nomenclature/", "ev": "← / →"}, {"id": "CH-0022", "d": "11 Nov 1891", "s": "1891-11-11", "c": "press", "e": "newspaper cutting (title not printed): “Newspaper report: reported theft of geese from Great House Farm, Llandough (1891)”", "src": "Media register MR-0003", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0010-llandough-farmyard-theft-geese-1891/"}, {"id": "CH-0023", "d": "7 Jun 1892", "s": "1892-06-07", "c": "press", "e": "South Wales Echo: “ THEFT OF GEESE AT LLANDOUGH” — Court report: three geese taken on 11 Nov 1891 from John Williams of Great House Farm, Llandough; police evidence heard.", "src": "Media register MR-0004", "u": "https://www.britishnewspaperarchive.co.uk/search/results/1850-01-01/1959-12-31?basicsearch=%22great%20house%20farm%22%20llandough&exactsearch=false&retrievecountrycounts=false"}, {"id": "CH-0024", "d": "8 Jun 1892", "s": "1892-06-08", "c": "press", "e": "South Wales Daily News: “ THEFT OF GEESE AT LLANDOUGH” — Same court case reported in the South Wales Daily News: geese of John Williams, Great House Farm.", "src": "Media register MR-0005", "u": "https://www.britishnewspaperarchive.co.uk/search/results/1850-01-01/1959-12-31?basicsearch=%22great%20house%20farm%22%20llandough&exactsearch=false&retrievecountrycounts=false"}, {"id": "CH-0025", "d": "10 Jun 1892", "s": "1892-06-10", "c": "history", "e": "South Wales Star reports geese taken, “the property of Mr. John Williams, Great House Farm, Llandough, on November 11, 1891” (South Wales Star 1892; EV-0224)", "src": "Legal Wiki, Master Timeline · EV-0224", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0224-1881-census-llandough-rg11-5288/#corroboration", "ev": "Contemporary press"}, {"id": "CH-0026", "d": "10 Jun 1892", "s": "1892-06-10", "c": "press", "e": "South Wales Star: “LLANDOUGH.” — Penarth magistrates hearing on the geese taken from John Williams, Great House Farm, Llandough, in Nov 1891.", "src": "Media register MR-0006", "u": "https://www.britishnewspaperarchive.co.uk/search/results/1850-01-01/1959-12-31?basicsearch=%22great%20house%20farm%22%20llandough&exactsearch=false&retrievecountrycounts=false"}, {"id": "CH-0027", "d": "31 Jul 1894", "s": "1894-07-31", "c": "history", "e": "Rev. F. E. Williams inducted as rector of Llandough, Leckwith and Cogan (Bute patron of the living): a different Williams, not the Great House family (EV-0281)", "src": "Legal Wiki, Master Timeline · EV-0281", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0281-not-our-family-rev-f-e-frank-williams-rector-of-llandough-leckwith-and-cogan-from/", "ev": "Disambiguation"}, {"id": "CH-0028", "d": "Jul–Aug 1894", "s": "1894-08-00", "c": "press", "e": "Swine fever at Llandough: “Five pigs belonging to Mr Williams, Great House, have been slaughtered” (Barry Dock News, 3 Aug 1894) (EV-0247)", "src": "Legal Wiki, Master Timeline · EV-0247", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0247-barry-dock-news-1894-swine-fever-great-house-llandough/", "ev": "Contemporary press"}, {"id": "CH-0029", "d": "3 Aug 1894", "s": "1894-08-03", "c": "press", "e": "Barry Dock News and Glamorgan Gazette, 3 Aug 1894: swine fever; five pigs of “Mr Williams, Great House” slaughtered", "src": "Media register MR-0007", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0247-barry-dock-news-1894-swine-fever-great-house-llandough/", "w": "https://web.archive.org/web/20261023165118/https://greathousefarmwiki.wordpress.com/evidence/ev-0247-barry-dock-news-1894-swine-fever-great-house-llandough/"}, {"id": "CH-0030", "d": "26 Nov 1896", "s": "1896-11-26", "c": "press", "e": "Obituary of J. E. Billups: “the Penarth Brickworks, which were started by him” (South Wales Daily News, 26 Nov 1896, p.6). A published brickworks history places the Llandough brickworks “next door” to the lime works “by 1899”, Billups Brick Co Ltd proprietor, “Llandough Brick Co by 1923”, “disused” by 1947 (secondary) (EV-0292)", "src": "Legal Wiki, Master Timeline · EV-0292", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0292-llandough-lime-works-and-brickworks-industrial-sequence-secondary-and-billups-obituary-1896/", "ev": "Contemporary press · secondary"}, {"id": "CH-0031", "d": "26 Nov 1896", "s": "1896-11-26", "c": "press", "e": "industrialgwent: “Llandough Lime Works and the brickworks next door: “owned in 1871 by D Thomas and Son”; brickworks “opened next door by 1899”, J. E. Billups, “Llandough Brick Co by 1923”, “disused” by 1947…”", "src": "Media register MR-0008", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0292-llandough-lime-works-and-brickworks-industrial-sequence-secondary-and-billups-obituary-1896/", "w": "https://web.archive.org/web/20261023165143/https://greathousefarmwiki.wordpress.com/evidence/ev-0292-llandough-lime-works-and-brickworks-industrial-sequence-secondary-and-billups-obituary-1896/"}, {"id": "CH-0032", "d": "6–15 May 1897", "s": "1897-05-15", "c": "history", "e": "George Kemp’s diary (Marconi’s assistant): Lavernock pole “107 ft”, Flat Holm “110 ft”, apparatus left “at Penarth”; no mention of Great House Farm (EV-0256)", "src": "Legal Wiki, Master Timeline · EV-0256", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0256-kemp-diary-lavernock-1897-bodleian-ms-marconi-89/"}, {"id": "CH-0033", "d": "15 May 1897", "s": "1897-05-15", "c": "press", "e": "Evening Express: “Wireless Telegraphy. Marconi Invention Tested at Lavernock”", "src": "Media register MR-0009", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0011-marconi-lavernock-wireless-cutting-1897/", "w": "http://web.archive.org/web/20261018202039/https://greathousefarmwiki.wordpress.com/evidence/ev-0011-marconi-lavernock-wireless-cutting-1897/"}, {"id": "CH-0034", "d": "10–18 May 1897", "s": "1897-05-18", "c": "press", "e": "Marconi’s wireless trials with the Post Office at Lavernock Point, Flat Holm and Brean Down. The receiving pole at Lavernock was put up by “Mr. Williams (of the engineering department, Cardiff)” (Evening Express, 15 May 1897, p.4, identified 19 Oct 2026 as the cutting EV-0011). The first Brean Down tape is dated 18 May 1897. Marconi left England on 5 Jul 1897. Link to Great House: evidence being added. (EV-0248; press 1897)", "src": "Legal Wiki, Master Timeline · EV-0011, EV-0248", "u": "https://greathousefarmwiki.wordpress.com/evidence-library/press-archive-transcripts/#n02", "ev": "Contemporary press"}, {"id": "CH-0035", "d": "23 Jul 1897", "s": "1897-07-23", "c": "press", "e": "Evening Express: “Marconi in Wales, April–July 1897: the contemporary Welsh press record (Lavernock, Flat Holm, Brean Down)”", "src": "Media register MR-0010", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0248-marconi-in-wales-may-1897-contemporary-press/", "w": "https://web.archive.org/web/20261023165209/https://greathousefarmwiki.wordpress.com/evidence/ev-0248-marconi-in-wales-may-1897-contemporary-press/"}, {"id": "CH-0036", "d": "20 Oct 1900", "s": "1900-10-20", "c": "press", "e": "London Evening Standard: “Press reports: Bute’s will left Leckwith-with-Llandough to Colum Crichton-Stuart”", "src": "Media register MR-0011", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0012-bute-will-press-reports-1900/"}, {"id": "CH-0037", "d": "29 Nov 1902", "s": "1902-11-29", "c": "history", "e": "Marquess of Bute’s coppice woods, incl. “Cwm Cydfin Wood, Leckwith and Llandough”, offered at auction (Stephenson & Alexander, particular 192; land or coppice only not stated)", "src": "Legal Wiki, Master Timeline", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0219-bute-coppice-woods-sale-1902-cwm-cydfin-wood/", "ev": "[EV-0219]"}, {"id": "CH-0038", "d": "16 Jul 1904", "s": "1904-07-16", "c": "press", "e": "Cardiff Times, 16 Jul 1904: John Williams “of Llandough Farm” at the Bute rent audit, occupier since 1855 (match to Great House Farm is an inference)", "src": "Media register MR-0012", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0227-cardiff-times-1904-john-williams-tenancy-since-1855/", "w": "https://web.archive.org/web/20261023165326/https://greathousefarmwiki.wordpress.com/evidence/ev-0227-cardiff-times-1904-john-williams-tenancy-since-1855/"}, {"id": "CH-0039", "d": "Oct 1904", "s": "1904-10-00", "c": "press", "e": "Barry Dock News: “Bute Court Leet at Llandough, press reports 1904–1917: “John Williams” on the 1910 grand jury; “no presentments … of the deaths of freeholders, or encroachments”; “Jenkin M. Williams” constable for Ll”", "src": "Media register MR-0013", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0283-bute-court-leet-at-llandough-press-reports-1904-1917-john-williams-on-the-1910-gra/", "w": "https://web.archive.org/web/20261023165351/https://greathousefarmwiki.wordpress.com/evidence/ev-0283-bute-court-leet-at-llandough-press-reports-1904-1917-john-williams-on-the-1910-gra/"}, {"id": "CH-0040", "d": "23 Feb 1905", "s": "1905-02-23", "c": "title", "e": "Bute conveyance, later on the WA231076 file and noted on WA735527 (deeds before registration)", "src": "Legal Wiki, Master Timeline", "u": "https://greathousefarmwiki.wordpress.com/land-registry-titles/#deeds-before-registration", "ev": "Parcel A — current interpretation"}, {"id": "CH-0041", "d": "23 February 1905", "s": "1905-02-23", "c": "title", "e": "Conveyance, John Marquis of Bute to Cardiff City Corporation, as recorded on the register", "src": "HM Land Registry title register WA735527 (Land lying on the North East side of Leckwith Road, Llandough), accessed 18 September 2026, Charges Register entry 1", "u": "https://greathousefarmwiki.wordpress.com/wp-content/uploads/2026/09/wp-1790112812173.pdf"}, {"id": "CH-0042", "d": "1 Apr 1907", "s": "1907-04-01", "c": "press", "e": "Llandough Air-rifle Clu 9-revised-tenancy/#plan", "ev": "[EV-0023] / Parcel B"}, {"id": "CH-0074", "d": "c. 1940", "s": "1940-00-00", "c": "title", "e": "12 years’ rent-free occupancy of the house parcel since 1928 complete, on Mary (Nancy) Williams’s statement that rent was last paid in 1928 (c.1974; Mary (Nancy) Williams’s statement) (c. 1940)", "src": "Legal Wiki, Master Timeline", "u": "https://greathousefarmwiki.wordpress.com/1939-revised-tenancy/#c1940", "ev": "Parcel A"}, {"id": "CH-0075", "d": "1941–43", "s": "1941-00-00", "c": "legal", "e": "National Farm Survey, Penarth parish bundle", "src": "The National Archives MAF 32/1220/39", "u": "https://csscpsg.bucklerfamily.estate/"}, {"id": "CH-0076", "d": "1940 – Apr 1942", "s": "1942-04-00", "c": "heritage", "e": "Western Ground Rents gives c.109 acres of Leckwith Woods to Cardiff council (offered and accepted 1940, completed April 1942; secondary source) Working theories (evidence pending): the 1940–42 woods gift and Parcel A. Each theory is stated as a theory, with its support and the record that would test it. Each rests on the dated records named and on our case’s reading of them; evidence being added.Provenance of the plan of the Williams parcel (corrected 20 Oct 2026): date and origin unknown; from a family heirloom collection, disclosed 2026. Our case, prospective, links it to the 1877 Daniel Thomas & Son agreement, which is not yet in hand . It is the only known source for the three-way split of Parcel A, much as Parcel B is known from the 1939 occupancy plan. See the plan.T1 (theory): the woods gift to Cardiff took in the woodland third of Parcel A. Support: the gift was “110 acres of wooded land at Leckwith” (Western Mail, 14 Sep 1940, p.5; press search snippet), about 109 acres in the council’s own history (Cardiff Parks; EV-0220); Parcel A’s woods are “practically Leckwith” and are now held by the Forest of Cardiff charity (our case, 20 Oct 2026; charity 1002867; woodland title WA735527, transferred 10 Nov 1994: EV-0136, GHF-E149). Test: the April 1942 WGR → Cardiff conveyance and its plan, laid over the c.1841 tithe parcel 266 “Wood” and the WA735527 plan; Cardiff’s Parks Committee minutes of 15 Oct 1940 to 15 Apr 1942 (Glamorgan Archives BC/C/6/78–80). The plan will show whether the gift’s ground reaches the woods beside the farm, some of which straddle the Llandough–Leckwith line, or lies higher on Leckwith Hill.", "src": "Legal Wiki, Master Timeline · EV-0220, EV-0136", "u": "https://canfod.glamarchives.gov.uk/en/records/BC/C/6/79", "ev": "[EV-0220]"}, {"id": "CH-0077", "d": "17 Nov 1942", "s": "1942-11-17", "c": "title", "e": "Western Mail advertises an “IMPORTANT SALE OF LIVE AND DEAD FARMING STOCK. GREAT HOUSE FARM, LLANDOUGH” (snippet only; which Llandough not verified) (EV-0286)", "src": "Legal Wiki, Master Timeline · EV-0286", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0286-snippet-only-western-mail-17-nov-1942-p-2-important-sale-of-live-and-dead-farming/", "ev": "Press snippet; to be checked", "also": [{"source": "Media register MR-0021", "url": "https://greathousefarmwiki.wordpress.com/evidence/ev-0286-snippet-only-western-mail-17-nov-1942-p-2-important-sale-of-live-and-dead-farming/"}]}, {"id": "CH-0078", "d": "1944", "s": "1944-00-00", "c": "history", "e": "WAEC dissatisfied; Frederick runs the farm as manager for John Williams (Mary’s statement) (1944)", "src": "Legal Wiki, Master Timeline", "u": "https://greathousefarmwiki.wordpress.com/john-williams/#y1944", "ev": "Parcel B"}, {"id": "CH-0079", "d": "c. 1945–1955", "s": "1945-00-00", "c": "heritage", "e": "Note and sketch of the old village layout by Mrs Nancy Buckler of Great House Farm; the note names her father as John Williams of Great House Farm, “born about 1867” (Glamorgan Archives D/D XJF 64/30–31) (EV-0155)", "src": "Legal Wiki, Master Timeline · EV-0155", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0155-glamorgan-archives-email-june-2026/", "ev": "Archive photo held"}, {"id": "CH-0080", "d": "c. 1948–49", "s": "1948-00-00", "c": "history", "e": "William (Billy) Buckler born at the farm; lives there until 1988 (William)", "src": "Legal Wiki, Master Timeline", "u": "https://greathousefarmwiki.wordpress.com/williams-buckler-family/#william", "ev": "Parcel A"}, {"id": "CH-0081", "d": "c. 1948–49", "s": "1948-00-00", "c": "legal", "e": "Start of the water cut-off to the farmhouse and grounds, inferred from Mrs Buckler’s 1958 statement that it had been cut off “for nearly 10 years by order of Western Ground Rents” (EV-0037, snippet only). Per a family member (voice testimony), cattle drowned in the River Ely trying to reach water (testimony; no record found). Date conflict: SC-48.", "src": "Legal Wiki, Master Timeline · EV-0037", "u": "https://greathousefarmwiki.wordpress.com/records-access-chronology/source-conflicts-register/#sc-48", "ev": "Date inferred"}, {"id": "CH-0082", "d": "2 Feb 1949", "s": "1949-02-02", "c": "heritage", "e": "John Williams’s occupancy surrendered and Frederick’s unwritten yearly agricultural occupancy from WGR begins for Parcel B. Another attempt to make occupancy permissive: the 1987 Court of Appeal judgment records Mr Williams’s arrears “in the mid-1930s and in the late 1940s”, the agreed surrender, and that “It was intended that Mr Frederick Buckler should have a written occupancy agreement, but this did not happen” (BP Properties Ltd v Buckler [1987] EWCA Civ 2; Frederick’s occupancy, surrender)", "src": "Legal Wiki, Master Timeline", "u": "https://greathousefarmwiki.wordpress.com/john-williams/#y1944", "ev": "Parcel B occupancy"}, {"id": "CH-0083", "d": "2 February 1949", "s": "1949-02-02", "c": "legal", "e": "Surrender and new yearly occupancy, as recited by the Court of Appeal", "src": "BP Properties Ltd v Buckler [1987] EWCA Civ 2, Court of Appeal, 31 July 1987, Dillon LJ, BAILII text ¶5", "u": "https://www.bailii.org/ew/cases/EWCA/Civ/1987/2.html"}, {"id": "CH-0084", "d": "June 1950 – c. 1952", "s": "1950-06-00", "c": "heritage", "e": "Mary reports that family papers including the title/farm agreement were missing from the farmhouse blanket box; a lodger later told her he had taken them at Mr Knapp’s request (Mary (Nancy) Williams, witness statement c.1974 (Mary (Nancy) Williams’s statement); papers missing)", "src": "Legal Wiki, Master Timeline", "u": "https://greathousefarmwiki.wordpress.com/1877-agreement/#papers-taken", "ev": "Parcel-A title papers"}, {"id": "CH-0085", "d": "10 Oct 1952", "s": "1952-10-10", "c": "correspondence", "e": "Landlords’ agents decide not to proceed with the letting to Frederick (1952 letter)", "src": "Legal Wiki, Master Timeline", "u": "https://greathousefarmwiki.wordpress.com/frederick-buckler/#tenancy-1949", "ev": "Parcel B"}, {"id": "CH-0086", "d": "1953", "s": "1953-00-00", "c": "history", "e": "Frederick’s last rent payment (Frederick’s occupancy)", "src": "Legal Wiki, Master Timeline", "u": "https://greathousefarmwiki.wordpress.com/frederick-buckler/#tenancy-1949", "ev": "Parcel B"}, {"id": "CH-0087", "d": "2 Feb 1955", "s": "1955-02-02", "c": "legal", "e": "High Court possession order against Frederick alone, worded for the whole farm; Mary not a party (1955 order) whole farm Nomenclaturewhole farm", "src": "Legal Wiki, Master Timeline", "u": "https://greathousefarmwiki.wordpress.com/the-two-parcels/whole-farm-nomenclature/", "ev": "← / →"}, {"id": "CH-0088", "d": "2 February 1955 to 4 July 1955", "s": "1955-02-02", "c": "legal", "e": "High Court possession order under Order 14, as recited by the Court of Appeal (the order itself is not held: EV-0032)", "src": "BP Properties Ltd v Buckler [1987] EWCA Civ 2, Court of Appeal, 31 July 1987, Dillon LJ, BAILII text ¶6", "u": "https://www.bailii.org/ew/cases/EWCA/Civ/1987/2.html"}, {"id": "CH-0089", "d": "18 Mar 1955", "s": "1955-03-18", "c": "title", "e": "Western Mail: Cardiff’s 176-acre Leckwith Woods “bought … for a nominal sum in 1942”; 106 acres leased to the Forestry Commission for 999 years. Measured: Leckwith Woods lies outside Llandough (EV-0259)", "src": "Legal Wiki, Master Timeline · EV-0259", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0259-leckwith-woods-1955-cardiff-forestry-commission-lease-and-boundary-measure/", "also": [{"source": "Media register MR-0022", "url": "https://greathousefarmwiki.wordpress.com/evidence/ev-0259-leckwith-woods-1955-cardiff-forestry-commission-lease-and-boundary-measure/"}]}, {"id": "CH-0090", "d": "4 Jul 1955", "s": "1955-07-04", "c": "legal", "e": "The 1955 order is enforced. The 1987 Court of Appeal judgment records that “possession was taken in respect of all parts of the farm except the farmhouse and garden”, and that Mrs Mary Buckler “had recently come out of hospital after having had a leg amputated and was objecting very strongly to leaving the farmhouse”. The parts taken most likely included the Parcel-A forest north of the house and the south-east ground later registered as VG41 (the 1947 OS and the Three Parts of Parcel A page) . Mary kept the farmhouse and garden; that group was not the full extent of Parcel A (enforcement)", "src": "Legal Wiki, Master Timeline", "u": "https://greathousefarmwiki.wordpress.com/1955-possession-order/#enforcement", "ev": "[PENDING: EV-0034] / Parcel B enforced / Parcel-A forest + green seized"}, {"id": "CH-0091", "d": "9 Oct 1957", "s": "1957-10-09", "c": "press", "e": "Western Mail, p.6: an item carrying the name “Mrs. M. D. BUCKLER … Llandough” (search-result snippet only; content and subject unknown)", "src": "Legal Wiki, Master Timeline", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0242-western-mail-1957-mrs-m-d-buckler-snippet/", "ev": "[EV-0242]"}, {"id": "CH-0092", "d": "9 Oct 1957", "s": "1957-10-09", "c": "press", "e": "Western Mail, 9 Oct 1957, p.6, “Mrs. M. D. BUCKLER … Llandough” (content unknown)", "src": "Media register MR-0023", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0242-western-mail-1957-mrs-m-d-buckler-snippet/"}, {"id": "CH-0093", "d": "6 May 1958", "s": "1958-05-06", "c": "heritage", "e": "Leckwith Common inquiry: Mrs Mary Doreen Buckler of Great House Farm “did not oppose the proposal so long as it applied only to playing fields”, and told the inquiry that Lord Bute had allowed her family “a slice of land” now Leckwith Common (Western Mail, 7 May 1958, EV-0035). The City of Cardiff (Leckwith Common) Compulsory Purchase Order, 1957 is confirmed on 8 Sep 1958 under the playing-fields statute (London Gazette, 31 Oct 1958, EV-0287). Leckwith Common, not Parcel A.", "src": "Legal Wiki, Master Timeline · EV-0035, EV-0287", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0287-london-gazette-31-oct-1958-p-6652-the-city-of-cardiff-leckwith-common-compulsory-p/", "ev": "Contemporary press + Gazette"}, {"id": "CH-0094", "d": "7 May 1958", "s": "1958-05-07", "c": "press", "e": "Western Mail: “City wants common for play-field” — Leckwith Common inquiry (Mrs Mary Doreen Buckler)", "src": "Media register MR-0024", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0035-western-mail-1958-leckwith-common-hearing/"}, {"id": "CH-0095", "d": "24 Sep 1958", "s": "1958-09-24", "c": "press", "e": "Western Mail: “Glamorgan County Council acquisition near Cogan Pill (WGR listed as owner)”", "src": "Media register MR-0025", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0036-western-mail-1958-gcc-acquisition-notice/"}, {"id": "CH-0096", "d": "27 Oct 1958", "s": "1958-10-27", "c": "press", "e": "London Gazette, 31 Oct 1958, p.6652: “the City of Cardiff (Leckwith Common) Compulsory Purchase Order, 1957, confirmed … on the 8th September 1958, under section 5 of the Physical Training and…", "src": "Media register MR-0026", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0287-london-gazette-31-oct-1958-p-6652-the-city-of-cardiff-leckwith-common-compulsory-p/"}, {"id": "CH-0097", "d": "31 October 1958", "s": "1958-10-31", "c": "legal", "e": "The London Gazette, 31 October 1958, p. 6652", "src": "EV-0287 (London Gazette notice)", "u": "https://www.thegazette.co.uk/London/issue/41539/page/6652"}, {"id": "CH-0098", "d": "20 Nov 1958", "s": "1958-11-20", "c": "heritage", "e": "Western Mail, p.7 (snippet only, EV-0037): “Mrs. Buckler stated that the water was cut off from her house and grounds for nearly 10 years by order of Western Ground Rents.” She told the planning committee: “This is a Welsh case of Crichel Down.” The water date conflicts with a c.1988 cut-off (SC-48). The same report, in a longer search window read in the 21 Oct 2026 sweep: “‘This is a Welsh case of Crichel Down,’ said Mrs. Buckler. ‘The Glamorgan County Council, Penarth Urban and Cardiff Rural Councils and Western Ground Rents have walked in and taken …’” (the window ends there), and the rubbish-tip lettings were “made over her head” by Western Ground Rents. Her words as reported; not a finding against any council or company. The reported reference to “Cardiff Rural Council” must be reconciled with the administrative correction in SC-22. Press Archive — unconfirmed references", "src": "Legal Wiki, Master Timeline · EV-0037", "u": "https://greathousefarmwiki.wordpress.com/evidence-library/press-archive-transcripts/", "ev": "Press snippet only — page image not seen"}, {"id": "CH-0099", "d": "20 Nov 1958", "s": "1958-11-20", "c": "press", "e": "Western Mail: “It’s a Crichel Down, states woman farmer” — Western Mail: “It’s a Crichel Down, states woman farmer” (Mrs M. D. Buckler)", "src": "Media register MR-0027", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0037-western-mail-1958-crichel-down/"}, {"id": "CH-0100", "d": "25 Nov 1958", "s": "1958-11-25", "c": "press", "e": "Commons Journal: “Hansard / Commons Journal: no petition presented against Leckwith Common order”", "src": "Media register MR-0028", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0038-hansard-1958-leckwith-common-no-petition/"}, {"id": "CH-0101", "d": "19 Nov – 11 Dec 1958", "s": "1958-12-11", "c": "history", "e": "Days 20–24 of the Ministry of Housing and Local Government public local inquiry into objections to the Glamorgan County Council Development Plan (Area No. 2); verbatim record at TNA BD 28/177 (catalogue entry; not yet read). Related plan files 1957–63: BD 28/133, BD 28/198, HLG 119, MAF 112/1108", "src": "Legal Wiki, Master Timeline", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0240-tna-bd-28-133-hlg-119-maf-112-glamorgan-development-plan-files/", "ev": "[EV-0239] / [EV-0240]"}, {"id": "CH-0102", "d": "1959", "s": "1959-00-00", "c": "title", "e": "Mary refuses a occupancy of the occupied farmhouse/buildings/garden group and asserts ownership; this was the area she could physically defend after the 1955 seizure, not the full Parcel-A extent (1959 refusal)", "src": "Legal Wiki, Master Timeline", "u": "https://greathousefarmwiki.wordpress.com/1962-possession-order/#refusal-1959", "ev": "Occupied house group"}, {"id": "CH-0103", "d": "By 1959", "s": "1959-00-00", "c": "legal", "e": "Occupancy offer for the farmhouse and garden, as recited by the Court of Appeal", "src": "BP Properties Ltd v Buckler [1987] EWCA Civ 2, Court of Appeal, 31 July 1987, Dillon LJ, BAILII text ¶7", "u": "https://www.bailii.org/ew/cases/EWCA/Civ/1987/2.html"}, {"id": "CH-0104", "d": "4 Mar 1960", "s": "1960-03-04", "c": "press", "e": "London Gazette, HM Land Registry “about to be registered” notices for Llandough land, 1960–1972 (whether farm land: not yet confirmed)", "src": "Media register MR-0030", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0231-london-gazette-land-registry-notices-llandough-1960-1972/"}, {"id": "CH-0105", "d": "29 Mar 1961", "s": "1961-03-29", "c": "title", "e": "Deed with plan between Western Ground Rents, South Western Brick & Tile Co Ltd and Cardiff City Corporation, recited on the woodland register WA735527 (pink strand) against land now in the woodland title; deed and plan not yet held (EV-0040; deeds before registration)", "src": "Legal Wiki, Master Timeline · EV-0040", "u": "https://greathousefarmwiki.wordpress.com/land-registry-titles/#deeds-before-registration", "ev": "Parcel unclear"}, {"id": "CH-0106", "d": "29 March 1961", "s": "1961-03-29", "c": "title", "e": "Deed, Western Ground Rents, South Western Brick & Tile and Cardiff City Corporation, as recorded on the register", "src": "HM Land Registry title register WA735527 (Land lying on the North East side of Leckwith Road, Llandough), accessed 18 September 2026, Charges Register entry 3", "u": "https://greathousefarmwiki.wordpress.com/wp-content/uploads/2026/09/wp-1790112812173.pdf"}, {"id": "CH-0107", "d": "1962–3", "s": "1962-00-00", "c": "heritage", "e": "E. J. Beare recovers sherds of 13th- or 14th-century pottery on the slope immediately north-east of Great House Farm, north of the church.", "src": "Holbrook & Thomas 2005, n.183", "u": "https://doi.org/10.5284/1071962"}, {"id": "CH-0108", "d": "7 Dec 1962", "s": "1962-12-07", "c": "press", "e": "Hansard (House of Commons): “Leasehold Bill: Llandough Estate in Penarth” — Commons debate on leasehold: ground rents on the Llandough Estate in Penarth (350–400 new houses) raised by two Members.", "src": "Media register MR-0031", "u": "https://hansard-api.parliament.uk/search/contributions/Spoken.json?queryParameters.searchTerm=llandough"}, {"id": "CH-0109", "d": "11 Dec 1962", "s": "1962-12-11", "c": "legal", "e": "Cardiff County Court order against Frederick and Mary for the occupied farmhouse/buildings/garden group; not enforced . This was within Parcel A but not the full Parcel-A estate (1962 order)", "src": "Legal Wiki, Master Timeline", "u": "https://greathousefarmwiki.wordpress.com/1962-possession-order/#order", "ev": "[PENDING: EV-0041] / Occupied house group"}, {"id": "CH-0110", "d": "11 December 1962", "s": "1962-12-11", "c": "legal", "e": "Cardiff County Court possession order, as recited by the Court of Appeal", "src": "BP Properties Ltd v Buckler [1987] EWCA Civ 2, Court of Appeal, 31 July 1987, Dillon LJ, BAILII text ¶9", "u": "https://www.bailii.org/ew/cases/EWCA/Civ/1987/2.html"}, {"id": "CH-0111", "d": "1963", "s": "1963-00-00", "c": "heritage", "e": "Three skeletons reported in utility-trench works (secondary research-file account; underlying 1963 record awaited) (archaeology)", "src": "Legal Wiki, Master Timeline", "u": "https://greathousefarmwiki.wordpress.com/archaeology/", "ev": "Parcel unclear"}, {"id": "CH-0112", "d": "1963", "s": "1963-00-00", "c": "heritage", "e": "Barry and Vale Archaeological Group excavates south of the church: the corner of a 12th- or 13th-century house and a gully with three human skeletons of possible 13th-century date.", "src": "Holbrook & Thomas 2005", "u": "https://doi.org/10.5284/1071962"}, {"id": "CH-0113", "d": "29 Jan – 5 Feb 1963", "s": "1963-02-05", "c": "history", "e": "Commons exchanges on Western Ground Rents Ltd and ministers (context only; nothing on Llandough or the farm) (EV-0261)", "src": "Legal Wiki, Master Timeline · EV-0261", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0261-hansard-1963-western-ground-rents-ministers/"}, {"id": "CH-0114", "d": "5 Feb 1963", "s": "1963-02-05", "c": "press", "e": "Hansard, 29 January and 5 February 1963 (with 14 November 1946): Western Ground Rents Ltd and ministers: a WGR director sent correspondence to the Lord Chancellor (11 July 1961) and to the Minister…", "src": "Media register MR-0032", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0261-hansard-1963-western-ground-rents-ministers/"}, {"id": "CH-0115", "d": "Jun 1963", "s": "1963-06-00", "c": "history", "e": "Mesne profits partly enforced against Frederick under the house-group proceedings (committal)", "src": "Legal Wiki, Master Timeline", "u": "https://greathousefarmwiki.wordpress.com/1962-possession-order/#committal", "ev": "Occupied house group"}, {"id": "CH-0116", "d": "1964–67", "s": "1964-00-0 ", "d": "19 Nov 1968", "s": "1968-11-19", "c": "press", "e": "Daily Express: “Press on the 1968–69 takeover battle for Western Ground Rents Ltd, ended by British Petroleum’s agreed bid of 15 Feb 1969 to take WGR’s properties “for their pension fund”” — press on the 1968–69 takeover battle for Western Ground Rents Ltd, ended by British Petroleum’s agreed bid of 15 Feb 1969 to take WGR’s properties “for their pension fund”", "src": "Media register MR-0033", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0288-snippets-only-press-on-the-1968-69-takeover-battle-for-western-ground-rents-ltd-en/"}, {"id": "CH-0123", "d": "15 Feb 1969", "s": "1969-02-15", "c": "title", "e": "British Petroleum makes an agreed bid for the whole of Western Ground Rents Ltd, wanting its “shops, offices, houses in London and South Wales — for their pension fund”, after rival bids from Amalgamated Investment & Property and Great Portland Estates (press snippets, EV-0288). The December 1969 sale of the farm to BP Pension Trust follows.", "src": "Legal Wiki, Master Timeline · EV-0288", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0288-snippets-only-press-on-the-1968-69-takeover-battle-for-western-ground-rents-ltd-en/", "ev": "Press snippets only"}, {"id": "CH-0124", "d": "15 Feb 1969", "s": "1969-02-15", "c": "legal", "e": "Agreed bid, British Petroleum for Western Ground Rents Ltd", "src": "Legal Wiki, Master Timeline (page 33)", "u": "https://greathousefarmwiki.wordpress.com/"}, {"id": "CH-0125", "d": "December 1969", "s": "1969-12-00", "c": "legal", "e": "Sale, Western Ground Rents to BP Pension Trust Ltd, as recited by the Court of Appeal", "src": "BP Properties Ltd v Buckler [1987] EWCA Civ 2, Court of Appeal, 31 July 1987, Dillon LJ, BAILII text ¶9", "u": "https://www.bailii.org/ew/cases/EWCA/Civ/1987/2.html"}, {"id": "CH-0126", "d": "31 Dec 1969", "s": "1969-12-31", "c": "legal", "e": "WGR sells Parcel B, plus an interest in the 1962 order on Parcel A, to BP Pension s.com/evidence/ev-0128-ggat-letter-reserved-matters-approval/"}, {"id": "CH-0283", "d": "27 Jul 1992", "s": "1992-07-27", "c": "heritage", "e": "GGAT to the council: the 1990 assessment “demonstrated conclusively that significant archaeological deposits exist within the proposed development area … including a quantity of human bone”. GGAT urges excavation to “preserve by record” before development. Page 2 of the letter is missing from the file.", "src": "Planning file 92/00671, archaeology responses p.4", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0128-ggat-letter-reserved-matters-approval/"}, {"id": "CH-0284", "d": "14 May – 3 Sep 1992", "s": "1992-09-03", "c": "heritage", "e": "Reserved matters 92/00671/RES (20 houses, Ideal Homes Wales) submitted and approved on 3 September 1992 under outline 89/01396/OUT; no additional archaeology condition, outline conditions 16–18 applied; GGAT had urged mitigation on 27 July 1992 (redevelopment · EV-0128 planning file 92/00671) whole farm Nomenclaturewhole farm", "src": "Legal Wiki, Master Timeline · EV-0128", "u": "https://greathousefarmwiki.wordpress.com/the-two-parcels/whole-farm-nomenclature/", "ev": "← / →"}, {"id": "CH-0285", "d": "3 September 1992", "s": "1992-09-03", "c": "legal", "e": "Approved planning drawings 92/00671/RES", "src": "EV-0129", "u": "https://greathousefarmwiki.wordpress.com/wp-content/uploads/2026/09/wp-1790112987191.pdf"}, {"id": "CH-0286", "d": "3 Sep 1992", "s": "1992-09-03", "c": "heritage", "e": "The council’s Chief Planning and Development Officer approves 92/00671/RES. No additional archaeological condition is imposed. Holbrook & Thomas (2005) and the developer’s 1994 preliminary report call this “full planning permission” in “March 1992”.", "src": "Planning file 92/00671 (approval stamp; archaeology responses pp.24–25, 29)", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0128-ggat-letter-reserved-matters-approval/"}, {"id": "CH-0287", "d": "26 Aug 1993", "s": "1993-08-26", "c": "press", "e": "South Wales Echo feature on Roman occupation (Llandough villa) — Feature on 400 years of Roman occupation in the area, citing the excavation of a substantial Roman villa at Llandough.", "src": "Media register MR-0083", "u": "https://www.britishnewspaperarchive.co.uk/search/results/1993-01-01/1996-12-31?basicsearch=%2Bllandough%20%2Bexcavation&exactsearch=false&retrievecountrycounts=false"}, {"id": "CH-0288", "d": "Dec 1993", "s": "1993-12-00", "c": "heritage", "e": "Groundworks begin before the archaeological condition is met (archaeology) whole farm Nomenclaturewhole farm", "src": "Legal Wiki, Master Timeline", "u": "https://greathousefarmwiki.wordpress.com/the-two-parcels/whole-farm-nomenclature/", "ev": "← / →"}, {"id": "CH-0289", "d": "3 Dec 1993", "s": "1993-12-03", "c": "title", "e": "BP transfers to Ideal Homes (later dealings) whole farm Nomenclaturewhole farm", "src": "Legal Wiki, Master Timeline", "u": "https://greathousefarmwiki.wordpress.com/the-two-parcels/whole-farm-nomenclature/", "ev": "← / →"}, {"id": "CH-0290", "d": "3 Dec 1993", "s": "1993-12-03", "c": "title", "e": "Transfer, BP Properties Ltd to Ideal Homes, registered on WA231076", "src": "HMLR schedule 30 Jul 2026", "u": "https://csscpsg.bucklerfamily.estate/"}, {"id": "CH-0291", "d": "3 Dec 1993", "s": "1993-12-03", "c": "heritage", "e": "BP Properties Ltd to Ideal Homes Wales (title WA231076).", "src": "Master Timeline", "u": "https://greathousefarmwiki.wordpress.com/timeline/"}, {"id": "CH-0292", "d": "13 & 15 Dec 1993", "s": "1993-12-15", "c": "heritage", "e": "Building has started. GGAT, the council’s archaeological adviser, writes that condition 18 “has not been fulfilled and cannot be discharged by your Authority” and recommends “a Breach of Condition notice is issued immediately”.", "src": "Planning file 92/00671, archaeology responses pp.1–2; EV-0131", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0131-glamorgan-gwent-archaeological-trust-letters-on-ar/"}, {"id": "CH-0293", "d": "1994", "s": "1994-00-00", "c": "heritage", "e": "Home Office licence to remove human remains (21 Mar); “preservation by record” agreed (4 May); Cotswold Archaeological Trust excavates the cemetery: 1,026 burials; building work outside the dig disturbs “probably at least 30”, 2 recorded (archaeology; EV-0900)", "src": "Legal Wiki, Master Timeline · EV-0900", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0900-archaeology-1990-ggat-evaluation-and-1994-excavation/", "ev": "Parcel unclear"}, {"id": "CH-0294", "d": "1994 – 1996", "s": "1994-00-00", "c": "heritage", "e": "Ideal Homes (Wales) build “Churchview Close”, Llandough (first buyers by January 1995); Persimmon buys Ideal Homes in early 1996. South Wales Echo, 22 Apr 1995: the council paid “contractors working on the nearby Great House Farm housing development to improve the grassed area” of the village green (snippets, EV-0276; whether Churchview Close is the farm site itself: to be checked).", "src": "Legal Wiki, Master Timeline · EV-0276", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0276-churchview-close-llandough-ideal-homes-persimmon-1994-1996/", "ev": "Press snippets only"}, {"id": "CH-0295", "d": "1994", "s": "1994-00-00", "c": "heritage", "e": "“At an early stage it became clear that the site contained numerous burials that continued beyond the bounds of the agreed excavation area.” Excavation extended to 0.22 ha: 1,026 burials. Work ceased September 1994. (The HER event record gives 858 inhumations.)", "src": "Holbrook & Thomas 2005; Heneb HER GGATE003875, GGAT02272s", "u": "https://doi.org/10.5284/1071962"}, {"id": "CH-0296", "d": "1994", "s": "1994-00-00", "c": "heritage", "e": "Building work outside the excavation area disturbed “probably at least 30” burials; two were recovered by salvage recording.", "src": "Holbrook & Thomas 2005", "u": "https://doi.org/10.5284/1071962"}, {"id": "CH-0297", "d": "12 January 1994", "s": "1994-01-12", "c": "legal", "e": "Ideal Homes Wales, Llandough Farm: Village Green planting plan (received stamp)", "src": "EV-0133", "u": "https://greathousefarmwiki.wordpress.com/wp-content/uploads/2026/09/wp-1790112987583.pdf"}, {"id": "CH-0298", "d": "4 Feb 1994", "s": "1994-02-04", "c": "heritage", "e": "After a site meeting on 18 Jan 1994, the developer’s agent cites the developer’s counsel’s opinion that condition 18 “has been discharged and that the approval of the detailed plans and the notice issued by your council are decisive as to that”.", "src": "Planning file 92/00671, archaeology responses pp.24–25", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0128-ggat-letter-reserved-matters-approval/"}, {"id": "CH-0299", "d": "Mar 1994", "s": "1994-03-00", "c": "heritage", "e": "Cotswold Archaeological Trust commissioned (by Wyn Thomas & Partners for Ideal Homes Wales Ltd) to excavate about 0.1 ha. Home Office burial licence granted 21 Mar 1994. GGAT’s letter of 18 May 1994 records that it expired on 21 Apr 1994 and had not been renewed by 3 May; the agent’s note of 5 May gives it as running to 20 Jul 1994.", "src": "Heneb HER GGATE003875; Holbrook & Thomas 2005; Planning file 92/00671, archaeology responses pp.38–40", "u": "https://archwilio.org.uk/her/chi3/report/page.php?watprn=GGATE003875"}, {"id": "CH-0300", "d": "29 Apr 1994", "s": "1994-04-29", "c": "press", "e": "South Wales Echo: “Burial ground find sparks Romans or Dark Ages conflict” — News report: an extensive burial ground found in trial excavations at Llandough, on land bought for a luxury housing development; archaeologists had uncovered 30 skeletons with traces of Roman timber buildings and fragments of Roman pottery in a 10-week dig by the Cotswold Archaeological Trust; the find \"could prove to be one of the most important in…", "src": "Media register MR-0084", "u": "https://www.britishnewspaperarchive.co.uk/search/results/1994-04-29/1994-04-29?basicsearch=llandough&exactsearch=false&retrievecountry 5", "d": "28 Jul 1994", "s": "1994-07-28", "c": "heritage", "e": "Finds donated to Amgueddfa Cymru (accession 95.56H) by Ideal Homes Wales Ltd.", "src": "EV-0293", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0293-llandough-1994-cemetery-excavation-her-ggat02272s-museum-wales-95-56h-burial-631/"}, {"id": "CH-0306", "d": "15 Sep 1994", "s": "1994-09-15", "c": "press", "e": "Cardiff Post: “Church View Close: first three homes released” — Property feature: Ideal Homes (Wales) released the first three homes at the new Church View Close development on the brow of Llandough Hill, the former farm site.", "src": "Media register MR-0085", "u": "https://www.britishnewspaperarchive.co.uk/search/results/1994-09-13/1994-09-16?basicsearch=llandough&exactsearch=false&retrievecountrycounts=false"}, {"id": "CH-0307", "d": "12 Oct 1994", "s": "1994-10-12", "c": "press", "e": "South Wales Echo: “WHEN OLD LEGAL DOCUMENTS WERE FOUND TIPPED BY THE ROADSIDE” — Comment piece: pre-1976 files of a Cardiff law firm (Leo Abse and Cohen) found dumped in a layby on Leckwith Road near Llandough.", "src": "Media register MR-0086", "u": "https://www.britishnewspaperarchive.co.uk/search/results/1994-10-11/1994-10-14?basicsearch=llandough&exactsearch=false&retrievecountrycounts=false"}, {"id": "CH-0308", "d": "12 Oct 1994", "s": "1994-10-12", "c": "press", "e": "South Wales Echo: “Leo Abse and Cohen files found in layby near Llandough (p.5 news report)” — News report (p.5): files and receipt books of the Cardiff law firm Leo Abse and Cohen, all dated before 1976, found by passers-by on Leckwith Road near Llandough.", "src": "Media register MR-0087", "u": "https://www.britishnewspaperarchive.co.uk/search/results/1994-10-11/1994-10-14?basicsearch=llandough&exactsearch=false&retrievecountrycounts=false"}, {"id": "CH-0309", "d": "27 Oct 1994", "s": "1994-10-27", "c": "press", "e": "Cardiff Post: “Ideal Homes Wales' latest location Churchview Close” — Property feature on Churchview Close: fo 9", "u": "https://www.britishnewspaperarchive.co.uk/search/results/1995-01-30/1995-02-04?basicsearch=llandough&exactsearch=false&retrievecountrycounts=false"}, {"id": "CH-0315", "d": "16 Mar 1995", "s": "1995-03-16", "c": "press", "e": "South Wales Echo: “LLANDOUGH IDEAL: A third of the Church View Close development has been sold” — Property column: a third of Church View Close sold by March 1995.", "src": "Media register MR-0090", "u": "https://www.britishnewspaperarchive.co.uk/search/results/1995-03-13/1995-03-18?basicsearch=llandough&exactsearch=false&retrievecountrycounts=false"}, {"id": "CH-0316", "d": "5 Oct 1995", "s": "1995-10-05", "c": "press", "e": "South Wales Echo: “Jenny has the right idea” — Property feature: Ideal Homes development next to St Dochdwy's Church; the name Church View Close chosen by a local Sunday School child.", "src": "Media register MR-0091", "u": "https://www.britishnewspaperarchive.co.uk/search/results/1994-01-01/1996-12-31?basicsearch=%22church%20view%20close%22&exactsearch=true&retrievecountrycounts=false"}, {"id": "CH-0317", "d": "26 Jun 1996", "s": "1996-06-26", "c": "press", "e": "London Gazette, 3 July 1996 (p.8990) and 18 April 1997 (p.4683): Western Ground Rents Ltd’s members’ voluntary winding-up: notice to creditors (“All known Creditors have been or will be paid in…", "src": "Media register MR-0092", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0277-london-gazette-1996-1997-western-ground-rents-creditors-and-final-meetings/"}, {"id": "CH-0318", "d": "3 Jul 1996", "s": "1996-07-03", "c": "press", "e": "London Gazette, 3 July 1996 (Issue 54455, p. 8982): Western Ground Rents Ltd (no. 342092) placed in members’ voluntary l", "src": "Media register MR-0093", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0249-london-gazette-3-jul-1996-western-ground-rents-bp-group-liquidation/"}, {"id": "CH-0319", "d": "Sep 1996", "s": "1996-09-00", "c": "press", "e": "South Wales Echo: “Press set, 1994–1996: Ideal H  theory): Parcel A did pass to WGR, and WGR gave part of its woods to Cardiff. On this reading the givers held Parcel A, or acted as if they did, while Mary (Nancy) Williams asserted that she owned it (our case, 20 Oct 2026). Support: WGR let land at Llandough from 1939 to 1963 (Glamorgan Archives DBDT123/7–13; Woodland & Land-Transfer Assessment). Test: the same 1938 conveyance and 1942 plan.Possible connection: the 1949 attempt to make Mary’s Parcel-A occupancy appear permissive (2 Feb 1949; SOURCE PENDING) and the 29 Mar 1961 deed between WGR, South Western Brick & Tile and “Cardiff City”, recited on the Forest of Cardiff woodland title WA735527, pink strand (GHF-E129; EV-0040), may relate to this gift (our case, 20 Oct 2026). Test: the 1961 deed and its plan, from the HM Land Registry title files.\n1941–43", "s": "2026-10-20", "c": "history", "e": "National Farm Survey, Penarth parish bundle (TNA MAF 32/1220/39; catalogue entry, not seen). That Great House Farm’s form is in this bundle is an inference (Llandough was added to Penarth in 1902); the forms of this series generally record occupier, owner and water supply", "src": "Legal Wiki, Master Timeline", "u": "https://greathousefarmwiki.wordpress.com/evidence/ev-0241-tna-maf-32-1220-39-national-farm-survey-penarth-1941/", "ev": "[EV-0241]"}, {"id": "CH-0520", "d": "19–20 Oct 2026", "s": "2026-10-20", "c": "legal", "e": "Preservation notice to HMCTS: index entries, warrants or bailiff returns", "src": "Preservation notice", "u": "https://email.bucklerfamily.estate/"}, {"id": "CH-0521", "d": "20 Oct 2026", "s": "2026-10-20", "c": "title", "e": "HM Land Registry EIR request (first-registration and amalgamation documents)", "src": "EIR (D260928 thread)", "u": "https://email.bucklerfamily.estate/"}, {"id": "CH-0522", "d": "20 Oct 2026", "s": "2026-10-20", "c": "legal", "e": "Llandough Community Council narrowed FOI request", "src": "FOI", "u": "https://email.bucklerfamily.estate/"}, {"id": "CH-0523", "d": "20 Oct 20 const D=JSON.parse(document.getElementById('cdata').textContent);
const L={"history": "History", "heritage": "Heritage", "title": "Title", "legal": "Legal", "press": "Press", "social": "Social", "correspondence": "Correspondence"};let c='',q='';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const bar=document.getElementById('cats');
function btns(){let h='<button type="button" data-c="" aria-pressed="'+(!c)+'">All</button>';Object.keys(L).forEach(k=>{const n=D.filter(x=>x.c===k).length;if(n)h+='<button type="button" data-c="'+k+'" aria-pressed="'+(c===k)+'">'+L[k]+' '+n+'</button>';});bar.innerHTML=h;}
bar.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;c=b.dataset.c;btns();draw();});
function short(t){return t.length>120?t.slice(0,117).replace(/\s+\S*$/,'')+'…':t;}
function item(x){let h='<details class="it" id="'+esc(x.id)+'"><summary><span class="d">'+esc(x.d)+'</span><span class="cat">'+esc(L[x.c]||x.c)+'</span><span class="t">'+esc(short(x.e))+'</span></summary><div class="body">';
 if(x.yt)h+='<div class="yt"><button type="button" data-v="'+esc(x.yt)+'" style="background-image:url(https://i.ytimg.com/vi/'+esc(x.yt)+'/hqdefault.jpg)">▶ Play</button></div>';
 h+='<p>'+esc(x.e)+'</p><p class="src">'+esc(x.src)+(x.ev?' · '+esc(x.ev):'')+'</p><p class="links">';
 if(x.u)h+='<a href="'+esc(x.u)+'" rel="noopener" target="_blank">Source</a>';
 if(x.w)h+='<a href="'+esc(x.w)+'" rel="noopener" target="_blank">Archived copy</a>';
 (x.also||[]).forEach((a,i)=>{h+='<a href="'+esc(a.url)+'" rel="noopener" target="_blank">Also '+(i+1)+'</a>';});
 h+='<a href="#'+esc(x.id)+'">'+esc(x.id)+'</a></p></div></details>';return h;}
function era(s){const y=parseInt(s.slice(0,4),10);if(isNaN(y)||y>=9999)return 'Undated';if(y<1800)return 'Before 1800';if(y<1900)return '1800s';if(y<1950)return '1900–1949';if(y<1980)return '1950–1979';if(y<2000)return String(y).slice(0,3)+'0s';if(y<2026)return '2000–2025';return '2026';}
function draw(){const qq=q.toLowerCase();const f=D.filter(x=>(!c||x.c===c)&&(!qq||(x.e+' '+x.d+' '+x.src).toLowerCase().includes(qq)));
 document.getElementById('cnt').textContent=f.length;const g={},order=[];
 f.forEach(x=>{const k=era(x.s);if(!g[k]){g[k]=[];order.push(k);}g[k].push(x);});
 const open=!!qq;let h='';order.forEach(k=>{h+='<details class="dec"'+(open?' open':'')+'><summary><span>'+k+' <span class="o">'+g[k].length+'</span></span></summary>'+g[k].map(item).join('')+'</details>';});
 document.getElementById('list').innerHTML=h||'<p class="lead">No events match.</p>';}
