 const qq=q.toLowerCase();const f=D.filter(x=>(!ty||x.type===ty)&&(!qq||JSON.stringify(x).toLowerCase().includes(qq)));
 document.getElementById('cnt').textContent=f.length;const g={};
 f.forEach(x=>{const k=/^\d{4}/.test(x.date||'')?x.date.slice(0,3)+'0s':'Undated';(g[k]=g[k]||[]).push(x);});
 const open=!!qq||!!ty;let h='';Object.keys(g).sort().forEach(k=>{h+='<details class="dec"'+(open?' open':'')+'><summary><span>'+k+' <span class="o">'+g[k].length+'</span></span></summary>'+g[k].map(item).join('')+'</details>';});
 document.getElementById('list').innerHTML=h||'<p class="lead">No items match.</p>';}
document.getElementById('q').addEventListener('input',e=>{q=e.target.value;draw();});
document.getElementById('all').onclick=function(){const ds=document.querySelectorAll('#list details');const o=this.textContent==='Expand all';ds.forEach(d=>d.open=o);this.textContent=o?'Collapse all':'Expand all';};
document.getElementById('list').addEventListener('click',e=>{const b=e.target.closest('.yt button');if(!b)return;const f=document.createElement('iframe');f.loading='lazy';f.allow='accelerometer; encrypted-media; gyroscope; picture-in-picture';f.allowFullscreen=true;f.title='YouTube video';f.src='https://www.youtube-nocookie.com/embed/'+b.dataset.v+'?autoplay=1&rel=0';b.replaceWith(f);});
draw();if(location.hash){const el=document.getElementById(location.hash.slice(1));if(el){let p=el.parentElement;while(p){if(p.tagName==='DETAILS')p.open=true;p=p.parentElement;}el.open=true;el.scrollIntoView();}}
})();
</script></body></html>
