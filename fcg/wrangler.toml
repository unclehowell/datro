name = "fcg-wp"
main = "src/index.js"

# theme assets bundled into the Worker (20 Oct 2026)
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[rules]]
type = "Text"
globs = ["**/*.css", "src/theme.js", "**/*.txt"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.woff2"]
fallthrough = true

[vars]
ENVIRONMENT = "production"
SITE_TITLE = "FCG Edge CMS"
WP_SOURCE_URL = "https://greathousefarmwiki.wordpress.com"

[[d1_databases]]
binding = "DB"
database_name = "fcg-wp-d1"
database_id = "a15aedf1-a4d3-49fe-bd28-c2974c323b96"
