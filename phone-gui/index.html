<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#09090b">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.svg">
  <title>AgentOS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #09090b; --surface: #18181b; --border: #27272a;
      --text: #d0c8b8; --muted: #71717a; --amber: #f59e0b;
      --amber-bright: #e8b84e; --green: #22c55e; --red: #ef4444;
    }
    body { background: var(--bg); color: var(--text); font-family: 'SF Mono', 'Fira Code', monospace; font-size: 14px; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
    header h1 { font-size: 16px; font-weight: 600; color: var(--amber); letter-spacing: 0.5px; }
    .status { display: flex; align-items: center; gap: 6px; margin-left: auto; font-size: 12px; color: var(--muted); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
    .status-dot.offline { background: var(--red); }
    #pipeline { display: flex; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; flex-wrap: wrap; }
    .pipeline-step { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: var(--bg); border: 1px solid var(--border); color: var(--muted); }
    .pipeline-step.active { border-color: var(--amber); color: var(--amber); }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: var(--amber); color: #000; border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg .source { font-size: 10px; color: var(--muted); margin-top: 4px; }
    .welcome { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 13px; line-height: 1.8; }
    .welcome h2 { color: var(--amber); font-size: 18px; margin-bottom: 8px; }
    #input-bar { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
    #input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text); font-family: inherit; font-size: 14px; resize: none; outline: none; max-height: 120px; }
    #input:focus { border-color: var(--amber); }
    #sendBtn { background: var(--amber); color: #000; border: none; border-radius: 8px; padding: 10px 20px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
    #sendBtn:disabled { opacity: 0.5; }
    .typing { display: flex; gap: 4px; padding: 10px 14px; }
    .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.4s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
    #providerBadge { font-size: 10px; padding: 2px 6px; border-radius: 3px; background: var(--bg); border: 1px solid var(--border); }
    .status-cards { display: none; padding: 8px 16px; gap: 6px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
    .status-cards.show { display: flex; }
    .status-card { font-size: 10px; padding: 4px 8px; border-radius: 4px; background: var(--bg); border: 1px solid var(--border); display: flex; align-items: center; gap: 4px; }
    .status-card .dot { width: 6px; height: 6px; border-radius: 50%; }
    .status-card .dot.on { background: var(--green); }
    .status-card .dot.off { background: var(--red); }
    @media (max-width: 480px) { body { font-size: 15px; } .msg { max-width: 90%; } }
  </style>
</head>
<body>
  <header>
    <h1>AgentOS</h1>
    <span id="providerBadge">minicpm</span>
    <div class="status">
      <span id="statusText">connecting...</span>
      <div id="statusDot" class="status-dot offline"></div>
    </div>
  </header>
  <div id="statusCards" class="status-cards"></div>
  <div id="pipeline"></div>
  <div id="messages">
    <div class="welcome" id="welcome">
      <h2>AgentOS Phone</h2>
      <div>Local MiniCPM5-1B &bull; Groq fallback<br>
      Child proxy &bull; port 6000<br><br>
      Type a message to begin.</div>
    </div>
  </div>
  <div id="input-bar">
    <textarea id="input" rows="1" placeholder="Ask anything..."></textarea>
    <button id="sendBtn">Send</button>
  </div>
  <script>
    const messages = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const providerBadge = document.getElementById('providerBadge');
    const pipeline = document.getElementById('pipeline');
    const welcome = document.getElementById('welcome');
    const chatHistory = [];
    let sending = false;

    async function checkHealth() {
      try {
        const r = await fetch('/api/health');
        const d = await r.json();
        statusDot.className = 'status-dot';
        statusText.textContent = `online ${d.uptime_s ? Math.floor(d.uptime_s/60) + 'm' : ''}`;
      } catch(e) {
        statusDot.className = 'status-dot offline';
        statusText.textContent = 'offline';
      }
    }
    checkHealth();
    setInterval(checkHealth, 15000);

    async function checkStatus() {
      try {
        const r = await fetch('/api/status');
        const d = await r.json();
        const cards = document.getElementById('statusCards');
        let html = '';
        const omniOk = d.omniroute?.status === 'ok';
        html += `<div class="status-card"><div class="dot ${omniOk ? 'on' : 'off'}"></div>OmniRoute</div>`;
        const hermesOk = d.hermes?.online;
        html += `<div class="status-card"><div class="dot ${hermesOk ? 'on' : 'off'}"></div>Hermes</div>`;
        const modelCount = d.models?.length || 0;
        html += `<div class="status-card"><div class="dot ${modelCount > 0 ? 'on' : 'off'}"></div>Models: ${modelCount}</div>`;
        cards.innerHTML = html;
        cards.classList.add('show');
      } catch(e) {}
    }
    checkStatus();
    setInterval(checkStatus, 30000);

    // Toggle status cards on status dot click
    statusDot.addEventListener('click', () => {
      const cards = document.getElementById('statusCards');
      cards.classList.toggle('show');
    });

    function addMsg(role, content, source, videoUrl) {
      if (welcome) welcome.remove();
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      if (videoUrl) {
        const vid = document.createElement('video');
        vid.src = videoUrl;
        vid.controls = true;
        vid.autoplay = true;
        vid.loop = true;
        vid.style.cssText = 'max-width:100%;border-radius:8px;';
        div.appendChild(vid);
      } else {
        div.textContent = content;
      }
      if (source) {
        const s = document.createElement('div');
        s.className = 'source';
        s.textContent = source;
        div.appendChild(s);
      }
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    function showPipeline(bc) {
      pipeline.innerHTML = '';
      if (!bc) return;
      const steps = bc.split(' → ');
      steps.forEach((step, i) => {
        const el = document.createElement('span');
        el.className = 'pipeline-step' + (i === steps.length - 1 ? ' active' : '');
        el.textContent = step.trim();
        pipeline.appendChild(el);
      });
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'msg assistant';
      div.id = 'typing';
      div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById('typing');
      if (t) t.remove();
    }

    async function send() {
      const text = input.value.trim();
      if (!text || sending) return;
      sending = true;
      sendBtn.disabled = true;
      input.value = '';
      input.style.height = 'auto';

      addMsg('user', text);
      chatHistory.push({ role: 'user', content: text });
      showTyping();

      try {
        const r = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: chatHistory }),
        });
        const data = await r.json();
        removeTyping();

        if (data.error) {
          addMsg('assistant', 'Error: ' + data.error);
        } else if (data.choices && data.choices.length > 0) {
          const content = data.choices[0].message.content;
          const source = data._breadcrumb || data._source || '';
          const videoUrl = data.videoUrl || null;
          addMsg('assistant', content, source, videoUrl);
          chatHistory.push({ role: 'assistant', content: content });
          showPipeline(data._breadcrumb);
          if (data._source) providerBadge.textContent = data._source;
        }
      } catch(e) {
        removeTyping();
        addMsg('assistant', 'Network error: ' + e.message);
      }
      sending = false;
      sendBtn.disabled = false;
      input.focus();
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });
  </script>
</body>
</html>
