<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCUK Command Bridge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="vehicle-theme">
    <div id="overlay-glare"></div>

    <header class="bridge-header">
        <div class="brand">FCUK COMMAND BRIDGE <span id="version-badge" class="version-badge">v0.0.0</span></div>
        <div class="system-stats">
            <div class="stat-box">
                <label>BRANCHES</label>
                <span id="branch-count">0</span>
            </div>
            <div class="stat-box">
                <label>AWS UPTIME</label>
                <span id="aws-status">OFFLINE</span>
            </div>
            <div class="stat-box">
                <label>FLYWHEEL</label>
                <span id="flywheel-state">STANDBY</span>
            </div>
        </div>
        <div class="header-actions">
            <button onclick="toggleModal('telemetry-modal')" class="btn-head">TELEMETRY</button>
            <button onclick="toggleModal('comms-popup')" class="btn-head">INTERCOM</button>
        </div>
    </header>

    <main class="cockpit">
        <section class="windscreen">
            <div class="plan-column left">
                <div class="column-header">
                    <h3>LEFT PLANS</h3>
                    <button id="btn-collapse-left" class="btn-mini" title="Collapse all">[-]</button>
                </div>
                <div id="branch-tree-left" class="tree-container"></div>
            </div>

            <div class="center-glass">
                <div class="editor-header">
                    <div class="editor-breadcrumb">
                        <span id="active-branch-path">NO FILE SELECTED</span>
                        <span id="active-side-badge" class="side-badge"></span>
                    </div>
                    <div class="editor-actions">
                        <span id="file-exists-indicator" class="file-badge"></span>
                        <button id="btn-save-plan" class="btn-glow" disabled>SAVE</button>
                    </div>
                </div>
                <textarea id="plan-editor" placeholder="Select a file from the left or right explorer..."></textarea>
            </div>

            <div class="plan-column right">
                <div class="column-header">
                    <h3>RIGHT PLANS</h3>
                    <button id="btn-collapse-right" class="btn-mini" title="Collapse all">[-]</button>
                </div>
                <div id="branch-tree-right" class="tree-container"></div>
            </div>
        </section>

        <section class="dashboard-base">
            <div class="instrument-cluster">
                <div class="fuel-bank">
                    <div class="gauge-vertical">
                        <div class="gauge-bar"><div id="fuel-api" class="gauge-fill" style="height: 80%"></div></div>
                        <label class="sideways">API</label>
                    </div>
                    <div class="gauge-vertical">
                        <div class="gauge-bar"><div id="fuel-llm" class="gauge-fill" style="height: 65%"></div></div>
                        <label class="sideways">LLM</label>
                    </div>
                    <div class="gauge-vertical">
                        <div class="gauge-bar"><div id="fuel-cli" class="gauge-fill" style="height: 90%"></div></div>
                        <label class="sideways">CLI</label>
                    </div>
                    <div class="gauge-vertical">
                        <div class="gauge-bar"><div id="fuel-ide" class="gauge-fill" style="height: 40%"></div></div>
                        <label class="sideways">IDE</label>
                    </div>
                </div>
                <div class="status-panel">
                    <div class="digital-readout">
                        <label>BIAS POSITION</label>
                        <div class="value" id="bias-label">50/50</div>
                    </div>
                    <div class="digital-readout">
                        <label>RELEASE GEAR</label>
                        <div class="value" id="gear-readout">6</div>
                    </div>
                </div>
            </div>

            <div class="main-console">
                <div class="bias-shifter">
                    <div class="bias-label">STEERING BIAS</div>
                    <div class="bias-slider-container">
                        <input type="range" id="bias-slider" min="1" max="5" value="3" step="1">
                        <div class="bias-notches">
                            <span data-pos="1">STRICT L</span>
                            <span data-pos="2">FAVOUR L</span>
                            <span data-pos="3">NEUTRAL</span>
                            <span data-pos="4">FAVOUR R</span>
                            <span data-pos="5">STRICT R</span>
                        </div>
                    </div>
                </div>

                <div class="gear-shifter">
                    <div class="gear-label">RELEASE GEAR</div>
                    <div class="gear-display" id="gear-display">6</div>
                    <input type="range" id="gear-range" min="1" max="10" value="6" step="1">
                    <div class="gear-notches">
                        <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal Systems -->
    <div id="telemetry-modal" class="modal-overlay" onclick="closeOnOverlay(event)">
        <div class="modal-content">
            <div class="terminal-container">
                <div class="terminal-header">
                    <span>LIVE SYSTEM TELEMETRY</span>
                    <div class="terminal-actions">
                        <button id="btn-ota" class="btn-terminal">OTA</button>
                        <button id="btn-meta" class="btn-terminal">META</button>
                        <button id="btn-toggle-pause" class="btn-terminal">PAUSE</button>
                        <button id="btn-clear-logs" class="btn-terminal">CLEAR</button>
                        <button onclick="toggleModal('telemetry-modal')" class="btn-terminal">CLOSE</button>
                    </div>
                </div>
                <pre id="log-content"></pre>
            </div>
        </div>
    </div>

    <div id="comms-popup" class="popup-box">
        <div class="intercom-container">
            <div class="terminal-header">
                <span>COMMAND INTERCOM</span>
                <button onclick="toggleModal('comms-popup')" class="btn-terminal">_</button>
            </div>
            <div id="chat-messages"></div>
            <div class="chat-input-row">
                <input type="text" id="chat-input" placeholder="Instruct design change...">
                <button id="btn-send-chat">SEND</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
