<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Branch Graph | COMMAND</title><style>* { margin: 0; padding: 0; box-sizing: border-box; }body { background: #0d0d2b; color: #e0e0e0; font-family: monospace; overflow: hidden; height: 100vh; }#graph { width: 100%; height: 100vh; }.node { cursor: pointer; }.node circle { stroke: #fff; stroke-width: 1.5; }.node text { fill: #e0e0e0; font-size: 10px; pointer-events: none; }.link { stroke: rgba(255,255,255,0.15); stroke-width: 1; }.link.release { stroke: #4ecdc4; stroke-width: 1.5; stroke-dasharray: 4,2; }.label { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(13,13,43,0.9); padding: 8px 16px; border: 1px solid #4ecdc4; border-radius: 4px; font-size: 12px; color: #4ecdc4; white-space: nowrap; pointer-events: none; }.legend { position: fixed; top: 20px; right: 20px; background: rgba(13,13,43,0.9); padding: 12px; border: 1px solid #333; border-radius: 4px; font-size: 11px; }.legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }.legend-dot { width: 10px; height: 10px; border-radius: 50%; }.tooltip { position: fixed; background: rgba(0,0,0,0.85); border: 1px solid #4ecdc4; border-radius: 4px; padding: 8px 12px; font-size: 12px; pointer-events: none; display: none; z-index: 100; }h1 { position: fixed; top: 20px; left: 20px; font-size: 14px; color: #4ecdc4; text-transform: uppercase; letter-spacing: 2px; z-index: 10; }</style></head><body><h1>BRANCH GRAPH</h1><div class="legend" id="legend"></div><div class="tooltip" id="tooltip"></div><div class="label">Drag nodes · Scroll to zoom · Hover for details</div><svg id="graph"></svg><script src="https://d3js.org/d3.v7.min.js"></script><script>const BRANCH_COLORS = {  althea:'#ff6b6b', archives:'#c9a96e', bpvsbuckler:'#4ecdc4', 'bpvsbuckler-redflag':'#ff4444',  bucklervsbp:'#45b7d1', bw_base:'#96ceb4', carfinancecheque:'#45b7d1',  ccan:'#96ceb4', ceo:'#ffeead', cnei:'#ff4444', command:'#00e5ff', dash:'#d4a574',  datro:'#00e5ff', dcc:'#ffd93d', financecheque:'#6bcb77',  'financecheque-monday-agent':'#6bcb77', 'gh-pages':'#748ffc', gui:'#ff6b6b',  hbnb:'#ff922b', library:'#69db7c', llmwiki:'#f783ac',  pirateclaw:'#be4bdb', rerelease:'#20c997', subrepos:'#748ffc',  ui:'#20c997', wave:'#f06595', wayback:'#a9e34b', whitepaper:'#e8590c'};const BRANCH_CATEGORIES = {  platform: ['cnei','command','gh-pages','rerelease'],  frontend: ['gui','ui','dash','hbnb'],  docs: ['wayback','library','llmwiki','whitepaper','althea','archives'],  finance: ['financecheque','carfinancecheque','financecheque-monday-agent'],  legal: ['bpvsbuckler','bpvsbuckler-redflag','bucklervsbp'],  core: ['datro','dcc','ccan','ceo','subrepos','bw_base'],  experimental: ['wave','pirateclaw']};const RELEASES_URL = 'https://api.github.com/repos/unclehowell/datro/releases?per_page=100';const width = window.innerWidth;const height = window.innerHeight;const svg = d3.select('#graph')  .attr('width', width)  .attr('height', height);const g = svg.append('g');const tooltip = document.getElementById('tooltip');const zoom = d3.zoom()  .scaleExtent([0.1, 4])  .on('zoom', (event) => g.attr('transform', event.transform));svg.call(zoom);async function buildGraph() {  const branches = Object.keys(BRANCH_COLORS);  const nodes = branches.map(name => ({ id: name, color: BRANCH_COLORS[name] || '#888' }));  const links = [];  // Get releases to build connections  let releases = [];  try {    const res = await fetch(RELEASES_URL);    releases = await res.json();  } catch(e) {}  // Build links from shared release patterns  const branchReleases = {};  if (Array.isArray(releases)) {    for (const r of releases) {      for (const b of branches) {        if (r.tag_name.startsWith(b + '-v')) {          if (!branchReleases[b]) branchReleases[b] = [];          branchReleases[b].push(r.tag_name);        }      }    }  }  // Connect branches that share release proximity (released around the same time)  const allDates = [];  if (Array.isArray(releases)) {    for (const r of releases) {      for (const b of branches) {        if (r.tag_name.startsWith(b + '-v')) {          allDates.push({ branch: b, date: new Date(r.published_at).getTime(), tag: r.tag_name });        }      }    }  }  allDates.sort((a, b) => a.date - b.date);  // Link consecutive releases from different branches (within 2 hours)  for (let i = 1; i < allDates.length; i++) {    const prev = allDates[i - 1];    const curr = allDates[i];    if (prev.branch !== curr.branch && (curr.date - prev.date) < 7200000) {      links.push({ source: prev.branch, target: curr.branch, type: 'release' });    }  }  // Add category-based connections  for (const [, members] of Object.entries(BRANCH_CATEGORIES)) {    for (let i = 0; i < members.length; i++) {      for (let j = i + 1; j < members.length; j++) {        links.push({ source: members[i], target: members[j], type: 'category' });      }    }  }  const simulation = d3.forceSimulation(nodes)    .force('link', d3.forceLink(links).id(d => d.id).distance(120).strength(l => l.type === 'category' ? 0.4 : 0.2))    .force('charge', d3.forceManyBody().strength(-300))    .force('center', d3.forceCenter(width / 2, height / 2))    .force('collision', d3.forceCollide(30));  const link = g.append('g')    .selectAll('line')    .data(links)    .join('line')    .attr('class', l => 'link ' + (l.type === 'release' ? 'release' : ''))    .attr('stroke-opacity', l => l.type === 'release' ? 0.6 : 0.15);  const node = g.append('g')    .selectAll('g')    .data(nodes)    .join('g')    .attr('class', 'node')    .call(d3.drag()      .on('start', (event, d) => { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })      .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })      .on('end', (event, d) => { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));  node.append('circle')    .attr('r', d => branchReleases[d.id] ? 8 + Math.min(branchReleases[d.id].length, 20) : 6)    .attr('fill', d => d.color)    .attr('stroke', '#fff')    .attr('stroke-width', 1.5)    .on('mouseover', (event, d) => {      tooltip.style.display = 'block';      tooltip.style.left = (event.clientX + 15) + 'px';      tooltip.style.top = (event.clientY - 10) + 'px';      const releases = branchReleases[d.id] || [];      const cat = Object.entries(BRANCH_CATEGORIES).find(([,v]) => v.includes(d.id))?.[0] || 'other';      tooltip.innerHTML = '<b>' + d.id + '</b><br>category: ' + cat + '<br>releases: ' + releases.length;    })    .on('mousemove', (event) => {      tooltip.style.left = (event.clientX + 15) + 'px';      tooltip.style.top = (event.clientY - 10) + 'px';    })    .on('mouseout', () => { tooltip.style.display = 'none'; })    .on('click', (event, d) => {      window.open('https://' + d.id + '.datro.directory', '_blank');    });  node.append('text')    .text(d => d.id)    .attr('x', 14)    .attr('y', 4)    .attr('font-size', d => branchReleases[d.id]?.length > 10 ? 12 : 10);  simulation.on('tick', () => {    link      .attr('x1', d => d.source.x)      .attr('y1', d => d.source.y)      .attr('x2', d => d.target.x)      .attr('y2', d => d.target.y);    node.attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');  });  // Build legend  const legend = document.getElementById('legend');  const cats = ['platform','frontend','docs','finance','legal','core','experimental'];  const catColors = { platform:'#00e5ff', frontend:'#ff6b6b', docs:'#a9e34b', finance:'#6bcb77', legal:'#4ecdc4', core:'#ffd93d', experimental:'#be4bdb' };  legend.innerHTML = '<div style="margin-bottom:6px;font-weight:bold;">CATEGORIES</div>';  for (const c of cats) {    const div = document.createElement('div');    div.className = 'legend-item';    div.innerHTML = '<span class="legend-dot" style="background:' + (catColors[c] || '#888') + '"></span>' + c;    legend.appendChild(div);  }}buildGraph();window.addEventListener('resize', () => {  svg.attr('width', window.innerWidth).attr('height', window.innerHeight);});</script></body></html>
