name: Deploy wave to Cloudflare Pages

on:
  push:
    branches:
      - wave
    paths:
      - 'static/wave/**'
      - '.github/workflows/deploy-wave.yml'
  workflow_dispatch:

concurrency:
  group: deploy-wave
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '42a4a8d7bfb96321118ada213638d050' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check site
        run: test -f static/wave/index.html

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@3 pages deploy static/wave --project-name=wave --branch=wave --commit-dirty=true
