name: Update Stripe Revenue

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [gh-pages]
  push:
    branches:
      - gh-pages
      - 'feature/auto-*'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-revenue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'gh-pages' }}

      - name: Check for Stripe Secret
        id: check_secret
        run: |
          if [ -z "${{ secrets.STRIPE_SECRET_KEY }}" ]; then
            echo "STRIPE_SECRET_KEY is missing or not available in this workflow."
            echo "::set-output name=has_secret::false"
          else
            echo "::set-output name=has_secret::true"
          fi

      - name: Fetch Stripe Revenue for Product
        if: steps.check_secret.outputs.has_secret == 'true'
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PRODUCT_ID: prod_Spt0LQW9iQp6XX
        run: |
          echo "Fetching charges for product: $PRODUCT_ID"
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "STRIPE_SECRET_KEY is not set. Exiting."
            exit 1
          fi

          # Fetch charges since product creation (Aug 9, 2024)
          RESPONSE=$(curl -s -w "\n%{http_code}" "https://api.stripe.com/v1/charges?limit=100&created[gte]=1723161600" \
            -u "$STRIPE_SECRET_KEY:")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Failed to fetch charges from Stripe. HTTP code: $HTTP_CODE"
            echo "Response body: $RESPONSE_BODY"
            exit 1
          fi

          echo "Response received from Stripe API"
          CHARGE_COUNT=$(echo "$RESPONSE_BODY" | jq '.data | length')
          echo "Found $CHARGE_COUNT charges"

          echo "Sample charge data:"
          echo "$RESPONSE_BODY" | jq '.data[0] | {amount, currency, paid, status, created}' || echo "No charges found"

          TOTAL_PENCE=$(echo "$RESPONSE_BODY" | jq '
            [.data[] | select(.paid == true and .status == "succeeded" and .currency == "gbp")] | map(.amount) | add // 0
          ')

          echo "Total revenue in pence: $TOTAL_PENCE"
          TOTAL_GBP=$(echo "scale=2; $TOTAL_PENCE / 100" | bc)
          echo "Total revenue in GBP: £$TOTAL_GBP"

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "{
            \"totalRevenue\": $TOTAL_PENCE,
            \"currency\": \"gbp\",
            \"productId\": \"$PRODUCT_ID\",
            \"lastUpdated\": \"$TIMESTAMP\"
          }" > static/forces/stripe-revenue.json

          echo "Generated stripe-revenue.json:"
          cat static/forces/stripe-revenue.json

      - name: Commit and Push Changes
        if: steps.check_secret.outputs.has_secret == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add static/forces/stripe-revenue.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Stripe revenue: £$(jq -r '.totalRevenue' static/forces/stripe-revenue.json | awk '{printf \"%.2f\", $1/100}') [automated]"

            # Push to appropriate branch
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              git push origin HEAD:${{ github.head_ref }}
            else
              git push
            fi
          fi

      - name: Handle Missing Stripe Secret (PRs from fork, etc.)
        if: steps.check_secret.outputs.has_secret == 'false'
        run: |
          echo "Skipping Stripe fetch and commit: STRIPE_SECRET_KEY is not available in this build. No revenue file will be updated."

