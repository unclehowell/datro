name: Deploy Tumbler to Cloudflare Pages

on:
  push:
    branches:
      - tumbler
    paths:
      - 'static/tumbler/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static/tumbler
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '42a4a8d7bfb96321118ada213638d050' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate source inventory and API functions
        run: |
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('sources.json','utf8'));if(!Array.isArray(d.sources)||d.sources.length<10)throw Error('source inventory missing');if(new Set(d.sources.map(x=>x.host)).size!==d.sources.length)throw Error('duplicate hosts');console.log('Source hosts:',d.sources.length)"
          for f in functions/api/*.js; do
            node --input-type=module --check < "$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          if "<title>Tumbler" not in html:
              raise SystemExit("Tumbler page title missing")
          script = html.rsplit("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/tumbler-inline-check.mjs").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/tumbler-inline-check.mjs

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy . --project-name=tumbler --branch=tumbler --commit-dirty=true

      - name: Smoke-test live app
        run: |
          curl --fail --silent --show-error --max-time 45 https://tumbler-6js.pages.dev/ -o /tmp/tumbler-index.html
          curl --fail --silent --show-error --max-time 45 https://tumbler-6js.pages.dev/api/manifest -o /tmp/tumbler-manifest.json
          curl --fail --silent --show-error --max-time 45 https://tumbler-6js.pages.dev/api/health -o /tmp/tumbler-health.json
          curl --fail --silent --show-error --max-time 90 https://tumbler-6js.pages.dev/api/corpus-status -o /tmp/tumbler-corpus.json
          # Validation-only probe: an invalid methodology cannot create a branch or PR.
          contribute_code=$(curl --silent --show-error --max-time 30 -o /tmp/tumbler-contribute-validation.json -w '%{http_code}' -X POST https://tumbler-6js.pages.dev/api/contribute -H "content-type: application/json" -d '{"method":"__validation_only__"}')
          legacy_code=$(curl --silent --show-error --max-time 30 -o /tmp/tumbler-legacy.json -w '%{http_code}' -X POST https://tumbler-6js.pages.dev/api/generate -H "content-type: application/json" -d '{}')
          python3 - <<'PY'
          import json
          from pathlib import Path
          html = Path("/tmp/tumbler-index.html").read_text(encoding="utf-8")
          manifest = json.loads(Path("/tmp/tumbler-manifest.json").read_text(encoding="utf-8"))
          health = json.loads(Path("/tmp/tumbler-health.json").read_text(encoding="utf-8"))
          corpus = json.loads(Path("/tmp/tumbler-corpus.json").read_text(encoding="utf-8"))
          contribute = json.loads(Path("/tmp/tumbler-contribute-validation.json").read_text(encoding="utf-8"))
          legacy = json.loads(Path("/tmp/tumbler-legacy.json").read_text(encoding="utf-8"))
          assert "<title>Tumbler" in html, "Missing homepage title"
          assert 'id="focus"' not in html and "<textarea" not in html, "Free-text corpus input must not be present"
          assert 'id="refresh-corpus"' in html and 'id="generate"' in html and 'id="pr-link"' in html, "Missing corpus refresh or PR controls"
          assert "global-row" in html and "service-row" in html, "Standard three-row navigation header is missing"
          assert len(manifest.get("inventory", {}).get("sources", [])) >= 10, "Missing source inventory"
          assert manifest.get("capabilities", {}).get("draftPullRequestGeneration") is True, "Manifest does not advertise PR workflow"
          assert health.get("service") == "tumbler", "Health route failed"
          assert "exhaustiveWholeEstateIndex" in corpus, "Missing explicit corpus coverage status"
          assert int(__import__("os").environ.get("CONTRIBUTE_CODE", "0")) if False else True
          assert contribute.get("replacement") == "POST /api/contribute" or contribute.get("error") or "configurationRequired" in contribute, "Contribution validation did not return a safe response"
          assert legacy.get("replacement") == "POST /api/contribute" and legacy.get("error"), "Legacy prompt endpoint was not retired"
          print("UI, source manifest, health, corpus coverage, safe contribution probe and retired endpoint checks passed; hosts:", len(manifest["inventory"]["sources"]), "AI binding:", health.get("aiBindingConfigured"))
          PY
          case "$contribute_code" in 400|503) ;; *) echo "Unexpected contribution validation HTTP status: $contribute_code"; exit 1;; esac
          test "$legacy_code" = "410" || { echo "Legacy prompt route should return 410, got $legacy_code"; exit 1; }
