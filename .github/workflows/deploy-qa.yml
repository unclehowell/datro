name: Deploy QA graph to Cloudflare Pages

on:
  push:
    branches:
      - qa
    paths:
      - 'static/qa/**'
      - '.github/workflows/deploy-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-qa
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static/qa
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '42a4a8d7bfb96321118ada213638d050' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure API data present (copy from bpvsbuckler if missing)
        run: |
          mkdir -p api
          if [ ! -s api/qa.json ]; then
            if [ -f ../bpvsbuckler/api/qa.json ]; then
              cp ../bpvsbuckler/api/qa.json api/
              cp ../bpvsbuckler/api/graph.json api/ 2>/dev/null || true
              cp ../bpvsbuckler/api/graph.sql api/ 2>/dev/null || true
            else
              git fetch origin bpvsbuckler --depth=1
              git show origin/bpvsbuckler:static/bpvsbuckler/api/qa.json > api/qa.json
              git show origin/bpvsbuckler:static/bpvsbuckler/api/graph.json > api/graph.json || true
              git show origin/bpvsbuckler:static/bpvsbuckler/api/graph.sql > api/graph.sql || true
            fi
          fi
          test -s api/qa.json
          python3 - <<'PY'
          import json
          payload = json.load(open("api/qa.json", encoding="utf-8"))
          records = payload.get("qa") if isinstance(payload, dict) else payload
          if not isinstance(records, list):
              raise SystemExit("qa.json must be a list or an object with a 'qa' list")
          count = len(records)
          print(f"Loaded {count} Q&A records")
          if count < 1:
              raise SystemExit("qa.json empty")
          ids = [item.get("id") for item in records if isinstance(item, dict)]
          if len(ids) != count or any(not isinstance(uid, str) or not uid.startswith("qa-") for uid in ids):
              raise SystemExit("qa.json contains records without stable qa-* UIDs")
          if len(set(ids)) != count:
              raise SystemExit("qa.json contains duplicate Q&A UIDs")
          PY

      - name: Validate API exports and JavaScript before deployment
        run: |
          test -s index.html
          test -s api/qa.json
          test -s api/graph.json
          test -s api/graph.sql
          grep -q 'CREATE VIRTUAL TABLE qa_fts' api/graph.sql
          grep -q 'CREATE VIRTUAL TABLE messages_fts' api/graph.sql
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          if "<script>" not in html or "</script>" not in html:
              raise SystemExit("index.html inline application script missing")
          script = html.rsplit("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/qa-inline-check.mjs").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/qa-inline-check.mjs
          for f in functions/api/*.js; do
            cp "$f" /tmp/qa-function-check.mjs
            node --check /tmp/qa-function-check.mjs
          done

      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes wrangler@3 pages deploy . --project-name=qa --branch=qa --commit-dirty=true

      - name: Smoke-test deployed UI and search API
        run: |
          curl --fail --silent --show-error --max-time 45 https://qa-acp.pages.dev/ -o /tmp/qa-index.html
          curl --fail --silent --show-error --max-time 45 https://qa-acp.pages.dev/api/qa.json -o /tmp/qa-data.json
          curl --fail --silent --show-error --max-time 45 'https://qa-acp.pages.dev/api/ask?q=WA231076' -o /tmp/qa-search.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          html = Path("/tmp/qa-index.html").read_text(encoding="utf-8")
          data = json.loads(Path("/tmp/qa-data.json").read_text(encoding="utf-8"))
          search = json.loads(Path("/tmp/qa-search.json").read_text(encoding="utf-8"))
          records = data.get("qa") if isinstance(data, dict) else data
          if "<title>QA Graph" not in html:
              raise SystemExit("Live homepage title missing.")
          if "${escapeHtml(x.id || '')}" not in html:
              raise SystemExit("Live renderer is missing the escaped Q&A UID text node.")
          if not isinstance(records, list) or len(records) != 309:
              raise SystemExit("Live qa.json record count mismatch.")
          ids = [x.get("id") for x in records if isinstance(x, dict)]
          if len(ids) != len(records) or len(set(ids)) != len(ids) or any(not isinstance(x, str) or not x.startswith("qa-") for x in ids):
              raise SystemExit("Live Q&A UIDs are missing or duplicated.")
          if search.get("source") != "d1" or not search.get("qa"):
              raise SystemExit("Live /api/ask did not return D1-backed Q&A results.")
          print(f"Smoke tests passed: homepage, escaped UID renderer, {len(records)} unique Q&A records, D1 search ({len(search['qa'])} Q&A hits).")
          PY

      - name: Sync and verify D1 graph
        env:
          SYNC_ATTEMPTS: "30"
        run: |
          complete=false
          attempt=1
          while [ "$attempt" -le "$SYNC_ATTEMPTS" ]; do
            status="$(curl --silent --show-error --output /tmp/qa-sync.json --write-out '%{http_code}' \
              --max-time 90 \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Accept: application/json" \
              "https://qa-acp.pages.dev/api/sync-graph")"
            if [ "$status" != "200" ]; then
              echo "D1 sync returned HTTP $status"
              cat /tmp/qa-sync.json
              exit 1
            fi
            state="$(python3 - <<'PY'
          import json, sys
          data = json.load(open("/tmp/qa-sync.json", encoding="utf-8"))
          if data.get("ok") is not True:
              safe = {k: data.get(k) for k in ("stage", "failedBatch", "batchCount", "batchBytes", "batchStatementCount", "error", "counts")}
              print("Graph sync failed: " + json.dumps(safe, ensure_ascii=False), file=sys.stderr)
              sys.exit(1)
          if data.get("complete") is True:
              print("complete")
              print("D1 graph verified:", json.dumps(data.get("counts", {}), sort_keys=True), file=sys.stderr)
          else:
              print("continue")
              print("D1 sync progress:", data.get("nextBatch", 0), "/", data.get("batchCount", 0), "chunks", file=sys.stderr)
          PY
            )"
            if [ "$state" = "complete" ]; then
              complete=true
              break
            fi
            attempt=$((attempt + 1))
          done
          if [ "$complete" != "true" ]; then
            echo "D1 sync did not complete within $SYNC_ATTEMPTS requests."
            exit 1
          fi
