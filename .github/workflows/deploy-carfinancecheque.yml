name: Deploy carfinancecheque to Cloudflare Pages

on:
  push:
    branches:
      - carfinancecheque
    paths:
      - 'static/carfinancecheque/**'
      - '.github/workflows/deploy-carfinancecheque.yml'
  workflow_dispatch:

concurrency:
  group: deploy-carfinancecheque
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static/carfinancecheque
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '42a4a8d7bfb96321118ada213638d050' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: static/carfinancecheque/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Check build renders consent banner
        run: grep -q 'id="consent-banner"' dist/index.html

      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is not set; cannot deploy."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@3 pages deploy dist --project-name=carfinancecheque --branch=carfinancecheque --commit-dirty=true
