name: Deploy hbnb to Cloudflare Pages

on:
  push:
    branches:
      - hbnb
    paths:
      - 'static/hbnb/**'
      - '.github/workflows/deploy-hbnb.yml'
  workflow_dispatch:

concurrency:
  group: deploy-hbnb
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static/hbnb
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '42a4a8d7bfb96321118ada213638d050' }}
      CUSTOM_DOMAIN: hbnb.greathousefarm.estate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: static/hbnb/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: CI=false npm run build

      - name: Check build output
        run: grep -q 'Hotspot' build/index.html

      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is not set; cannot deploy."
            exit 1
          fi

      - name: Pick Pages project (hbnb, hotspotbnb, or create hbnb)
        id: project
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          exists() { curl -fsS -o /dev/null -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$1"; }
          if exists hbnb; then name=hbnb
          elif exists hotspotbnb; then name=hotspotbnb
          else
            name=hbnb
            curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              -d '{"name":"hbnb","production_branch":"hbnb"}' "$api" | jq '.success'
          fi
          echo "Using Pages project: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@3 pages deploy build --project-name=${{ steps.project.outputs.name }} --branch=hbnb --commit-dirty=true

      - name: Ensure DNS record in Cloudflare
        continue-on-error: true
        run: |
          cf() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          base="https://api.cloudflare.com/client/v4"
          echo "Zones in this account:"
          cf "$base/zones?per_page=50" | jq -r '.result[] | "\(.name)\t\(.status)\t\(.name_servers|join(","))\t\(.original_registrar // "-")"'
          target=$(cf "$base/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/${{ steps.project.outputs.name }}" | jq -r '.result.subdomain')
          echo "Pages target: $target"
          apex=$(echo "$CUSTOM_DOMAIN" | awk -F. '{print $(NF-1)"."$NF}')
          zone=$(cf "$base/zones?name=$apex" | jq -r '.result[0].id // empty')
          if [ -z "$zone" ]; then
            echo "::warning::Zone $apex is not in this Cloudflare account; cannot create DNS for $CUSTOM_DOMAIN"
            exit 0
          fi
          rec=$(cf "$base/zones/$zone/dns_records?name=$CUSTOM_DOMAIN" | jq -r '.result[0].id // empty')
          body="{\"type\":\"CNAME\",\"name\":\"$CUSTOM_DOMAIN\",\"content\":\"$target\",\"proxied\":true}"
          if [ -n "$rec" ]; then cf -X PUT -d "$body" "$base/zones/$zone/dns_records/$rec" | jq '{success, errors}'
          else cf -X POST -d "$body" "$base/zones/$zone/dns_records" | jq '{success, errors}'; fi

      - name: Attach custom domain
        continue-on-error: true
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/${{ steps.project.outputs.name }}/domains"
          curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            -d "{\"name\":\"$CUSTOM_DOMAIN\"}" "$api" | jq '{success, errors, status: .result.status}'
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | jq -r '.result[] | "\(.name)\t\(.status)"'
