name: Deploy to Cloudflare Pages

on:
  push:
    branches: [financecheque, command]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        if: github.ref == 'refs/heads/financecheque'
        run: |
          npm ci
          npm run build

      - name: Migrate D1 database
        if: github.ref == 'refs/heads/financecheque'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute financecheque-db --remote --file schema.sql

      - name: Create project if needed
        continue-on-error: true
        run: npx wrangler pages project create ${{ github.ref == 'refs/heads/command' && 'command' || 'financecheque' }} --production-branch ${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: |
          npm install wrangler 2>/dev/null || true
          npx --yes wrangler pages deploy ${{ github.ref == 'refs/heads/command' && '.' || 'dist' }} --project-name ${{ github.ref == 'refs/heads/command' && 'command' || 'financecheque' }} --branch ${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
