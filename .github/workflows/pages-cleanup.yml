name: Pages Deploy Cleanup
on:
  schedule:
    - cron: '0 */48 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: 42a4a8d7bfb96321118ada213638d050
      CF_PROJECT: command-dashboard
    steps:
      - uses: actions/checkout@v4
      - name: List and purge old Cloudflare Pages deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN secret"
            exit 1
          fi
          npx wrangler@3 pages deployment list \
            --project-name "$CF_PROJECT" \
            --json > /tmp/deployments.json 2>/dev/null
          python3 .github/scripts/pages-cleanup.py
