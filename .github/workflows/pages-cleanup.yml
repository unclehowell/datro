name: Pages Deploy Cleanup
on:
  schedule:
    - cron: '0 */48 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      PROJECT: command-dashboard
      CF_ACCOUNT_ID: 77672efb598df743fe4eac6762713248
    steps:
      - uses: actions/checkout@v4
      - name: Clean up Cloudflare Pages deploys
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "Missing CF_API_TOKEN or CF_ACCOUNT_ID secrets"
            exit 1
          fi
          python3 << 'PYEOF'
import json, os, subprocess, sys

token = os.environ['CF_API_TOKEN']
account = os.environ['CF_ACCOUNT_ID']
project = os.environ['PROJECT']
api = f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}/deployments'
headers = ['Authorization', f'Bearer {token}']

def cf_get(path):
    r = subprocess.run(['curl', '-s', '-H', headers[0], headers[1], path], capture_output=True, text=True)
    return json.loads(r.stdout)

def cf_delete(path):
    r = subprocess.run(['curl', '-s', '-X', 'DELETE', '-H', headers[0], headers[1], path], capture_output=True, text=True)
    return json.loads(r.stdout)

data = cf_get(api)
if not data.get('success'):
    print('Failed to list deploys:', json.dumps(data.get('errors')))
    sys.exit(1)

deploys = data.get('result', [])
deploys.sort(key=lambda d: d['created_on'], reverse=True)

prod_success = [d for d in deploys if d.get('environment') == 'production' and d.get('latest_stage', {}).get('status') == 'success']
others = [d for d in deploys if d.get('environment') != 'production' or d.get('latest_stage', {}).get('status') != 'success']

to_delete = prod_success[10:] + others
kept = len(prod_success[:10])

print(f'Total deploys: {len(deploys)}')
print(f'Production success: {len(prod_success)} (keeping {kept})')
print(f'To delete: {len(to_delete)}')

deleted = 0
for d in to_delete:
    did = d['id']
    env = d.get('environment', 'unknown')
    date = d.get('created_on', 'unknown')
    result = cf_delete(f'{api}/{did}')
    status = 'OK' if result.get('success') else 'FAIL'
    print(f'  [{status}] {did} ({env}, {date})')
    deleted += 1

print(f'Cleanup complete: deleted {deleted} deploys, kept {kept} production')
PYEOF
