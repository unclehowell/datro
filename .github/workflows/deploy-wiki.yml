name: Deploy wiki to Cloudflare Pages (wiki.bucklerfamily.estate)

on:
  push:
    branches:
      - wiki
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-wiki
  cancel-in-progress: true

env:
  PROJECT: greathousefarmwiki
  DOMAIN: wiki.bucklerfamily.estate
  ZONE: bucklerfamily.estate

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '42a4a8d7bfb96321118ada213638d050' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild the static wiki
        run: |
          python3 tools/ghfwiki.py
          test -f site/index.html && test -f site/404.html && test -f site/recovered/index.html

      - name: Create the Pages project (first run only)
        run: |
          npx --yes wrangler@3 pages project list | grep -qw "$PROJECT" \
            || npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=wiki

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@3 pages deploy site --project-name="$PROJECT" --branch=wiki --commit-dirty=true

      - name: Attach custom domain wiki.bucklerfamily.estate
        run: |
          api=https://api.cloudflare.com/client/v4
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          # 1. Tell the Pages project about the hostname (no-op if already attached).
          curl -sS -X POST "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" \
            -H "$auth" -H "Content-Type: application/json" --data "{\"name\":\"$DOMAIN\"}" | tee domain.json
          echo
          # 2. Point the hostname at the project with a proxied CNAME in the bucklerfamily.estate zone.
          zone_id=$(curl -sS "$api/zones?name=$ZONE" -H "$auth" | python3 -c 'import json,sys;r=json.load(sys.stdin)["result"];print(r[0]["id"] if r else "")')
          if [ -z "$zone_id" ]; then
            echo "::warning::Zone $ZONE not visible to this API token; add a CNAME $DOMAIN -> $PROJECT.pages.dev in the Cloudflare dashboard."
            exit 0
          fi
          rec=$(curl -sS "$api/zones/$zone_id/dns_records?type=CNAME&name=$DOMAIN" -H "$auth" | python3 -c 'import json,sys;r=json.load(sys.stdin).get("result") or [];print(r[0]["id"] if r else "")')
          body="{\"type\":\"CNAME\",\"name\":\"$DOMAIN\",\"content\":\"$PROJECT.pages.dev\",\"proxied\":true,\"comment\":\"Great House Farm wiki archive (datro wiki branch)\"}"
          if [ -n "$rec" ]; then
            curl -sS -X PUT "$api/zones/$zone_id/dns_records/$rec" -H "$auth" -H "Content-Type: application/json" --data "$body"
          else
            curl -sS -X POST "$api/zones/$zone_id/dns_records" -H "$auth" -H "Content-Type: application/json" --data "$body"
          fi
          echo
          # 3. Report domain status (it becomes "active" once Cloudflare validates it, usually within minutes).
          curl -sS "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains/$DOMAIN" -H "$auth" \
            | python3 -c 'import json,sys;r=json.load(sys.stdin).get("result") or {};print("Domain status:",r.get("status"),r.get("validation_data",{}).get("status",""))'
