name: Cloudflare Conditional Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [gh-pages]

  push:
    branches:
      - gh-pages
      - 'feature/auto-*'

jobs:
  detect-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    concurrency:
      group: cf-pages-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------- Change Detection ----------------
      - name: Detect changed apps
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            MERGE=$(git merge-base "$BASE" HEAD)
            DIFF=$(git diff --name-only "$MERGE"...HEAD)
          else
            DIFF=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || git ls-files)
          fi

          # initialize all to false
          for app in library hbnb forces gui datro projections bpvsbuckler dcc ew; do
            echo "$app=false" >> "$GITHUB_OUTPUT"
          done

          # mark true if any changes detected
          grep -q '^static/library/'      <<<"$DIFF" && echo "library=true" >> $GITHUB_OUTPUT
          grep -q '^static/hbnb/'         <<<"$DIFF" && echo "hbnb=true" >> $GITHUB_OUTPUT
          grep -q '^static/forces/'       <<<"$DIFF" && echo "forces=true" >> $GITHUB_OUTPUT
          grep -q '^static/gui/'          <<<"$DIFF" && echo "gui=true" >> $GITHUB_OUTPUT
          grep -q '^static/datro/'        <<<"$DIFF" && echo "datro=true" >> $GITHUB_OUTPUT
          grep -q '^static/projections/'  <<<"$DIFF" && echo "projections=true" >> $GITHUB_OUTPUT
          grep -q '^static/bpvsbuckler/'  <<<"$DIFF" && echo "bpvsbuckler=true" >> $GITHUB_OUTPUT
          grep -q '^static/_dcc/'         <<<"$DIFF" && echo "dcc=true" >> $GITHUB_OUTPUT
          grep -q '^static/ew/'           <<<"$DIFF" && echo "ew=true" >> $GITHUB_OUTPUT

      # ---------------- Builds ----------------
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.hbnb == 'true'
        with:
          node-version: '22'

      - name: Build hbnb
        if: steps.changes.outputs.hbnb == 'true'
        run: |
          cd static/hbnb
          npm ci
          npm run build

      # ---------------- Deploy Helper ----------------
      - name: Deploy helper
        id: deploy
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          deploy () {
            local dir=$1 project=$2
            npx wrangler pages deploy "$dir" \
              --project-name="$project" \
              --branch="${{ github.head_ref || github.ref_name }}" \
              --commit-hash="${{ github.sha }}" \
              > out.txt 2>&1

            grep -oP 'https://[a-f0-9]+\.pages\.dev[^\s]*' out.txt | head -1 || echo ""
          }

          echo "library=$(deploy static/library library)" >> $GITHUB_OUTPUT
          echo "hbnb=$(deploy static/hbnb/build hbnb)" >> $GITHUB_OUTPUT
          echo "forces=$(deploy static/forces forces)" >> $GITHUB_OUTPUT
          echo "gui=$(deploy static/gui gui)" >> $GITHUB_OUTPUT
          echo "datro=$(deploy static/datro datro-homepage)" >> $GITHUB_OUTPUT
          echo "projections=$(deploy static/projections projections)" >> $GITHUB_OUTPUT
          echo "bpvsbuckler=$(deploy static/bpvsbuckler bpvsbuckler)" >> $GITHUB_OUTPUT
          echo "dcc=$(deploy static/_dcc dcc)" >> $GITHUB_OUTPUT
          echo "ew=$(deploy static/ew ew)" >> $GITHUB_OUTPUT

      # ---------------- PR Comment ----------------
      - name: Comment preview table
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const apps = [
              ['library','library'],
              ['hbnb','hbnb'],
              ['forces','forces'],
              ['gui','gui'],
              ['datro','datro-homepage'],
              ['projections','projections'],
              ['bpvsbuckler','bpvsbuckler'],
              ['dcc','dcc'],
              ['ew','ew']
            ];

            let body = "## 🚀 Cloudflare Pages Preview Deployments\n\n";
            body += "| Application | Status | Preview URL |\n|---|---|---|\n";

            let total = 0;
            for (const [key,name] of apps) {
              const url = `${{ steps.deploy.outputs[key] }}` || '';
              if (url) {
                body += `| ${name} | ✅ Deployed | [Preview](${url}) |\n`;
                total++;
              } else {
                body += `| ${name} | 🚫 Skipped | N/A |\n`;
              }
            }

            body += `\nTotal Deployed: ${total} application(s)`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
