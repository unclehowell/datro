name: Cloudflare Conditional Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [gh-pages]
  push:
    branches:
      - gh-pages
      - 'feature/auto-*'

jobs:
  deploy-and-comment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      # 1) Checkout repo
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) Detect changed apps
      - name: Detect changed apps
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          # determine diff
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            MERGE_BASE=$(git merge-base "$BASE_SHA" HEAD)
            DIFF=$(git diff --name-only "$MERGE_BASE"...HEAD)
          else
            DIFF=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || git ls-files)
          fi

          # app folders in static/
          declare -A APPS=(
            ["library"]="library"
            ["hbnb"]="hbnb"
            ["forces"]="forces"
            ["gui"]="gui"
            ["datro"]="datro"
            ["projections"]="projections"
            ["bpvsbuckler"]="bpvsbuckler"
            ["_dcc"]="dcc"
            ["_etrike"]="etrike"
            ["ew"]="ew"
            ["_maps"]="_maps"
            ["puck"]="puck"
            ["_trailer"]="trailer"
          )

          for folder in "${!APPS[@]}"; do
            echo "${APPS[$folder]}=false" >> $GITHUB_OUTPUT
            if grep -q "^static/${folder}/" <<< "$DIFF"; then
              echo "${APPS[$folder]}=true" >> $GITHUB_OUTPUT
            fi
          done

      # 3) Build apps if needed
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.hbnb == 'true'
        with:
          node-version: '22'

      - name: Build hbnb
        if: steps.changes.outputs.hbnb == 'true'
        run: |
          cd static/hbnb
          npm ci
          npm run build

      # 4) Deploy apps
      - name: Deploy apps
        id: deploy
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          declare -A FOLDERS=(
            ["library"]="library"
            ["hbnb"]="hbnb"
            ["forces"]="forces"
            ["gui"]="gui"
            ["datro"]="datro-homepage"
            ["projections"]="projections"
            ["bpvsbuckler"]="bpvsbuckler"
            ["_dcc"]="dcc"
            ["_etrike"]="etrike"
            ["ew"]="ew"
            ["_maps"]="_maps"
            ["puck"]="puck"
            ["_trailer"]="trailer"
          )

          for folder in "${!FOLDERS[@]}"; do
            changed="${{ steps.changes.outputs[${FOLDERS[$folder]}] }}"
            if [ "$changed" != "true" ]; then
              echo "${FOLDERS[$folder]}=" >> $GITHUB_OUTPUT
              continue
            fi

            local_dir="static/$folder"
            project="${FOLDERS[$folder]}"

            url=$(npx wrangler pages deploy "$local_dir" \
              --project-name="$project" \
              --branch="${{ github.head_ref || github.ref_name }}" \
              --commit-hash="${{ github.sha }}" \
              --deploy-preview 2>&1 \
              | grep -oE 'https://[a-z0-9.-]+\.pages\.dev' | head -1 || true)

            echo "${project}=$url" >> $GITHUB_OUTPUT
          done

      # 5) Comment PR with clean table
      - name: Comment preview table
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const apps = [
              "library", "hbnb", "forces", "gui",
              "datro", "projections", "bpvsbuckler",
              "dcc", "etrike", "ew", "_maps", "puck", "trailer"
            ];

            let body = "## 🚀 Cloudflare Pages Preview Deployments\n\n";
            body += "| Application | Status | Preview URL |\n|---|---|---|\n";

            let total = 0;
            for (const app of apps) {
              const url = process.env[`DEPLOY_${app.toUpperCase()}`] || '';
              if (url) {
                body += `| ${app} | ✅ Deployed | [Preview](${url}) |\n`;
                total++;
              } else {
                body += `| ${app} | 🚫 Skipped | N/A |\n`;
              }
            }

            body += `\nTotal Deployed: ${total} application(s)`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

