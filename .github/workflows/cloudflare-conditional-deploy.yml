name: Cloudflare Conditional Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - gh-pages

  push:
    branches:
      - gh-pages
      - 'feature/auto-*'

jobs:
  detect-and-deploy:
    name: Detect changes and deploy only touched apps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    concurrency:
      group: cf-pages-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Change Detection ---
      - name: Determine changed files
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1 || true
            MERGE_BASE=$(git merge-base "$BASE_SHA" HEAD)
            DIFF=$(git diff --name-only "$MERGE_BASE"...HEAD) || true
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              DIFF=$(git ls-files) || true
            else
              DIFF=$(git diff --name-only "$BEFORE" "$AFTER") || true
            fi
          fi

          # Initialize all apps to false
          for app in library hbnb forces gui datro projections bpvsbuckler dcc ew; do
            echo "$app=false" >> "$GITHUB_OUTPUT"
          done

          # Set to true if changes detected
          grep -qE '^static/library/'      <<<"$DIFF" && echo "library=true" >> "$GITHUB_OUTPUT"
          grep -qE '^static/hbnb/'         <<<"$DIFF" && echo "hbnb=true" >> "$GITHUB_OUTPUT"
          grep -qE '^static/forces/'       <<<"$DIFF" && echo "forces=true" >> "$GITHUB_OUTPUT"
          grep -qE '^static/gui/'          <<<"$DIFF" && echo "gui=true" >> "$GITHUB_OUTPUT"
          grep -qE '^static/datro/'        <<<"$DIFF" && echo "datro=true" >> "$GITHUB_OUTPUT"
          grep -qE '^static/projections/'  <<<"$DIFF" && echo "projections=true" >> "$GITHUB_OUTPUT"
          grep -qE '^static/bpvsbuckler/'  <<<"$DIFF" && echo "bpvsbuckler=true" >> "$GITHUB_OUTPUT"
          grep -qE '^static/_dcc/'         <<<"$DIFF" && echo "dcc=true" >> "$GITHUB_OUTPUT"
          grep -qE '^static/ew/'           <<<"$DIFF" && echo "ew=true" >> "$GITHUB_OUTPUT"

      # --- Setup Node (only run if HBNB needs it) ---
      - name: Setup Node
        if: steps.changes.outputs.hbnb == 'true'
        uses: actions/setup-node@v4
        with:
            node-version: '22'

      ######################################################################
      # Deploy apps
      ######################################################################

      - name: Deploy apps
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          deploy () {
            local dir=$1 project=$2
            npx wrangler pages deploy "$dir" \
              --project-name="$project" \
              --branch="${{ github.head_ref || github.ref_name }}" \
              --commit-hash="${{ github.sha }}" \
              > out.txt 2>&1

            grep -oP 'https://[a-f0-9]+\.pages\.dev[^\s]*' out.txt | head -1 || echo ""
          }

          echo "library=$(deploy static/library library)" >> $GITHUB_OUTPUT
          echo "hbnb=$(deploy static/hbnb/build hbnb)" >> $GITHUB_OUTPUT
          echo "forces=$(deploy static/forces ceo)" >> $GITHUB_OUTPUT
          echo "gui=$(deploy static/gui gui)" >> $GITHUB_OUTPUT
          echo "datro=$(deploy static/datro datro-homepage)" >> $GITHUB_OUTPUT
          echo "projections=$(deploy static/projections projections)" >> $GITHUB_OUTPUT
          echo "bpvsbuckler=$(deploy static/bpvsbuckler bpvsbuckler)" >> $GITHUB_OUTPUT
          echo "dcc=$(deploy static/_dcc dcc)" >> $GITHUB_OUTPUT
          echo "ew=$(deploy static/ew ew)" >> $GITHUB_OUTPUT

      ######################################################################
      # PR Comment Table
      ######################################################################
      - name: Post Clean Preview Table
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const apps = [
              { name: 'library', changed: '${{ steps.changes.outputs.library }}', url: '${{ steps.deploy.outputs.library }}' },
              { name: 'hbnb', changed: '${{ steps.changes.outputs.hbnb }}', url: '${{ steps.deploy.outputs.hbnb }}' },
              { name: 'ceo (forces)', changed: '${{ steps.changes.outputs.forces }}', url: '${{ steps.deploy.outputs.forces }}' },
              { name: 'gui', changed: '${{ steps.changes.outputs.gui }}', url: '${{ steps.deploy.outputs.gui }}' },
              { name: 'datro-homepage', changed: '${{ steps.changes.outputs.datro }}', url: '${{ steps.deploy.outputs.datro }}' },
              { name: 'projections', changed: '${{ steps.changes.outputs.projections }}', url: '${{ steps.deploy.outputs.projections }}' },
              { name: 'bpvsbuckler', changed: '${{ steps.changes.outputs.bpvsbuckler }}', url: '${{ steps.deploy.outputs.bpvsbuckler }}' },
              { name: 'dcc', changed: '${{ steps.changes.outputs.dcc }}', url: '${{ steps.deploy.outputs.dcc }}' },
              { name: 'ew', changed: '${{ steps.changes.outputs.ew }}', url: '${{ steps.deploy.outputs.ew }}' },
            ];

            let body = '🚀 Cloudflare Pages Preview Deployments\n\n';
            body += 'Application\tStatus\tPreview URL\n';

            let deployed = 0;

            for (const app of apps) {
              let status, link;
              if (app.url && app.url !== '' && app.url !== 'null') {
                status = '✅ Deployed';
                link = 'Preview';
                deployed++;
              } else if (app.changed === 'true') {
                status = '⚠️ Deploy attempted';
                link = 'Check logs';
              } else {
                status = '🚫 Skipped';
                link = 'N/A';
              }
              body += `${app.name}\t${status}\t${link}\n`;
            }

            body += `\nTotal Deployed: ${deployed} application(s)`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const botComment = comments.find(c => 
              c.user.type === 'Bot' && 
              c.body.includes('🚀 Cloudflare Pages Preview Deployments')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            }

