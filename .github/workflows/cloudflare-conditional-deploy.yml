name: Cloudflare Conditional Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - gh-pages
  push:
    branches:
      - gh-pages
      - 'feature/auto-*'

jobs:
  detect-changes:
    name: Detect changed static projects
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      changed_any: ${{ steps.matrix.outputs.changed_any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          DIFF=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            BASE_REF="${{ github.event.pull_request.base.ref }}"
            if [ -z "$BASE_SHA" ] || [ -z "$BASE_REF" ]; then
              echo "ERROR: Pull request base sha/ref not set"
              exit 1
            fi
            git fetch origin "$BASE_REF" --depth=1 || true
            MERGE_BASE=$(git merge-base "$BASE_SHA" HEAD)
            DIFF=$(git diff --name-only "$MERGE_BASE"...HEAD) || true
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ -z "$BEFORE" ] || [ -z "$AFTER" ]; then
              echo "ERROR: BEFORE or AFTER not set"
              exit 1
            fi
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              DIFF=$(git ls-files) || true
            else
              DIFF=$(git diff --name-only "$BEFORE" "$AFTER") || true
            fi
          fi

          echo "$DIFF" > /tmp/changed_files.txt

      - name: Build project matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f static/projects.tsv ]; then
            echo "ERROR: static/projects.tsv not found"
            exit 1
          fi

          sed -n 's#^static/\([^/][^/]*\)/.*#\1#p' /tmp/changed_files.txt | sort -u > /tmp/changed_projects.txt

          items=""
          while IFS=$'\t' read -r project preview repo cf_project cname; do
            [ -z "$project" ] && continue
            if grep -Fxq "$project" /tmp/changed_projects.txt; then
              if [ -z "$cf_project" ]; then cf_project="$project"; fi
              items="$items{\"project\":\"$project\",\"dir\":\"static/$project\",\"cf_project\":\"$cf_project\",\"preview_url\":\"$preview\",\"cname\":\"$cname\"},"
            fi
          done < <(tail -n +2 static/projects.tsv)

          if [ -z "$items" ]; then
            echo "changed_any=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          items="[${items%,}]"
          echo "changed_any=true" >> "$GITHUB_OUTPUT"
          echo "matrix={\"include\":$items}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy changed projects
    needs: detect-changes
    if: needs.detect-changes.outputs.changed_any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy ${{ matrix.project }}
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ matrix.dir }} --project-name=${{ matrix.cf_project }}

  deploy-summary:
    name: Deployment Summary
    needs: [detect-changes, deploy]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Summary
        run: |
          echo "Deployment complete for changed apps."
