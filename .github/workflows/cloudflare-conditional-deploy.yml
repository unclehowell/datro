          OUT=$(wrangler pages deploy "$DIRECTORY" \
            --project-name="$PROJECT_NAME" \
            --branch="$BRANCH_NAME" \
            --commit-dirty=true \
            --commit-hash="$COMMIT_SHA" 2>&1 | tee /tmp/wrangler_bpvs.log || true)
          echo "$OUT"
          URL=$(echo "$OUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev[[:alnum:]/._-]*' | tail -n1 || true)
          if [ -z "${URL:-}" ]; then echo "No preview URL found"; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Deployment box: bpvsbuckler(preview)
        if: github.event_name == 'pull_request' && steps.changes.outputs.bpvsbuckler == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.payload.pull_request?.head.sha || context.sha;
            const env = "bpvsbuckler(preview)";
            const url = "${{ steps.deploy_bpvsbuckler.outputs.url }}";
            const { data: dep } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              environment: env,
              transient_environment: true,
              auto_merge: false,
              required_contexts: [],
              description: "Cloudflare Pages preview"
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: dep.id,
              state: "success",
              environment: env,
              environment_url: url,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              auto_inactive: false
            });
