name: Cloudflare conditional deploy (wrangler + deployments box, no comments)

on:
  # Previews on PRs targeting gh-pages (Codex PRs)
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - gh-pages
  # Keep pushes to gh-pages enabled (you can add prod steps later)
  push:
    branches:
      - gh-pages

jobs:
  deploy:
    name: Detect changes and deploy only touched apps
    runs-on: ubuntu-latest

    # Needed for GitHub Deployments box
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    # Auto-cancel older runs for same PR/branch
    concurrency:
      group: cf-wrangler-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    env:
      # Convenient refs
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      COMMIT_SHA:  ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          echo "Determining changed files..."
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1 || true
            DIFF=$(git diff --name-only "$BASE_SHA"...HEAD) || true
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              DIFF=$(git ls-files) || true
            else
              DIFF=$(git diff --name-only "$BEFORE" "$AFTER") || true
            fi
          fi

          echo "Changed files:"
          echo "$DIFF"

          {
            echo "library=false"
            echo "hbnb=false"
            echo "forces=false"
            echo "gui=false"
            echo "datro=false"
            echo "projections=false"
            echo "bpvsbuckler=false"
          } >> "$GITHUB_OUTPUT"

          if echo "$DIFF" | grep -qE '^static/library/';     then echo "library=true" >> "$GITHUB_OUTPUT"; fi
          if echo "$DIFF" | grep -qE '^static/hbnb/';        then echo "hbnb=true" >> "$GITHUB_OUTPUT"; fi
          if echo "$DIFF" | grep -qE '^static/forces/';      then echo "forces=true" >> "$GITHUB_OUTPUT"; fi
          if echo "$DIFF" | grep -qE '^static/gui/';         then echo "gui=true"   >> "$GITHUB_OUTPUT"; fi
          if echo "$DIFF" | grep -qE '^static/datro/';       then echo "datro=true" >> "$GITHUB_OUTPUT"; fi
          if echo "$DIFF" | grep -qE '^static/projections/'; then echo "projections=true" >> "$GITHUB_OUTPUT"; fi
          if echo "$DIFF" | grep -qE '^static/bpvsbuckler/'; then echo "bpvsbuckler=true" >> "$GITHUB_OUTPUT"; fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm i -g wrangler@^4.47.0

      ######################################################################
      # Each app: wrangler pages deploy + GitHub Deployment box
      # Requires repo secrets:
      #   CLOUDFLARE_API_TOKEN
      #   CLOUDFLARE_ACCOUNT_ID
      #
      # PROJECT_NAME must match your Cloudflare Pages project names:
      #   library, hbnb, ceo, gui, datro-homepage, projections, bpvsbuckler
      #
      # GitHub Environments already created:
      #   library(preview), hbnb(preview), ceo(preview), gui(preview),
      #   datro(preview), projections(preview), bpvsbuckler(preview)
      ######################################################################

      # ---------- library ----------
      - name: Deploy library (preview)
        id: deploy_library
        if: github.event_name == 'pull_request' && steps.changes.outputs.library == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME:         library
          DIRECTORY:            static/library
          BRANCH_NAME:          ${{ env.BRANCH_NAME }}
          COMMIT_SHA:           ${{ env.COMMIT_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$DIRECTORY/package.json" ]; then
            (cd "$DIRECTORY" && (npm ci || npm install) && npm run build --if-present)
          fi
          OUT=$(wrangler pages deploy "$DIRECTORY" \
            --project-name="$PROJECT_NAME" \
            --branch="$BRANCH_NAME" \
            --commit-dirty=true \
            --commit-hash="$COMMIT_SHA" 2>&1 | tee /tmp/wrangler_library.log || true)
          echo "$OUT"
          URL=$(echo "$OUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev[[:alnum:]/._-]*' | tail -n1 || true)
          if [ -z "${URL:-}" ]; then
            echo "No preview URL detected in wrangler output"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Deployment box: library(preview)
        if: github.event_name == 'pull_request' && steps.changes.outputs.library == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.payload.pull_request?.head.sha || context.sha;
            const env = "library(preview)";
            const url = "${{ steps.deploy_library.outputs.url }}";
            const { data: dep } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              environment: env,
              transient_environment: true,
              auto_merge: false,
              required_contexts: [],
              description: "Cloudflare Pages preview"
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: dep.id,
              state: "success",
              environment: env,
              environment_url: url,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              auto_inactive: false
            });

      # ---------- hbnb ----------
      - name: Deploy hbnb (preview)
        id: deploy_hbnb
        if: github.event_name == 'pull_request' && steps.changes.outputs.hbnb == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME:         hbnb
          DIRECTORY:            static/hbnb
          BRANCH_NAME:          ${{ env.BRANCH_NAME }}
          COMMIT_SHA:           ${{ env.COMMIT_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$DIRECTORY/package.json" ]; then
            (cd "$DIRECTORY" && (npm ci || npm install) && npm run build --if-present)
          fi
          OUT=$(wrangler pages deploy "$DIRECTORY" \
            --project-name="$PROJECT_NAME" \
            --branch="$BRANCH_NAME" \
            --commit-dirty=true \
            --commit-hash="$COMMIT_SHA" 2>&1 | tee /tmp/wrangler_hbnb.log || true)
          echo "$OUT"
          URL=$(echo "$OUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev[[:alnum:]/._-]*' | tail -n1 || true)
          if [ -z "${URL:-}" ]; then echo "No preview URL found"; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Deployment box: hbnb(preview)
        if: github.event_name == 'pull_request' && steps.changes.outputs.hbnb == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.payload.pull_request?.head.sha || context.sha;
            const env = "hbnb(preview)";
            const url = "${{ steps.deploy_hbnb.outputs.url }}";
            const { data: dep } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              environment: env,
              transient_environment: true,
              auto_merge: false,
              required_contexts: [],
              description: "Cloudflare Pages preview"
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: dep.id,
              state: "success",
              environment: env,
              environment_url: url,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              auto_inactive: false
            });

      # ---------- forces (ceo) ----------
      - name: Deploy forces/ceo (preview)
        id: deploy_forces
        if: github.event_name == 'pull_request' && steps.changes.outputs.forces == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME:         ceo
          DIRECTORY:            static/forces
          BRANCH_NAME:          ${{ env.BRANCH_NAME }}
          COMMIT_SHA:           ${{ env.COMMIT_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$DIRECTORY/package.json" ]; then
            (cd "$DIRECTORY" && (npm ci || npm install) && npm run build --if-present)
          fi
          OUT=$(wrangler pages deploy "$DIRECTORY" \
            --project-name="$PROJECT_NAME" \
            --branch="$BRANCH_NAME" \
            --commit-dirty=true \
            --commit-hash="$COMMIT_SHA" 2>&1 | tee /tmp/wrangler_forces.log || true)
          echo "$OUT"
          URL=$(echo "$OUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev[[:alnum:]/._-]*' | tail -n1 || true)
          if [ -z "${URL:-}" ]; then echo "No preview URL found"; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Deployment box: ceo(preview)
        if: github.event_name == 'pull_request' && steps.changes.outputs.forces == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.payload.pull_request?.head.sha || context.sha;
            const env = "ceo(preview)";
            const url = "${{ steps.deploy_forces.outputs.url }}";
            const { data: dep } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              environment: env,
              transient_environment: true,
              auto_merge: false,
              required_contexts: [],
              description: "Cloudflare Pages preview"
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: dep.id,
              state: "success",
              environment: env,
              environment_url: url,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              auto_inactive: false
            });

      # ---------- gui ----------
      - name: Deploy gui (preview)
        id: deploy_gui
        if: github.event_name == 'pull_request' && steps.changes.outputs.gui == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME:         gui
          DIRECTORY:            static/gui
          BRANCH_NAME:          ${{ env.BRANCH_NAME }}
          COMMIT_SHA:           ${{ env.COMMIT_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$DIRECTORY/package.json" ]; then
            (cd "$DIRECTORY" && (npm ci || npm install) && npm run build --if-present)
          fi
          OUT=$(wrangler pages deploy "$DIRECTORY" \
            --project-name="$PROJECT_NAME" \
            --branch="$BRANCH_NAME" \
            --commit-dirty=true \
            --commit-hash="$COMMIT_SHA" 2>&1 | tee /tmp/wrangler_gui.log || true)
          echo "$OUT"
          URL=$(echo "$OUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev[[:alnum:]/._-]*' | tail -n1 || true)
          if [ -z "${URL:-}" ]; then echo "No preview URL found"; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Deployment box: gui(preview)
        if: github.event_name == 'pull_request' && steps.changes.outputs.gui == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.payload.pull_request?.head.sha || context.sha;
            const env = "gui(preview)";
            const url = "${{ steps.deploy_gui.outputs.url }}";
            const { data: dep } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              environment: env,
              transient_environment: true,
              auto_merge: false,
              required_contexts: [],
              description: "Cloudflare Pages preview"
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: dep.id,
              state: "success",
              environment: env,
              environment_url: url,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              auto_inactive: false
            });

      # ---------- datro-homepage ----------
      - name: Deploy datro-homepage (preview)
        id: deploy_datro
        if: github.event_name == 'pull_request' && steps.changes.outputs.datro == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME:         datro-homepage
          DIRECTORY:            static/datro
          BRANCH_NAME:          ${{ env.BRANCH_NAME }}
          COMMIT_SHA:           ${{ env.COMMIT_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$DIRECTORY/package.json" ]; then
            (cd "$DIRECTORY" && (npm ci || npm install) && npm run build --if-present)
          fi
          OUT=$(wrangler pages deploy "$DIRECTORY" \
            --project-name="$PROJECT_NAME" \
            --branch="$BRANCH_NAME" \
            --commit-dirty=true \
            --commit-hash="$COMMIT_SHA" 2>&1 | tee /tmp/wrangler_datro.log || true)
          echo "$OUT"
          URL=$(echo "$OUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev[[:alnum:]/._-]*' | tail -n1 || true)
          if [ -z "${URL:-}" ]; then echo "No preview URL found"; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Deployment box: datro(preview)
        if: github.event_name == 'pull_request' && steps.changes.outputs.datro == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.payload.pull_request?.head.sha || context.sha;
            const env = "datro(preview)";
            const url = "${{ steps.deploy_datro.outputs.url }}";
            const { data: dep } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              environment: env,
              transient_environment: true,
              auto_merge: false,
              required_contexts: [],
              description: "Cloudflare Pages preview"
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: dep.id,
              state: "success",
              environment: env,
              environment_url: url,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              auto_inactive: false
            });

      # ---------- projections ----------
      - name: Deploy projections (preview)
        id: deploy_projections
        if: github.event_name == 'pull_request' && steps.changes.outputs.projections == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME:         projections
          DIRECTORY:            static/projections
          BRANCH_NAME:          ${{ env.BRANCH_NAME }}
          COMMIT_SHA:           ${{ env.COMMIT_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$DIRECTORY/package.json" ]; then
            (cd "$DIRECTORY" && (npm ci || npm install) && npm run build --if-present)
          fi
          OUT=$(wrangler pages deploy "$DIRECTORY" \
            --project-name="$PROJECT_NAME" \
            --branch="$BRANCH_NAME" \
            --commit-dirty=true \
            --commit-hash="$COMMIT_SHA" 2>&1 | tee /tmp/wrangler_projections.log || true)
          echo "$OUT"
          URL=$(echo "$OUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev[[:alnum:]/._-]*' | tail -n1 || true)
          if [ -z "${URL:-}" ]; then echo "No preview URL found"; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Deployment box: projections(preview)
        if: github.event_name == 'pull_request' && steps.changes.outputs.projections == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.payload.pull_request?.head.sha || context.sha;
            const env = "projections(preview)";
            const url = "${{ steps.deploy_projections.outputs.url }}";
            const { data: dep } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              environment: env,
              transient_environment: true,
              auto_merge: false,
              required_contexts: [],
              description: "Cloudflare Pages preview"
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: dep.id,
              state: "success",
              environment: env,
              environment_url: url,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              auto_inactive: false
            });

      # ---------- bpvsbuckler ----------
      - name: Deploy bpvsbuckler (preview)
        id: deploy_bpvsbuckler
        if: github.event_name == 'pull_request' && steps.changes.outputs.bpvsbuckler == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME:         bpvsbuckler
          DIRECTORY:            static/bpvsbuckler
          BRANCH_NAME:          ${{ env.BRANCH_NAME }}
          COMMIT_SHA:           ${{ env.COMMIT_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$DIRECTORY/package.json" ]; then
