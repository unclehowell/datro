name: Cloudflare Conditional Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - gh-pages
  push:
    branches:
      - gh-pages
      - 'feature/auto-*'

jobs:
  detect-and-deploy:
    name: Detect changes and deploy only touched apps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    concurrency:
      group: cf-pages-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          echo "==[Debug Info]=="
          echo "github.event_name=${{ github.event_name }}"
          echo "github.sha=${{ github.sha }}"
          echo "github.head_ref=${{ github.head_ref }}"
          echo "github.event.pull_request.base.sha=${{ github.event.pull_request.base.sha }}"
          echo "github.event.pull_request.base.ref=${{ github.event.pull_request.base.ref }}"
          echo "github.event.before=${{ github.event.before }}"

          DIFF=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ -z "${{ github.event.pull_request.base.sha }}" ] || [ -z "${{ github.event.pull_request.base.ref }}" ]; then
              echo "ERROR: Pull request base sha/ref not set"
              exit 1
            fi
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1 || true
            MERGE_BASE=$(git merge-base "$BASE_SHA" HEAD)
            DIFF=$(git diff --name-only "$MERGE_BASE"...HEAD) || true
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ -z "$BEFORE" ] || [ -z "$AFTER" ]; then
              echo "ERROR: BEFORE or AFTER not set"
              exit 1
            fi
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              DIFF=$(git ls-files) || true
            else
              DIFF=$(git diff --name-only "$BEFORE" "$AFTER") || true
            fi
          fi

          echo "Changed files:"
          echo "$DIFF"

          {
            echo "library=false"
            echo "hbnb=false"
            echo "forces=false"
            echo "gui=false"
            echo "datro=false"
            echo "projections=false"
            echo "bpvsbuckler=false"
            echo "dcc=false"
            echo "pcp=false"
          } >> "$GITHUB_OUTPUT"

          if echo "$DIFF" | grep -qE '^static/library/';    then echo "library=true"    >> "$GITHUB_OUTPUT"; fi
          if echo "$DIFF" | grep -qE '^static/hbnb/';       then echo "hbnb=true"       >> "$GITHUB_OUTPUT"; fi
          if echo "$DIFF" | grep -qE '^static/forces/';     then echo "forces=true"     >> "$GITHUB_OUTPUT"; fi
          if echo "$DIFF" | grep -qE '^static/gui/';        then echo "gui=true"        >> "$GITHUB_OUTPUT"; fi
          if echo "$DIFF" | grep -qE '^static/datro/';      then echo "datro=true"      >> "$GITHUB_OUTPUT"; fi
          if echo "$DIFF" | grep -qE '^static/projections/'; then echo "projections=true" >> "$GITHUB_OUTPUT"; fi
          if echo "$DIFF" | grep -qE '^static/bpvsbuckler/'; then echo "bpvsbuckler=true" >> "$GITHUB_OUTPUT"; fi
          if echo "$DIFF" | grep -qE '^static/_dcc/';       then echo "dcc=true"        >> "$GITHUB_OUTPUT"; fi
          if echo "$DIFF" | grep -qE '^static/pcp/';        then echo "pcp=true"        >> "$GITHUB_OUTPUT"; fi

      - name: Setup Node (for builds if needed)
        if: steps.changes.outputs.hbnb == 'true'  # Add more conditions if other apps need Node/npm
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Example build step (uncomment/adapt per app if they require build)
      # - name: Build HBNB (if changed)
      #   if: steps.changes.outputs.hbnb == 'true'
      #   working-directory: static/hbnb
      #   run: |
      #     npm ci
      #     npm run build

      # Deploy steps ? one per app, conditional
      - name: Deploy library
        if: steps.changes.outputs.library == 'true'
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy static/library --project-name=library

      - name: Deploy hbnb
        if: steps.changes.outputs.hbnb == 'true'
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy static/hbnb --project-name=hbnb

      - name: Deploy forces
        if: steps.changes.outputs.forces == 'true'
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy static/forces --project-name=ceo  # CHANGE

      - name: Deploy gui
        if: steps.changes.outputs.gui == 'true'
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy static/gui --project-name=gui  # CHANGE

      - name: Deploy datro
        if: steps.changes.outputs.datro == 'true'
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy static/datro --project-name=datro  # CHANGE if different

      - name: Deploy projections
        if: steps.changes.outputs.projections == 'true'
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy static/projections --project-name=  # CHANGE

      - name: Deploy bpvsbuckler
        if: steps.changes.outputs.bpvsbuckler == 'true'
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy static/bpvsbuckler --project-name=bpvsbuckler  # CHANGE

      - name: Deploy dcc
        if: steps.changes.outputs.dcc == 'true'
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy static/_dcc --project-name=dcc  # CHANGE

      - name: Deploy pcp (Finance Cheque)
        if: steps.changes.outputs.pcp == 'true'
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy static/pcp --project-name=financecheque

      # Optional: Summary / notification step (e.g., comment on PR)
      - name: Deploy Summary
        if: always() && github.event_name == 'pull_request'
        run: |
          echo "Deployment complete for changed apps."
          # Add gh pr comment if you want: gh pr comment ${{ github.event.pull_request.number }} --body "Pages previews updated for changed sub-apps."
