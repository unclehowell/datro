name: Deploy bpvsbuckler to Cloudflare Pages

on:
  push:
    branches:
      - bpvsbuckler
    paths:
      - 'static/bpvsbuckler/**'
      - 'evidence-catalogue/**'
      - '.github/workflows/deploy-bpvsbuckler.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-bpvsbuckler
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static/bpvsbuckler
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '42a4a8d7bfb96321118ada213638d050' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate the scene seed from source
        run: python3 content/story_source.py

      - name: Build the Q&A graph (correspondence + case questions + scenes) and the storyboard from it
        run: |
          python3 content/graph/ingest_catalogue.py
          python3 content/graph/ingest_gmail.py
          python3 content/graph/build_graph.py

      - name: Build story exports
        run: node scripts/build-timeline-exports.mjs

      - name: Commit generated story exports to the branch
        run: |
          git add src/data/story.json src/data/meta.json api/timeline.json api/graph.json api/qa.json api/graph.sql content/graph/seed content/graph/corpus llms.txt story/index.html story/transcript.txt sitemap.xml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "bpvsbuckler: refresh generated story exports [skip ci]"
            if ! git push origin HEAD:bpvsbuckler; then
              # A rerun may start from the original event SHA after another run
              # has already committed identical generated files. Accept that
              # only if the remote generated outputs match; never overwrite a
              # newer, different export set.
              git fetch origin bpvsbuckler
              if git diff --quiet FETCH_HEAD -- src/data/story.json src/data/meta.json api/timeline.json llms.txt story/index.html story/transcript.txt sitemap.xml; then
                echo "Generated exports are already current on bpvsbuckler."
              else
                echo "Remote branch advanced with different generated exports; refusing to overwrite."
                exit 1
              fi
            fi
          fi

      - name: Build player
        run: |
          npm install --no-audit --no-fund
          npx vite build

      - name: Add the site's static folders (evidence, research, api, archives, ...)
        run: |
          rsync -a --exclude dist --exclude node_modules --exclude src --exclude /index.html \
            --exclude package.json --exclude package-lock.json --exclude tsconfig.json --exclude vite.config.ts \
            --exclude '.hermes-live' --exclude logs --exclude scripts --exclude content/graph/raw \
            --exclude functions --exclude wrangler.toml ./ dist/
          grep -q 'assets/index-' dist/index.html
          test -f dist/story/index.html && test -f dist/story/transcript.txt && test -f dist/llms.txt

      - name: Load the Q&A graph into Cloudflare D1 (bpvsbuckler-graph)
        # The /api/ask search reads D1. If the token cannot write D1, the search
        # falls back to the static /api/qa.json, so a failure here does not block the deploy.
        continue-on-error: true
        run: npx --yes wrangler@3 d1 execute bpvsbuckler-graph --remote --file=api/graph.sql --yes

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@3 pages deploy dist --project-name=bpvsbuckler --branch=bpvsbuckler --commit-dirty=true
